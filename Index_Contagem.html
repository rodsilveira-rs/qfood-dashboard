<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q Food — KPIs da Contagem</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1f2e;--sf:#242938;--s2:#2e3447;--s3:#353c52;
  --br:rgba(255,255,255,0.10);--b2:rgba(255,255,255,0.18);
  --tx:#eef1f8;--mu:#8fa0c0;--mu2:#5e718e;
  --red:#ff4d4f;--ok:#36cfa0;--warn:#ffaa2b;--blue:#4d8ef5;--pur:#a07cf6;--cyan:#22d3ee;
  --qf:#e63329;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);padding-bottom:40px;}

.top{position:sticky;top:0;z-index:60;background:var(--sf);border-bottom:1px solid var(--br);padding:12px 16px;}
.top-r{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;}
.back{background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:9px;padding:7px 11px;font-size:0.8rem;cursor:pointer;font-family:var(--fb);}
.ttl{font-family:var(--fh);font-weight:700;font-size:1.05rem;flex:1;}
.btn{background:var(--qf);border:none;border-radius:9px;padding:10px 15px;color:#fff;font-size:0.82rem;font-weight:600;font-family:var(--fh);cursor:pointer;}
.btn.sec{background:var(--s2);border:1px solid var(--b2);color:var(--tx);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px;}

.per{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.per button{background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:9px;padding:9px 14px;font-size:0.8rem;cursor:pointer;font-family:var(--fb);}
.per button.on{background:var(--qf);border-color:var(--qf);color:#fff;font-weight:600;}
.per input[type=date]{background:var(--bg);border:1px solid var(--b2);border-radius:9px;padding:8px 11px;color:var(--tx);font-size:0.8rem;font-family:var(--fb);}

/* velocímetros */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px;}
.gz{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:18px 14px 14px;text-align:center;}
.gz svg{width:100%;max-width:210px;height:auto;}
.gz-nm{font-family:var(--fh);font-size:0.82rem;font-weight:700;letter-spacing:.3px;margin-top:2px;}
.gz-hint{font-size:0.68rem;color:var(--mu2);margin-top:5px;line-height:1.4;}

/* cartões numéricos */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:22px;}
.nm{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:14px;}
.nm small{display:block;font-size:0.66rem;color:var(--mu2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;}
.nm b{font-family:var(--fh);font-size:1.5rem;font-weight:700;}
.nm .sub{font-size:0.68rem;color:var(--mu);margin-top:4px;}

.sec-h{font-family:var(--fh);font-size:0.78rem;color:var(--mu2);letter-spacing:.6px;text-transform:uppercase;margin:22px 0 10px;}
.panel{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:16px;overflow-x:auto;}

table{width:100%;border-collapse:collapse;font-size:0.8rem;}
th{text-align:left;font-family:var(--fh);font-size:0.68rem;color:var(--mu2);letter-spacing:.4px;text-transform:uppercase;padding:8px 9px;border-bottom:1px solid var(--b2);white-space:nowrap;}
td{padding:9px;border-bottom:1px solid var(--br);}
tr:last-child td{border-bottom:none;}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.cd{font-family:ui-monospace,monospace;font-size:0.72rem;color:var(--mu2);}
.g{color:var(--ok);} .r{color:var(--red);} .y{color:var(--warn);} .m{color:var(--mu);}

/* barras de método */
.mb{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.mb-l{width:78px;font-size:0.76rem;color:var(--mu);}
.mb-t{flex:1;height:22px;background:var(--s2);border-radius:6px;overflow:hidden;}
.mb-t > i{display:block;height:100%;}
.mb-v{width:82px;text-align:right;font-size:0.76rem;font-variant-numeric:tabular-nums;}

.empty{text-align:center;color:var(--mu2);font-size:0.84rem;padding:40px 16px;line-height:1.6;}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--b2);border-top-color:var(--qf);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
.only-print{display:none;}

/* ══════════ IMPRESSÃO / PDF ══════════
   Sem biblioteca: Ctrl+P > "Salvar como PDF" gera o arquivo com
   fidelidade melhor que qualquer jsPDF, e imprime igual no Mac,
   Windows e no celular. */
@media print{
  @page{size:A4 portrait;margin:12mm;}
  body{background:#fff !important;color:#111 !important;padding:0;}
  .top,.per,.no-print{display:none !important;}
  .only-print{display:block;}
  .wrap{max-width:100%;padding:0;}
  .gz,.nm,.panel{background:#fff !important;border:1px solid #ccc !important;
    box-shadow:none !important;break-inside:avoid;page-break-inside:avoid;}
  .gauges{grid-template-columns:repeat(3,1fr);}
  .nums{grid-template-columns:repeat(4,1fr);}
  .sec-h{color:#555 !important;}
  th{color:#555 !important;border-bottom:1px solid #999 !important;}
  td{border-bottom:1px solid #ddd !important;}
  .m{color:#666 !important;} .mu2,.cd{color:#777 !important;}
  .g{color:#0a7f5c !important;} .r{color:#c0231f !important;} .y{color:#a06a00 !important;}
  .gz-nm,.nm b{color:#111 !important;}
  .gz-hint,.nm small,.nm .sub{color:#666 !important;}
  table{font-size:0.68rem;}
  .brk{page-break-before:always;}
  .prt-h{border-bottom:2px solid #e63329;padding-bottom:10px;margin-bottom:16px;}
  .prt-h h1{font-family:'Syne',sans-serif;font-size:1.2rem;color:#111;}
  .prt-h p{font-size:0.75rem;color:#555;margin-top:4px;}
}
</style>
</head>
<body>

<div class="top no-print">
  <div class="top-r">
    <button class="back" onclick="location.href='Index_Contagem.html'">←</button>
    <div class="ttl">KPIs da Contagem</div>
    <button class="btn sec" onclick="carregar()">Atualizar</button>
    <button class="btn" onclick="window.print()">Gerar PDF</button>
  </div>
</div>

<div class="wrap">
  <div class="only-print prt-h">
    <h1>Q Food Company — Auditoria de Estoque</h1>
    <p id="prt-sub">—</p>
  </div>

  <div class="per no-print" id="per">
    <button data-p="hoje">Hoje</button>
    <button data-p="7" class="on">7 dias</button>
    <button data-p="30">30 dias</button>
    <button data-p="mes">Mês atual</button>
    <button data-p="ant">Mês anterior</button>
    <input type="date" id="de"><input type="date" id="ate">
    <button data-p="custom" class="sec">Aplicar</button>
  </div>

  <div id="app"><div class="empty"><span class="spin"></span> Carregando…</div></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   Q FOOD — Index_Contagem_KPI.html  v1.0
   Backend: ?modulo=contagem&action=kpis  (exige o PATCH_CONT_kpis)
   Acesso: só admin ou preparador — o backend recusa os demais.
   ══════════════════════════════════════════════════════════════ */

var API="https://script.google.com/macros/s/AKfycbzrrsO9rj3Tu1BtB449g0rAli6zpgxcdLZ9ydFaq6rfvMH_jTh194CtbPzArRM52qLkKA/exec";
var USER=null, DE=null, ATE=null, K=null;

(function(){
  var s=null;
  try{ s=JSON.parse(localStorage.getItem("qfood_session")||"null"); }catch(e){}
  if(!s||!s.email||(Date.now()-(s.ts||0))>8*60*60*1000){ location.href="Index_Menu.html"; return; }
  USER=s;
  aplicarPeriodo("7");
  document.getElementById("per").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    aplicarPeriodo(b.getAttribute("data-p"), b);
  });
})();

function iso(d){ var o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); }
function fmtBr(s){ if(!s) return "—"; var p=String(s).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function rs(v){ return "R$ "+(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function aplicarPeriodo(p, btn){
  var hj=new Date(), d1=new Date(), d2=new Date();
  if(p==="hoje"){ }
  else if(p==="7"){ d1.setDate(hj.getDate()-6); }
  else if(p==="30"){ d1.setDate(hj.getDate()-29); }
  else if(p==="mes"){ d1=new Date(hj.getFullYear(),hj.getMonth(),1); }
  else if(p==="ant"){ d1=new Date(hj.getFullYear(),hj.getMonth()-1,1); d2=new Date(hj.getFullYear(),hj.getMonth(),0); }
  else if(p==="custom"){
    var a=document.getElementById("de").value, b=document.getElementById("ate").value;
    if(!a||!b){ alert("Escolha as duas datas."); return; }
    DE=a; ATE=b; marcar(btn); document.getElementById("de").value=a; document.getElementById("ate").value=b;
    return carregar();
  }
  DE=iso(d1); ATE=iso(d2);
  document.getElementById("de").value=DE;
  document.getElementById("ate").value=ATE;
  marcar(btn); carregar();
}
function marcar(btn){
  var bs=document.querySelectorAll("#per button");
  for(var i=0;i<bs.length;i++) bs[i].className = bs[i].getAttribute("data-p")==="custom" ? "sec" : "";
  if(btn && btn.getAttribute("data-p")!=="custom") btn.className="on";
}

function carregar(){
  document.getElementById("app").innerHTML='<div class="empty"><span class="spin"></span> Calculando…</div>';
  var q=API+"?modulo=contagem&action=kpis&autorEmail="+encodeURIComponent(USER.email)+
        "&de="+encodeURIComponent(DE)+"&ate="+encodeURIComponent(ATE);
  fetch(q).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){ document.getElementById("app").innerHTML='<div class="empty">'+esc(j.error)+'</div>'; return; }
    K=j.kpis; render();
  }).catch(function(e){
    document.getElementById("app").innerHTML='<div class="empty">Falha de conexão.<br>'+esc(e)+'</div>';
  });
}

/* ---------- velocímetro em SVG ----------
   Arco de 180°. maiorMelhor=false inverte a escala de cor
   (usado na taxa de recontagem, onde perto de zero é bom). */
function gauge(pct, nome, hint, maiorMelhor, lim){
  var vazio = (pct==null || isNaN(pct));
  var v = vazio ? 0 : Math.max(0, Math.min(100, pct));
  var R=70, CX=90, CY=92, LEN=Math.PI*R;
  var off = LEN*(1 - v/100);

  lim = lim || (maiorMelhor===false ? [10,25] : [90,97]);
  var cor;
  if(vazio) cor="#5e718e";
  else if(maiorMelhor===false) cor = v<=lim[0] ? "#36cfa0" : (v<=lim[1] ? "#ffaa2b" : "#ff4d4f");
  else cor = v>=lim[1] ? "#36cfa0" : (v>=lim[0] ? "#ffaa2b" : "#ff4d4f");

  return '<div class="gz">'+
    '<svg viewBox="0 0 180 118">'+
      '<path d="M 20 92 A 70 70 0 0 1 160 92" fill="none" stroke="#2e3447" stroke-width="15" stroke-linecap="round"/>'+
      '<path d="M 20 92 A 70 70 0 0 1 160 92" fill="none" stroke="'+cor+'" stroke-width="15" stroke-linecap="round" '+
        'stroke-dasharray="'+LEN.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
      '<text x="90" y="84" text-anchor="middle" fill="'+cor+'" '+
        'style="font-family:Syne,sans-serif;font-size:31px;font-weight:800">'+
        (vazio?"—":v.toFixed(1).replace(".",","))+'</text>'+
      '<text x="90" y="104" text-anchor="middle" fill="#8fa0c0" '+
        'style="font-family:DM Sans,sans-serif;font-size:12px">'+(vazio?"sem dados":"%")+'</text>'+
    '</svg>'+
    '<div class="gz-nm">'+esc(nome)+'</div>'+
    '<div class="gz-hint">'+esc(hint)+'</div></div>';
}

function render(){
  var k=K, h="";
  document.getElementById("prt-sub").textContent =
    "Período de "+fmtBr(k.periodo.de)+" a "+fmtBr(k.periodo.ate)+
    " · emitido em "+fmtBr(iso(new Date()))+" por "+(USER.nome||USER.email);

  if(!k.totalContagens){
    document.getElementById("app").innerHTML=
      '<div class="empty">Nenhuma contagem registrada neste período.</div>';
    return;
  }

  /* ── velocímetros ── */
  h+='<div class="gauges">'+
    gauge(k.acuracidadePct,"Acuracidade",
      "Itens em que o físico bateu exato com o sistema",true,[90,97])+
    gauge(k.coberturaPct,"Cobertura",
      k.totalContagens+" contados de "+k.itensPlanejados+" planejados",true,[85,95])+
    gauge(k.recontagemPct,"Taxa de recontagem",
      "Quanto menor, melhor. Taxa alta pede investigação",false,[5,15])+
    '</div>';

  /* ── números ── */
  var acer = k.comSaldoParaConfronto
    ? Math.round(k.acuracidadePct/100*k.comSaldoParaConfronto) : 0;
  h+='<div class="nums">'+
    card("Contagens","<b>"+k.totalContagens+"</b>",k.sessoes+" dia(s) de contagem")+
    card("Divergência em R$","<b class='r'>"+rs(k.divergenciaAbsolutaRS)+"</b>","valor absoluto acumulado")+
    card("Divergência em unidades","<b>"+k.divergenciaAbsolutaUn+"</b>","soma das diferenças")+
    card("Itens não localizados","<b class='"+(k.naoLocalizados?"y":"m")+"'>"+k.naoLocalizados+"</b>","procurados e não achados")+
    card("Confrontados","<b>"+k.comSaldoParaConfronto+"</b>",acer+" bateram exato")+
    card("Recontagens","<b class='"+(k.recontagens?"y":"m")+"'>"+k.recontagens+"</b>","com justificativa registrada")+
    '</div>';

  /* ── método de leitura ── */
  var met=k.porMetodo||{}, somaM=0;
  Object.keys(met).forEach(function(x){ somaM+=met[x]; });
  if(somaM){
    var cores={CAMERA:"#22d3ee",BUSCA:"#a07cf6",MANUAL:"#8fa0c0"};
    h+='<div class="sec-h">Como os itens foram localizados</div><div class="panel">';
    ["CAMERA","BUSCA","MANUAL"].forEach(function(x){
      var q=met[x]||0, p=somaM?(q/somaM*100):0;
      h+='<div class="mb"><div class="mb-l">'+(x==="CAMERA"?"Câmera":x==="BUSCA"?"Busca":"Manual")+'</div>'+
         '<div class="mb-t"><i style="width:'+p.toFixed(1)+'%;background:'+cores[x]+'"></i></div>'+
         '<div class="mb-v">'+q+' · '+p.toFixed(0)+'%</div></div>';
    });
    h+='<div class="gz-hint" style="margin-top:8px">Se a câmera ficar abaixo de 50%, '+
       'a leitura por foto não está dando conta e vale avaliar um leitor Bluetooth.</div></div>';
  }

  /* ── evolução diária ── */
  if((k.serieDiaria||[]).length>1){
    h+='<div class="sec-h">Evolução diária</div><div class="panel">'+sparkline(k.serieDiaria)+'</div>';
  }

  /* ── itens com pior acuracidade ── */
  var itens=(k.porItem||[]).filter(function(i){ return i.acuracidade!=null; });
  if(itens.length){
    h+='<div class="sec-h brk">Itens por acuracidade (pior primeiro)</div><div class="panel"><table>'+
       '<tr><th>Item</th><th class="n">Contagens</th><th class="n">Acuracidade</th>'+
       '<th class="n">Diverg. un</th><th class="n">Diverg. R$</th><th class="n">Última</th></tr>';
    itens.slice(0,40).forEach(function(i){
      var c = i.acuracidade>=97?"g":(i.acuracidade>=90?"y":"r");
      h+='<tr><td>'+esc(i.nome)+'<div class="cd">'+esc(i.codigo)+'</div></td>'+
         '<td class="n">'+i.contagens+'</td>'+
         '<td class="n '+c+'">'+i.acuracidade.toFixed(1).replace(".",",")+'%</td>'+
         '<td class="n">'+i.divergenciaAbs+'</td>'+
         '<td class="n '+(i.valorDivergencia?"r":"m")+'">'+rs(i.valorDivergencia)+'</td>'+
         '<td class="n m">'+fmtBr(i.ultimaContagem)+'</td></tr>';
    });
    h+='</table></div>';
  }

  /* ── maiores divergências ── */
  if((k.top20Divergencias||[]).length){
    h+='<div class="sec-h">Maiores divergências do período</div><div class="panel"><table>'+
       '<tr><th>Data</th><th>Item</th><th class="n">Diferença</th><th class="n">Impacto</th><th>Quem contou</th></tr>';
    k.top20Divergencias.forEach(function(d){
      h+='<tr><td class="m">'+fmtBr(d.data)+'</td>'+
         '<td>'+esc(d.nome)+'<div class="cd">'+esc(d.codigo)+'</div></td>'+
         '<td class="n '+(d.divergencia>0?"y":"r")+'">'+(d.divergencia>0?"+":"")+d.divergencia+'</td>'+
         '<td class="n r">'+rs(Math.abs(d.valor))+'</td>'+
         '<td class="m">'+esc(String(d.usuario).split("@")[0])+'</td></tr>';
    });
    h+='</table></div>';
  }

  /* ── por operador ── */
  var us=k.porUsuario||{};
  if(Object.keys(us).length){
    h+='<div class="sec-h">Por operador</div><div class="panel"><table>'+
       '<tr><th>Operador</th><th class="n">Contagens</th><th class="n">Acuracidade</th>'+
       '<th class="n">Recontagens</th><th class="n">% recontagem</th></tr>';
    Object.keys(us).forEach(function(u){
      var a=us[u];
      var ac = a.comSaldo ? (a.exatos/a.comSaldo*100) : null;
      var pr = a.contagens ? (a.recontagens/a.contagens*100) : 0;
      h+='<tr><td>'+esc(u.split("@")[0])+'</td>'+
         '<td class="n">'+a.contagens+'</td>'+
         '<td class="n '+(ac==null?"m":(ac>=97?"g":ac>=90?"y":"r"))+'">'+
           (ac==null?"—":ac.toFixed(1).replace(".",",")+"%")+'</td>'+
         '<td class="n">'+a.recontagens+'</td>'+
         '<td class="n '+(pr>15?"r":pr>5?"y":"m")+'">'+pr.toFixed(0)+'%</td></tr>';
    });
    h+='</table>'+
       '<div class="gz-hint" style="margin-top:10px">Acuracidade muito alta somada a recontagem alta '+
       'no mesmo operador é o padrão a investigar: pode indicar recontagem feita depois de ver o saldo.</div></div>';
  }

  h+='<div class="only-print" style="margin-top:18px;font-size:0.65rem;color:#888">'+
     'Contagem cega — o saldo do sistema é lançado previamente e só é revelado ao operador '+
     'após a gravação da contagem física. Recontagens exigem justificativa e preservam o registro original.</div>';

  document.getElementById("app").innerHTML=h;
}

function card(t,v,s){
  return '<div class="nm"><small>'+esc(t)+'</small>'+v+'<div class="sub">'+esc(s)+'</div></div>';
}

/* Gráfico de linha da acuracidade diária, em SVG puro */
function sparkline(serie){
  var pts=serie.filter(function(s){ return s.acuracidade!=null; });
  if(pts.length<2) return '<div class="gz-hint">Dados insuficientes para a curva.</div>';
  var W=760,H=170,PL=42,PR=12,PT=14,PB=26;
  var iw=W-PL-PR, ih=H-PT-PB;
  var min=Math.min.apply(null,pts.map(function(p){return p.acuracidade;}));
  var lo=Math.max(0,Math.floor((min-5)/10)*10), hi=100;
  function X(i){ return PL + (pts.length===1?iw/2:(i/(pts.length-1))*iw); }
  function Y(v){ return PT + ih - ((v-lo)/(hi-lo))*ih; }

  var g="";
  [lo,(lo+hi)/2,hi].forEach(function(v){
    g+='<line x1="'+PL+'" y1="'+Y(v)+'" x2="'+(W-PR)+'" y2="'+Y(v)+'" stroke="#2e3447" stroke-width="1"/>'+
       '<text x="'+(PL-7)+'" y="'+(Y(v)+4)+'" text-anchor="end" fill="#5e718e" '+
       'style="font-family:DM Sans;font-size:10px">'+Math.round(v)+'%</text>';
  });

  var d=pts.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.acuracidade).toFixed(1); }).join(" ");
  g+='<path d="'+d+'" fill="none" stroke="#36cfa0" stroke-width="2.5" stroke-linejoin="round"/>';

  pts.forEach(function(p,i){
    var c = p.acuracidade>=97?"#36cfa0":(p.acuracidade>=90?"#ffaa2b":"#ff4d4f");
    g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.acuracidade).toFixed(1)+'" r="3.6" fill="'+c+'"/>';
    var passo=Math.ceil(pts.length/8);
    if(i%passo===0 || i===pts.length-1){
      g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" fill="#5e718e" '+
         'style="font-family:DM Sans;font-size:10px">'+p.data.slice(8,10)+"/"+p.data.slice(5,7)+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'</svg>'+
         '<div class="gz-hint">Acuracidade por dia. Pontos vermelhos são dias abaixo de 90%.</div>';
}
</script>
</body>
</html>
