<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q Food — Contagem</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#1a1f2e;--sf:#242938;--s2:#2e3447;--s3:#353c52;
  --br:rgba(255,255,255,0.10);--b2:rgba(255,255,255,0.18);--b3:rgba(255,255,255,0.26);
  --tx:#eef1f8;--mu:#8fa0c0;--mu2:#5e718e;
  --red:#ff4d4f;--ok:#36cfa0;--warn:#ffaa2b;--blue:#4d8ef5;--pur:#a07cf6;--cyan:#22d3ee;
  --qf:#e63329;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;padding-bottom:90px;}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:60;background:var(--sf);border-bottom:1px solid var(--br);padding:10px 14px;}
.top-r1{display:flex;align-items:center;gap:10px;}
.back{background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:9px;padding:7px 11px;font-size:0.8rem;cursor:pointer;font-family:var(--fb);}
.ttl{font-family:var(--fh);font-weight:700;font-size:1rem;flex:1;}
.who{font-size:0.68rem;color:var(--mu2);text-align:right;line-height:1.3;}

.tabs{display:flex;gap:6px;margin-top:10px;}
.tab{flex:1;background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:9px;padding:9px;font-size:0.78rem;font-weight:500;cursor:pointer;font-family:var(--fb);}
.tab.on{background:var(--qf);border-color:var(--qf);color:#fff;}

.bar{margin-top:10px;height:6px;background:var(--s2);border-radius:99px;overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s;}
.bar-lbl{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--mu);margin-top:5px;}

.wrap{max-width:760px;margin:0 auto;padding:14px;}

/* ---------- avisos ---------- */
.alert{border-radius:11px;padding:12px 14px;font-size:0.8rem;line-height:1.45;margin-bottom:12px;border:1px solid;}
.alert.warn{background:rgba(255,170,43,.10);border-color:rgba(255,170,43,.4);color:#ffce80;}
.alert.err{background:rgba(255,77,79,.10);border-color:rgba(255,77,79,.4);color:#ff9b9c;}
.alert.ok{background:rgba(54,207,160,.10);border-color:rgba(54,207,160,.4);color:#7fe4c4;}
.alert.info{background:rgba(77,142,245,.10);border-color:rgba(77,142,245,.4);color:#a9c7fb;}

/* ---------- controles ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.inp{background:var(--bg);border:1px solid var(--b2);border-radius:10px;padding:11px 13px;color:var(--tx);font-size:0.88rem;font-family:var(--fb);outline:none;width:100%;}
.inp:focus{border-color:var(--qf);}
.btn{background:var(--qf);border:none;border-radius:10px;padding:12px 16px;color:#fff;font-size:0.85rem;font-weight:600;font-family:var(--fh);cursor:pointer;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sec{background:var(--s2);border:1px solid var(--b2);color:var(--tx);}
.btn.ghost{background:transparent;border:1px solid var(--b2);color:var(--mu);}
.btn.ok{background:var(--ok);color:#08251c;}
.btn.wide{width:100%;}

/* ---------- itens ---------- */
.sec-h{font-family:var(--fh);font-size:0.75rem;color:var(--mu2);letter-spacing:.6px;text-transform:uppercase;margin:16px 0 8px;}
.card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:12px 13px;margin-bottom:8px;}
.card.done{border-left:3px solid var(--ok);opacity:.75;}
.card.pend{border-left:3px solid var(--warn);}
.card.tap{cursor:pointer;}
.card.tap:active{background:var(--s2);}
.it-top{display:flex;align-items:flex-start;gap:9px;}
.it-nm{flex:1;font-size:0.86rem;line-height:1.35;font-weight:500;}
.it-cd{font-size:0.68rem;color:var(--mu2);font-family:ui-monospace,monospace;margin-top:3px;}
.tag{font-size:0.6rem;padding:3px 7px;border-radius:99px;font-weight:600;letter-spacing:.4px;white-space:nowrap;}
.tag.a{background:rgba(255,77,79,.16);color:#ff9b9c;}
.tag.r{background:rgba(160,124,246,.16);color:#c4aef9;}
.tag.s{background:rgba(34,211,238,.16);color:#8fe6f5;}
.it-res{margin-top:9px;padding-top:9px;border-top:1px dashed var(--br);display:flex;gap:14px;font-size:0.76rem;flex-wrap:wrap;}
.it-res b{font-family:var(--fh);font-size:0.9rem;}
.g{color:var(--ok);} .r{color:var(--red);} .y{color:var(--warn);} .m{color:var(--mu);}

/* ---------- barra fixa ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sf);border-top:1px solid var(--br);padding:10px 14px;display:flex;gap:8px;max-width:760px;margin:0 auto;}
.dock .btn{flex:1;padding:14px;font-size:0.9rem;}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,13,22,.86);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet{background:var(--sf);border:1px solid var(--b2);border-radius:18px 18px 0 0;width:100%;max-width:760px;padding:20px 18px 26px;max-height:92vh;overflow-y:auto;}
.sheet h3{font-family:var(--fh);font-size:1rem;margin-bottom:4px;line-height:1.3;}
.sheet .sub{font-size:0.72rem;color:var(--mu2);margin-bottom:16px;font-family:ui-monospace,monospace;}
.qty{width:100%;background:var(--bg);border:2px solid var(--b2);border-radius:14px;padding:20px;color:var(--tx);font-size:2.1rem;font-family:var(--fh);font-weight:700;text-align:center;outline:none;}
.qty:focus{border-color:var(--qf);}
.lbl{font-size:0.7rem;color:var(--mu2);margin:14px 0 6px;letter-spacing:.3px;}

/* ---------- revelação ---------- */
.rev{border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.rev.ok{background:rgba(54,207,160,.13);border:1px solid rgba(54,207,160,.45);}
.rev.bad{background:rgba(255,77,79,.13);border:1px solid rgba(255,77,79,.45);}
.rev.non{background:rgba(143,160,192,.10);border:1px solid var(--b2);}
.rev-t{font-family:var(--fh);font-size:1.15rem;font-weight:700;margin-bottom:12px;}
.rev-g{display:flex;justify-content:center;gap:26px;}
.rev-c{text-align:center;}
.rev-c small{display:block;font-size:0.64rem;color:var(--mu2);margin-bottom:3px;letter-spacing:.4px;}
.rev-c b{font-family:var(--fh);font-size:1.5rem;}

/* ---------- câmera ---------- */
#cam{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:230px;}
.cam-tip{font-size:0.74rem;color:var(--mu);text-align:center;margin-top:12px;line-height:1.5;}

.empty{text-align:center;color:var(--mu2);font-size:0.82rem;padding:34px 16px;line-height:1.6;}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--b2);border-top-color:var(--qf);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none !important;}
</style>
</head>
<body>

<div class="top">
  <div class="top-r1">
    <button class="back" onclick="location.href='Index_Menu.html'">←</button>
    <div class="ttl">Contagem</div>
    <div class="who" id="who">—</div>
  </div>
  <div class="tabs hide" id="tabs">
    <button class="tab" id="tab-prep" onclick="setModo('prep')">Preparar</button>
    <button class="tab" id="tab-cont" onclick="setModo('cont')">Contar</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bar-lbl"><span id="bar-l">—</span><span id="bar-r"></span></div>
</div>

<div class="wrap" id="app">
  <div class="empty"><span class="spin"></span> Carregando…</div>
</div>

<div class="dock hide" id="dock"></div>

<!-- modal quantidade -->
<div class="ov" id="ov-qty">
  <div class="sheet">
    <div id="qty-rev"></div>
    <h3 id="qty-nm">—</h3>
    <div class="sub" id="qty-cd">—</div>
    <div id="qty-form">
      <input class="qty" id="qty-in" type="text" inputmode="decimal" placeholder="0">
      <div id="qty-just" class="hide">
        <div class="lbl">JUSTIFICATIVA DA RECONTAGEM (obrigatória)</div>
        <input class="inp" id="qty-obs" placeholder="Por que está recontando este item?">
      </div>
      <div class="row" style="margin:16px 0 0;">
        <button class="btn ok" style="flex:2" onclick="salvarQtd()">Gravar contagem</button>
        <button class="btn ghost" style="flex:1" onclick="salvarQtd(true)">Não localizado</button>
      </div>
      <button class="btn sec wide" style="margin-top:8px" onclick="fecharQty()">Cancelar</button>
    </div>
    <button class="btn wide hide" id="qty-close" style="margin-top:4px" onclick="fecharQty()">Continuar</button>
  </div>
</div>

<!-- modal saldo (Célio) -->
<div class="ov" id="ov-sal">
  <div class="sheet">
    <h3 id="sal-nm">—</h3>
    <div class="sub" id="sal-cd">—</div>
    <div class="lbl">SALDO NO SISTEMA (LIVE WORK)</div>
    <input class="qty" id="sal-in" type="text" inputmode="decimal" placeholder="0">
    <div class="row" style="margin:16px 0 0;">
      <button class="btn ok" style="flex:2" onclick="salvarSaldo()">Lançar saldo</button>
      <button class="btn ghost" style="flex:1" onclick="pularItem()">Zerado · pular</button>
    </div>
    <button class="btn sec wide" style="margin-top:8px" onclick="fecharSal()">Cancelar</button>
  </div>
</div>

<!-- modal câmera -->
<div class="ov" id="ov-cam">
  <div class="sheet">
    <h3>Ler código de barras</h3>
    <div class="sub">Aponte para o código do produto</div>
    <div id="cam"></div>
    <div class="cam-tip">Etiqueta amassada ou sem código? Feche e use a busca por nome.</div>
    <button class="btn sec wide" style="margin-top:14px" onclick="fecharCam()">Fechar câmera</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   Q FOOD — Index_Contagem.html  v1.0

   Backend: Code.gs mestre, ?modulo=contagem
   Sessão:  localStorage "qfood_session" (mesma do Index_Menu)

   ⚠ CONTAGEM CEGA
   Esta tela NUNCA recebe o saldo do sistema de um item ainda não
   contado — o backend não envia. Não há nada aqui para esconder,
   e por isso F12 não revela nada. O saldo só chega na resposta
   de salvarContagem, com a contagem já gravada e travada.
   ══════════════════════════════════════════════════════════════ */

var API = "https://script.google.com/macros/s/AKfycbzrrsO9rj3Tu1BtB449g0rAli6zpgxcdLZ9ydFaq6rfvMH_jTh194CtbPzArRM52qLkKA/exec";

var BASE_CACHE_KEY = "qfood_contagem_base_v1";
var BASE_TTL_MS    = 7*24*60*60*1000;   // 1 semana
var FILA_KEY       = "qfood_contagem_fila_v1";

var USER=null, MODO=null, DATA=null, SESSAO=null, BASE=null, MAPA_GTIN={}, ITEM_SEL=null, SCANNER=null, FILTRO="";

/* ---------- sessão ---------- */
(function init(){
  var s=null;
  try{ s=JSON.parse(localStorage.getItem("qfood_session")||"null"); }catch(e){}
  if(!s || !s.email || (Date.now()-(s.ts||0)) > 8*60*60*1000){
    localStorage.removeItem("qfood_session");
    location.href="Index_Menu.html"; return;
  }
  USER=s;
  document.getElementById("who").innerHTML = (s.nome||s.email)+"<br>"+(s.role||"");
  DATA = hojeIso();
  carregarBase(function(){ carregarSessao(); });
})();

/* ---------- utilidades ---------- */
function hojeIso(){
  var d=new Date(), o=d.getTimezoneOffset();
  return new Date(d.getTime()-o*60000).toISOString().slice(0,10);
}
function proxDia(){
  var d=new Date(); d.setDate(d.getDate()+1);
  if(d.getDay()===0) d.setDate(d.getDate()+1);          // pula domingo
  var o=d.getTimezoneOffset();
  return new Date(d.getTime()-o*60000).toISOString().slice(0,10);
}
function fmtBr(iso){
  if(!iso) return "—";
  var p=String(iso).split("-");
  var dias=["dom","seg","ter","qua","qui","sex","sáb"];
  var dt=new Date(+p[0],+p[1]-1,+p[2]);
  return p[2]+"/"+p[1]+" ("+dias[dt.getDay()]+")";
}
function padCod(v){
  var s=String(v==null?"":v).replace(/\D/g,"");
  if(!s) return "";
  return s.length>=5 ? s : ("00000"+s).slice(-5);
}
function padGtin(v){
  var s=String(v==null?"":v).replace(/\D/g,"");
  if(!s||s.length<8||s.length>14) return "";
  return ("00000000000000"+s).slice(-14);
}
// remove acento e caixa, para a busca por nome funcionar com "queijo"/"QUEIJO"
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function num(v){
  if(v===""||v==null) return null;
  var n=parseFloat(String(v).replace(",","."));
  return isFinite(n)?n:null;
}

/* ---------- rede ---------- */
function api(action, params, cb){
  var q = API+"?modulo=contagem&action="+encodeURIComponent(action)+
          "&autorEmail="+encodeURIComponent(USER.email);
  Object.keys(params||{}).forEach(function(k){
    q += "&"+k+"="+encodeURIComponent(params[k]);
  });
  fetch(q).then(function(r){return r.json();})
    .then(function(j){ cb(null,j); })
    .catch(function(e){ cb(e); });
}
// form-urlencoded evita preflight CORS a partir do GitHub Pages
function apiPost(action, payload, cb){
  payload = payload||{};
  payload.autorEmail = USER.email;
  var body = new URLSearchParams();
  body.append("action", action);
  body.append("payload", JSON.stringify(payload));
  fetch(API+"?modulo=contagem", {method:"POST", body:body})
    .then(function(r){return r.json();})
    .then(function(j){ cb(null,j); })
    .catch(function(e){ cb(e); });
}

/* ---------- base de produtos (cache local) ---------- */
function carregarBase(done){
  var c=null;
  try{ c=JSON.parse(localStorage.getItem(BASE_CACHE_KEY)||"null"); }catch(e){}
  if(c && c.base && (Date.now()-c.ts)<BASE_TTL_MS){ aplicarBase(c.base); return done(); }

  api("base", {}, function(err,j){
    if(err||!j||!j.ok){ aplicarBase([]); return done(); }
    try{ localStorage.setItem(BASE_CACHE_KEY, JSON.stringify({ts:Date.now(), base:j.base})); }catch(e){}
    aplicarBase(j.base); done();
  });
}
function aplicarBase(arr){
  BASE=arr||[]; MAPA_GTIN={};
  BASE.forEach(function(r){ if(r[2]) MAPA_GTIN[r[2]]=r[0]; });
}
function nomeDe(cod){
  cod=padCod(cod);
  for(var i=0;i<BASE.length;i++) if(BASE[i][0]===cod) return BASE[i][1];
  return "";
}

/* ---------- carregar sessão ---------- */
function carregarSessao(){
  document.getElementById("app").innerHTML='<div class="empty"><span class="spin"></span> Carregando contagem…</div>';
  api("sessao", {data:DATA}, function(err,j){
    if(err){ erro("Falha de conexão. Verifique a internet e tente de novo."); return; }
    if(!j.ok){ erro(j.error||"Erro ao carregar a sessão."); return; }
    SESSAO=j.sessao;
    var p=SESSAO.perfil||{};
    if(!MODO){
      var dois = (p.preparador||p.admin) && (p.contador||p.admin);
      if(dois){
        document.getElementById("tabs").classList.remove("hide");
        MODO = (p.preparador||p.admin) ? "prep" : "cont";
      } else {
        MODO = (p.preparador||p.admin) ? "prep" : "cont";
      }
    }
    sincTabs(); render();
    escoarFila();
  });
}
function setModo(m){ MODO=m; sincTabs(); render(); }
function sincTabs(){
  var a=document.getElementById("tab-prep"), b=document.getElementById("tab-cont");
  if(a) a.className="tab"+(MODO==="prep"?" on":"");
  if(b) b.className="tab"+(MODO==="cont"?" on":"");
}
function erro(m){
  document.getElementById("app").innerHTML='<div class="alert err">'+esc(m)+'</div>';
  document.getElementById("dock").classList.add("hide");
}

/* ---------- render ---------- */
function render(){
  if(MODO==="prep") renderPrep(); else renderCont();
}

function progresso(feito,total,label){
  var pct = total? Math.round(feito/total*100):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("bar-l").textContent=label;
  document.getElementById("bar-r").textContent=feito+" de "+total;
}

/* ══════════ MODO PREPARAR (Célio) ══════════ */
function renderPrep(){
  var s=SESSAO, h="";

  h+='<div class="row">'+
       '<input class="inp" type="date" id="dt" value="'+DATA+'" style="flex:1;min-width:150px" onchange="trocarData(this.value)">'+
       '<button class="btn sec" onclick="trocarData(\''+proxDia()+'\')">Amanhã</button>'+
     '</div>';

  if(!s.existe){
    progresso(0,1,"Contagem de "+fmtBr(DATA));
    h+='<div class="alert info">Nenhuma contagem preparada para <b>'+fmtBr(DATA)+'</b>.<br>'+
       'Ao preparar, o sistema monta a lista sozinho: os itens fixos de maior giro mais os aleatórios do dia.</div>';
    h+='<button class="btn wide" onclick="prepararSessao()">Preparar contagem de '+fmtBr(DATA)+'</button>';
    document.getElementById("app").innerHTML=h;
    document.getElementById("dock").classList.add("hide");
    return;
  }

  var itens=s.itens||[];
  var pend=itens.filter(function(i){ return i.qtdSistema==null; });
  var ok  =itens.filter(function(i){ return i.qtdSistema!=null; });
  progresso(ok.length, itens.length, "Saldos · "+fmtBr(DATA));

  if(s.status==="PREPARANDO"){
    h+='<div class="alert warn">Faltam <b>'+pend.length+'</b> saldos. Toque em cada item e informe o saldo do Live Work. '+
       'Se o item estiver zerado no sistema, use <b>Zerado · pular</b> — o sistema puxa o próximo do ranking sozinho.</div>';
  } else {
    h+='<div class="alert ok">Contagem <b>'+esc(s.status)+'</b>. A expedição já pode contar.</div>';
  }

  if(pend.length){
    h+='<div class="sec-h">Pendentes ('+pend.length+')</div>';
    pend.forEach(function(i){ h+=cardPrep(i); });
  }
  if(ok.length){
    h+='<div class="sec-h">Lançados ('+ok.length+')</div>';
    ok.forEach(function(i){ h+=cardPrep(i); });
  }

  document.getElementById("app").innerHTML=h;

  var d=document.getElementById("dock");
  d.classList.remove("hide");
  d.innerHTML = (s.status==="PREPARANDO")
    ? '<button class="btn ok" onclick="liberar()" '+(pend.length?"disabled":"")+'>'+
      (pend.length? "Faltam "+pend.length+" saldos" : "Liberar para a expedição")+'</button>'
    : '<button class="btn sec" onclick="carregarSessao()">Atualizar</button>';
}

function cardPrep(i){
  var t = i.origem==="BAIXO" ? '<span class="tag r">ALEATÓRIO</span>'
        : i.origem==="SUBSTITUTO" ? '<span class="tag s">SUBSTITUTO</span>'
        : '<span class="tag a">FIXO</span>';
  var cls = i.qtdSistema==null ? "card tap pend" : "card tap done";
  var res = i.qtdSistema==null ? ""
        : '<div class="it-res"><span class="m">Saldo sistema</span><b>'+i.qtdSistema+'</b></div>';
  var sub = i.substituiu ? '<div class="it-cd">substituiu '+esc(i.substituiu)+'</div>' : '';
  return '<div class="'+cls+'" onclick="abrirSal(\''+i.codigo+'\')">'+
           '<div class="it-top"><div class="it-nm">'+esc(i.nome)+
           '<div class="it-cd">'+esc(i.codigo)+'</div>'+sub+'</div>'+t+'</div>'+res+'</div>';
}

function trocarData(v){ DATA=v; SESSAO=null; carregarSessao(); }

function prepararSessao(){
  var b=event.target; b.disabled=true; b.textContent="Montando lista…";
  apiPost("prepararSessao", {data:DATA}, function(err,j){
    if(err||!j.ok){ alert("Erro: "+((j&&j.error)||err)); b.disabled=false; b.textContent="Tentar de novo"; return; }
    var r=j.resultado;
    var msg="Lista pronta: "+r.totalItens+" itens ("+r.fixos+" fixos + "+r.aleatorios+" aleatórios).";
    if(r.orfaosNoRank) msg+="\n\n"+r.orfaosNoRank+" itens do ranking não têm cadastro na base e foram ignorados.";
    alert(msg);
    carregarSessao();
  });
}

function abrirSal(cod){
  var i=(SESSAO.itens||[]).filter(function(x){return x.codigo===cod;})[0];
  if(!i) return;
  ITEM_SEL=i;
  document.getElementById("sal-nm").textContent=i.nome;
  document.getElementById("sal-cd").textContent=i.codigo+(i.gtin?" · "+i.gtin:"");
  document.getElementById("sal-in").value = i.qtdSistema==null ? "" : i.qtdSistema;
  document.getElementById("ov-sal").classList.add("open");
  setTimeout(function(){ document.getElementById("sal-in").focus(); },120);
}
function fecharSal(){ document.getElementById("ov-sal").classList.remove("open"); ITEM_SEL=null; }

function salvarSaldo(){
  var q=num(document.getElementById("sal-in").value);
  if(q==null){ alert("Informe o saldo do sistema."); return; }
  apiPost("lancarSaldo", {data:DATA, codigo:ITEM_SEL.codigo, qtdSistema:q}, function(err,j){
    if(err||!j.ok){ alert("Erro: "+((j&&j.error)||err)); return; }
    fecharSal(); carregarSessao();
  });
}

function pularItem(){
  if(!confirm("Marcar "+ITEM_SEL.nome+" como zerado no sistema?\n\nEle sai da contagem e o próximo do ranking entra no lugar.")) return;
  apiPost("pularItem", {data:DATA, codigo:ITEM_SEL.codigo}, function(err,j){
    if(err||!j.ok){ alert("Erro: "+((j&&j.error)||err)); return; }
    alert("Entrou no lugar: "+j.resultado.nome);
    fecharSal(); carregarSessao();
  });
}

function liberar(){
  apiPost("liberarSessao", {data:DATA}, function(err,j){
    if(err||!j.ok){ alert("Erro: "+((j&&j.error)||err)); return; }
    alert("Contagem liberada. A expedição já pode começar.");
    carregarSessao();
  });
}

/* ══════════ MODO CONTAR (Jonathas / Expedição) ══════════ */
function renderCont(){
  var s=SESSAO, h="";

  if(!s.existe){
    progresso(0,1,"Contagem de "+fmtBr(DATA));
    document.getElementById("app").innerHTML=
      '<div class="alert warn"><b>Célio ainda não preparou a contagem de hoje.</b><br>'+
      'Assim que ele liberar, os itens aparecem aqui.</div>'+
      '<button class="btn sec wide" onclick="carregarSessao()">Verificar de novo</button>';
    document.getElementById("dock").classList.add("hide");
    return;
  }

  var itens=s.itens||[];
  var pend=itens.filter(function(i){ return !i.contado; });
  var fei =itens.filter(function(i){ return i.contado; });
  progresso(fei.length, itens.length, "Contagem · "+fmtBr(DATA));

  if(s.status==="PREPARANDO"){
    h+='<div class="alert warn">Célio ainda está lançando os saldos ('+s.saldosPendentes+' pendentes). '+
       'Você já pode contar normalmente — a comparação aparece quando o saldo entrar.</div>';
  }

  var fila=lerFila();
  if(fila.length){
    h+='<div class="alert warn"><b>'+fila.length+' contagem(ns) aguardando envio.</b> '+
       'Ficam salvas no aparelho e sobem sozinhas quando a internet voltar. Não feche a página.</div>';
  }

  h+='<div class="row"><input class="inp" id="busca" placeholder="Buscar por nome ou código…" '+
     'value="'+esc(FILTRO)+'" oninput="filtrar(this.value)"></div>';

  var f=norm(FILTRO).split(/\s+/).filter(Boolean);
  function bate(i){
    if(!f.length) return true;
    var alvo=norm(i.nome)+" "+i.codigo+" "+(i.gtin||"");
    return f.every(function(t){ return alvo.indexOf(t)>=0; });
  }
  var pf=pend.filter(bate), ff=fei.filter(bate);

  if(!pf.length && !ff.length){
    h+='<div class="empty">Nenhum item encontrado para "'+esc(FILTRO)+'".</div>';
  }
  if(pf.length){
    h+='<div class="sec-h">A contar ('+pf.length+')</div>';
    pf.forEach(function(i){ h+=cardCont(i); });
  }
  if(ff.length){
    h+='<div class="sec-h">Contados ('+ff.length+')</div>';
    ff.forEach(function(i){ h+=cardCont(i); });
  }

  document.getElementById("app").innerHTML=h;

  var d=document.getElementById("dock");
  d.classList.remove("hide");
  d.innerHTML='<button class="btn" onclick="abrirCam()">📷 Escanear</button>'+
              '<button class="btn sec" onclick="carregarSessao()">Atualizar</button>';
}

function cardCont(i){
  var t = i.origem==="BAIXO" ? '<span class="tag r">ALEATÓRIO</span>'
        : i.origem==="SUBSTITUTO" ? '<span class="tag s">SUBSTITUTO</span>'
        : '<span class="tag a">FIXO</span>';
  var res="";
  if(i.contado){
    var u=i.historico[i.historico.length-1]||{};
    var q = (u.qtd==null) ? "—" : u.qtd;
    res='<div class="it-res"><span class="m">Contado</span><b>'+q+'</b>';
    if(i.qtdSistema!=null){
      var dv=i.divergencia;
      res+='<span class="m">Sistema</span><b>'+i.qtdSistema+'</b>'+
           '<span class="m">Divergência</span><b class="'+(dv===0?"g":"r")+'">'+
           (dv>0?"+":"")+dv+'</b>';
    }
    res+='</div>';
  }
  return '<div class="card tap '+(i.contado?"done":"pend")+'" onclick="abrirQty(\''+i.codigo+'\')">'+
           '<div class="it-top"><div class="it-nm">'+esc(i.nome)+
           '<div class="it-cd">'+esc(i.codigo)+'</div></div>'+t+'</div>'+res+'</div>';
}

function filtrar(v){
  FILTRO=v;
  var el=document.getElementById("busca");
  var pos=el?el.selectionStart:0;
  render();
  var n=document.getElementById("busca");
  if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
}

/* ---------- modal de quantidade ---------- */
function abrirQty(cod){
  var i=(SESSAO.itens||[]).filter(function(x){return x.codigo===cod;})[0];
  if(!i) return;
  ITEM_SEL=i;
  document.getElementById("qty-rev").innerHTML="";
  document.getElementById("qty-form").classList.remove("hide");
  document.getElementById("qty-close").classList.add("hide");
  document.getElementById("qty-nm").textContent=i.nome;
  document.getElementById("qty-cd").textContent=i.codigo+(i.gtin?" · "+i.gtin:"");
  document.getElementById("qty-in").value="";
  document.getElementById("qty-obs").value="";
  document.getElementById("qty-just").className = i.contado ? "" : "hide";
  document.getElementById("ov-qty").classList.add("open");
  setTimeout(function(){ document.getElementById("qty-in").focus(); },120);
}
function fecharQty(){
  document.getElementById("ov-qty").classList.remove("open");
  ITEM_SEL=null; render();
}

function salvarQtd(naoLoc){
  var i=ITEM_SEL; if(!i) return;
  var q = naoLoc ? null : num(document.getElementById("qty-in").value);
  if(!naoLoc && q==null){ alert("Informe a quantidade contada."); return; }
  if(!naoLoc && q<0){ alert("Quantidade não pode ser negativa."); return; }
  var obs=document.getElementById("qty-obs").value.trim();
  if(i.contado && !obs){ alert("Recontagem exige justificativa."); return; }

  var pl={ data:DATA, codigo:i.codigo, qtd:q, naoLocalizado:!!naoLoc,
           metodo:(i.__viaCam?"CAMERA":(FILTRO?"BUSCA":"MANUAL")), obs:obs };

  apiPost("salvarContagem", pl, function(err,j){
    if(err){ enfileirar(pl); mostrarOffline(); return; }
    if(!j.ok){ alert("Erro: "+j.error); return; }
    revelar(j.resultado);
  });
}

/* ---------- a revelação (só depois de gravado) ---------- */
function revelar(r){
  var h="";
  if(r.naoLocalizado){
    h='<div class="rev non"><div class="rev-t">Registrado como não localizado</div>'+
      '<div class="cam-tip">Fica marcado para o Célio conferir depois.</div></div>';
  } else if(r.semSaldoLancado){
    h='<div class="rev non"><div class="rev-t">Contagem gravada: '+r.qtdContada+'</div>'+
      '<div class="cam-tip">O saldo do sistema ainda não foi lançado. A comparação sai no relatório.</div></div>';
  } else if(r.bateu){
    h='<div class="rev ok"><div class="rev-t">✓ Bateu certo</div><div class="rev-g">'+
      '<div class="rev-c"><small>CONTADO</small><b>'+r.qtdContada+'</b></div>'+
      '<div class="rev-c"><small>SISTEMA</small><b>'+r.qtdSistema+'</b></div></div></div>';
  } else {
    var d=r.divergencia;
    h='<div class="rev bad"><div class="rev-t">Divergência de '+(d>0?"+":"")+d+'</div><div class="rev-g">'+
      '<div class="rev-c"><small>CONTADO</small><b>'+r.qtdContada+'</b></div>'+
      '<div class="rev-c"><small>SISTEMA</small><b>'+r.qtdSistema+'</b></div>'+
      '<div class="rev-c"><small>DIFERENÇA</small><b class="r">'+(d>0?"+":"")+d+'</b></div></div>'+
      (r.valorDivergencia!=null?'<div class="cam-tip">Impacto aproximado: R$ '+
        Math.abs(r.valorDivergencia).toFixed(2).replace(".",",")+'</div>':'')+'</div>';
  }
  h+='<div class="alert info" style="margin-top:12px">Contagem gravada e travada. '+
     'Para recontar, é preciso justificar — e as duas contagens ficam no histórico.</div>';

  document.getElementById("qty-rev").innerHTML=h;
  document.getElementById("qty-form").classList.add("hide");
  document.getElementById("qty-close").classList.remove("hide");

  // atualiza em memória para a lista já refletir
  var i=ITEM_SEL;
  if(i){
    i.contado=true; i.qtdSistema=r.qtdSistema; i.divergencia=r.divergencia;
    i.historico=(i.historico||[]).concat([{qtd:r.qtdContada,tipo:r.tipo,por:USER.email}]);
  }
}

/* ---------- fila offline ---------- */
function lerFila(){ try{ return JSON.parse(localStorage.getItem(FILA_KEY)||"[]"); }catch(e){ return []; } }
function gravarFila(f){ try{ localStorage.setItem(FILA_KEY, JSON.stringify(f)); }catch(e){} }
function enfileirar(pl){ var f=lerFila(); f.push(pl); gravarFila(f); }
function mostrarOffline(){
  document.getElementById("qty-rev").innerHTML=
    '<div class="rev non"><div class="rev-t">Salvo no aparelho</div>'+
    '<div class="cam-tip">Sem internet agora. A contagem sobe sozinha quando a conexão voltar — '+
    'pode continuar contando normalmente.</div></div>';
  document.getElementById("qty-form").classList.add("hide");
  document.getElementById("qty-close").classList.remove("hide");
}
function escoarFila(){
  var f=lerFila();
  if(!f.length) return;
  var pl=f[0];
  apiPost("salvarContagem", pl, function(err,j){
    if(err) return;                       // ainda sem rede, tenta depois
    var g=lerFila(); g.shift(); gravarFila(g);
    if(g.length) escoarFila(); else carregarSessao();
  });
}
setInterval(escoarFila, 15000);
window.addEventListener("online", escoarFila);

/* ---------- câmera ---------- */
function abrirCam(){
  document.getElementById("ov-cam").classList.add("open");
  if(typeof Html5Qrcode==="undefined"){
    document.getElementById("cam").innerHTML=
      '<div class="empty">Leitor não carregou. Use a busca por nome.</div>';
    return;
  }
  SCANNER=new Html5Qrcode("cam");
  SCANNER.start(
    {facingMode:"environment"},
    { fps:10, qrbox:{width:260,height:150},
      // limitar formatos acelera muito a decodificação em celular fraco
      formatsToSupport:[
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,  Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,    Html5QrcodeSupportedFormats.CODE_128
      ]},
    function(txt){ fecharCam(); tratarLeitura(txt); },
    function(){}
  ).catch(function(e){
    var msg = String(e||"");
    var iosWebview = /iPhone|iPad/.test(navigator.userAgent) && !/Safari/.test(navigator.userAgent);
    document.getElementById("cam").innerHTML=
      '<div class="empty">Não consegui abrir a câmera.<br><br>'+
      (iosWebview
        ? 'Abra esta página no <b>Safari</b>. Dentro do WhatsApp ou Instagram o iPhone bloqueia a câmera.'
        : 'Verifique a permissão de câmera do navegador.')+
      '<br><br>Enquanto isso, use a busca por nome.<br><br><small>'+esc(msg)+'</small></div>';
  });
}
function fecharCam(){
  document.getElementById("ov-cam").classList.remove("open");
  if(SCANNER){
    try{ SCANNER.stop().then(function(){ SCANNER.clear(); SCANNER=null; }); }
    catch(e){ SCANNER=null; }
  }
}

function tratarLeitura(txt){
  var g=padGtin(txt);
  var cod = g ? MAPA_GTIN[g] : null;

  if(!cod){
    FILTRO=""; render();
    alert("Código não encontrado na base:\n"+txt+"\n\nUse a busca por nome para achar o item.");
    return;
  }
  var naLista=(SESSAO.itens||[]).filter(function(x){return x.codigo===cod;})[0];
  if(!naLista){
    var nm=nomeDe(cod);
    alert("Este item não está na contagem de hoje:\n\n"+nm+"\n\n"+
          "Se quiser registrar mesmo assim, ele entra como contagem EXTRA.");
    SESSAO.itens.push({codigo:cod, nome:nm, gtin:g, origem:"EXTRA", curva:"", contado:false, historico:[]});
    naLista=SESSAO.itens[SESSAO.itens.length-1];
  }
  naLista.__viaCam=true;
  render();
  abrirQty(cod);
}

/* Enter no campo de quantidade grava direto */
document.getElementById("qty-in").addEventListener("keydown",function(e){
  if(e.key==="Enter"){ e.preventDefault(); salvarQtd(); }
});
document.getElementById("sal-in").addEventListener("keydown",function(e){
  if(e.key==="Enter"){ e.preventDefault(); salvarSaldo(); }
});
</script>
