<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<title>Gestão Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141416; --ink-2:#26272B; --paper:#F4F4F5; --card:#FFFFFF; --line:#DEDFE2;
  --text:#1B1C20; --mute:#6A6D75;
  --brand:#C4161C; --brand-on:#FFFFFF; --brand-soft:#FBE4E5; --accent:#E8383D;
  --logo-bg:transparent; --chip:#ECEDEF;
  --jade:#1F7A63; --jade-soft:#E0EFE9;
  --chili:#C23A2E; --chili-soft:#FAE5E2;
  --yuzu:#B98107; --yuzu-soft:#FAF0D4;
  --sky:#2F6690; --sky-soft:#E3EDF5;
  --roxo:#5B4B9E; --roxo-soft:#EAE6F7;
  --r-lg:16px; --r:10px;
  --display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Temas por empresa: QF = Q Food (Todas e Cozinha de Produção), ML = Mercearia Liberdade, GG = Gogui */
body[data-tema="ML"]{
  --ink:#3A0C10; --ink-2:#521519; --paper:#FBF6F1; --line:#EEDFD3;
  --text:#2B1A17; --mute:#7A6259;
  --brand:#D8261F; --brand-on:#FFFFFF; --brand-soft:#FDE6DC; --accent:#F29A22;
  --logo-bg:#FFFFFF; --chip:#F6E8DC;
}
body[data-tema="GG"]{
  --ink:#110F0C; --ink-2:#231F19; --paper:#F7F4EE; --line:#E6DECF;
  --text:#1D1913; --mute:#756B5C;
  --brand:#8A6629; --brand-on:#FFFFFF; --brand-soft:#F3EAD7; --accent:#D4AF5F;
  --logo-bg:#110F0C; --chip:#EFE7D8;
}
body{transition:background-color .35s ease}
.top,.gauge,.login{transition:background-color .35s ease}
.brand-row{display:flex;align-items:center;gap:12px;min-width:0;min-height:46px}
.brand-logo{height:40px;width:auto;max-width:96px;object-fit:contain;border-radius:8px;background:var(--logo-bg);padding:3px 6px;flex:none}
body[data-tema="GG"] .brand-logo{height:44px;padding:0}
body[data-tema="QF"] .brand-logo{height:44px;max-width:120px;padding:0}
.login .brand-logo{height:72px;max-width:180px;margin:0 0 18px}
@media (max-width:640px){.brand-logo{height:32px;max-width:70px}.brand small{display:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Topo ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.7;letter-spacing:0;margin-top:3px}
.top .spacer{flex:1}
.menu-link{flex:none;display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px}
.menu-link:hover{background:rgba(255,255,255,.1)}
.login .menu-link{align-self:flex-start;margin:-28px 0 28px}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who b{display:block;font-weight:600}
.who span{opacity:.7}
.who button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9aa6ad;display:inline-block}
.sync.ok i{background:#5fd3a9}.sync.err i{background:#ff8a7d}.sync.sync i{background:#ffd166;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{max-width:1180px;margin:0 auto;padding:10px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 12px 12px;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;font-size:14.5px}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
nav.tabs button .bdg{display:inline-block;min-width:19px;height:19px;line-height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;margin-left:6px;text-align:center;vertical-align:1px}
nav.tabs button .bdg.alerta{background:#ff5a4a;animation:pulse 1.4s infinite}
@media (max-width:640px){.who .who-txt{display:none}.sync .sync-txt{display:none}.brand{font-size:19px}}

main{max-width:1180px;margin:0 auto;padding:20px 18px 110px}
h2.view{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:4px 0 4px}
p.lead{color:var(--mute);margin:0 0 18px;max-width:62ch}
h3.sec{font-family:var(--display);font-weight:700;font-size:18px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3.sec .count{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:500}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 18px;background:var(--brand);color:var(--brand-on);font-weight:700;cursor:pointer;font-size:15px;transition:background-color .35s ease}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--chili);border:1.5px solid #eec3be}
.btn.dark{background:var(--ink)}
.btn.jade{background:var(--jade)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--yuzu-soft);color:var(--yuzu)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:#ECEFEC;color:var(--mute)}
.pill.info{background:var(--sky-soft);color:var(--sky)}
.pill.roxo{background:var(--roxo-soft);color:var(--roxo)}
.pill.urgente{background:#C23A2E;color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#c4cbc6}
.dot.ok{background:var(--jade)}.dot.warn{background:var(--yuzu)}.dot.bad{background:var(--chili)}.dot.info{background:var(--sky)}
.empty{color:var(--mute);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-lg);background:rgba(255,255,255,.5)}
.banner{background:var(--yuzu-soft);color:#6d4d05;border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.banner.urg{background:#FBE4E5;color:#8d1f16;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--mute)}
.fld.req>span::after{content:" *";color:var(--chili)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none}
.fld.sm select,.fld.sm input{min-height:38px;padding:7px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12.5px;color:var(--mute)}
.err-msg{color:var(--chili);font-size:13px;font-weight:600}
.seg{display:inline-flex;background:#E4E8E3;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(30,43,51,.12)}

/* ---------- Painel ---------- */
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.gauge{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge svg{width:100%;max-width:280px;height:auto;display:block}
.gauge .pct{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em;margin-top:-54px}
.gauge .pct sup{font-size:26px;vertical-align:top;margin-left:2px}
.gauge .g-lbl{font-weight:600;margin-top:8px}
.gauge .g-sub{font-size:12.5px;opacity:.7;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px}
.tile[data-act]{cursor:pointer}
.tile[data-act]:hover{border-color:var(--brand)}
.tile b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.tile span{font-size:13.5px;color:var(--mute);font-weight:500}
.tile.bad b{color:var(--chili)}.tile.warn b{color:var(--yuzu)}.tile.info b{color:var(--sky)}.tile.ok b{color:var(--jade)}
.quick{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.quick .btn{flex:1;min-width:180px;padding:14px}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row-main small,.row-num small{display:block;color:var(--mute);font-size:12.5px}
.row-num{text-align:right;white-space:nowrap}
.row-num b{font-weight:700}
.row .btn.sm{flex:none}
details.more>summary{cursor:pointer;font-weight:600;color:var(--sky);padding:8px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}

/* ---------- Cartão de demanda ---------- */
.dem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.dem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;font:inherit}
.dem:hover{border-color:var(--brand);border-left-color:inherit}
.dem.p-baixa{border-left-color:#9AA3A9}
.dem.p-normal{border-left-color:var(--sky)}
.dem.p-alta{border-left-color:var(--yuzu)}
.dem.p-emergencial{border-left-color:var(--chili);background:#FFF9F8}
.dem .dem-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dem .dem-num{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:-.01em;color:var(--mute)}
.dem .dem-tit{font-weight:700;font-size:16.5px;line-height:1.25}
.dem .dem-loc{font-size:12.5px;color:var(--mute)}
.dem .dem-pes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.dem .dem-pes b{font-weight:600}
.dem .dem-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.dem.aceite{box-shadow:0 0 0 2px var(--accent) inset}

/* ---------- Linha do tempo ---------- */
.tl{position:relative;margin:4px 0 0;padding:0 0 0 22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:10px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--sky);border:2px solid var(--paper)}
.tl-item.ok::before{background:var(--jade)}
.tl-item.bad::before{background:var(--chili)}
.tl-item.warn::before{background:var(--yuzu)}
.tl-item .tl-h{font-size:12.5px;color:var(--mute)}
.tl-item .tl-b{font-weight:600}
.tl-item .tl-t{font-size:14px;margin-top:2px;white-space:pre-wrap}
.tl-item .tl-x{font-size:12.5px;margin-top:4px}
.tl-item a{color:var(--sky)}

/* ---------- Detalhe ---------- */
.det-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.det-kv{display:grid;grid-template-columns:132px 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
.det-kv dt{color:var(--mute);font-weight:600;font-size:13px}
.det-kv dd{margin:0}
.det-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.det-box h4{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.det-box p{margin:0;white-space:pre-wrap}

/* ---------- Tabelas ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
table.tb th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb td.r,table.tb th.r{text-align:right}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:#F7F9F6}
.bar{height:8px;background:#E8ECE8;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--ink-2)}

/* ---------- Portaria (sem sessão) ---------- */
.login{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 18px 40px}
.login h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);letter-spacing:-.035em;line-height:.95;margin:0;text-align:center}
.login .sub{opacity:.72;margin:12px 0 30px;text-align:center;max-width:46ch}
.login .unis{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.login .unis span{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;font-size:13px}

/* ---------- Modal / Toast ---------- */
.modal{position:fixed;inset:0;background:rgba(20,30,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:680px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-family:var(--display);font-size:20px}
.sheet header button{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--mute);padding:4px 8px}
.sheet .body{padding:16px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.bad{background:var(--chili)}
.aviso-versao{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 12px 10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:92vw}
.aviso-versao button{border:0;border-radius:999px;padding:8px 14px;background:var(--brand);color:var(--brand-on);font-weight:700;cursor:pointer;font:inherit;white-space:nowrap}
</style>
</head>
<body data-tema="QF">

<div id="login" class="login hidden"></div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <a class="menu-link" href="#" data-act="menu" aria-label="Voltar ao menu">&#8592; Menu</a>
      <div class="brand-row">
        <img class="brand-logo" id="brandLogo" src="https://rodsilveira-rs.github.io/qfood-dashboard/assets/qfood-logo.png" alt="Q Food Company" onerror="this.style.visibility='hidden'">
        <div class="brand">Gestão Técnica<small id="brandSub">Mercearia Liberdade, Gogui e Cozinha de Produção</small></div>
      </div>
      <div class="spacer"></div>
      <span class="sync" id="sync"><i></i><span class="sync-txt">Carregando</span></span>
      <div class="who"><div class="who-txt"><b id="whoName"></b><span id="whoRole"></span></div><button type="button" data-act="logout">Sair</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <header><h3 id="mTitle"></h3><button type="button" data-act="close" aria-label="Fechar">×</button></header>
    <div class="body" id="mBody"></div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   CONFIGURAÇÃO
   GAS_URL: cole aqui a URL /exec da implantação do Code_Gestao_Tecnica.gs.
   Vazio = modo local (dados só neste aparelho, útil para teste).
   ========================================================= */
const CFG = {
  GAS_URL: '',
  CACHE_KEY: 'gt_cache_v1',
  OUTBOX_KEY: 'gt_outbox_v1',
  ROSTER_KEY: 'gt_roster_v1',
  ROSTER_TTL_MIN: 15,
  REFRESH_MS: 120000,
  MENU_URL: 'https://rodsilveira-rs.github.io/qfood-dashboard/Index_Menu.html',
  /* Mesma planilha publicada que o Index_Menu usa para ler a aba USRR. */
  USRR_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQPVyIo5MxwR6mcxIQcNYjPvBFJIkHNceED2efR0UInsselVC6h3d_KQ2-uLtFUwMYAE-XyIIOK-h7W/pub?gid=1823026381&single=true&output=csv',
  COL_NIVEL: 'Gestao_Tecnica',
  SESSION_HOURS: 8,
  VERSAO_MS: 300000,
  OCIOSO_MS: 60000
};

const UN = {
  ML: { nome: 'Mercearia Liberdade', curto: 'Mercearia' },
  GG: { nome: 'Gogui Korean', curto: 'Gogui' },
  CP: { nome: 'Cozinha de Produção', curto: 'Cozinha' }
};
const UN_IDS = ['ML', 'GG', 'CP'];
const ASSETS_URL = 'https://rodsilveira-rs.github.io/qfood-dashboard/assets/';
const TEMAS = {
  QF: { logo: 'qfood-logo.png', alt: 'Q Food Company', cor: '#141416', sub: 'Mercearia Liberdade, Gogui e Cozinha de Produção' },
  ML: { logo: 'Logo_Mercearia_Liberdade.png', alt: 'Mercearia Liberdade', cor: '#3A0C10', sub: 'Mercearia Liberdade' },
  GG: { logo: 'gogui-logo.jpg', alt: 'Gogui Korean BBQ', cor: '#110F0C', sub: 'Gogui Korean' }
};
const temaDaUnidade = u => (u === 'ML' || u === 'GG') ? u : 'QF';
function aplicarTema(u) {
  const id = temaDaUnidade(u);
  const t = TEMAS[id];

/* Lista de responsáveis: quem tem a coluna Gestao_Tecnica preenchida na USRR. */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { cur.push(field); field = ''; }
    else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || cur.length) { cur.push(field); rows.push(cur); }
  return rows;
}
function rosterDoCSV(txt) {
  const rows = parseCSV(txt);
  if (!rows.length) return [];
  const head = rows[0].map(h => String(h || '').trim());
  const col = n => head.findIndex(h => h.toLowerCase() === n.toLowerCase());
  const iEmail = col('email'), iNome = col('nome'), iNivel = col(CFG.COL_NIVEL);
  if (iEmail < 0 || iNivel < 0) return [];
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || !row.length) continue;
    const email = String(row[iEmail] || '').trim().toLowerCase();
    const nivel = String(row[iNivel] || '').trim().toLowerCase();
    if (!email || !nivel) continue;
    out.push({
      email,
      nome: String(iNome >= 0 ? row[iNome] : '').trim() || email,
      nivel: ['executor', 'tecnico', 'gestor'].includes(nivel) ? nivel : 'executor'
    });
  }
  return out.sort(byNome);
}

/* Chave de recorrência: é ela que permite dizer "esse problema já aconteceu 4 vezes". */
function chaveRec(d) {

function origensPendentes() {
  const usadas = new Set(DB.demandas.filter(d => d.origem_id).map(d => d.origem_id));
  const out = [];
  DB.observacoes.forEach(o => {

  });

function periodo() {
  const t = today();
  if (F.per === 'hoje') return [t, t];
  if (F.per === 'semana') return [addDays(t, -6), t];
  if (F.per === 'mes') return [t.slice(0, 8) + '01', t];
  if (F.per === 'tudo') return ['0000-01-01', '9999-12-31'];
  const a = F.de || t, b = F.ate || t;
  return a <= b ? [a, b] : [b, a];
}
const inPer = (d, per) => { const x = String(d || '').slice(0, 10); return x >= per[0] && x <= per[1]; };

function filtrar(lista) {
  const per = periodo();
  const q = normal(F.q);
  return lista.filter(d => {
    if (F.un !== 'todas' && d.unidade !== F.un) return false;
    if (F.prio !== 'todas' && d.prioridade !== F.prio) return false;
    if (F.resp !== 'todos' && normal(d.responsavel) !== normal(F.resp)) return false;
    if (F.st === 'abertas' && !stAberto(d.status)) return false;
    if (F.st === 'atrasadas' && !atrasada(d)) return false;
    if (F.st === 'concluidas' && d.status !== 'concluida') return false;
    if (ST_IDS.includes(F.st) && d.status !== F.st) return false;
    if (F.st === 'concluidas' && !inPer(d.data_conclusao || d.data_abertura, per)) return false;
    if (F.st !== 'concluidas' && F.per !== 'tudo' && !stAberto(d.status) && !inPer(d.data_abertura, per)) return false;
    if (q && !normal([d.numero, d.titulo, d.problema, d.responsavel, d.produto_nome, d.categoria, d.setor].join(' ')).includes(q)) return false;
    return true;
  }).sort(ordenar);
}
/* Emergencial primeiro, depois atrasada, depois prazo mais curto. */
function ordenar(a, b) {
  const pa = prioOrdem(a.prioridade), pb = prioOrdem(b.prioridade);
  if (pa !== pb) return pa - pb;
  const aa = atrasada(a) ? 0 : 1, ab = atrasada(b) ? 0 : 1;
  if (aa !== ab) return aa - ab;
  const za = a.prazo || '9999-12-31', zb = b.prazo || '9999-12-31';
  if (za !== zb) return String(za).localeCompare(String(zb));
  return String(b.data_abertura).localeCompare(String(a.data_abertura));
}

function navItems() {
  const minhas = DB.demandas.filter(d => stAberto(d.status) && minhaDemanda(d));
  const aceites = minhas.filter(aguardaMeuAceite).length;
  const it = [
    ['painel', 'Painel', 0],
    ['minhas', 'Minhas', aceites || minhas.length, !!aceites]
  ];
  if (ehTecnico()) it.push(['entrada', 'Entrada', origensPendentes().length, false]);
  it.push(['todas', 'Todas', 0], ['recorrencias', 'Recorrências', 0]);
  if (ehTecnico()) it.push(['relatorios', 'Relatórios', 0]);
  if (ehGestor()) it.push(['cadastros', 'Cadastros', 0]);
  return it;
}

function cartaoDemanda(d) {

  const rec = ocorrencias(d).length;
  return `<button type="button" class="dem p-${normal(d.prioridade) || 'normal'}${aguardaMeuAceite(d) ? ' aceite' : ''}" data-act="abrir-dem" data-id="${esc(d.id)}">

function listaDemandas(lista, vazio) {

}

/* =========================================================

function gaugeSVG(pct) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = pct === null ? '#5b6a73' : p < 60 ? '#ff7a6b' : p < 85 ? '#f2b632' : '#5fd3a9';
  const r = 100, cx = 120, cy = 120;
  const ang = Math.PI * (1 - p / 100);
  const x = cx + r * Math.cos(ang), y = cy - r * Math.sin(ang);
  const arc = p > 0 ? `<path d="M20 120 A100 100 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${cor}" stroke-width="22" stroke-linecap="round"/>` : '';
  const ticks = [0, 25, 50, 75, 100].map(t => {
    const a = Math.PI * (1 - t / 100);
    return `<line x1="${cx + 118 * Math.cos(a)}" y1="${cy - 118 * Math.sin(a)}" x2="${cx + 126 * Math.cos(a)}" y2="${cy - 126 * Math.sin(a)}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`;
  }).join('');
  const needle = `<line x1="${cx}" y1="${cy}" x2="${(cx + 74 * Math.cos(ang)).toFixed(2)}" y2="${(cy - 74 * Math.sin(ang)).toFixed(2)}" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="${cx}" cy="${cy}" r="6" fill="#fff" opacity=".55"/>`;
  return `<svg viewBox="0 0 240 132" aria-hidden="true"><path d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="22" stroke-linecap="round"/>${arc}${ticks}${pct === null ? '' : needle}</svg>`;
}

  const comPrazo = concl.filter(d => noPrazo(d) !== null);

  const travadas = abertas.filter(d => ['bloqueada', 'decisao', 'terceiro'].includes(d.status));
  const recs = gruposRecorrentes();
  const temposConcl = concl.map(d => tempos(d).total).filter(t => t !== null);
  const medio = temposConcl.length ? temposConcl.reduce((a, b) => a + b, 0) / temposConcl.length : null;
  const entrada = ehTecnico() ? origensPendentes().length : 0;

  return `

      <div class="tile${atras.length ? ' bad' : ''}" data-act="ir-todas" data-st="atrasadas"><b>${atras.length}</b><span>Atrasadas</span></div>
      <div class="tile${emerg.length ? ' bad' : ''}" data-act="ir-todas" data-st="abertas" data-prio="Emergencial"><b>${emerg.length}</b><span>Emergenciais</span></div>
      <div class="tile${semAceite.length ? ' warn' : ''}" data-act="ir-todas" data-st="aceite"><b>${semAceite.length}</b><span>Sem aceite do responsável</span></div>
      <div class="tile${validando.length ? ' warn' : ''}" data-act="ir-todas" data-st="validacao"><b>${validando.length}</b><span>Aguardando validação</span></div>
      <div class="tile${travadas.length ? ' info' : ''}"><b>${travadas.length}</b><span>Bloqueadas ou aguardando terceiro</span></div>
      <div class="tile"><b>${medio === null ? '—' : tempoHumano(medio).replace(/ h| dias/, '')}</b><span>Tempo médio de resolução${medio === null ? '' : medio < 48 ? ' (horas)' : ' (dias)'}</span></div>
      <div class="tile${recs.length ? ' warn' : ''}" data-act="goto" data-v="recorrencias"><b>${recs.length}</b><span>Problemas recorrentes</span></div>
      ${ehTecnico() ? `<div class="tile${entrada ? ' info' : ''}" data-act="goto" data-v="entrada"><b>${entrada}</b><span>Na entrada, vindas da Produção</span></div>` : `<div class="tile"><b>${concl.length}</b><span>Concluídas no período</span></div>`}
    </div>
  </div>
  ${ehTecnico() ? `<div class="quick"><button type="button" class="btn" data-act="nova-dem">Registrar demanda</button></div>` : ''}

  <h3 class="sec">Precisa de atenção agora <span class="count">${plural(atras.length + emerg.length, 'demanda')}</span></h3>
  ${listaDemandas(atras.concat(emerg.filter(d => !atrasada(d))).sort(ordenar).slice(0, 9), 'Nada atrasado nem emergencial. Bom sinal.')}

  <h3 class="sec">Esperando alguém confirmar <span class="count">${plural(semAceite.length, 'demanda')}</span></h3>
  ${listaDemandas(semAceite.sort(ordenar).slice(0, 6), 'Todas as demandas já foram aceitas pelos responsáveis.')}

  <h3 class="sec">Concluídas recentemente <span class="count">${plural(concl.length, 'no período')}</span></h3>
  ${concl.length ? `<div class="list">${concl.sort((a, b) => String(b.data_conclusao).localeCompare(String(a.data_conclusao))).slice(0, 8).map(d => {
    const t = tempos(d);
    return `<div class="row"><span class="dot ${noPrazo(d) === false ? 'warn' : 'ok'}"></span>
      <div class="row-main"><b>${esc(d.titulo)}</b><small>${esc(demNum(d))} · ${esc(d.responsavel || '—')} · ${esc(UN[d.unidade] ? UN[d.unidade].curto : d.unidade)}</small></div>
      <div class="row-num"><b>${esc(tempoHumano(t.total))}</b><small>${noPrazo(d) === false ? 'fora do prazo' : 'no prazo'}</small></div>
      <button type="button" class="btn sm ghost" data-act="abrir-dem" data-id="${esc(d.id)}">Abrir</button></div>`;
  }).join('')}</div>` : '<div class="empty">Nenhuma demanda concluída no período selecionado.</div>'}`;
}

/* =========================================================
   RELATÓRIOS
   ========================================================= */
function vRelatorios() {
  const per = periodo();
  const base = demandas().filter(d => F.un === 'todas' || d.unidade === F.un);
  const noPeriodo = base.filter(d => inPer(d.data_abertura, per) || (d.data_conclusao && inPer(d.data_conclusao, per)) || stAberto(d.status));
  const porPessoa = {};
  noPeriodo.forEach(d => {
    const n = d.responsavel || '—';
    const o = porPessoa[n] = porPessoa[n] || { n, total: 0, abertas: 0, atrasadas: 0, concluidas: 0, prazo: 0, comPrazo: 0, aceite: [], tempos: [] };
    o.total++;
    if (stAberto(d.status)) o.abertas++;
    if (atrasada(d)) o.atrasadas++;
    if (d.status === 'concluida') {
      o.concluidas++;
      const np = noPrazo(d);
      if (np !== null) { o.comPrazo++; if (np) o.prazo++; }
      const t = tempos(d);
      if (t.total !== null) o.tempos.push(t.total);
    }
    const t = tempos(d);
    if (t.ateAceite !== null) o.aceite.push(t.ateAceite);
  });
  const pessoas = Object.values(porPessoa).sort((a, b) => b.total - a.total);
  const media = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;

  const porCategoria = {};
  noPeriodo.forEach(d => { const k = d.categoria || 'Sem categoria'; porCategoria[k] = (porCategoria[k] || 0) + 1; });
  const cats = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;

  return `
  <h2 class="view">Relatórios</h2>
  <p class="lead">Entregas por pessoa, tempo de resposta e onde os problemas se concentram.</p>
  ${filtros(false)}
  <div class="actions" style="margin-bottom:18px">
    <button type="button" class="btn ghost" data-act="exp-xlsx">Baixar Excel</button>
    <button type="button" class="btn ghost" data-act="exp-pdf">Imprimir ou salvar PDF</button>
  </div>

  <h3 class="sec">Por responsável <span class="count">${plural(pessoas.length, 'pessoa')}</span></h3>
  <div class="tb-wrap"><table class="tb">
    <thead><tr><th>Responsável</th><th class="r">Total</th><th class="r">Abertas</th><th class="r">Atrasadas</th><th class="r">Concluídas</th><th class="r">No prazo</th><th class="r">Até aceitar</th><th class="r">Tempo médio</th></tr></thead>
    <tbody>${pessoas.length ? pessoas.map(p => {
      const pct = p.comPrazo ? Math.round(p.prazo / p.comPrazo * 100) : null;
      return `<tr><td><b>${esc(p.n)}</b></td><td class="r num">${p.total}</td><td class="r num">${p.abertas}</td>
      <td class="r num" style="${p.atrasadas ? 'color:var(--chili);font-weight:700' : ''}">${p.atrasadas}</td>
      <td class="r num">${p.concluidas}</td><td class="r num">${pct === null ? '—' : pct + '%'}</td>
      <td class="r num">${esc(tempoHumano(media(p.aceite)))}</td><td class="r num">${esc(tempoHumano(media(p.tempos)))}</td></tr>`;
    }).join('') : '<tr><td colspan="8">Nenhuma demanda no período.</td></tr>'}</tbody>

function linhaDoTempo(id) {
  const mov = andamentoDe(id);
  if (!mov.length) return '<div class="empty">Sem movimentos registrados.</div>';
  return `<div class="tl">${mov.map(m => {
    const def = MOV[m.tipo] || { t: m.tipo, c: '' };
    const quem = m.tipo === 'direcionamento' || m.tipo === 'transferencia'
      ? `${esc(m.de || '—')} → ${esc(m.para || '—')}`
      : esc(m.autor || '—');
    return `<div class="tl-item ${def.c}">
      <div class="tl-h">${fmtDH(m.data_hora)}</div>
      <div class="tl-b">${esc(def.t)} · ${quem}</div>
      ${m.texto ? `<div class="tl-t">${esc(m.texto)}</div>` : ''}
      ${m.prazo_novo ? `<div class="tl-x">Novo prazo: <b>${fmtD(m.prazo_novo)}</b></div>` : ''}
      ${m.evidencia ? `<div class="tl-x">${fotoHTML(m.evidencia)}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function acoesDaDemanda(d) {
  const b = [];
  const aberto = stAberto(d.status);
  const meu = minhaDemanda(d);
  if (!aberto) {
    if (ehTecnico() && d.status === 'concluida') b.push(['reabrir', 'Reabrir', 'danger']);
    return b;
  }
  if (d.status === 'aceite' && (meu || ehTecnico())) b.push(['aceitar', 'Confirmar recebimento', '']);
  if (d.status !== 'aceite' && d.status !== 'validacao') {
    if (meu || ehTecnico()) b.push(['acao', 'Registrar ação', '']);
  }
  b.push(['comentar', 'Comentar', 'ghost']);
  if (meu || ehTecnico()) {
    if (d.status !== 'bloqueada') b.push(['bloquear', 'Bloquear', 'ghost']);
    else b.push(['desbloquear', 'Desbloquear', 'ghost']);
    b.push(['prazo', 'Alterar prazo', 'ghost']);
  }
  if (ehTecnico()) b.push(['transferir', 'Transferir', 'ghost']);
  if ((meu || ehTecnico()) && d.status !== 'aceite' && d.status !== 'validacao') b.push(['concluir', 'Concluir', 'jade']);
  if (d.status === 'validacao' && ehTecnico()) b.push(['validar', 'Validar e encerrar', 'jade']);
  if (ehGestor()) b.push(['cancelar', 'Cancelar', 'danger']);
  return b;
}

      ${origem ? `<dt>Origem</dt><dd>${esc(d.origem_tipo === 'desperdicio' ? 'Descarte' : 'Observação')} da produção, ${fmtDH(origem.data_hora)}, por ${esc(origem.responsavel || '—')}</dd>` : ''}
    </dl>

function registrarMov(demandaId, tipo, dados = {}) {
  return save('andamento', {
    id: uid('mv'), demanda_id: demandaId, data_hora: nowISO(), tipo,
    de: dados.de || '', para: dados.para || '', texto: dados.texto || '',
    prazo_novo: dados.prazo_novo || '', status_novo: dados.status_novo || '',
    evidencia: dados.evidencia || '', autor: USER.nome, status: 'ativo', criado_em: nowISO()
  }, true);
}
function mudarStatus(d, novo, tipo, dados = {}) {
  const patch = { id: d.id, status: novo };
  Object.assign(patch, dados.patch || {});
  save('demandas', patch, true);
  registrarMov(d.id, tipo, dados);
  render();
  if ($('#modal').classList.contains('open')) abrirDemanda(d.id);
}

function formSimples(titulo, campos, onOk, textoBotao) {
  const html = `<form id="fMov" class="stack">
    ${campos}
    <div class="err-msg" id="movErr"></div>
    <div class="actions"><button type="submit" class="btn block">${textoBotao || 'Salvar'}</button></div>
  </form>`;
  openModal(titulo, html, root => {
    const f = $('#fMov', root), err = $('#movErr', root);
    bindFoto(root);
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      if (FOTO_BUSY) { err.textContent = 'Aguarde o envio da foto terminar.'; return; }
      const msg = onOk(f);
      if (msg) { err.textContent = msg; return; }
    });
  });
}

/* =========================================================
   FOTOS: guarda no aparelho e envia quando houver internet
   ========================================================= */
const FOTO_DB = 'gt_fotos';
let FOTO_FLUSH = false;
function idb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(FOTO_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('fotos')) req.result.createObjectStore('fotos', { keyPath: 'id' }); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function idbOp(modo, fn) {
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction('fotos', modo);
    const st = tx.objectStore('fotos');
    const r = fn(st);
    tx.oncomplete = () => res(r && r.result !== undefined ? r.result : r);
    tx.onerror = () => rej(tx.error);
  }));
}
const fotoGuardar = f => idbOp('readwrite', st => st.put(f));
const fotoLer = id => idbOp('readonly', st => st.get(id));
const fotoApagar = id => idbOp('readwrite', st => st.delete(id));
const fotoTodas = () => idbOp('readonly', st => st.getAll());

const fotoPendente = v => String(v || '').startsWith('pendente:');
function fotoHTML(v, classe) {
  if (!v) return '';
  if (fotoPendente(v)) return '<span class="pill warn">Foto guardada, aguardando internet</span>';
  return `<a href="${esc(v)}" target="_blank" rel="noopener"${classe ? ` class="${classe}"` : ''}>Ver foto</a>`;
}
const CAMPOS_FOTO = [['demandas', 'evidencia'], ['demandas', 'evidencia_solucao'], ['andamento', 'evidencia']];
const fotosNaFila = () => CAMPOS_FOTO.reduce((n, [t, c]) => n + DB[t].filter(r => r.status !== 'cancelado' && fotoPendente(r[c])).length, 0);

async function compressImg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
async function enviarFoto(foto) {
  const r = await api({ action: 'upload', name: foto.nome, mime: 'image/jpeg', data: foto.data.split(',')[1] });
  if (!r || !r.ok) throw new Error((r && r.error) || 'Falha no envio da foto');
  return r.url;
}
function bindFoto(root) {
  const inp = $('[data-foto]', root);
  if (!inp) return;
  inp.addEventListener('change', async () => {
    const file = inp.files[0];
    if (!file) return;
    const out = $('input[name=evidencia]', root), st = $('.foto-st', root);
    FOTO_BUSY = true;
    st.textContent = 'Preparando a foto…';
    try {
      const data = await compressImg(file);
      const id = uid('ft');
      const nome = `${today()}_${USER.nome.replace(/[^\w]+/g, '_')}_${Date.now()}.jpg`;
      await fotoGuardar({ id, data, nome, criado_em: nowISO() });
      out.value = 'pendente:' + id;
      st.textContent = 'Foto guardada no aparelho.';
      if (CFG.GAS_URL && navigator.onLine) {
        st.textContent = 'Enviando foto…';
        try {
          const url = await enviarFoto({ data, nome });
          await fotoApagar(id);
          out.value = url;
          st.innerHTML = `Foto anexada. <a href="${esc(url)}" target="_blank" rel="noopener">Ver</a>`;
        } catch (e) {
          console.warn(e);
          st.textContent = 'Sem internet agora. A foto fica guardada e sobe sozinha depois.';
        }
      }
    } catch (e) {
      console.warn(e);
      st.textContent = 'Não foi possível ler a foto. Tente tirar de novo.';
      inp.value = '';
    } finally { FOTO_BUSY = false; }
  });
}
async function flushFotos() {
  if (!CFG.GAS_URL || FOTO_FLUSH || !navigator.onLine) return;
  const pendentes = [];
  CAMPOS_FOTO.forEach(([t, c]) => DB[t].forEach(r => { if (r.status !== 'cancelado' && fotoPendente(r[c])) pendentes.push({ tab: t, row: r, campo: c }); }));
  if (!pendentes.length) { limparFotosOrfas(); return; }
  FOTO_FLUSH = true;
  let enviadas = 0;
  try {
    for (const { tab, row, campo } of pendentes.slice(0, 5)) {
      const id = String(row[campo]).slice(9);
      const foto = await fotoLer(id);
      if (!foto) { save(tab, { id: row.id, [campo]: '' }, true); continue; }
      const url = await enviarFoto(foto);
      save(tab, { id: row.id, [campo]: url }, true);
      await fotoApagar(id);
      enviadas++;
    }
  } catch (e) {
    console.warn('Envio de foto adiado', e);
  } finally { FOTO_FLUSH = false; }
  if (enviadas) {
    persist();
    if (!$('#modal').classList.contains('open') && !isTyping()) render();
    if (fotosNaFila()) setTimeout(flushFotos, 2000);
  }
}
async function limparFotosOrfas() {
  try {
    const usadas = new Set();
    CAMPOS_FOTO.forEach(([t, c]) => DB[t].forEach(r => { if (fotoPendente(r[c])) usadas.add(String(r[c]).slice(9)); }));
    const todas = await fotoTodas();
    const limite = Date.now() - 48 * 3600e3;
    for (const f of todas) {
      if (usadas.has(f.id)) continue;
      if (new Date(String(f.criado_em).replace(' ', 'T')).getTime() < limite) await fotoApagar(f.id);
    }
  } catch (e) { /* silencioso */ }
}
function iniciarFotos() {
  flushFotos();
  setInterval(() => { if (!document.hidden) flushFotos(); }, 60000);
  window.addEventListener('online', () => setTimeout(flushFotos, 1500));
}

/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
   Consulta o próprio arquivo de tempos em tempos. Se mudou, avisa e recarrega
   quando não houver nada em edição.
   ========================================================= */
let VERSAO_ASSINATURA = null, NOVA_VERSAO = false, ULTIMO_TOQUE = Date.now(), CHECANDO = false;
const hashTexto = t => {
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return String(h);
};
function trabalhoEmAndamento() {
  if ($('#modal').classList.contains('open')) return true;
  if (isTyping()) return true;
  if (OUTBOX.length) return true;
  return false;
}
function recarregar() {
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
}
function avisarNovaVersao() {
  if ($('#avisoVersao')) return;
  const el = document.createElement('div');
  el.id = 'avisoVersao';
  el.className = 'aviso-versao';
  el.innerHTML = '<span>Nova versão disponível</span><button type="button" data-act="atualizar">Atualizar agora</button>';
  document.body.appendChild(el);
}
async function checarVersao() {
  if (CHECANDO) return;
  CHECANDO = true;
  try {
    const url = location.pathname + '?checagem=' + Date.now();
    let assinatura = null;
    try {
      const h = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (h.ok) assinatura = h.headers.get('etag') || h.headers.get('last-modified');
    } catch (e) { /* alguns servidores não respondem HEAD */ }
    if (!assinatura) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.text();
      assinatura = t.length + ':' + hashTexto(t);
    }
    if (!VERSAO_ASSINATURA) { VERSAO_ASSINATURA = assinatura; return; }
    if (assinatura !== VERSAO_ASSINATURA) {
      NOVA_VERSAO = true;
      avisarNovaVersao();
      if (!trabalhoEmAndamento() && Date.now() - ULTIMO_TOQUE > CFG.OCIOSO_MS) recarregar();
    }
  } catch (e) {
    console.warn('Checagem de versão falhou', e);
  } finally { CHECANDO = false; }
}
function iniciarChecagemVersao() {
  checarVersao();
  setInterval(() => { if (!document.hidden) checarVersao(); }, CFG.VERSAO_MS);
  setInterval(() => {
    if (NOVA_VERSAO && !document.hidden && !trabalhoEmAndamento() && Date.now() - ULTIMO_TOQUE > CFG.OCIOSO_MS) recarregar();
  }, 20000);
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { ULTIMO_TOQUE = Date.now(); }, { passive: true }));
}

document.addEventListener('click', ev => {
  const nv = ev.target.closest('[data-view]');
  if (nv) { VIEW = nv.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (ev.target === $('#modal')) { closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'menu': ev.preventDefault(); window.location.href = CFG.MENU_URL; break;
    case 'logout': window.location.href = CFG.MENU_URL; break;
    case 'atualizar': recarregar(); break;
    case 'close': closeModal(); break;
    case 'goto': VIEW = el.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'ir-todas':
      F.st = el.dataset.st || 'abertas';
      if (el.dataset.prio) F.prio = el.dataset.prio;
      VIEW = 'todas'; render(); window.scrollTo(0, 0); break;
    case 'abrir-dem': abrirDemanda(id); break;
    case 'nova-dem': abrirNovaDemanda(null); break;
    case 'dem-de-origem': {
      const lista = origensPendentes();
      const o = lista.find(x => x.r.id === id);
      if (o) abrirNovaDemanda(o); else toast('Registro não encontrado.', true);
      break;
    }
    case 'dem-aceitar': acaoAceitar(id); break;
    case 'dem-comentar': acaoComentar(id); break;
    case 'dem-acao': acaoRegistrarAcao(id); break;
    case 'dem-transferir': acaoTransferir(id); break;
    case 'dem-bloquear': acaoBloquear(id); break;
    case 'dem-desbloquear': acaoDesbloquear(id); break;
    case 'dem-prazo': acaoPrazo(id); break;
    case 'dem-concluir': acaoConcluir(id); break;
    case 'dem-validar': acaoValidar(id); break;
    case 'dem-reabrir': acaoReabrir(id); break;
    case 'dem-cancelar': acaoCancelar(id); break;
    case 'exp-xlsx': exportarPlanilha(); break;
    case 'exp-pdf': exportarPDF(); break;
    case 'cad-tab': CAD_TAB = el.dataset.t; render(); break;
    case 'nova-cat': abrirCategoria(null); break;
    case 'edit-cat': abrirCategoria(DB.categorias.find(c => c.id === id)); break;
  }
});
document.addEventListener('change', ev => {
  const f = ev.target.closest('[data-f]');
  if (!f) return;
  F[f.dataset.f] = f.value;
  if (f.dataset.f === 'per' && f.value === 'custom') { F.de = F.de || addDays(today(), -6); F.ate = F.ate || today(); }
  render();
});
document.addEventListener('input', ev => {
  if (ev.target.id !== 'gtBusca') return;
  F.q = ev.target.value;
  const pos = ev.target.selectionStart;
  render();
  const nb = $('#gtBusca');
  if (nb) { nb.focus(); nb.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
});
window.addEventListener('online', () => { flush(); load(); updSync(); });
window.addEventListener('offline', () => updSync());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  ULTIMO_TOQUE = Date.now();
  load();
  flushFotos();
  checarVersao();
});

/* =========================================================
   INÍCIO
   ========================================================= */
(function init() {
  restore();
  if (!definirUsuario()) { renderPortaria(); return; }
  render();
  carregarRoster();
  if (CFG.GAS_URL) {
    load();
    setInterval(() => { if (!document.hidden) load(); }, CFG.REFRESH_MS);
    setInterval(carregarRoster, CFG.ROSTER_TTL_MIN * 60000);
  }
  iniciarChecagemVersao();
  iniciarFotos();
})();

</script>
</body>
