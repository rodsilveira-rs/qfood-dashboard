<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Food — E-commerce, CRM & Conversão</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1f2e;--sf:#242938;--s2:#2e3447;--s3:#353c52;
  --br:rgba(255,255,255,0.10);--b2:rgba(255,255,255,0.18);
  --tx:#eef1f8;--mu:#a9b7d4;--mu2:#8394b4;
  --red:#ff5b52;--ok:#36cfa0;--warn:#ffaa2b;--blue:#4d8ef5;--pur:#a07cf6;--cyan:#22d3ee;--pink:#f472b6;
  --fh:'DM Sans',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
.hidden{display:none!important;}

/* topo */
.top{position:sticky;top:0;z-index:30;background:rgba(17,21,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--br);}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.top img{height:34px;}
.top h1{font-family:var(--fh);font-size:1.12rem;font-weight:800;letter-spacing:.2px;line-height:1.15;}
.top h1 small{display:block;font-size:.74rem;font-weight:500;color:var(--mu);letter-spacing:0;}
.top .sp{flex:1;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--s2);border:1px solid var(--br);color:var(--mu);cursor:default;white-space:nowrap;}
.chip.ok{background:rgba(54,207,160,.10);color:var(--ok);border-color:rgba(54,207,160,.35);}
.chip.warn{color:var(--warn);border-color:rgba(255,170,43,.4);}
.chip.err{color:var(--red);border-color:rgba(255,91,82,.45);}
.chip.clic{cursor:pointer;}
.lnk{font-size:.78rem;color:var(--mu);padding:6px 10px;border-radius:8px;border:1px solid var(--br);}
.lnk:hover{color:var(--tx);background:var(--s2);}
.tabs{max-width:1280px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;border:1px solid var(--br);background:var(--sf);color:var(--mu);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.84rem;cursor:pointer;}
.tab.on{background:var(--pur);border-color:var(--pur);color:#fff;}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;line-height:18px;text-align:center;}

.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 80px;}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.hero h2{font-family:var(--fh);font-size:1.35rem;font-weight:800;}
.hero p{font-size:.85rem;color:var(--mu);margin-top:4px;max-width:720px;line-height:1.45;}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ctrl label{font-size:.74rem;color:var(--mu);}
.inp,.sel{background:var(--s2);border:1px solid var(--b2);border-radius:9px;padding:8px 10px;min-height:38px;outline:none;}
.inp:focus,.sel:focus,textarea:focus{border-color:var(--pur);box-shadow:0 0 0 3px rgba(160,124,246,.18);}
.btn{border:none;border-radius:10px;padding:9px 16px;font-weight:700;font-size:.84rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:38px;}
.btn.pri{background:var(--pur);color:#fff;}
.btn.ok{background:var(--ok);color:#0d1a14;}
.btn.gh{background:var(--s2);color:var(--tx);border:1px solid var(--b2);}
.btn.sm{padding:6px 10px;font-size:.76rem;min-height:30px;border-radius:8px;}
.btn:disabled{opacity:.5;cursor:wait;}

.estado{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}

/* velocímetros */
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:16px;}
.gauge{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:12px 12px 10px;text-align:center;}
.gauge svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto;}
.gauge .pc{font-family:var(--fh);font-weight:800;font-size:1.65rem;line-height:1;margin-top:4px;}
.gauge .lb{font-size:.78rem;font-weight:700;margin-top:8px;}
.gauge .sb{font-size:.72rem;color:var(--mu);margin-top:3px;line-height:1.35;min-height:2.7em;}

/* cartões e formulários */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.card{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:16px;margin-bottom:14px;}
.card.full{grid-column:1/-1;}
.ct{font-family:var(--fh);font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.ct .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:rgba(160,124,246,.18);color:var(--pur);font-size:.78rem;}
.cs{font-size:.76rem;color:var(--mu);margin-bottom:12px;line-height:1.45;}
.fs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.f{display:flex;flex-direction:column;gap:5px;}
.f label{font-size:.72rem;color:var(--mu);font-weight:600;overflow-wrap:anywhere;}
.f{min-width:0;}
.card{min-width:0;}
.f input,.f select,.f textarea{background:var(--s2);border:1px solid var(--b2);border-radius:9px;padding:8px 10px;min-height:38px;outline:none;width:100%;}
.f textarea{min-height:66px;resize:vertical;line-height:1.45;}
.f.w2{grid-column:span 2;}
.f.wf{grid-column:1/-1;}
.f .hint{font-size:.68rem;color:var(--mu2);}
.calc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.kv{background:var(--s2);border:1px solid var(--br);border-radius:10px;padding:8px 11px;min-width:120px;}
.kv .k{font-size:.68rem;color:var(--mu);}
.kv .v{font-weight:800;font-size:1rem;margin-top:2px;}
.kv.ok .v{color:var(--ok);} .kv.warn .v{color:var(--warn);} .kv.bad .v{color:var(--red);}
.alerta{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.8rem;line-height:1.45;border:1px solid;}
.alerta.bad{background:rgba(255,91,82,.10);border-color:rgba(255,91,82,.4);color:#ffb3ad;}
.alerta.ok{background:rgba(54,207,160,.10);border-color:rgba(54,207,160,.35);color:#9fe8cf;}
.alerta.info{background:rgba(77,142,245,.10);border-color:rgba(77,142,245,.35);color:#b7cffb;}

/* funil */
.funil{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.fun-l{display:grid;grid-template-columns:120px 1fr 74px;align-items:center;gap:10px;font-size:.78rem;}
.fun-b{height:22px;border-radius:6px;background:var(--s2);position:relative;overflow:hidden;}
.fun-b i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pur),var(--cyan));border-radius:6px;}
.fun-l .pc{text-align:right;font-weight:700;}
.fun-l.vaza .pc{color:var(--red);}
.fun-l.vaza .nm::after{content:' ⚠';color:var(--red);}

/* P&L */
.pl{margin-top:12px;border:1px solid var(--br);border-radius:10px;overflow:hidden;}
.pl-r{display:flex;justify-content:space-between;padding:8px 12px;font-size:.84rem;border-bottom:1px solid var(--br);}
.pl-r:last-child{border-bottom:none;}
.pl-r.neg span:last-child{color:#ffb3ad;}
.pl-r.tot{background:var(--s2);font-weight:800;}

/* tabelas editáveis */
.tw{overflow-x:auto;margin-top:6px;}
table.t{width:100%;border-collapse:collapse;font-size:.8rem;}
table.t th{text-align:left;font-size:.68rem;color:var(--mu);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--br);white-space:nowrap;}
table.t td{padding:5px 4px;border-bottom:1px solid var(--br);vertical-align:middle;}
table.t td input,table.t td select{width:100%;min-width:72px;background:var(--s2);border:1px solid var(--br);border-radius:7px;padding:6px 8px;min-height:32px;outline:none;}
table.t td.c{white-space:nowrap;font-weight:700;}
table.t td.x{width:34px;text-align:center;}
.rm{background:none;border:none;color:var(--mu2);cursor:pointer;font-size:1rem;padding:4px;}
.rm:hover{color:var(--red);}
.add{margin-top:8px;}

/* falhas */
.falhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.fa{display:flex;flex-direction:column;gap:6px;background:var(--s2);border:1px solid var(--br);border-radius:10px;padding:9px 10px;}
.fa.on{border-color:rgba(255,91,82,.55);background:rgba(255,91,82,.08);}
.fa .h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.8rem;font-weight:700;}
.sw{display:inline-flex;border:1px solid var(--b2);border-radius:8px;overflow:hidden;}
.sw button{border:none;background:transparent;color:var(--mu);font-size:.72rem;font-weight:700;padding:5px 9px;cursor:pointer;}
.sw button.on.okb{background:var(--ok);color:#0d1a14;}
.sw button.on.bad{background:var(--red);color:#fff;}
.fa input{background:var(--sf);border:1px solid var(--br);border-radius:7px;padding:6px 8px;font-size:.78rem;outline:none;}

/* testes */
.tst{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.tc{background:var(--s2);border:1px solid var(--br);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
.tc:hover{border-color:var(--b2);}
.tc .tt{font-weight:800;font-size:.88rem;}
.tc .hp{font-size:.76rem;color:var(--mu);line-height:1.4;}
.tags{display:flex;gap:6px;flex-wrap:wrap;}
.tg{font-size:.66rem;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--s3);color:var(--mu);}
.tg.ESCALAR{background:rgba(54,207,160,.18);color:var(--ok);}
.tg.CORRIGIR{background:rgba(255,170,43,.18);color:var(--warn);}
.tg.INTERROMPER{background:rgba(255,91,82,.18);color:var(--red);}
.tg.TESTAR{background:rgba(77,142,245,.18);color:var(--blue);}
.tg.rodando{background:rgba(160,124,246,.2);color:var(--pur);}
.tg.concluido{background:rgba(54,207,160,.14);color:var(--ok);}
.vazio{font-size:.82rem;color:var(--mu);padding:14px;border:1px dashed var(--b2);border-radius:10px;text-align:center;}

/* barra aquisição x retenção */
.split{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:12px;font-size:.72rem;font-weight:800;}
.split div{display:flex;align-items:center;justify-content:center;color:#0d1117;min-width:0;white-space:nowrap;overflow:hidden;}

/* tabela executiva */
table.ex{width:100%;border-collapse:collapse;font-size:.8rem;}
table.ex th{font-size:.68rem;color:var(--mu);text-align:left;padding:7px 6px;border-bottom:1px solid var(--b2);white-space:nowrap;}
table.ex td{padding:6px;border-bottom:1px solid var(--br);vertical-align:middle;}
table.ex td.d{font-weight:700;white-space:nowrap;}
table.ex td.n{white-space:nowrap;text-align:right;}
table.ex td input,table.ex td select{width:100%;min-width:90px;background:var(--s2);border:1px solid var(--br);border-radius:7px;padding:6px 8px;min-height:32px;outline:none;font-size:.78rem;}
.dv-ok{color:var(--ok);font-weight:800;} .dv-bad{color:var(--red);font-weight:800;} .dv-warn{color:var(--warn);font-weight:800;}

/* gráfico */
.chart svg{width:100%;height:auto;display:block;}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--mu);margin-top:6px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

/* checklist de entregas */
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--br);font-size:.82rem;}
.ck b{margin-left:auto;font-size:.78rem;}
.ck.ok b{color:var(--ok);} .ck.bad b{color:var(--red);} .ck.warn b{color:var(--warn);}

/* modal */
.mb{position:fixed;inset:0;background:rgba(5,8,15,.72);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
.md{background:var(--sf);border:1px solid var(--b2);border-radius:16px;max-width:760px;width:100%;padding:18px;}
.md h3{font-family:var(--fh);font-weight:800;font-size:1.1rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.md .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}

/* aviso de nova versão e toast */
.aviso-v{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:#111827;border:1px solid var(--pur);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:.82rem;box-shadow:0 10px 30px rgba(0,0,0,.45);}
.toast{position:fixed;right:16px;bottom:16px;z-index:90;background:#111827;border:1px solid var(--b2);border-left:4px solid var(--ok);border-radius:10px;padding:11px 14px;font-size:.84rem;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
.toast.err{border-left-color:var(--red);}
.toast.warn{border-left-color:var(--warn);}
.gate{max-width:460px;margin:16vh auto;padding:30px 26px;text-align:center;background:var(--sf);border:1px solid var(--br);border-radius:14px;}
.gate .i{font-size:2.3rem;margin-bottom:10px;}
.gate h2{font-size:1.1rem;margin-bottom:8px;}
.gate p{font-size:.86rem;color:var(--mu);line-height:1.5;margin-bottom:18px;}
.gate a{display:inline-block;background:var(--cyan);color:#0d1117;font-weight:800;padding:10px 24px;border-radius:9px;}

@media print{ body{background:#fff;color:#111;} .top,.ctrl,.estado,.add,.rm{display:none!important;} .card,.gauge{background:#fff;border-color:#ccc;} .kv{background:#f4f4f4;} table.ex td input,table.ex td select{border:none;background:none;color:#111;} }
@media(max-width:900px){ .grid2,.grid3{grid-template-columns:minmax(0,1fr);} }
@media(max-width:640px){
  .top-in{padding:10px 14px;gap:8px;}
  .top h1{font-size:1rem;}
  .tabs{padding:0 14px 8px;}
  .wrap{padding:14px 14px 80px;}
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .gauge{padding:10px 6px 8px;}
  .gauge .pc{font-size:1.35rem;margin-top:2px;}
  .fs{grid-template-columns:repeat(2,minmax(0,1fr));}
  .f.w2{grid-column:1/-1;}
  .fun-l{grid-template-columns:92px 1fr 58px;}
  .hide-m{display:none;}
  .hero h2{font-size:1.15rem;}
  .ctrl{width:100%;}
  .ctrl .btn{flex:1;justify-content:center;}
}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   E-COMMERCE, CRM & CONVERSÃO — Bárbara do Carmo
   Operating System 2026 (Marketing & Growth) · seções 03, 07, 08 e 12
   Gravação: mesma base do Checkpoint (abas ECOM_*), POST text/plain.
   O navegador guarda rascunho e fila; a base é a verdade.
   ══════════════════════════════════════════════════════════════ */
var CFG = {
  URL:   'https://script.google.com/macros/s/AKfycbwf1CiH6UJfSu2__BgpIz3apWfM8UeNSRniWW4b-Zb4KUUdQBHeQhedUZddr29zDXMeqw/exec',
  TOKEN: 'qfood-rs-2026-xK9pL3mQ7vN2bT8',
  GESTOR: 'barbara',
  NOME: 'Bárbara do Carmo',
  ADMINS: ['rodrigo@qfoodcompany.com.br','rodrigo.silveira@qfoodcompany.com.br','adilson@qfoodcompany.com.br'],

  DEV: 'qfood-dev-2026',
  REFRESH_MS: 60000,   /* atualiza os dados a cada 1 min, só se ninguém estiver editando */
  RETRY_MS:   30000,   /* tenta reenviar a fila a cada 30 s */
  VERSAO_MS: 300000,   /* procura nova versão da página a cada 5 min */
  OCIOSO_MS:  60000,   /* só recarrega a página depois de 1 min sem toque */
  JANELA_DIAS: 150
};
var ABA = { d:'ECOM_DIARIO', s:'ECOM_SEMANAL', m:'ECOM_MENSAL', t:'ECOM_TESTES' };
var CHAVE_ABA = { d:'data_iso', s:'periodo_iso', m:'mes', t:'teste_id' };

/* ── Campos de cada aba (mesma ordem das colunas na base) ── */
var CAMPOS = {
  d: ['gestor_id','gestor_nome','area','data_iso',
      'receita','receita_comp','meta_dia','receita_mtd',
      'pedidos','mix_obs',
      'sessoes','sessoes_produto','carrinhos','checkouts','compras_site',
      'carrinhos_abandonados','checkouts_abandonados','receita_recuperavel','receita_recuperada',
      'clientes_novos','clientes_recorrentes','clientes_reativados','leads_b2b','leads_passados',
      'receita_crm','crm_obs',
      'midia','descontos','comissao','gateway','frete_subsidiado','cmv',
      'rupturas','divergencias','receita_perdida','estoque_obs',
      'top_skus_json','parados_json','marketplaces_json','falhas_json','falha_acao','obs',
      'editado_por','salvo_em'],
  s: ['gestor_id','gestor_nome','area','periodo_iso',
      'funil_vazamento',
      'crm_boas_vindas','crm_abandono','crm_pos_compra','crm_recompra','crm_winback','crm_cross_sell',
      'estoque_ruptura','estoque_excesso','estoque_skus_foco','estoque_campanhas_giro','estoque_margem_min',
      'fin_resultado','vitoria_1','vitoria_2','vitoria_3','desvio_1','desvio_2','desvio_3','causas',
      'escalar','corrigir','interromper','testar','responsaveis','prazos','resultado_esperado',
      'editado_por','salvo_em'],
  m: ['gestor_id','gestor_nome','area','mes',
      'meta_receita','meta_margem_pct','meta_conversao','meta_roas','meta_ticket','meta_novos','meta_recorrentes','orcamento_midia','meta_receita_crm','meta_leads',
      'cohort_json','canais_json','receita_aquisicao','receita_retencao','obs_aq_ret',
      'roadmap_json','crm_fluxos_json','crm_segmentos_json','exec_json',
      'editado_por','salvo_em'],
  t: ['teste_id','gestor_id','semana_iso','data_iso','data_fim','tipo','titulo','hipotese','metrica','amostra',
      'status','resultado','impacto_conversao','impacto_margem','decisao','aprendizado','ativo',
      'editado_por','salvo_em']
};
var JSONS = { d:['top_skus_json','parados_json','marketplaces_json','falhas_json'],
              m:['cohort_json','canais_json','roadmap_json','crm_fluxos_json','crm_segmentos_json','exec_json'], s:[], t:[] };

/* ── utilitários ── */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function p2(n){ return String(n).padStart(2,'0'); }
function isoDe(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hoje(){ return isoDe(new Date()); }
function addDias(iso,n){ var d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
function segunda(iso){ var d=new Date(iso+'T12:00:00'); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoDe(d); }
function mesDe(iso){ return String(iso).substring(0,7); }
function diasNoMes(mes){ var a=+mes.substring(0,4), m=+mes.substring(5,7); return new Date(a,m,0).getDate(); }
function addMes(mes,n){ var a=+mes.substring(0,4), m=+mes.substring(5,7)-1+n; var d=new Date(a,m,1); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
var DIAS_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dBR(iso){ if(!iso) return ''; var p=String(iso).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function dCurto(iso){ var p=String(iso).split('-'); return p[2]+'/'+p[1]; }
function nomeDia(iso){ return DIAS_SEM[new Date(iso+'T12:00:00').getDay()]; }
function nomeMes(mes){ return MESES[+mes.substring(5,7)-1]+' de '+mes.substring(0,4); }
function num(v){
  if(v===null||v===undefined) return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  var s=String(v).trim().replace(/R\$|%|\s/g,'');
  if(!s) return null;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  var n=parseFloat(s); return isFinite(n)?n:null;
}
function n0(v){ var n=num(v); return n===null?0:n; }
function soma(arr,k){ return arr.reduce(function(a,r){ return a+n0(r[k]); },0); }
function div(a,b){ return (b&&isFinite(a/b))?a/b:null; }
function fR(v){ if(v===null||v===undefined||!isFinite(v)) return '—'; var a=Math.abs(v); return (v<0?'−':'')+'R$ '+a.toLocaleString('pt-BR',{minimumFractionDigits:a<1000?2:0,maximumFractionDigits:a<1000?2:0}); }
function fN(v,c){ if(v===null||v===undefined||!isFinite(v)) return '—'; return v.toLocaleString('pt-BR',{maximumFractionDigits:c==null?0:c}); }
function fP(v,c){ if(v===null||v===undefined||!isFinite(v)) return '—'; return (v*100).toLocaleString('pt-BR',{minimumFractionDigits:c==null?1:c,maximumFractionDigits:c==null?1:c})+'%'; }
function fX(v){ if(v===null||v===undefined||!isFinite(v)) return '—'; return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'x'; }
function jparse(v,def){ if(v&&typeof v==='object') return v; try{ var o=JSON.parse(v); return (o&&typeof o==='object')?o:def; }catch(e){ return def; } }
function clone(o){ return JSON.parse(JSON.stringify(o||{})); }
function lsGet(k,def){ try{ var v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?def:v; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function horaAgora(){ var d=new Date(); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function hhmm(iso){ if(!iso) return ''; var d=new Date(iso); return isNaN(d)?'':p2(d.getHours())+':'+p2(d.getMinutes()); }
function toast(msg,tipo){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'+(tipo?' '+tipo:''); t.textContent=msg; document.body.appendChild(t);

/* ══ BASE LOCAL (espelho da base de dados) ══ */
var CACHE_KEY='qfood_ecom_cache_v1', FILA_KEY='qfood_ecom_fila_v1', ULT_KEY='qfood_ecom_ultimo_v1';
var DB = lsGet(CACHE_KEY,null) || {d:{},s:{},m:{},t:{}};
['d','s','m','t'].forEach(function(k){ if(!DB[k]) DB[k]={}; });
function gravarCache(){ lsSet(CACHE_KEY,DB); }

/* normaliza o que vem da base: datas como texto, JSON como objeto */
function normIso(v){
  if(!v) return '';
  var s=String(v);
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  var d=new Date(s); return isNaN(d)?s:isoDe(d);
}
function normMes(v){
  if(!v) return '';
  var s=String(v);
  if(/^\d{4}-\d{2}/.test(s)) return s.substring(0,7);
  var d=new Date(s); return isNaN(d)?s:(d.getFullYear()+'-'+p2(d.getMonth()+1));
}
function normLinha(tipo,r){
  var o={}; Object.keys(r||{}).forEach(function(k){ o[k]=r[k]; });
  if(tipo==='d'){ o.data_iso=normIso(o.data_iso); }
  if(tipo==='s'){ o.periodo_iso=normIso(o.periodo_iso); }
  if(tipo==='m'){ o.mes=normMes(o.mes); }
  if(tipo==='t'){ o.data_iso=normIso(o.data_iso); o.data_fim=normIso(o.data_fim); o.semana_iso=normIso(o.semana_iso); }
  (JSONS[tipo]||[]).forEach(function(k){ o[k]=jparse(o[k], k==='exec_json'||k==='falhas_json'||k==='crm_fluxos_json'||k==='crm_segmentos_json'?{}:[]); });
  return o;
}
/* prepara para gravar: só as colunas da aba, JSON como texto */
function serializar(tipo,dado){
  var o={};
  CAMPOS[tipo].forEach(function(k){
    var v=dado[k];
    if(v===undefined) v='';
    if(v!==null && typeof v==='object') v=JSON.stringify(v);
    o[k]=v;
  });
  if(tipo!=='t'){ o.gestor_id=CFG.GESTOR; }
  else if(!o.gestor_id) o.gestor_id=CFG.GESTOR;
  o.gestor_nome=o.gestor_nome||CFG.NOME;
  if('area' in o) o.area=o.area||'E-commerce, CRM & Conversão';
  return o;
}

/* ── rascunho (só no navegador, até salvar) ── */
function rascKey(tipo,chave){ return 'qfood_ecom_rasc_'+tipo+'_'+chave; }
function lerRasc(tipo,chave){ return lsGet(rascKey(tipo,chave),null); }
function gravarRasc(tipo,chave,dado){ dado._rasc_em=new Date().toISOString(); lsSet(rascKey(tipo,chave),dado); }
function apagarRasc(tipo,chave){ lsDel(rascKey(tipo,chave)); }
function registro(tipo,chave){ var r=DB[tipo][chave]; return r?normLinha(tipo,r):null; }
/* o que aparece na tela: rascunho > base > vazio */
function dadoTela(tipo,chave){
  var r=lerRasc(tipo,chave);
  if(r) return { dado:r, rasc:true };
  var b=registro(tipo,chave);
  if(b) return { dado:b, rasc:false };
  var v={}; v[CHAVE_ABA[tipo]]=chave; return { dado:normLinha(tipo,v), rasc:false, novo:true };
}

/* ══ FILA DE ENVIO (sobe sozinha quando a conexão voltar) ══ */
function fila(){ return lsGet(FILA_KEY,[]); }
function gravarFila(f){ lsSet(FILA_KEY,f); pintarStatus(); }
function enfileirar(tipo,dado){
  var chave=ABA[tipo]+'|'+dado[CHAVE_ABA[tipo]];
  var f=fila().filter(function(i){ return i.chave!==chave; });
  f.push({ chave:chave, tipo:tipo, aba:ABA[tipo], dado:dado, em:new Date().toISOString(), tent:0 });
  gravarFila(f);
}
function pendente(tipo,chave){ return fila().some(function(i){ return i.chave===ABA[tipo]+'|'+chave; }); }
function postar(aba,dado){
  return fetch(CFG.URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ token:CFG.TOKEN, aba:aba, dado:dado }) })
    .then(function(r){ return r.json(); });
}
var ENVIANDO=false, ULT_ERRO='';
function sincronizar(){
  if(ENVIANDO) return Promise.resolve();
  var f=fila(); if(!f.length){ pintarStatus(); return Promise.resolve(); }
  if(navigator.onLine===false){ pintarStatus(); return Promise.resolve(); }
  ENVIANDO=true; pintarStatus();
  var seq=Promise.resolve();
  f.forEach(function(item){
    seq=seq.then(function(){
      return postar(item.aba,item.dado).then(function(res){
        if(res && res.ok){
          var atual=fila().filter(function(i){ return !(i.chave===item.chave && i.em===item.em); });
          gravarFila(atual); ULT_ERRO='';
          lsSet(ULT_KEY,new Date().toISOString());
        } else {
          ULT_ERRO=(res&&(res.erro||res.error))||'resposta inválida do servidor';
          marcarTentativa(item);
        }
      }).catch(function(){ marcarTentativa(item); });
    });
  });
  return seq.then(function(){ ENVIANDO=false; pintarStatus(); }, function(){ ENVIANDO=false; pintarStatus(); });
}
function marcarTentativa(item){
  var f=fila(); f.forEach(function(i){ if(i.chave===item.chave && i.em===item.em) i.tent=(i.tent||0)+1; }); gravarFila(f);
}

/* ══ LEITURA DA BASE ══ */
function buscar(aba,params){
  var q='?aba='+encodeURIComponent(aba)+'&gestor='+encodeURIComponent(CFG.GESTOR);
  Object.keys(params||{}).forEach(function(k){ q+='&'+k+'='+encodeURIComponent(params[k]); });
  q+='&_='+Date.now();
  return fetch(CFG.URL+q,{cache:'no-store'}).then(function(r){ return r.json(); });
}
var BASE_OK=null, CARREGANDO=false, ULT_LEITURA='';
function carregarBase(){
  if(CARREGANDO) return Promise.resolve(false);
  if(navigator.onLine===false){ BASE_OK=false; pintarStatus(); return Promise.resolve(false); }
  CARREGANDO=true; pintarStatus();
  var de=addDias(hoje(),-CFG.JANELA_DIAS);
  var pedidos=[
    ['d', buscar(ABA.d,{de:de})],
    ['s', buscar(ABA.s,{de:segunda(de)})],
    ['m', buscar(ABA.m,{de:mesDe(de)})],
    ['t', buscar(ABA.t,{de:addDias(de,-60)})]
  ];
  var antes=JSON.stringify(DB);
  return Promise.all(pedidos.map(function(p){
    return p[1].then(function(res){ return {tipo:p[0],res:res}; }, function(){ return {tipo:p[0],res:null}; });
  })).then(function(lista){
    var falhou=false;
    lista.forEach(function(x){
      if(!x.res || !x.res.ok){ falhou=true; return; }
      var tipo=x.tipo, novo={};
      (x.res.registros||[]).forEach(function(r){
        var n=normLinha(tipo,r), k=n[CHAVE_ABA[tipo]];
        if(!k) return;
        novo[k]=r; novo[k][CHAVE_ABA[tipo]]=k;
      });
      /* o que ainda está na fila vale mais que a base (não foi confirmado lá) */
      fila().forEach(function(i){ if(i.tipo===tipo){ var k=i.dado[CHAVE_ABA[tipo]]; novo[k]=i.dado; } });
      /* registros fora da janela de leitura continuam no espelho local */
      Object.keys(DB[tipo]).forEach(function(k){ if(!(k in novo) && foraDaJanela(tipo,k,de)) novo[k]=DB[tipo][k]; });
      DB[tipo]=novo;
    });
    BASE_OK=!falhou; CARREGANDO=false;
    if(!falhou) ULT_LEITURA=new Date().toISOString();
    gravarCache(); pintarStatus();
    return JSON.stringify(DB)!==antes;
  });
}
function foraDaJanela(tipo,k,de){
  if(tipo==='d') return k<de;
  if(tipo==='s') return k<segunda(de);
  if(tipo==='m') return k<mesDe(de);
  return false;
}

/* ══ STATUS NO TOPO ══ */
function pintarStatus(){
  var box=el('st-sync'); if(!box) return;
  var f=fila(), off=navigator.onLine===false;
  var cls='chip', txt;
  if(off){ cls+=' warn'; txt='● Sem conexão'+(f.length?' · '+f.length+' na fila':''); }
  else if(ENVIANDO||CARREGANDO){ txt='↻ Sincronizando…'; }
  else if(f.length){ cls+=' warn'; txt='⏳ '+f.length+' aguardando envio'+(ULT_ERRO?' · '+ULT_ERRO:''); if(ULT_ERRO) cls=cls.replace('warn','err'); }
  else if(BASE_OK===false){ cls+=' err'; txt='⚠ Base de dados indisponível · usando dados deste aparelho'; }
  else { cls+=' ok'; var u=lsGet(ULT_KEY,'')||ULT_LEITURA; txt='✓ Sincronizado'+(u?' · '+hhmm(u):''); }
  box.className=cls+' clic'; box.textContent=txt;
  box.title='Clique para sincronizar agora';
}

/* ══ NÃO INTERROMPER QUEM ESTÁ DIGITANDO ══
   A página só é redesenhada pela atualização automática quando:
   - nenhum campo está em foco, - não há modal aberto,
   - não há alteração sem salvar na tela, - a fila está vazia. */
var SUJO=false, MODAL=false, ULT_TOQUE=Date.now();
function editando(){
  var a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if(MODAL || SUJO) return true;
  return false;
}
function ocupado(){ return editando() || fila().length>0 || ENVIANDO; }
['pointerdown','keydown','touchstart','wheel'].forEach(function(ev){ document.addEventListener(ev,function(){ ULT_TOQUE=Date.now(); },{passive:true}); });

function atualizarAuto(){
  if(document.hidden || navigator.onLine===false) return;
  sincronizar().then(function(){
    if(editando()) return;
    return carregarBase().then(function(mudou){
      if(mudou && !editando()) redesenhar(true);
    });
  });
}

/* ── nova versão da página: avisa e só recarrega com a pessoa parada ── */
var VERSAO=null, NOVA_VERSAO=false, CHECANDO=false;
function hashTxt(t){ var h=5381; for(var i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return String(h); }
function checarVersao(){
  if(CHECANDO || location.protocol==='file:') return;
  CHECANDO=true;
  var url=location.pathname+'?checagem='+Date.now();
  fetch(url,{method:'HEAD',cache:'no-store'}).then(function(h){ return h.ok?(h.headers.get('etag')||h.headers.get('last-modified')):null; })
  .catch(function(){ return null; })
  .then(function(ass){
    if(ass) return ass;
    return fetch(url,{cache:'no-store'}).then(function(r){ return r.ok?r.text():null; }).then(function(t){ return t?t.length+':'+hashTxt(t):null; }).catch(function(){ return null; });
  }).then(function(ass){
    CHECANDO=false;
    if(!ass) return;
    if(!VERSAO){ VERSAO=ass; return; }
    if(ass!==VERSAO){ NOVA_VERSAO=true; avisarVersao(); tentarRecarregar(); }
  });
}
function tentarRecarregar(){
  if(NOVA_VERSAO && !document.hidden && !ocupado() && Date.now()-ULT_TOQUE>CFG.OCIOSO_MS) recarregarPagina();
}
function recarregarPagina(){ location.replace(location.pathname+'?v='+Date.now()+location.hash); }
function avisarVersao(){
  if(el('aviso-v')) return;
  var d=document.createElement('div'); d.id='aviso-v'; d.className='aviso-v';
  d.innerHTML='<span>Nova versão disponível. Seus dados estão salvos neste aparelho.</span><button class="btn pri sm" id="aviso-v-bt">Atualizar agora</button>';
  document.body.appendChild(d);
  el('aviso-v-bt').onclick=function(){
    if(SUJO && !confirm('Há alterações ainda não salvas na base de dados. Elas continuam guardadas neste aparelho como rascunho. Atualizar agora?')) return;
    recarregarPagina();
  };
}

function linhasD(de,ate){
  return Object.keys(DB.d).filter(function(k){ return k>=de && k<=ate; }).sort().map(function(k){ return registro('d',k); });
}
function mensal(mes){ var r=lerRasc('m',mes)||registro('m',mes); return r||normLinha('m',{mes:mes}); }
function divN(a,b){ var x=num(a); return x===null?null:div(x,n0(b)); }
function pct100(v){ var n=num(v); return n===null?null:n/100; }

/* custos e margem de contribuição digital
   Receita − mídia − descontos − comissão − gateway − frete subsidiado − CMV */
function plDe(o){
  var receita=n0(o.receita);
  var custos=[
    {k:'midia',l:'Mídia',v:n0(o.midia)},{k:'descontos',l:'Descontos',v:n0(o.descontos)},
    {k:'comissao',l:'Comissão de marketplace',v:n0(o.comissao)},{k:'gateway',l:'Gateway de pagamento',v:n0(o.gateway)},
    {k:'frete_subsidiado',l:'Frete subsidiado',v:n0(o.frete_subsidiado)},{k:'cmv',l:'CMV',v:n0(o.cmv)}
  ];
  var tot=custos.reduce(function(a,c){ return a+c.v; },0);
  var margem=receita-tot;
  return { receita:receita, custos:custos, total:tot, margem:margem, margemPct:div(margem,receita), roas:div(receita,n0(o.midia)), temCusto:tot>0 };
}

/* indicadores do dia */
function calcDia(d){
  var iso=d.data_iso, mes=mesDe(iso), mm=mensal(mes);
  var metaMes=num(mm.meta_receita), dias=diasNoMes(mes), dia=+iso.substring(8,10);
  var metaDia=num(d.meta_dia); if(metaDia===null && metaMes!==null) metaDia=metaMes/dias;
  var doMes=linhasD(mes+'-01',iso).filter(function(r){ return r.data_iso!==iso; });
  var mtdAuto=soma(doMes,'receita')+n0(d.receita);
  var mtd=num(d.receita_mtd); if(mtd===null) mtd=mtdAuto;
  var ritmo=metaMes!==null?metaMes*dia/dias:null;
  var receita=num(d.receita);
  var est=[
    {k:'sessoes',l:'Sessões',v:num(d.sessoes)},{k:'sessoes_produto',l:'Viu produto',v:num(d.sessoes_produto)},
    {k:'carrinhos',l:'Carrinho',v:num(d.carrinhos)},{k:'checkouts',l:'Checkout',v:num(d.checkouts)},
    {k:'compras_site',l:'Compra',v:num(d.compras_site)}
  ];
  var pl=plDe(d);
  var novos=n0(d.clientes_novos), rec=n0(d.clientes_recorrentes);
  return {
    mes:mes, metaMes:metaMes, metaDia:metaDia, mtd:mtd, mtdAuto:mtdAuto, ritmo:ritmo,
    pctDia:div(receita,metaDia), pctMes:div(mtd,metaMes), pctRitmo:div(mtd,ritmo),
    varComp:(num(d.receita_comp)?div(n0(d.receita)-n0(d.receita_comp),n0(d.receita_comp)):null),
    aov:div(n0(d.receita),n0(d.pedidos)),
    funil:funil(est), conv:div(n0(d.compras_site),n0(d.sessoes)),
    abCarr:divN(d.carrinhos_abandonados,d.carrinhos), abChk:divN(d.checkouts_abandonados,d.checkouts),
    recupPct:divN(d.receita_recuperada,d.receita_recuperavel),
    novosPct:(num(d.clientes_novos)===null&&num(d.clientes_recorrentes)===null)?null:div(novos,novos+rec), leadsPass:divN(d.leads_passados,d.leads_b2b),
    crmPct:divN(d.receita_crm,d.receita),
    pl:pl, mm:mm
  };
}
/* funil: conversão de cada etapa e onde o dinheiro vaza */
function funil(est){
  var base=est[0].v, pior=-1, piorTx=2;
  var out=est.map(function(e,i){
    var tx=i===0?null:div(e.v||0,est[i-1].v||0);
    if(i>0 && tx!==null && e.v!==null && est[i-1].v){ if(tx<piorTx){ piorTx=tx; pior=i; } }
    return {k:e.k,l:e.l,v:e.v,tx:tx,larg:div(e.v||0,base||0)};
  });
  if(pior>=0) out[pior].vaza=true;
  return { etapas:out, temDados:est.some(function(e){ return e.v; }) };
}

/* agregado de um período (semana ou mês) */
function agregar(rows){
  var o={ dias:rows.length };
  ['receita','pedidos','sessoes','sessoes_produto','carrinhos','checkouts','compras_site','carrinhos_abandonados','checkouts_abandonados',
   'receita_recuperavel','receita_recuperada','clientes_novos','clientes_recorrentes','clientes_reativados','leads_b2b','leads_passados',
   'receita_crm','midia','descontos','comissao','gateway','frete_subsidiado','cmv','rupturas','receita_perdida']
  .forEach(function(k){ o[k]=soma(rows,k); });
  o.pl=plDe(o);
  o.aov=div(o.receita,o.pedidos);
  o.conv=div(o.compras_site,o.sessoes);
  o.funil=funil([

/* desvio: para números que acumulam no mês, compara com o ritmo do mês */
function fracaoMes(mes){
  var h=hoje(), m=mesDe(h);
  if(mes<m) return 1;
  if(mes>m) return 0;
  return Math.max(1,(+h.substring(8,10))-1)/diasNoMes(mes); /* até ontem: o report é do dia anterior */
}

/* ══ COMPONENTES ══ */
function corPct(p,inv){
  if(p===null||p===undefined||!isFinite(p)) return '#5e6b85';
  var r=inv?(p<=1?1:1/p):p;
  return r>=1?'#36cfa0':(r>=0.85?'#ffaa2b':'#ff5b52');
}
/* velocímetro: p = realizado/meta (1 = 100%) */
function gauge(p,rotulo,sub,o){
  o=o||{};
  var temP=p!==null&&p!==undefined&&isFinite(p);
  var f=temP?Math.max(0,Math.min(p,1)):0, cor=o.cor||corPct(p,o.inv);
  var ang=-90+180*f;
  var big=o.valor!=null?o.valor:(temP?Math.round(p*100)+'%':'—');
  return '<div class="gauge">'+
    '<svg viewBox="0 0 120 72" aria-hidden="true">'+
      '<path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="#353c52" stroke-width="11" stroke-linecap="round"/>'+
      (temP&&f>0?'<path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="'+cor+'" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="'+(f*100).toFixed(1)+' 100"/>':'')+
      (temP?'<g transform="rotate('+ang.toFixed(1)+' 60 62)"><line x1="60" y1="62" x2="60" y2="22" stroke="#eef1f8" stroke-width="2.4" stroke-linecap="round"/></g><circle cx="60" cy="62" r="4.5" fill="#eef1f8"/>':'')+
    '</svg>'+
    '<div class="pc" style="color:'+(temP||o.cor?cor:'var(--mu)')+'">'+esc(big)+'</div>'+
    '<div class="lb">'+esc(rotulo)+'</div><div class="sb">'+(sub||'')+'</div></div>';
}
function fld(k,l,o){
  o=o||{}; var v=FORM.dado[k]; if(v===null||v===undefined) v='';
  var cls='f'+(o.w?' '+o.w:'');
  var ph=o.ph?' placeholder="'+esc(o.ph)+'"':'';
  var ctl;
  if(o.tipo==='area') ctl='<textarea data-k="'+k+'"'+ph+'>'+esc(v)+'</textarea>';
  else if(o.tipo==='sel') ctl='<select data-k="'+k+'"><option value=""></option>'+o.ops.map(function(x){ var val=typeof x==='string'?x:x.k, lb=typeof x==='string'?x:x.l; return '<option value="'+esc(val)+'"'+(String(v)===val?' selected':'')+'>'+esc(lb)+'</option>'; }).join('')+'</select>';
  else if(o.tipo==='data') ctl='<input type="date" data-k="'+k+'" value="'+esc(v)+'">';
  else if(o.tipo==='txt') ctl='<input type="text" data-k="'+k+'" value="'+esc(v)+'"'+ph+'>';
  else ctl='<input type="text" inputmode="decimal" data-k="'+k+'" value="'+esc(v)+'"'+ph+'>';
  return '<div class="'+cls+'"><label>'+esc(l)+(o.un?' <span style="color:var(--mu2)">('+o.un+')</span>':'')+'</label>'+ctl+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'</div>';
}
/* tabela editável guardada como lista em um campo JSON */
function tabela(k,cols,o){

  if(!rows.length) h+='<tr><td colspan="'+(cols.length+2)+'" style="color:var(--mu);font-size:.78rem;padding:10px 6px">Nenhuma linha. Use “+ Adicionar”.</td></tr>';

      return '<td><input type="text"'+(c.num?' inputmode="decimal"':'')+' data-tb="'+k+'" data-i="'+i+'" data-c="'+c.k+'" value="'+esc(v)+'"'+(c.ph?' placeholder="'+esc(c.ph)+'"':'')+'></td>';

  }

  else if(FORM.tipo==='m' && VIEW==='mes'){
    var ag=agregar(linhasD(SEL.mes+'-01',SEL.mes+'-31'));
    var sp=document.querySelector('[data-calc="m-split"]'); if(sp) sp.innerHTML=splitHTML(FORM.dado,ag);
    if(tb==='canais_json'){ var r=FORM.dado.canais_json[+t.getAttribute('data-i')], p=plDe(r), c=document.querySelector('[data-calc="canais_json-'+t.getAttribute('data-i')+'"]'); if(c) c.textContent=fR(p.margem)+(p.margemPct!==null?' · '+fP(p.margemPct):''); }
  }
}
function onChange(ev){
  var t=ev.target, id=t.id;
  if(id==='sel-dia'){ SEL.dia=t.value; redesenhar(); return; }
  if(id==='sel-semana'){ SEL.semana=t.value; redesenhar(); return; }
  if(id==='sel-mes'){ SEL.mes=t.value; redesenhar(); return; }
  if(id==='sel-painel'){ SEL.painel=t.value; redesenhar(); return; }
  if(id==='sel-filtro-t'){ FILTRO_T=t.value; redesenhar(); return; }
  if(t.tagName==='SELECT') onInput(ev);
}
function marcarSujo(){
  SUJO=true; FORM.rasc=true;
  gravarRasc(FORM.tipo,FORM.chave,FORM.dado);
  var e=el('estado'); if(e) e.outerHTML=estadoHTML();
}
function onClick(ev){
  var b=ev.target.closest('[data-act]'); if(!b) return;
  var a=b.getAttribute('data-act');
  if(a==='view') return irPara(b.getAttribute('data-v'));
  if(a==='sync'){ sincronizar().then(function(){ return carregarBase(); }).then(function(m){ if(!editando()) redesenhar(true); toast(BASE_OK?'Dados atualizados com a base.':'Sem acesso à base agora. Seguimos com os dados deste aparelho.',BASE_OK?'':'warn'); }); return; }
  if(a==='salvar') return salvar();
  if(a==='descartar'){ if(!confirm('Descartar o rascunho e voltar ao que está salvo na base de dados?')) return; apagarRasc(FORM.tipo,FORM.chave); SUJO=false; redesenhar(true); return; }
  if(a==='lin-add'){ var k=b.getAttribute('data-tb'); FORM.dado[k]=Array.isArray(FORM.dado[k])?FORM.dado[k]:[]; FORM.dado[k].push({}); marcarSujo(); redesenharForm(); return; }
  if(a==='lin-rm'){ var k2=b.getAttribute('data-tb'); FORM.dado[k2].splice(+b.getAttribute('data-i'),1); marcarSujo(); redesenharForm(); return; }
  if(a==='falha'){ var f=b.getAttribute('data-fa'); FORM.dado.falhas_json=FORM.dado.falhas_json||{}; var st=FORM.dado.falhas_json[f]||{}; st.s=b.getAttribute('data-s'); FORM.dado.falhas_json[f]=st; marcarSujo(); redesenharForm(); return; }
  if(a==='copiar-08h') return copiar(texto08h(),'Report 08h copiado. Cole no grupo ou no WhatsApp.');
  if(a==='copiar-semana') return copiar(textoSemana(),'Fechamento semanal copiado.');
  if(a==='imprimir') return window.print();
  if(a==='teste-novo') return abrirTeste(null);
  if(a==='teste-abrir') return abrirTeste(b.getAttribute('data-id'));
  if(a==='teste-fechar') return fecharTeste();
  if(a==='teste-salvar') return salvarTeste(false);
  if(a==='teste-excluir'){ if(confirm('Excluir este teste do registro?')) salvarTeste(true); return; }
}
/* redesenha a tela atual mantendo o que foi digitado (rascunho) e a rolagem */
function redesenharForm(){ var s=SUJO; redesenhar(true); SUJO=s; FORM.rasc=s||FORM.rasc; var e=el('estado'); if(e) e.outerHTML=estadoHTML(); }
function copiar(txt,msg){
  var ok=function(){ toast(msg); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,function(){ copiarAntigo(txt); ok(); });
  else { copiarAntigo(txt); ok(); }
}
function copiarAntigo(txt){ var t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); }

/* ── salvar: base local + fila + envio ── */
function salvar(){
  if(!FORM.tipo) return;
  var d=clone(FORM.dado);
  d[CHAVE_ABA[FORM.tipo]]=FORM.chave;
  if(FORM.tipo==='d'){
    var vazio=['receita','pedidos','sessoes','midia'].every(function(k){ return num(d[k])===null; });
    if(vazio){ toast('Preencha pelo menos a receita ou os pedidos do dia.','warn'); return; }
  }
  /* limpa linhas vazias das tabelas */
  (JSONS[FORM.tipo]||[]).forEach(function(k){ if(Array.isArray(d[k])) d[k]=d[k].filter(function(r){ return r && Object.keys(r).some(function(c){ return String(r[c]||'').trim(); }); }); });
  delete d._rasc_em;
  d.editado_por=meuEmail(); d.salvo_em=new Date().toISOString();
  var dado=serializar(FORM.tipo,d);
  DB[FORM.tipo][FORM.chave]=dado; gravarCache();
  apagarRasc(FORM.tipo,FORM.chave);
  enfileirar(FORM.tipo,dado);
  SUJO=false; FORM.rasc=false;
  redesenhar(true);
  toast(navigator.onLine===false?'Salvo neste aparelho. Sobe para a base de dados quando a conexão voltar.':'Salvo. Enviando para a base de dados…', navigator.onLine===false?'warn':'');
  sincronizar().then(function(){
    var e=el('estado'); if(e && FORM.tipo) e.outerHTML=estadoHTML();
    if(!pendente(FORM.tipo,FORM.chave)) toast('Gravado na base de dados.');
    else if(ULT_ERRO) toast('A base recusou: '+ULT_ERRO+'. O registro continua guardado e será reenviado.','err');
  });
}

/* ── início ── */
function iniciar(){
  if(!temAcesso()){ telaBloqueio(); return; }
  montarCasca();
  var m=(location.hash||'').match(/#v=(\w+)/);
  VIEW=m?m[1]:(ehAdmin()&&!ehDona()?'painel':'hoje');
  irPara(VIEW);
  carregarBase().then(function(mudou){ if(mudou && !editando()) redesenhar(true); });
  sincronizar();
  setInterval(function(){ if(fila().length) sincronizar(); }, CFG.RETRY_MS);
  setInterval(atualizarAuto, CFG.REFRESH_MS);
  window.addEventListener('online',function(){ pintarStatus(); atualizarAuto(); });
  window.addEventListener('offline',pintarStatus);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ atualizarAuto(); checarVersao(); } });
  checarVersao();
  setInterval(function(){ if(!document.hidden) checarVersao(); }, CFG.VERSAO_MS);
  setInterval(tentarRecarregar, 20000);
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
}
document.addEventListener('DOMContentLoaded',iniciar);

</script>
