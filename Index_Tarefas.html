<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caderno de Assuntos · Q Food</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161a26;--sf:#20263a;--s2:#2a3149;--s3:#343c57;--pg:#1b2032;
  --br:rgba(255,255,255,.09);--b2:rgba(255,255,255,.17);
  --tx:#eef1f8;--mu:#97a6c6;--mu2:#6b7c9e;
  --red:#ff4d4f;--qf:#e63329;--ok:#36cfa0;--warn:#ffaa2b;--amb:#d97706;--blue:#4d8ef5;--pur:#a07cf6;--cyan:#22d3ee;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:.9rem;color:var(--tx);background:var(--s2);border:1px solid var(--br);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pur)}
input[type=date]{color-scheme:dark}
textarea{resize:vertical;min-height:72px;line-height:1.45}
input[type=checkbox]{width:auto}

/* ── topo ── */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(22,26,38,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--br)}
.logo{background:#fff;border-radius:9px;width:42px;height:42px;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain}
.ttl h1{font-family:var(--fh);font-size:1.15rem;font-weight:800;line-height:1.1}
.ttl span{font-size:.74rem;color:var(--mu)}
.busca{flex:1;max-width:460px;margin-left:12px}
.busca input{background:var(--sf);border-radius:10px}
.top-d{display:flex;align-items:center;gap:8px;margin-left:auto}
.usr{font-size:.8rem;color:var(--mu);padding:8px 10px;border:1px solid var(--br);border-radius:9px;white-space:nowrap}
.btn{background:var(--s2);border:1px solid var(--br);border-radius:9px;padding:9px 14px;font-size:.84rem;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--b2)}
.btn.pri{background:var(--qf);border-color:var(--qf);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:rgba(255,170,43,.15);border-color:rgba(255,170,43,.5);color:var(--warn)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:.76rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:wait}
.btn-menu{display:none}

/* ── estrutura ── */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 63px)}
.fich{border-right:1px solid var(--br);padding:14px 10px 30px;position:sticky;top:63px;height:calc(100vh - 63px);overflow-y:auto;background:#141826}
.fich-sec{font-size:.66rem;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu2);padding:14px 10px 6px}
.fich-sec:first-child{padding-top:2px}
.af{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:transparent;border-radius:9px;text-align:left;font-size:.88rem;color:#cdd5e6;position:relative}
.af:hover{background:rgba(255,255,255,.05);color:#fff}
.af.on{background:rgba(230,51,41,.16);color:#fff;box-shadow:inset 3px 0 0 var(--qf)}
.af .i{width:20px;text-align:center;flex-shrink:0}
.af .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af .n{font-size:.68rem;font-weight:800;border-radius:10px;padding:1px 7px;background:var(--s3)}
.af .n.red{background:var(--qf);color:#fff}
.af.p .t small{color:var(--mu2);font-size:.7rem}
.veu-f{display:none}

.main{padding:18px 22px 60px;min-width:0}
.lst-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.lst-h h2{font-family:var(--fh);font-size:1.35rem;font-weight:800}
.lst-h p{font-size:.82rem;color:var(--mu);margin-top:2px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:rgba(160,124,246,.14);border:1px solid rgba(160,124,246,.4);color:#d6c8ff;border-radius:20px;padding:4px 10px;font-size:.76rem}
.fchip button{background:none;border:none;color:inherit;font-weight:800}
.resumo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.rk{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:11px 13px;cursor:pointer}
.rk:hover{border-color:var(--b2)}
.rk b{display:block;font-family:var(--fh);font-size:1.5rem;font-weight:800;line-height:1.1}
.rk span{font-size:.72rem;color:var(--mu)}
.grupo{font-size:.76rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin:18px 0 8px}
.grupo:first-of-type{margin-top:4px}

/* ── ficha (cartão do fichário) ── */
.ficha{display:flex;background:var(--sf);border:1px solid var(--br);border-radius:12px;margin-bottom:9px;overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.ficha:hover{border-color:var(--b2);transform:translateY(-1px)}
.ficha.sel{border-color:var(--pur);box-shadow:0 0 0 2px rgba(160,124,246,.25)}
.ficha .aba{width:6px;flex-shrink:0}
.ficha .fc{padding:11px 14px;min-width:0;flex:1}
.l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cod{font-family:ui-monospace,monospace;font-size:.7rem;color:var(--cyan)}
.ficha h3{font-size:.98rem;font-weight:700;line-height:1.3}
.meta{font-size:.78rem;color:var(--mu);margin-top:5px;line-height:1.5}
.meta .sep{margin:0 6px;opacity:.5}
.meta .ag{color:var(--warn);font-weight:600}
.prox,.motivo{font-size:.8rem;margin-top:5px;line-height:1.4}
.prox{color:#cfd8ea}
.motivo{color:#ffb86b}
.upd{font-size:.7rem;color:var(--mu2);margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;border-radius:20px;padding:2px 8px;border:1px solid var(--br);background:var(--s2);white-space:nowrap}
.chip.reu{color:var(--cyan);border-color:rgba(34,211,238,.4)}
.chip.crit{background:var(--qf);border-color:var(--qf);color:#fff}
.chip.imp{color:var(--warn);border-color:rgba(255,170,43,.45)}
.chip.alta{color:#ff8a80;border-color:rgba(255,77,79,.45)}
.st-pendente{color:#a9b6d2}
.st-em_andamento{color:var(--warn);border-color:rgba(255,170,43,.4)!important}
.st-bloqueado{color:#ffb86b;border-color:rgba(217,119,6,.55)!important;background:rgba(217,119,6,.12)!important}
.st-em_risco{color:#ffd166;border-color:rgba(255,209,102,.45)!important}
.st-concluido{color:var(--ok);border-color:rgba(54,207,160,.45)!important}
.st-cancelado{color:var(--mu2)}
.vazio{text-align:center;color:var(--mu);padding:46px 16px;border:1px dashed var(--b2);border-radius:14px;line-height:1.6}
.vazio b{display:block;font-size:2rem;margin-bottom:6px}
.bloq-tela{max-width:480px;margin:70px auto;text-align:center;background:var(--sf);border:1px solid var(--br);border-radius:16px;padding:34px 26px;line-height:1.55}
.bloq-tela h2{font-family:var(--fh);margin-bottom:10px}

/* ── página do assunto (abre por cima, como uma folha) ── */
.veu{position:fixed;inset:0;background:rgba(5,7,14,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .15s}
.veu.on{opacity:1;pointer-events:auto}
.pagina{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--pg);border-left:1px solid var(--b2);z-index:90;overflow-y:auto;transform:translateX(102%);transition:transform .2s;box-shadow:-20px 0 50px rgba(0,0,0,.45)}
.pagina.on{transform:none}
.pg-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(27,32,50,.97);border-bottom:1px solid var(--br)}
.pg-top .x{margin-left:auto;background:var(--s2);border:1px solid var(--br);border-radius:50%;width:34px;height:34px;font-size:.9rem}
.volta{background:none;border:none;color:var(--pur);font-weight:700;font-size:.84rem;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pg{padding:16px 22px 40px}
.pg h2{font-family:var(--fh);font-size:1.35rem;font-weight:800;line-height:1.25;margin:6px 0 12px}
.grid-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.gm{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:8px 11px;min-width:0}
.gm small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.7px;color:var(--mu2);font-weight:700}
.gm b{display:block;font-size:.86rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.pessoas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--br);border-radius:20px;padding:4px 10px 4px 4px;font-size:.78rem}
.pchip i{width:22px;height:22px;border-radius:50%;background:var(--s3);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.68rem;font-weight:800}
.pchip.ext i{background:rgba(255,170,43,.2);color:var(--warn)}
.pchip button{background:none;border:none;color:var(--mu);font-weight:800;margin-left:2px}
.acoes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.sec{margin-top:18px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.74rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--br)}
.texto{white-space:pre-wrap;line-height:1.55;font-size:.9rem;background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:11px 13px}
.sit{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.sit-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem}
.sit-l label{font-size:.72rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mu2);min-width:118px}
.sit-l select{width:auto;padding:6px 10px}
.sit-l .v{flex:1;min-width:150px}
.sit-l .mu{color:var(--mu)}
.lk{background:none;border:none;color:var(--pur);font-size:.78rem;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.pt{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:9px 12px;margin-bottom:7px;cursor:pointer}
.pt:hover{border-color:var(--b2)}
.pt .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pt .pc{flex:1;min-width:0}
.pt .pc b{display:block;font-size:.88rem;font-weight:600}
.pt .pc span{font-size:.74rem;color:var(--mu)}
.pt.fech{opacity:.6}
.pt.fech b{text-decoration:line-through}
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rel .rc{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--br);border-radius:20px;padding:5px 11px;font-size:.78rem;cursor:pointer}
.rel .rc button{background:none;border:none;color:var(--mu);font-weight:800}
.rel select{width:auto;max-width:100%;padding:6px 10px;font-size:.8rem}
.reu-box{background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.35);border-radius:12px;padding:12px 14px;font-size:.86rem;line-height:1.6}
/* linha do tempo */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--br)}
.te{position:relative;margin-bottom:10px}
.te:before{content:attr(data-i);position:absolute;left:-23px;top:0;width:20px;height:20px;border-radius:50%;background:var(--pg);display:flex;align-items:center;justify-content:center;font-size:.72rem}
.te .q{font-size:.7rem;color:var(--mu2)}
.te .q b{color:var(--mu)}
.te.ev .tx{font-size:.82rem;color:#c4cde0}
.te.com .tx{background:var(--sf);border:1px solid var(--br);border-radius:10px;padding:8px 11px;font-size:.88rem;line-height:1.5;white-space:pre-wrap;margin-top:3px}
.te.com.meu .tx{border-left:3px solid var(--qf)}
.te .men{font-size:.7rem;color:var(--warn);margin-top:3px}
.com-f{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:10px;margin-top:10px}
.com-f textarea{background:var(--s2);min-height:60px}
.com-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.com-l input{flex:1;min-width:140px;width:auto;padding:7px 10px}

/* ── modais ── */
.mod-ov{position:fixed;inset:0;z-index:120;background:rgba(5,7,14,.72);display:none;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
.mod-ov.on{display:flex}
.mod{background:var(--sf);border:1px solid var(--b2);border-radius:16px;width:100%;max-width:640px;padding:20px 22px;margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mod h3{font-family:var(--fh);font-size:1.12rem;font-weight:800}
.mod-sub{font-size:.82rem;color:var(--mu);margin:3px 0 12px}
.mod label{display:block;font-size:.7rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mu);margin:12px 0 5px}
.mod label.ck{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:500;color:var(--tx)}
.mod .hint{font-size:.72rem;color:var(--mu2);margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.mod-msg{font-size:.82rem;color:var(--warn);margin-top:10px;line-height:1.45}
.mod-msg .btn{margin-top:8px}
.mod-f{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--br)}
.chips-ed{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.addl{display:flex;gap:8px}
.addl input{flex:1}
.np-row{display:grid;grid-template-columns:1.6fr 1fr .9fr auto;gap:6px;margin-bottom:6px}
.np-row button{background:var(--s2);border:1px solid var(--br);border-radius:8px;padding:0 10px;color:var(--mu)}
.bloco-ext{border:1px dashed var(--b2);border-radius:10px;padding:4px 12px 12px;margin-top:12px}

.loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;display:none;background:linear-gradient(90deg,transparent,var(--qf),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:sl 1.1s infinite}
.loader.on{display:block}
@keyframes sl{0%{background-position:-50% 0}100%{background-position:150% 0}}
.toast{position:fixed;bottom:18px;right:18px;z-index:210;background:var(--sf);border:1px solid var(--b2);border-radius:11px;padding:11px 16px;font-size:.86rem;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none}
.toast.on{display:block}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.error{border-color:var(--red);color:#ff8a80}
.demo{background:var(--warn);color:#1a1f2e;text-align:center;font-size:.78rem;font-weight:700;padding:6px}

@media(max-width:1100px){.resumo{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){
  .app{display:block}
  .btn-menu{display:inline-flex}
  .fich{position:fixed;left:0;top:0;bottom:0;height:auto;width:270px;z-index:100;transform:translateX(-105%);transition:transform .2s;box-shadow:10px 0 40px rgba(0,0,0,.6)}
  body.fich-on .fich{transform:none}
  body.fich-on .veu-f{display:block;position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.5)}
  .busca{display:none}
  .busca.m{display:block;margin:0 0 12px;max-width:none}
  .usr{display:none}
  .main{padding:14px 12px 60px}
  .resumo{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-m{grid-template-columns:1fr 1fr}
  .g2,.g3{grid-template-columns:1fr}
  .np-row{grid-template-columns:1fr 1fr}
  .np-row input:first-child{grid-column:1/-1}
  .pg{padding:14px 14px 40px}
  .ttl span{display:none}
}
@media(min-width:901px){.busca.m{display:none}}
</style>
</head>
<body>
<div class="loader" id="loader"></div>
<div class="toast" id="toast"></div>
<div id="demo-faixa"></div>

<header class="top">
  <button class="btn btn-menu" onclick="menuFich()" aria-label="Cadernos">☰</button>
  <div class="logo"><img src="logo.png" alt="Q Food" onerror="this.parentNode.style.display='none'"></div>
  <div class="ttl"><h1>Caderno de Assuntos</h1><span>Q Food Group · acompanhamento dos gestores</span></div>
  <div class="busca"><input type="search" id="q" placeholder="🔎 Buscar assunto, pessoa, código…" oninput="buscar(this.value)"></div>
  <div class="top-d">
    <span class="usr" id="usr">—</span>
    <button class="btn pri" id="btn-novo" onclick="formAssunto(null)" style="display:none">＋ Novo assunto</button>
    <button class="btn ghost" onclick="location.href='Index_Menu.html'" title="Menu do sistema">🏠</button>
  </div>
</header>

<div class="app">
  <aside class="fich" id="fich"></aside>
  <div class="veu-f" onclick="menuFich(false)"></div>
  <main class="main" id="main"><div class="vazio"><b>⏳</b>Abrindo o caderno…</div></main>
</div>

<div class="veu" id="veu" onclick="fecharFicha()"></div>
<section class="pagina" id="pagina" aria-label="Assunto"></section>
<div class="mod-ov" id="modal" onclick="if(event.target===this)fecharModal()"><div class="mod" id="modal-box"></div></div>
<datalist id="dl-pessoas"></datalist>
<datalist id="dl-areas"></datalist>

<script>
/* ============================================================
   Q FOOD — CADERNO DE ASSUNTOS (Index_Tarefas_v2)
   Backend: Code_Tarefas2.gs · rota ?modulo=tarefas
   Sem CSV: tudo vem do Apps Script (boot + itens).
   ?demo=1 abre com dados de exemplo (nada é gravado).
   ============================================================ */
'use strict';
var API_URL = 'https://script.google.com/macros/s/AKfycbwf1CiH6UJfSu2__BgpIz3apWfM8UeNSRniWW4b-Zb4KUUdQBHeQhedUZddr29zDXMeqw/exec';
var REFRESH_MS = 60000;
var ABERTOS = ['pendente','em_andamento','bloqueado','em_risco'];
var ROT = { pendente:'Pendente', em_andamento:'Em andamento', bloqueado:'Bloqueado', em_risco:'Em risco', concluido:'Concluído', cancelado:'Cancelado' };
var PRIOR = { alta:'Alta', media:'Média', baixa:'Baixa' };
var CRIT = { normal:'Normal', importante:'Importante', critica:'Crítica' };
var AREAS = ['Comercial','Marketing','E-commerce','Logística','Frota','Expedição','Estoque','Compras','Financeiro','RH','Administrativo','TI','Restaurantes','Mercearia','Gogui','Sushi Trip','Obras e manutenção','Outros'];
var FAROL = {
  atrasado:{ c:'#ff4d4f', t:'Atrasado' },   bloq:{ c:'#d97706', t:'Bloqueado' },
  hoje:{ c:'#ffaa2b', t:'Vence hoje' },     risco:{ c:'#ffd166', t:'Em risco' },
  breve:{ c:'#ffaa2b', t:'Vence em breve' }, ok:{ c:'#36cfa0', t:'No prazo' },
  sem:{ c:'#6b7c9e', t:'Sem prazo' },       fechado:{ c:'#4d8ef5', t:'Encerrado' }
};
var RANK = { atrasado:0, bloq:1, hoje:2, risco:3, breve:4, ok:5, sem:6, fechado:7 };
var VIEWS = [
  { id:'hoje',       ico:'☀️', t:'Hoje',                    d:'O que pede atenção agora: atrasos, bloqueios, vencimentos, críticos e retornos pendentes.' },
  { id:'meus',       ico:'🙋', t:'Comigo',                  d:'Assuntos em que você é responsável, está envolvido ou de quem se aguarda retorno.' },
  { id:'aguardando', ico:'⏳', t:'Aguardando retorno',      d:'Assuntos parados esperando a resposta de alguém.' },
  { id:'bloqueados', ico:'⛔', t:'Bloqueados',              d:'Bloqueados ou em risco — com o motivo.' },
  { id:'alta',       ico:'🚩', t:'Prioridades',             d:'Prioridade alta ou criticidade crítica.' },

var S = { me:null, gestores:[], externos:[], itens:[], porId:{}, view:'hoje', fPessoa:'', fArea:'', q:'',
          aberto:null, demo:false, carregado:false, pessoasLista:[], areasLista:[] };
var CH = { env:[], cit:[] };   /* listas de pessoas em edição (envolvidos do formulário, citações do comentário) */

/* ─────────────── utilidades ─────────────── */
function el(id){ return document.getElementById(id); }
function val(id){ var e = el(id); return e ? String(e.value || '').trim() : ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function hojeIso(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function isoBR(iso){ var p = String(iso || '').substring(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function diasAte(iso){ if (!iso) return null; var a = new Date(String(iso).substring(0, 10) + 'T12:00:00'), b = new Date(hojeIso() + 'T12:00:00'); return isNaN(a) ? null : Math.round((a - b) / 864e5); }
function prazoTxt(iso){
  var d = diasAte(iso); if (d == null) return 'sem prazo';
  if (d < 0) return 'atrasado há ' + (-d) + (d === -1 ? ' dia' : ' dias');
  if (d === 0) return 'vence hoje';
  if (d === 1) return 'vence amanhã';
  return 'até ' + isoBR(iso);
}
function relativo(ts){
  if (!ts) return ''; var d = new Date(ts); if (isNaN(d)) return '';
  var s = (Date.now() - d) / 1000;
  if (s < 60) return 'agora';
  if (s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'há ' + Math.floor(s / 3600) + 'h';
  if (s < 86400 * 7) { var n = Math.floor(s / 86400); return 'há ' + n + (n === 1 ? ' dia' : ' dias'); }
  return d.toLocaleDateString('pt-BR');
}
function dataHora(ts){ var d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); }
function toast(msg, tipo){
  var t = el('toast'); t.textContent = msg; t.className = 'toast on ' + (tipo || '');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = 'toast'; }, 4200);
}
function loader(on){ el('loader').classList.toggle('on', !!on); }
function iniciais(nome){ var p = String(nome || '?').trim().split(/\s+/); return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase(); }

/* ─────────────── domínio ─────────────── */
function ehPonto(o){ return o.tipo === 'ponto'; }
function aberto(o){ return ABERTOS.indexOf(o.status || 'pendente') >= 0; }
function assuntos(){ return S.itens.filter(function(x){ return x.tipo !== 'ponto'; }); }
function pontosDe(id){ return S.itens.filter(function(x){ return x.tipo === 'ponto' && x.assuntoId === id && !x.arquivado; }); }
function nomePor(email){
  if (!email) return '';
  var g = S.gestores.filter(function(x){ return x.email === email; })[0];
  return g ? g.nome : email.split('@')[0];
}
function chavePessoa(p){ return p ? (p.email || ('n:' + norm(p.nome))) : ''; }
function pessoasDoItem(o){
  var L = [];
  if (o.dono || o.donoNome) L.push({ email:o.dono || '', nome:o.donoNome || nomePor(o.dono), papel:'resp' });
  (o.envolvidos || []).forEach(function(p){ if (p) L.push({ email:p.email || '', nome:p.nome || nomePor(p.email), papel:'env' }); });
  if (o.aguardandoDe && (o.aguardandoDe.nome || o.aguardandoDe.email)) L.push({ email:o.aguardandoDe.email || '', nome:o.aguardandoDe.nome || nomePor(o.aguardandoDe.email), papel:'ag' });
  return L;
}
function pessoasDoAssunto(a){
  var L = pessoasDoItem(a);
  pontosDe(a.id).filter(aberto).forEach(function(p){ L = L.concat(pessoasDoItem(p)); });
  return L;
}
function envolveMe(a){ var me = S.me.email; return pessoasDoAssunto(a).some(function(p){ return p.email === me; }); }
function podeEditar(o){
  if (!S.me || S.demo) return !!S.me;
  if (S.me.admin) return true;
  var e = S.me.email;
  if (o.dono === e || o.criadoPor === e) return true;
  if ((o.responsaveis || []).indexOf(e) >= 0) return true;
  if (ehPonto(o) && S.porId[o.assuntoId]) return podeEditar(S.porId[o.assuntoId]);
  return false;
}
function farol(o){
  if (!aberto(o)) return 'fechado';
  if (o.status === 'bloqueado') return 'bloq';
  var d = diasAte(o.prazo);
  if (d == null) return o.status === 'em_risco' ? 'risco' : 'sem';
  if (d < 0) return 'atrasado';
  if (d === 0) return 'hoje';
  if (o.status === 'em_risco') return 'risco';
  if (d <= 2) return 'breve';
  return 'ok';
}
function farolAssunto(a){
  var f = farol(a); if (!aberto(a)) return f;
  pontosDe(a.id).filter(aberto).forEach(function(p){ var g = farol(p); if (RANK[g] < RANK[f]) f = g; });
  return f;
}
function sinais(a){
  var ps = pontosDe(a.id), abertosP = ps.filter(aberto);
  var s = { atrasado:0, hoje:0, bloq:0, aguard:0, crit:0, pontosAbertos:abertosP.length, pontosTotal:ps.length };
  (aberto(a) ? [a] : []).concat(aberto(a) ? abertosP : []).forEach(function(x){
    var f = farol(x);
    if (f === 'atrasado') s.atrasado++;
    if (f === 'hoje') s.hoje++;
    if (x.status === 'bloqueado' || x.status === 'em_risco') s.bloq++;
    if (x.aguardandoDe && x.aguardandoDe.nome) s.aguard++;
    if (x.criticidade === 'critica') s.crit++;
  });
  return s;
}
function passaView(a, v){
  if (v === 'arquivados') return !!a.arquivado;
  if (a.arquivado) return false;
  if (v === 'concluidos') return !aberto(a);
  if (!aberto(a)) return false;
  var s = sinais(a);
  if (v === 'hoje') return !!(s.atrasado || s.hoje || s.bloq || s.crit || s.aguard);
  if (v === 'meus') return envolveMe(a);
  if (v === 'aguardando') return s.aguard > 0;
  if (v === 'bloqueados') return s.bloq > 0;
  if (v === 'alta') return a.prioridade === 'alta' || s.crit > 0;
  if (v === 'reunioes') return !!a.reuniao;
  return true;
}
function passaFiltros(a){
  if (S.fArea && (a.area || 'Sem área') !== S.fArea) return false;
  if (S.fPessoa && !pessoasDoAssunto(a).some(function(p){ return chavePessoa(p) === S.fPessoa; })) return false;
  if (S.q) {
    var hay = norm([a.id, a.origem, a.titulo, a.resumo, a.area, a.proximaAcao, a.motivoBloqueio]
      .concat(pessoasDoAssunto(a).map(function(p){ return p.nome; }))
      .concat(pontosDe(a.id).map(function(p){ return p.titulo + ' ' + p.id; })).join(' '));
    if (norm(S.q).split(/\s+/).some(function(t){ return t && hay.indexOf(t) < 0; })) return false;
  }

}
function ordenar(lista){
  if (S.view === 'concluidos') return lista.sort(function(a, b){ return String(b.encerradoEm || b.atualizadoEm).localeCompare(String(a.encerradoEm || a.atualizadoEm)); });
  if (S.view === 'arquivados') return lista.sort(function(a, b){ return String(b.atualizadoEm).localeCompare(String(a.atualizadoEm)); });
  return lista.sort(function(a, b){
    var fa = RANK[farolAssunto(a)], fb = RANK[farolAssunto(b)]; if (fa !== fb) return fa - fb;
    var pa = a.prazo || '9999', pb = b.prazo || '9999'; if (pa !== pb) return pa.localeCompare(pb);
    return String(b.atualizadoEm).localeCompare(String(a.atualizadoEm));
  });
}
function resolverPessoa(txt){
  txt = String(txt || '').trim(); if (!txt) return null;
  var t = norm(txt);
  var g = S.gestores.filter(function(x){ return norm(x.nome) === t || x.email === txt.toLowerCase(); })[0];
  return g ? { email:g.email, nome:g.nome } : { email:'', nome:txt };
}
function pessoaTxt(p){ return p ? (p.nome || nomePor(p.email)) : ''; }

/* ─────────────── API ─────────────── */
function apiGet(action){
  return fetch(API_URL + '?modulo=tarefas&action=' + action + '&email=' + encodeURIComponent(S.me.email) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ if (!d.ok) { var e = new Error(d.error || 'Erro ao ler a base de dados'); e.codigo = d.codigo; throw e; } return d; });
}
function apiPost(action, payload){
  if (S.demo) return Promise.reject(new Error('Modo demonstração: nada é gravado.'));
  var body = 'action=' + encodeURIComponent(action) + '&email=' + encodeURIComponent(S.me.email) + '&payload=' + encodeURIComponent(JSON.stringify(payload || {}));
  return fetch(API_URL + '?modulo=tarefas', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' }, body:body })
    .then(function(r){ if (!r.ok) throw new Error('Falha de conexão (' + r.status + ')'); return r.json(); })
    .then(function(d){ if (!d.ok) { var e = new Error(d.error || 'Erro ao gravar'); e.codigo = d.codigo || ''; throw e; } return d; });
}
/* grava, mescla o retorno na tela; em erro mostra o aviso e devolve null */
function post(action, payload, okMsg, silencioso){
  loader(true);
  return apiPost(action, payload).then(function(d){
    loader(false);
    mesclar((d.resultado && d.resultado.itens) || []);
    if (okMsg) toast(okMsg, 'ok');
    return d;
  }).catch(function(e){
    loader(false);
    if (silencioso) throw e;

    return null;
  });
}
function mesclar(itens){
  itens.forEach(function(n){
    var i = -1;
    for (var k = 0; k < S.itens.length; k++) if (S.itens[k].id === n.id) { i = k; break; }
    if (i >= 0) S.itens[i] = n; else S.itens.push(n);
  });
  indexar(); renderTudo();
}
function indexar(){
  S.porId = {};
  S.itens.forEach(function(o){ S.porId[o.id] = o; });
}

/* ─────────────── carga ─────────────── */
function carregar(){
  loader(true);
  apiGet('boot').then(function(d){
    loader(false);
    S.me = d.me; S.gestores = d.gestores || []; S.externos = d.pessoasExternas || []; S.itens = d.itens || [];
    S.carregado = true;

    el('usr').textContent = S.me.nome + (S.me.admin ? ' · admin' : '');

    loader(false);
    el('fich').innerHTML = '';
    el('main').innerHTML = '<div class="bloq-tela"><h2>🔒 Não foi possível abrir</h2><p>' + esc(e.message) + '</p><p style="margin-top:14px"><button class="btn pri" onclick="location.href=\'Index_Menu.html\'">Voltar ao menu</button> <button class="btn" onclick="carregar()">Tentar de novo</button></p></div>';
  });
}
function atualizar(){

    S.itens = d.itens || []; indexar(); renderTudo();
  }).catch(function(){});
}
function digitando(){
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q') return true;
  var c = el('c-txt'); return !!(c && c.value.trim());
}
function preencherListas(){
  var nomes = {};

  S.externos.forEach(function(n){ nomes[n] = 1; });
  S.itens.forEach(function(o){ pessoasDoItem(o).forEach(function(p){ if (p.nome) nomes[p.nome] = 1; }); });
  el('dl-pessoas').innerHTML = Object.keys(nomes).sort().map(function(n){ return '<option value="' + esc(n) + '">'; }).join('');
  var ar = {}; AREAS.forEach(function(a){ ar[a] = 1; }); S.itens.forEach(function(o){ if (o.area) ar[o.area] = 1; });
  el('dl-areas').innerHTML = Object.keys(ar).sort().map(function(a){ return '<option value="' + esc(a) + '">'; }).join('');

function abrirLinkPendente(){

  var m = h.match(/#a=([^&]+)/);

/* ─────────────── tela: fichário (lateral) ─────────────── */
function renderTudo(){ renderFich(); renderLista(); if (S.aberto) { if (S.porId[S.aberto]) { if (!digitando() && !modalAberto()) renderPagina(); } else fecharFicha(); } }
function renderFich(){
  var as = assuntos(), h = '<div class="fich-sec">Cadernos</div>';
  VIEWS.forEach(function(v){
    var n = as.filter(function(a){ return passaView(a, v.id); }).length;
    h += '<button class="af' + (S.view === v.id ? ' on' : '') + '" onclick="setView(\'' + v.id + '\')"><span class="i">' + v.ico + '</span><span class="t">' + v.t + '</span>' +
         (n ? '<span class="n' + (v.id === 'hoje' ? ' red' : '') + '">' + n + '</span>' : '') + '</button>';
  });
  var mp = {}, ma = {};

    var vis = {};
    pessoasDoAssunto(a).forEach(function(p){
      var k = chavePessoa(p); if (!k || vis[k]) return; vis[k] = 1;
      mp[k] = mp[k] || { k:k, nome:p.nome || nomePor(p.email), ext:!p.email, n:0 }; mp[k].n++;

function setView(v){ S.view = v; menuFich(false); renderTudo(); window.scrollTo({ top:0 }); }
function setPessoa(i){ var p = S.pessoasLista[i]; S.fPessoa = (p && S.fPessoa !== p.k) ? p.k : ''; S.fPessoaNome = p ? p.nome : ''; if (S.fPessoa && S.view !== 'arquivados' && S.view !== 'concluidos') S.view = 'abertos'; menuFich(false); renderTudo(); }

function buscar(t){ S.q = String(t || '').trim(); var a = el('q'), b = el('q-m'); if (a && a.value !== t) a.value = t; if (b && b.value !== t) b.value = t; renderLista(); }

/* ─────────────── tela: lista de fichas ─────────────── */

  } else if (S.view === 'hoje') {

function resumoHoje(){

function chipsHTML(o){

function cardHTML(a){
  var s = sinais(a), F = FAROL[farolAssunto(a)], meta = [];

  if (a.aguardandoDe && a.aguardandoDe.nome) meta.push('<span class="ag">⏳ aguardando ' + esc(a.aguardandoDe.nome) + '</span>');
  if (aberto(a) && a.prazo) meta.push('<span style="color:' + FAROL[farol(a)].c + '">📅 ' + prazoTxt(a.prazo) + '</span>');
  if (!aberto(a) && a.encerradoEm) meta.push('✅ encerrado ' + relativo(a.encerradoEm));
  if (s.pontosTotal) meta.push('🧩 ' + (s.pontosAbertos ? s.pontosAbertos + ' de ' + s.pontosTotal + ' pontos abertos' : 'pontos concluídos (' + s.pontosTotal + ')'));
  var l3 = '';
  if ((a.status === 'bloqueado' || a.status === 'em_risco') && a.motivoBloqueio) l3 = '<div class="motivo">⛔ ' + esc(a.motivoBloqueio) + '</div>';
  else if (aberto(a) && a.proximaAcao) l3 = '<div class="prox">➡️ ' + esc(a.proximaAcao) + '</div>';
  var alertaP = '';
  if (aberto(a)) {
    var pa = pontosDe(a.id).filter(function(p){ return aberto(p) && (farol(p) === 'atrasado' || p.status === 'bloqueado'); });
    if (pa.length) alertaP = '<div class="motivo">🧩 ' + pa.length + ' ponto(s) ' + (pa.some(function(p){ return farol(p) === 'atrasado'; }) ? 'atrasado(s)' : 'bloqueado(s)') + ': ' + esc(pa.slice(0, 2).map(function(p){ return p.titulo; }).join(' · ')) + '</div>';
  }
  var upd = a.atualizadoEm ? '<div class="upd">atualizado ' + relativo(a.atualizadoEm) + (a.atualizadoPor ? ' por ' + esc(nomePor(a.atualizadoPor)) : '') + '</div>' : '';
  return '<article class="ficha' + (S.aberto === a.id ? ' sel' : '') + '" onclick="abrirFicha(\'' + a.id + '\')">' +
    '<span class="aba" style="background:' + F.c + '" title="' + F.t + '"></span><div class="fc">' +
    '<div class="l1">' + (a.id.indexOf('ASS-') === 0 ? '<span class="cod">' + a.id + '</span>' : '') + chipsHTML(a) + '</div>' +
    '<h3>' + esc(a.titulo) + '</h3><div class="meta">' + meta.join('<span class="sep">·</span>') + '</div>' + l3 + alertaP + upd + '</div></article>';
}

/* ─────────────── tela: página do assunto / ponto ─────────────── */
function abrirFicha(id){
  if (!S.porId[id]) return;
  S.aberto = id; CH.cit = [];
  renderPagina();
  el('pagina').classList.add('on'); el('veu').classList.add('on'); el('pagina').scrollTop = 0;
  try { history.replaceState(null, '', '#a=' + encodeURIComponent(id)); } catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('.ficha'), function(f){ f.classList.remove('sel'); });
}
function fecharFicha(){
  S.aberto = null;
  el('pagina').classList.remove('on'); el('veu').classList.remove('on');
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  renderLista();
}
function pessoaChip(p, extra){
  var nome = p.nome || nomePor(p.email);
  return '<span class="pchip' + (p.email ? '' : ' ext') + '" title="' + esc(p.email || 'fora do sistema') + '"><i>' + esc(iniciais(nome)) + '</i>' + esc(nome) + (extra || '') + '</span>';
}
function renderPagina(){
  var o = S.porId[S.aberto]; if (!o) return fecharFicha();
  var pai = ehPonto(o) ? S.porId[o.assuntoId] : null, pode = podeEditar(o), ro = !!o.reuniao, ab = aberto(o), arq = !!o.arquivado;
  var id = o.id, h = '';
  h += '<div class="pg-top">' + (pai ? '<button class="volta" onclick="abrirFicha(\'' + pai.id + '\')">← ' + esc(pai.titulo) + '</button>' : '<span style="font-size:.78rem;color:var(--mu)">' + (ehPonto(o) ? 'Ponto' : 'Assunto') + '</span>') + '<button class="x" onclick="fecharFicha()" aria-label="Fechar">✕</button></div>';
  h += '<div class="pg">';
  h += '<div class="l1">' + (o.id.indexOf('ASS-') === 0 ? '<span class="cod">' + o.id + '</span>' : '') + chipsHTML(o) + '</div>';
  h += '<h2>' + (ehPonto(o) ? '🧩 ' : '') + esc(o.titulo) + '</h2>';
  var F = FAROL[farol(o)];
  h += '<div class="grid-m">' +
    '<div class="gm"><small>Responsável</small><b>' + esc(o.donoNome || nomePor(o.dono) || '—') + '</b></div>' +
    '<div class="gm"><small>Prazo</small><b style="color:' + F.c + '">' + (ab ? prazoTxt(o.prazo) : (o.prazo ? isoBR(o.prazo) : '—')) + '</b></div>' +
    '<div class="gm"><small>Prioridade · criticidade</small><b>' + (PRIOR[o.prioridade] || '—') + ' · ' + (CRIT[o.criticidade] || 'Normal') + '</b></div>' +
    '<div class="gm"><small>Área</small><b>' + esc(o.area || '—') + '</b></div>' +
    '<div class="gm"><small>Aberto</small><b>' + (o.criadoEm ? isoBR(o.criadoEm.substring(0, 10)) : '—') + (o.criadoPor ? ' · ' + esc(nomePor(o.criadoPor)) : '') + '</b></div>' +
    '<div class="gm"><small>Visível para</small><b>' + (ehPonto(o) ? 'quem vê o assunto' : (o.visibilidade === 'restrito' ? '🔒 envolvidos' : 'todos os gestores')) + '</b></div>' +
  '</div>';
  var env = o.envolvidos || [];
  if (env.length) h += '<div class="pessoas"><span style="font-size:.72rem;color:var(--mu2);align-self:center;margin-right:2px">ENVOLVIDOS</span>' + env.map(function(p){ return pessoaChip(p); }).join('') + '</div>';

  /* ações */
  var ac = [];
  if (!ro && !arq && pode && ab) ac.push('<button class="btn sm" onclick="' + (ehPonto(o) ? 'formPonto(null,\'' + id + '\')' : 'formAssunto(\'' + id + '\')') + '">✏️ Editar</button>');
  if (!ro && !arq && !ehPonto(o)) ac.push('<button class="btn sm" onclick="formPonto(\'' + id + '\',null)">🧩 Novo ponto</button>');
  if (!ro && !arq && pode && ab) ac.push('<button class="btn sm" style="color:var(--ok)" onclick="formEncerrar(\'' + id + '\')">✅ Encerrar</button>');
  if (!ro && !arq && pode && !ab) ac.push('<button class="btn sm warn" onclick="formReabrir(\'' + id + '\')">↩️ Reabrir</button>');
  if (!ro && pode) ac.push(arq ? '<button class="btn sm" onclick="arquivar(\'' + id + '\',false)">♻️ Restaurar</button>' : '<button class="btn sm ghost" onclick="arquivar(\'' + id + '\',true)">🗄 Arquivar</button>');
  if (ro) ac.push('<button class="btn sm" onclick="location.href=\'Index_Checkpoint.html#reu=' + encodeURIComponent(o.origem) + '\'">🤝 Abrir no Checkpoint</button>');
  if (ac.length) h += '<div class="acoes">' + ac.join('') + '</div>';

  if (o.resumo) h += '<div class="sec"><div class="sec-t">Resumo</div><div class="texto">' + esc(o.resumo) + '</div></div>';

  /* compromisso de reunião */
  if (ro) {
    h += '<div class="sec"><div class="sec-t">Compromisso da reunião ' + esc(o.origem) + '</div><div class="reu-box">' +
      '🎯 <b>Meta:</b> ' + esc(o.meta || '—') + '<br>📎 <b>Evidência esperada:</b> ' + esc(o.evidenciaEsperada || '—') +
      (o.evidencia ? '<br>✅ <b>Entregue:</b> ' + esc(o.evidencia) : '') +
      (o.motivoBloqueio ? '<br>⛔ <b>Impedimento:</b> ' + esc(o.motivoBloqueio) : '') +
      '<br><span style="color:var(--mu);font-size:.8rem">O status deste compromisso é atualizado no Checkpoint. Aqui você pode acompanhar e comentar.</span></div></div>';
  }

  /* situação agora */
  if (!ro && ab && !arq) {
    var dis = pode ? '' : ' disabled';
    h += '<div class="sec"><div class="sec-t">Situação agora</div><div class="sit">';
    h += '<div class="sit-l"><label>Andamento</label><select onchange="mudarStatus(\'' + id + '\',this.value)"' + dis + '>' +
      ABERTOS.map(function(s){ return '<option value="' + s + '"' + (o.status === s ? ' selected' : '') + '>' + ROT[s] + '</option>'; }).join('') + '</select>' +
      ((o.status === 'bloqueado' || o.status === 'em_risco') && o.motivoBloqueio ? '<span class="v" style="color:#ffb86b">⛔ ' + esc(o.motivoBloqueio) + '</span>' : '') + '</div>';
    h += '<div class="sit-l"><label>Próxima ação</label><span class="v' + (o.proximaAcao ? '' : ' mu') + '">' + esc(o.proximaAcao || 'não definida') + '</span>' + (pode ? '<button class="lk" onclick="formCampo(\'' + id + '\',\'proximaAcao\')">' + (o.proximaAcao ? 'alterar' : 'definir') + '</button>' : '') + '</div>';
    var ag = o.aguardandoDe && o.aguardandoDe.nome;
    h += '<div class="sit-l"><label>Aguardando</label><span class="v' + (ag ? '' : ' mu') + '" style="' + (ag ? 'color:var(--warn);font-weight:600' : '') + '">' + (ag ? '⏳ retorno de ' + esc(o.aguardandoDe.nome) : 'ninguém') + '</span>' +
      (pode ? (ag ? '<button class="btn sm" onclick="recebiRetorno(\'' + id + '\')">✔ Recebi o retorno</button>' : '<button class="lk" onclick="formCampo(\'' + id + '\',\'aguardandoDe\')">definir</button>') : '') + '</div>';
    h += '</div></div>';
  }

  /* pontos */
  if (!ehPonto(o) && !ro) {
    var ps = pontosDe(id).sort(function(a, b){
      var x = aberto(a) ? 0 : 1, y = aberto(b) ? 0 : 1; if (x !== y) return x - y;
      return (RANK[farol(a)] - RANK[farol(b)]) || String(a.prazo || '9999').localeCompare(String(b.prazo || '9999'));
    });
    var nAb = ps.filter(aberto).length;
    h += '<div class="sec"><div class="sec-t"><span>Pontos · ' + (ps.length ? nAb + ' aberto(s) de ' + ps.length : 'nenhum ainda') + '</span>' + (!arq ? '<button class="lk" onclick="formPonto(\'' + id + '\',null)">＋ novo ponto</button>' : '') + '</div>';
    h += ps.length ? ps.map(function(p){
      var fp = FAROL[farol(p)], nc = (p.comentarios || []).length;
      return '<div class="pt' + (aberto(p) ? '' : ' fech') + '" onclick="abrirFicha(\'' + p.id + '\')"><span class="dot" style="background:' + fp.c + '" title="' + fp.t + '"></span>' +
        '<div class="pc"><b>' + esc(p.titulo) + '</b><span>👤 ' + esc(p.donoNome || nomePor(p.dono) || '—') + ' · ' + (aberto(p) ? prazoTxt(p.prazo) : (ROT[p.status] + (p.encerradoEm ? ' ' + relativo(p.encerradoEm) : ''))) +
        (p.aguardandoDe && p.aguardandoDe.nome && aberto(p) ? ' · ⏳ ' + esc(p.aguardandoDe.nome) : '') + (nc ? ' · 💬 ' + nc : '') + '</span></div>' +
        '<span class="chip st-' + esc(p.status) + '">' + ROT[p.status] + '</span></div>';
    }).join('') : '<div style="font-size:.82rem;color:var(--mu);padding:4px 2px">Quebre o assunto em pontos: cada um com responsável e prazo. Ex.: "Retorno do Gledson sobre o telhado".</div>';
    h += '</div>';
  }

  /* relacionados */
  if (!ehPonto(o)) {
    var rel = (o.relacionados || []).map(function(r){ return S.porId[r]; }).filter(Boolean);
    var cand = assuntos().filter(function(a){ return a.id !== id && !a.arquivado && (o.relacionados || []).indexOf(a.id) < 0; });
    if (rel.length || (!arq && cand.length)) {
      h += '<div class="sec"><div class="sec-t">Assuntos relacionados</div><div class="rel">' +
        rel.map(function(r){ return '<span class="rc" onclick="abrirFicha(\'' + r.id + '\')">🔗 ' + esc(r.titulo) + (podeEditar(o) ? '<button onclick="event.stopPropagation();vincular(\'' + id + '\',\'' + r.id + '\',true)" title="Desvincular">×</button>' : '') + '</span>'; }).join('') +
        (!arq && cand.length ? '<select onchange="if(this.value)vincular(\'' + id + '\',this.value,false)"><option value="">＋ relacionar com…</option>' +
          cand.map(function(c){ return '<option value="' + c.id + '">' + esc(c.titulo.substring(0, 70)) + '</option>'; }).join('') + '</select>' : '') +
        '</div></div>';
    }
  }

  /* linha do tempo + comentário */
  h += '<div class="sec"><div class="sec-t">Linha do tempo</div>' + linhaTempoHTML(o) + comentarioHTML(o) + '</div>';
  h += '</div>';
  el('pagina').innerHTML = h;
}
var ICO_EV = { criado:'📒', ponto:'🧩', status:'🔄', prazo:'📅', aguardando:'⏳', responsavel:'👤', envolvidos:'👥', encerrado:'✅', reaberto:'↩️',
  arquivado:'🗄', restaurado:'♻️', vinculo:'🔗', proxima:'➡️', bloqueio:'⛔', edicao:'✏️', prioridade:'🚩', criticidade:'🚨', visibilidade:'🔒' };
function linhaTempoHTML(o){
  var L = [];
  (o.historico || []).forEach(function(h){ L.push({ ts:h.ts, ev:true, i:ICO_EV[h.tipo] || '•', quem:h.porNome || nomePor(h.por), txt:h.texto }); });
  (o.comentarios || []).forEach(function(c){
    L.push({ ts:c.ts || c.em, ev:!!c.auto, i:c.auto ? '•' : '💬', quem:c.autor || nomePor(c.email), txt:c.texto, meu:c.email === S.me.email, men:c.mencoes || [] });
  });
  L.sort(function(a, b){ return String(a.ts).localeCompare(String(b.ts)); });
  if (!L.length) return '<div style="font-size:.82rem;color:var(--mu)">Sem registros ainda.</div>';
  return '<div class="tl">' + L.map(function(x){
    return '<div class="te ' + (x.ev ? 'ev' : 'com') + (x.meu ? ' meu' : '') + '" data-i="' + x.i + '"><div class="q"><b>' + esc(x.quem || '—') + '</b> · ' + dataHora(x.ts) + '</div><div class="tx">' + esc(x.txt) + '</div>' +
      (x.men && x.men.length ? '<div class="men">citou: ' + x.men.map(function(m){ return esc(m.nome); }).join(', ') + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}
function comentarioHTML(o){
  return '<div class="com-f"><textarea id="c-txt" placeholder="Escreva uma atualização: o que aconteceu, o que falta, quem precisa agir…"></textarea>' +
    '<div class="chips-ed" id="c-cit">' + CH.cit.map(function(p, i){ return pessoaChip(p, '<button onclick="CH.cit.splice(' + i + ',1);pintarCit()">×</button>'); }).join('') + '</div>' +
    '<div class="com-l"><input id="c-pessoa" list="dl-pessoas" placeholder="Citar alguém (opcional)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addCit()}"><button class="btn sm" onclick="addCit()">＋ citar</button>' +
    '<button class="btn pri sm" id="c-btn" onclick="comentar(\'' + o.id + '\')" style="margin-left:auto">Registrar</button></div></div>';
}
function addCit(){ var p = resolverPessoa(val('c-pessoa')); if (!p) return; if (!CH.cit.some(function(x){ return chavePessoa(x) === chavePessoa(p); })) CH.cit.push(p); el('c-pessoa').value = ''; pintarCit(); }
function pintarCit(){ var b = el('c-cit'); if (b) b.innerHTML = CH.cit.map(function(p, i){ return pessoaChip(p, '<button onclick="CH.cit.splice(' + i + ',1);pintarCit()">×</button>'); }).join(''); }

/* ─────────────── ações rápidas ─────────────── */
function comentar(id){
  var t = val('c-txt'); if (!t) { toast('Escreva a atualização antes de registrar.', 'error'); return; }
  var b = el('c-btn'); if (b) b.disabled = true;
  post('comentar', { id:id, texto:t, mencoes:CH.cit }, 'Registrado no histórico.').then(function(d){
    if (d) { CH.cit = []; var c = el('c-txt'); if (c) c.value = ''; renderPagina(); }
    else if (b) b.disabled = false;
  });
}
function mudarStatus(id, novo){
  var o = S.porId[id]; if (!o || novo === o.status) return;
  if (novo === 'bloqueado' || novo === 'em_risco') {
    modal('<h3>' + (novo === 'bloqueado' ? '⛔ Bloqueado' : '⚠️ Em risco') + '</h3><p class="mod-sub">' + esc(o.titulo) + '</p>' +
      '<label>O que está impedindo?</label><textarea id="m-mot" placeholder="Ex.: precisa do Adilson, que volta da China dia 05/11">' + esc(o.motivoBloqueio || '') + '</textarea>' +
      '<label>Aguardando retorno de quem? (opcional)</label><input id="m-ag" list="dl-pessoas" value="' + esc(pessoaTxt(o.aguardandoDe)) + '" placeholder="Nome da pessoa">' +
      '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal();renderPagina()">Cancelar</button><button class="btn pri" onclick="confirmarBloqueio(\'' + id + '\',\'' + novo + '\')">Salvar</button></div>');
    return;
  }
  post('editar', { id:id, campos:{ status:novo } }, 'Andamento atualizado.').then(function(d){ if (!d) renderPagina(); });
}
function confirmarBloqueio(id, novo){
  var mot = val('m-mot'); if (!mot) { msgModal('Diga o que está impedindo.'); return; }
  var o = S.porId[id], c = { motivoBloqueio:mot, status:novo }, ag = resolverPessoa(val('m-ag'));
  if (JSON.stringify(ag) !== JSON.stringify(normPessoa(o.aguardandoDe))) c.aguardandoDe = ag;
  salvarModal('editar', { id:id, campos:c }, 'Andamento atualizado.');
}
function recebiRetorno(id){
  var o = S.porId[id];
  modal('<h3>✔ Retorno recebido</h3><p class="mod-sub">De ' + esc(pessoaTxt(o.aguardandoDe)) + ' · ' + esc(o.titulo) + '</p>' +
    '<label>O que foi respondido? (fica no histórico)</label><textarea id="m-ret" placeholder="Ex.: Gledson confirmou que o vazamento foi corrigido"></textarea>' +
    '<label>Próxima ação (opcional)</label><input id="m-prox" value="' + esc(o.proximaAcao || '') + '">' +
    '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="m-btn" onclick="confirmarRetorno(\'' + id + '\')">Salvar</button></div>');
}
function confirmarRetorno(id){
  var o = S.porId[id], ret = val('m-ret'), prox = val('m-prox'), c = { aguardandoDe:null };
  if (prox !== (o.proximaAcao || '')) c.proximaAcao = prox;
  var b = el('m-btn'); if (b) b.disabled = true;
  apiPost('editar', { id:id, campos:c }).then(function(d){
    mesclar(d.resultado.itens || []);
    if (!ret) return null;
    return apiPost('comentar', { id:id, texto:'Retorno de ' + pessoaTxt(o.aguardandoDe) + ': ' + ret }).then(function(d2){ mesclar(d2.resultado.itens || []); });
  }).then(function(){ fecharModal(); toast('Retorno registrado.', 'ok'); renderPagina(); })
    .catch(function(e){ if (b) b.disabled = false; msgModal(e.message); });
}
function formCampo(id, campo){
  var o = S.porId[id];
  if (campo === 'proximaAcao') {
    modal('<h3>➡️ Próxima ação</h3><p class="mod-sub">' + esc(o.titulo) + '</p><label>O que precisa acontecer agora?</label><input id="m-v" maxlength="300" value="' + esc(o.proximaAcao || '') + '" placeholder="Ex.: ligar para o suporte do Mercado Livre na segunda">' +
      '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" onclick="salvarModal(\'editar\',{id:\'' + id + '\',campos:{proximaAcao:val(\'m-v\')}},\'Próxima ação salva.\')">Salvar</button></div>');
  } else {
    modal('<h3>⏳ Aguardando retorno</h3><p class="mod-sub">' + esc(o.titulo) + '</p><label>De quem?</label><input id="m-v" list="dl-pessoas" placeholder="Escolha um gestor ou digite o nome (ex.: Gledson)">' +
      '<div class="hint">Pode ser alguém de fora do sistema — o nome fica registrado no assunto.</div>' +
      '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" onclick="var p=resolverPessoa(val(\'m-v\'));if(!p){msgModal(\'Informe a pessoa.\');return;}salvarModal(\'editar\',{id:\'' + id + '\',campos:{aguardandoDe:p}},\'Registrado.\')">Salvar</button></div>');
  }
}
function arquivar(id, sim){
  var o = S.porId[id];
  if (sim && !confirm('Arquivar "' + o.titulo + '"?\n\nSai das listas, mas continua guardado no Arquivo com todo o histórico.')) return;
  post(sim ? 'arquivar' : 'restaurar', { id:id }, sim ? 'Arquivado.' : 'Restaurado.').then(function(d){ if (d && sim && !ehPonto(o)) fecharFicha(); });
}
function vincular(id, outro, remover){
  if (remover && !confirm('Desvincular estes assuntos?')) return;
  post('vincular', { id:id, relacionadoId:outro, remover:!!remover }, remover ? 'Desvinculado.' : 'Assuntos relacionados.');
}

/* ─────────────── modais ─────────────── */
function modal(html){ el('modal-box').innerHTML = html; el('modal').classList.add('on'); var f = el('modal-box').querySelector('input:not([type=checkbox]),textarea,select'); if (f) setTimeout(function(){ f.focus(); }, 60); }
function fecharModal(){ el('modal').classList.remove('on'); el('modal-box').innerHTML = ''; }
function modalAberto(){ return el('modal').classList.contains('on'); }
function msgModal(t){ var m = el('mod-msg'); if (m) m.innerHTML = esc(t); }
function salvarModal(action, payload, okMsg){
  var bs = el('modal-box').querySelectorAll('.mod-f .btn'); Array.prototype.forEach.call(bs, function(b){ b.disabled = true; });
  loader(true);
  return apiPost(action, payload).then(function(d){
    loader(false); fecharModal(); mesclar(d.resultado.itens || []); if (okMsg) toast(okMsg, 'ok'); return d;
  }).catch(function(e){
    loader(false); Array.prototype.forEach.call(bs, function(b){ b.disabled = false; }); msgModal(e.message); return null;
  });
}
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (modalAberto()) fecharModal(); else if (S.aberto) fecharFicha();
});
function normPessoa(p){ return p && (p.nome || p.email) ? { email:p.email || '', nome:p.nome || nomePor(p.email) } : null; }
function normLista(l){ return (l || []).map(normPessoa).filter(Boolean).map(function(p){ return chavePessoa(p); }).sort().join('|'); }
function opcoes(mapa, sel){ return Object.keys(mapa).map(function(k){ return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + mapa[k] + '</option>'; }).join(''); }
function envChipsHTML(){ return CH.env.map(function(p, i){ return pessoaChip(p, '<button type="button" onclick="CH.env.splice(' + i + ',1);pintarEnv()">×</button>'); }).join(''); }
function pintarEnv(){ var b = el('f-env'); if (b) b.innerHTML = envChipsHTML(); }
function addEnv(){ var p = resolverPessoa(val('f-env-in')); if (!p) return; if (!CH.env.some(function(x){ return chavePessoa(x) === chavePessoa(p); })) CH.env.push(p); el('f-env-in').value = ''; pintarEnv(); }
function toggleMotivo(){ var s = val('f-status'), b = el('f-mot-box'); if (b) b.style.display = (s === 'bloqueado' || s === 'em_risco') ? '' : 'none'; }
function toggleMotivoPrazo(orig){ var b = el('f-mprazo-box'); if (b) b.style.display = (orig && val('f-prazo') !== orig) ? '' : 'none'; }

function addLinhaPonto(){
  var box = el('f-pontos'); if (!box) return;
  var d = document.createElement('div'); d.className = 'np-row';
  d.innerHTML = '<input class="np-t" maxlength="200" placeholder="Ponto (ex.: aguardar retorno do Adilson)"><input class="np-r" list="dl-pessoas" placeholder="Responsável"><input class="np-p" type="date"><button type="button" onclick="this.parentNode.remove()">×</button>';
  box.appendChild(d); d.querySelector('.np-t').focus();
}
function salvarAssunto(id){
  var titulo = val('f-titulo'); if (!titulo) return msgModal('Informe o assunto.');
  var resp = resolverPessoa(val('f-resp')); if (!resp) return msgModal('Informe o responsável.');
  var status = val('f-status'), mot = val('f-mot');
  if ((status === 'bloqueado' || status === 'em_risco') && !mot) return msgModal('Diga o que está impedindo.');
  var ag = resolverPessoa(val('f-ag'));
  if (!id) {
    var pontos = [], falta = false;
    Array.prototype.forEach.call(document.querySelectorAll('#f-pontos .np-row'), function(r){
      var t = r.querySelector('.np-t').value.trim(), rp = resolverPessoa(r.querySelector('.np-r').value);
      if (!t) return; if (!rp) falta = true;
      pontos.push({ titulo:t, responsavel:rp, prazo:r.querySelector('.np-p').value });
    });
    if (falta) return msgModal('Cada ponto precisa de um responsável.');
    loader(true);
    var bs = el('modal-box').querySelectorAll('.mod-f .btn'); Array.prototype.forEach.call(bs, function(b){ b.disabled = true; });
    apiPost('criarAssunto', { titulo:titulo, resumo:val('f-resumo'), area:val('f-area'), responsavel:resp, envolvidos:CH.env,
      prioridade:val('f-prior'), criticidade:val('f-crit'), prazo:val('f-prazo'), status:status, motivoBloqueio:mot,
      visibilidade:val('f-vis'), aguardandoDe:ag, proximaAcao:val('f-prox'), pontos:pontos })
    .then(function(d){
      loader(false); fecharModal(); var it = d.resultado.itens || []; mesclar(it); preencherListas();
      toast('Assunto ' + (it[0] ? it[0].id : '') + ' criado.', 'ok'); if (it[0]) abrirFicha(it[0].id);
    }).catch(function(e){ loader(false); Array.prototype.forEach.call(bs, function(b){ b.disabled = false; }); msgModal(e.message); });
    return;
  }
  var o = S.porId[id], c = {};
  if (titulo !== o.titulo) c.titulo = titulo;
  if (val('f-resumo') !== (o.resumo || '')) c.resumo = val('f-resumo');
  if (val('f-area') !== (o.area || '')) c.area = val('f-area');
  if (resp.email !== (o.dono || '') || resp.nome !== (o.donoNome || nomePor(o.dono))) c.responsavel = resp;
  if (normLista(CH.env) !== normLista(o.envolvidos)) c.envolvidos = CH.env;
  if (val('f-prior') !== o.prioridade) c.prioridade = val('f-prior');
  if (val('f-crit') !== (o.criticidade || 'normal')) c.criticidade = val('f-crit');
  if (val('f-prazo') !== (o.prazo || '')) { c.prazo = val('f-prazo'); c.motivoPrazo = val('f-mprazo'); }
  if (val('f-vis') !== (o.visibilidade || 'todos')) c.visibilidade = val('f-vis');
  if (mot !== (o.motivoBloqueio || '')) c.motivoBloqueio = mot;
  if (status !== o.status) c.status = status;
  if (JSON.stringify(ag) !== JSON.stringify(normPessoa(o.aguardandoDe))) c.aguardandoDe = ag;
  if (val('f-prox') !== (o.proximaAcao || '')) c.proximaAcao = val('f-prox');
  if (!Object.keys(c).length) { fecharModal(); return; }
  salvarModal('editar', { id:id, campos:c }, 'Assunto atualizado.').then(function(){ preencherListas(); });
}

function salvarPonto(assuntoId, pontoId){
  var titulo = val('f-titulo'); if (!titulo) return msgModal('Descreva o ponto.');
  var resp = resolverPessoa(val('f-resp')); if (!resp) return msgModal('Todo ponto precisa de um responsável.');
  var status = val('f-status'), mot = val('f-mot');
  if ((status === 'bloqueado' || status === 'em_risco') && !mot) return msgModal('Diga o que está impedindo.');
  var ag = resolverPessoa(val('f-ag'));
  if (!pontoId) {
    salvarModal('criarPonto', { assuntoId:assuntoId, titulo:titulo, resumo:val('f-resumo'), responsavel:resp, prazo:val('f-prazo'),
      prioridade:val('f-prior'), criticidade:val('f-crit'), status:status, motivoBloqueio:mot, aguardandoDe:ag, proximaAcao:val('f-prox') }, 'Ponto aberto.')
      .then(function(d){ if (d) preencherListas(); });
    return;
  }
  var o = S.porId[pontoId], c = {};
  if (titulo !== o.titulo) c.titulo = titulo;
  if (val('f-resumo') !== (o.resumo || '')) c.resumo = val('f-resumo');
  if (resp.email !== (o.dono || '') || resp.nome !== (o.donoNome || nomePor(o.dono))) c.responsavel = resp;
  if (val('f-prazo') !== (o.prazo || '')) { c.prazo = val('f-prazo'); c.motivoPrazo = val('f-mprazo'); }
  if (val('f-prior') !== o.prioridade) c.prioridade = val('f-prior');
  if (val('f-crit') !== (o.criticidade || 'normal')) c.criticidade = val('f-crit');
  if (mot !== (o.motivoBloqueio || '')) c.motivoBloqueio = mot;
  if (status !== o.status) c.status = status;
  if (JSON.stringify(ag) !== JSON.stringify(normPessoa(o.aguardandoDe))) c.aguardandoDe = ag;
  if (val('f-prox') !== (o.proximaAcao || '')) c.proximaAcao = val('f-prox');
  if (!Object.keys(c).length) { fecharModal(); return; }
  salvarModal('editar', { id:pontoId, campos:c }, 'Ponto atualizado.').then(function(){ preencherListas(); });
}

function encerrar(id, forcar){
  var b = el('e-btn'); if (b) b.disabled = true;
  loader(true);
  apiPost('encerrar', { id:id, nota:val('e-nota'), evidencia:val('e-evid'), cancelar:!!(el('e-canc') && el('e-canc').checked), forcar:!!forcar })
    .then(function(d){ loader(false); fecharModal(); mesclar(d.resultado.itens || []); toast('Encerrado. O histórico fica guardado e dá para reabrir.', 'ok'); })
    .catch(function(e){

      if (e.codigo === 'PONTOS_ABERTOS') el('mod-msg').innerHTML = esc(e.message) + '<div><button class="btn warn" onclick="encerrar(\'' + id + '\',true)">Encerrar o assunto e os pontos abertos</button></div>';
      else msgModal(e.message);
    });
}
