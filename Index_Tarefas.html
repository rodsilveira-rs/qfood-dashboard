<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13213b">
<title>Caderno de Assuntos · Q Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13213b;--navy2:#1d2f52;--navy3:#28406b;--ntx:#dfe5f1;--nmu:#8e9bb8;
  --paper:#f4efe4;--paper2:#ebe3d3;--card:#fffdf7;--sheet:#faf6ec;
  --ink:#1d2433;--mu:#6c675b;--mu2:#9a9384;
  --line:rgba(70,55,25,.13);--line2:rgba(70,55,25,.26);
  --qf:#d9302a;--red:#c8312c;--org:#d9711c;--amb:#c98a0c;--yel:#e7ab1e;--ok:#2f8f58;--blue:#3567b5;--lil:#6a55c4;
  --red-bg:#fbe3df;--amb-bg:#fbefd3;--lil-bg:#ebe6f8;--ok-bg:#e2f1e6;--blue-bg:#e3ebf7;--gr-bg:#eeeae0;
  --fh:'Source Serif 4',Georgia,'Times New Roman',serif;--fb:'DM Sans',system-ui,-apple-system,sans-serif;
  --pgw:min(660px,46vw);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(40,64,107,.12)}
input[type=date]{color-scheme:light}
textarea{resize:vertical;min-height:76px;line-height:1.45}
input[type=checkbox]{width:auto;accent-color:var(--navy3)}

/* ── botões ── */
.btn{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font-size:.86rem;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--mu2);background:#fff}
.btn.pri{background:var(--qf);border-color:var(--qf);color:#fff}
.btn.pri:hover{filter:brightness(1.07);background:var(--qf)}
.btn.warn{background:var(--amb-bg);border-color:rgba(201,138,12,.45);color:#8a5d00}
.btn.okb{background:var(--ok-bg);border-color:rgba(47,143,88,.4);color:#1f6b40}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}
.btn.ghost:hover{background:var(--paper2)}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:wait}
.lk{background:none;border:none;color:var(--navy3);font-size:.8rem;font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* ── estrutura ── */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.fich{background:var(--navy);color:var(--ntx);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:50}
.marca{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.marca .lg{background:#fff;border-radius:10px;width:42px;height:42px;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca .lg img{width:100%;height:100%;object-fit:contain}
.marca b{display:block;font-family:var(--fh);font-size:1.12rem;color:#fff;line-height:1.1}
.marca span{font-size:.76rem;color:var(--nmu)}
.fich-nav{flex:1;overflow-y:auto;padding:4px 12px 16px}
.fich-sec{font-size:.64rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--nmu);padding:16px 10px 6px}
.af{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:transparent;border-radius:9px;text-align:left;font-size:.9rem;color:var(--ntx)}
.af:hover{background:rgba(255,255,255,.06);color:#fff}
.af.on{background:var(--navy3);color:#fff;box-shadow:inset 3px 0 0 var(--qf)}
.af .i{width:20px;text-align:center;flex-shrink:0;font-size:.95rem}
.af .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af .t small{color:var(--nmu);font-size:.7rem}
.af .n{font-size:.7rem;font-weight:700;border-radius:10px;padding:1px 8px;background:rgba(255,255,255,.1);color:var(--ntx)}
.af .n.red{background:var(--qf);color:#fff}
.fich-pe{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:10px}
.fich-pe .btn.pri{padding:12px 14px;font-size:.95rem;border-radius:12px;box-shadow:0 6px 18px rgba(217,48,42,.35)}
.fich-pe .eu{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--nmu)}
.fich-pe .eu span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fich-pe .eu button{background:rgba(255,255,255,.08);border:none;border-radius:8px;padding:6px 9px;color:var(--ntx)}
.veu-f{display:none}

.col{min-width:0;transition:margin-right .2s}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(244,239,228,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .busca{flex:1;max-width:520px}
.top .busca input{background:var(--card);border-radius:11px;padding:10px 13px}
.top .m-only{display:none}
.top-ttl{display:none}
.main{padding:22px 28px 80px;max-width:1120px}

/* ── cabeçalho da lista ── */
.lst-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lst-h h2{font-family:var(--fh);font-size:2.1rem;font-weight:700;line-height:1.05;letter-spacing:-.3px}
.lst-h p{font-size:.88rem;color:var(--mu);margin-top:5px}
.lst-h .cnt{font-size:.82rem;color:var(--mu)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid rgba(53,103,181,.3);color:var(--blue);border-radius:20px;padding:4px 10px;font-size:.78rem;font-weight:600}
.fchip button{background:none;border:none;color:inherit;font-weight:800}
.busca.m{display:none}

/* resumo do dia */
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.rk{border-radius:14px;padding:14px 16px;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;gap:12px;transition:transform .12s}
.rk:hover{transform:translateY(-1px)}
.rk .ri{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;background:rgba(255,255,255,.65)}
.rk b{display:block;font-family:var(--fh);font-size:1.7rem;line-height:1}
.rk span{display:block;font-size:.8rem;font-weight:600;margin-top:3px}
.rk em{display:block;font-style:normal;font-size:.72rem;opacity:.8;margin-top:1px}
.rk.r{background:var(--red-bg);color:#9c2420}.rk.a{background:var(--amb-bg);color:#80590a}.rk.o{background:#fde7d3;color:#93470c}.rk.l{background:var(--lil-bg);color:#46368f}
.grupo{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-size:1.08rem;font-weight:700;color:var(--ink);margin:24px 0 10px}
.grupo:first-of-type{margin-top:6px}
.grupo .gn{font-family:var(--fb);font-size:.72rem;font-weight:700;background:var(--paper2);color:var(--mu);border-radius:10px;padding:1px 8px}
.grupo:after{content:'';flex:1;height:1px;background:var(--line)}

/* ── ficha (cartão do fichário) ── */
.ficha{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 0 rgba(70,55,25,.05),0 6px 16px -10px rgba(70,55,25,.25);transition:transform .12s,box-shadow .12s}
.ficha:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(70,55,25,.05),0 12px 24px -12px rgba(70,55,25,.35)}
.ficha.sel{outline:2px solid var(--navy3);outline-offset:1px}
.ficha .aba{width:9px;flex-shrink:0;border-radius:14px 0 0 14px;background:var(--aba)}
.ficha .aba:after{content:'';position:absolute;left:-5px;top:18px;width:6px;height:30px;border-radius:4px 0 0 4px;background:var(--aba)}
.ficha .fc{padding:14px 18px 13px 16px;min-width:0;flex:1}
.ficha .chev{align-self:center;color:var(--mu2);font-size:1.3rem;padding:0 14px 0 4px}
.l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.cod{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:var(--mu2);margin-left:auto}
.ficha h3{font-family:var(--fh);font-size:1.22rem;font-weight:700;line-height:1.25;letter-spacing:-.1px}
.aviso{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;line-height:1.4;border-radius:9px;padding:7px 11px;margin-top:9px}
.aviso.r{background:var(--red-bg);color:#9c2420}
.aviso.a{background:var(--amb-bg);color:#7a5408}
.rodape{display:grid;grid-template-columns:minmax(130px,.8fr) minmax(0,1.6fr) minmax(130px,.9fr);margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.rodape .cel{min-width:0;padding:0 12px;border-left:1px solid var(--line)}
.rodape .cel:first-child{padding-left:0;border-left:none}
.rodape small{display:block;font-size:.68rem;color:var(--mu2);font-weight:600;margin-bottom:3px}
.rodape .v{font-size:.86rem;line-height:1.35;display:flex;align-items:center;gap:7px}
.rodape .v.vazio-v{color:var(--mu2);font-style:italic}
.rodape .mini{display:block;font-size:.74rem;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd{font-size:.72rem;color:var(--mu2);margin-top:9px}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.2px}
.av.xs{width:21px;height:21px;font-size:.55rem}
.av.ext{background:#fff!important;color:#8a5d00;border:1.5px dashed #c98a0c}

/* selos */
.st{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 10px;border:1px solid}
.st-pendente{color:#5c5649;background:var(--gr-bg);border-color:rgba(92,86,73,.25)}
.st-em_andamento{color:#1f6b40;background:var(--ok-bg);border-color:rgba(47,143,88,.35)}
.st-bloqueado{color:#8a5d00;background:var(--amb-bg);border-color:rgba(201,138,12,.5)}
.st-em_risco{color:#93470c;background:#fde7d3;border-color:rgba(217,113,28,.45)}
.st-concluido{color:var(--blue);background:var(--blue-bg);border-color:rgba(53,103,181,.35)}
.st-cancelado{color:#6c675b;background:var(--gr-bg);border-color:rgba(92,86,73,.25);text-decoration:line-through}
.sn{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;border-radius:20px;padding:3px 9px;background:var(--gr-bg);color:var(--mu);white-space:nowrap}
.sn.r{background:var(--red-bg);color:#9c2420}
.sn.o{background:#fde7d3;color:#93470c}
.sn.a{background:var(--amb-bg);color:#7a5408}
.sn.l{background:var(--lil-bg);color:#46368f}
.sn.l.forte{background:#d9d0f5;color:#33267a}
.sn.crit{background:var(--red);color:#fff}
.sn.reu{background:#dff1f4;color:#0f6574}
.vazio{text-align:center;color:var(--mu);padding:48px 16px;border:1.5px dashed var(--line2);border-radius:16px;line-height:1.6;background:rgba(255,253,247,.5)}
.vazio b{display:block;font-size:2rem;margin-bottom:6px}
.bloq-tela{max-width:480px;margin:70px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 26px;line-height:1.55}
.bloq-tela h2{font-family:var(--fh);margin-bottom:10px}

/* ── agenda ── */
.dia-nav{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.dia-nav .seta{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:1.1rem}
.dia-nav .dia{min-width:200px;text-align:center}
.dia-nav .dia b{display:block;font-family:var(--fh);font-size:1.35rem}
.dia-nav .dia span{font-size:.8rem;color:var(--mu)}
.ag-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.ag-row:hover{border-color:var(--line2)}
.ag-row .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.ag-row .ac{flex:1;min-width:0}
.ag-row .ac b{display:block;font-size:.92rem;font-weight:600;line-height:1.3}
.ag-row .ac span{display:block;font-size:.76rem;color:var(--mu);margin-top:2px}
.ag-row .ac i{font-style:normal;color:var(--lil);font-weight:600}
.ag-dia{font-size:.78rem;font-weight:700;color:var(--mu);text-transform:capitalize;margin:14px 0 6px}

/* ── página do assunto (folha) ── */
.veu{position:fixed;inset:0;background:rgba(19,33,59,.35);z-index:80;opacity:0;pointer-events:none;transition:opacity .15s}
.veu.on{opacity:1;pointer-events:auto}
.pagina{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);background:var(--sheet);border-left:1px solid var(--line2);z-index:90;overflow-y:auto;transform:translateX(102%);transition:transform .2s;box-shadow:-24px 0 50px rgba(19,33,59,.18)}
.pagina.on{transform:none}
.pg-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:11px 22px;background:rgba(250,246,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.pg-top .tp{font-size:.78rem;color:var(--mu)}
.pg-top .x{margin-left:auto;background:var(--card);border:1px solid var(--line2);border-radius:50%;width:34px;height:34px;font-size:.9rem;flex-shrink:0}
.volta{background:none;border:none;color:var(--navy3);font-weight:700;font-size:.85rem;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pg{padding:18px 26px 50px}
.pg h2{font-family:var(--fh);font-size:1.75rem;font-weight:700;line-height:1.2;margin:4px 0 4px;letter-spacing:-.2px}
.pg .sub{font-size:.8rem;color:var(--mu);margin-bottom:14px}
.agora{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin-bottom:14px}
.agora .ag-c{background:var(--card);padding:11px 14px;min-width:0}
.agora .ag-c.full{grid-column:1/-1}
.agora small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mu2);margin-bottom:4px}
.agora .ag-v{font-size:.95rem;font-weight:600;line-height:1.35}
.agora .ag-v.mu{color:var(--mu2);font-weight:500;font-style:italic}
.agora .ag-s{font-size:.76rem;color:var(--mu);margin-top:2px}
.agora .ag-a{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.agora select{width:auto;padding:6px 10px;font-weight:600}
.agora.cab{border-color:transparent}
.agora .ag-c.st-c{border-left:5px solid var(--aba)}
.acoes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.sec{margin-top:22px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--fh);font-size:1.05rem;font-weight:700;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec-t .lk{font-family:var(--fb)}
.texto{white-space:pre-wrap;line-height:1.6;font-size:.92rem;color:#353b48}
.grid-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.gm small{display:block;font-size:.68rem;color:var(--mu2);font-weight:600}
.gm b{display:block;font-size:.88rem;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.papel{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line)}
.papel:last-child{border-bottom:none}
.papel>small{width:138px;flex-shrink:0;font-size:.74rem;color:var(--mu);font-weight:600;padding-top:6px}
.papel .pl{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:3px 11px 3px 3px;font-size:.82rem}
.pchip .av{width:24px;height:24px;font-size:.62rem}
.pchip em{font-style:normal;font-size:.7rem;color:var(--mu2)}
.pchip button{background:none;border:none;color:var(--mu);font-weight:800;margin-left:2px}
.pt{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:7px;cursor:pointer}
.pt:hover{border-color:var(--line2)}
.pt .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#fff}
.pt.fech .ck{background:var(--ok);border-color:var(--ok)}
.pt.canc .ck{background:var(--mu2);border-color:var(--mu2)}
.pt .pc{flex:1;min-width:0}
.pt .pc b{display:block;font-size:.9rem;font-weight:600}
.pt .pc span{font-size:.75rem;color:var(--mu)}
.pt.fech b,.pt.canc b{text-decoration:line-through;color:var(--mu)}
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rel .rc{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:.8rem;cursor:pointer}
.rel .rc button{background:none;border:none;color:var(--mu);font-weight:800}
.rel select{width:auto;max-width:100%;padding:6px 10px;font-size:.82rem}
.reu-box{background:#eef7f8;border:1px solid rgba(15,101,116,.25);border-radius:12px;padding:12px 14px;font-size:.88rem;line-height:1.6;margin-bottom:14px}
/* linha do tempo */
.tl{position:relative;padding-left:26px;margin-top:14px}
.tl:before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.te{position:relative;margin-bottom:13px}
.te:before{content:attr(data-i);position:absolute;left:-27px;top:-1px;width:21px;height:21px;border-radius:50%;background:var(--sheet);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:.66rem}
.te:first-child:before{border-color:var(--qf);box-shadow:0 0 0 3px rgba(217,48,42,.12)}
.te .q{font-size:.72rem;color:var(--mu2)}
.te .q b{color:var(--ink);font-weight:600}
.te.ev .tx{font-size:.85rem;color:#3f4552;margin-top:1px}
.te.com .tx{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;margin-top:4px}
.te.com.meu .tx{border-left:3px solid var(--qf)}
.te .men{font-size:.72rem;color:var(--lil);margin-top:3px}
.com-f{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.com-f textarea{min-height:60px;border-color:var(--line)}
.com-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.com-l input{flex:1;min-width:140px;width:auto;padding:7px 10px}
.chips-ed{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* ── modais ── */
.mod-ov{position:fixed;inset:0;z-index:120;background:rgba(19,33,59,.45);display:none;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
.mod-ov.on{display:flex}
.mod{background:var(--sheet);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:640px;padding:22px 24px;margin:auto;box-shadow:0 24px 70px rgba(19,33,59,.35)}
.mod h3{font-family:var(--fh);font-size:1.35rem;font-weight:700}
.mod-sub{font-size:.84rem;color:var(--mu);margin:3px 0 12px}
.mod label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin:13px 0 5px}

<script>
/* ============================================================
   Q FOOD — CADERNO DE ASSUNTOS (Index_Tarefas_v2 · visual fichário)
   Backend: Code_Tarefas2.gs · rota ?modulo=tarefas
   Sem CSV: tudo vem do Apps Script (boot + itens).
   ?demo=1 abre com dados de exemplo (nada é gravado).
   As permissões (quem vê / quem edita) são conferidas no backend;
   aqui no navegador elas só escondem botões.
   ============================================================ */
'use strict';
var API_URL = 'https://script.google.com/macros/s/AKfycbwf1CiH6UJfSu2__BgpIz3apWfM8UeNSRniWW4b-Zb4KUUdQBHeQhedUZddr29zDXMeqw/exec';
var REFRESH_MS = 60000;
var ABERTOS = ['pendente','em_andamento','bloqueado','em_risco'];
var ROT = { pendente:'Pendente', em_andamento:'Em andamento', bloqueado:'Bloqueado', em_risco:'Em risco', concluido:'Concluído', cancelado:'Cancelado' };
var PRIOR = { alta:'Alta', media:'Média', baixa:'Baixa' };
var CRIT = { normal:'Normal', importante:'Importante', critica:'Crítica' };
var AREAS = ['Comercial','Marketing','E-commerce','Logística','Frota','Expedição','Estoque','Compras','Financeiro','RH','Administrativo','TI','Restaurantes','Mercearia','Gogui','Sushi Trip','Obras e manutenção','Outros'];
var FAROL = {
  atrasado:{ c:'#c8312c', t:'Atrasado' },    bloq:{ c:'#e7ab1e', t:'Bloqueado' },
  hoje:{ c:'#d9711c', t:'Vence hoje' },      risco:{ c:'#d9711c', t:'Em risco' },
  breve:{ c:'#e7ab1e', t:'Vence em breve' }, ok:{ c:'#2f8f58', t:'No prazo' },
  sem:{ c:'#b9b19f', t:'Sem prazo' },        fechado:{ c:'#3567b5', t:'Encerrado' }
};
var RANK = { atrasado:0, bloq:1, hoje:2, risco:3, breve:4, ok:5, sem:6, fechado:7 };
var VIEWS = [
  { id:'hoje',       ico:'☀️', t:'Hoje',                    d:'O que pede atenção agora. Cada assunto aparece uma vez, com todos os sinais.' },
  { id:'agenda',     ico:'📅', t:'Agenda',                  d:'Vencimentos por dia — assuntos e pontos.' },
  { id:'meus',       ico:'🙋', t:'Comigo',                  d:'Você é responsável, está envolvido ou alguém aguarda retorno seu.' },
  { id:'aguardando', ico:'⏳', t:'Aguardando retorno',      d:'Parados esperando a resposta de alguém.' },
  { id:'bloqueados', ico:'⛔', t:'Bloqueados',              d:'Bloqueados ou em risco — com o motivo.' },
  { id:'alta',       ico:'🚩', t:'Prioridades',             d:'Prioridade alta ou criticidade crítica.' },
  { id:'abertos',    ico:'📒', t:'Todos os abertos',        d:'Tudo o que está em andamento no grupo.' },
  { id:'reunioes',   ico:'🤝', t:'Compromissos de reunião', d:'Vindos das reuniões do Checkpoint. O status é tratado lá.' },
  { id:'concluidos', ico:'✅', t:'Concluídos',              d:'Encerrados como concluídos. O histórico fica guardado e dá para reabrir.' },
  { id:'cancelados', ico:'🚫', t:'Cancelados',              d:'Encerrados sem acontecer. Cancelar não é concluir.' },
  { id:'arquivados', ico:'🗄', t:'Arquivo',                 d:'Assuntos arquivados — guardados, fora das listas.' }
];
var TABS = [['hoje','☀️','Hoje'],['agenda','📅','Agenda'],['abertos','📒','Assuntos'],['meus','🙋','Comigo'],['_menu','☰','Mais']];
var AV_CORES = ['#3567b5','#2f8f58','#8b5cf6','#c2410c','#0f766e','#b45309','#9d174d','#475569','#1d4ed8','#7c3aed'];

var S = { me:null, gestores:[], externos:[], itens:[], porId:{}, view:'hoje', fPessoa:'', fArea:'', q:'', dia:'',
          aberto:null, demo:false, carregado:false, pessoasLista:[], areasLista:[], nomes:[] };
var CH = { env:[], cit:[] };   /* listas de pessoas em edição (envolvidos do formulário, citações do comentário) */

/* ─────────────── utilidades ─────────────── */
function el(id){ return document.getElementById(id); }
function val(id){ var e = el(id); return e ? String(e.value || '').trim() : ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hojeIso(){ return isoDe(new Date()); }
function somaDias(iso, n){ var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDe(d); }
function isoBR(iso){ var p = String(iso || '').substring(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function diasAte(iso){ if (!iso) return null; var a = new Date(String(iso).substring(0, 10) + 'T12:00:00'), b = new Date(hojeIso() + 'T12:00:00'); return isNaN(a) ? null : Math.round((a - b) / 864e5); }
function diasDesde(ts){ var d = new Date(ts); return isNaN(d) ? 0 : Math.floor((Date.now() - d) / 864e5); }
function ehHoje(ts){ var d = new Date(ts); return !isNaN(d) && isoDe(d) === hojeIso(); }
function prazoTxt(iso){
  var d = diasAte(iso); if (d == null) return 'sem prazo';
  if (d < 0) return 'atrasado há ' + (-d) + (d === -1 ? ' dia' : ' dias');
  if (d === 0) return 'vence hoje';
  if (d === 1) return 'amanhã';
  if (d < 7) return diaSemana(iso) + ', ' + isoBR(iso).substring(0, 5);
  return 'até ' + isoBR(iso);
}
function diaSemana(iso){ return new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'long' }).replace('-feira', ''); }
function diaLongo(iso){ var s = new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
function diaRotulo(iso){ var d = diasAte(iso); if (d === 0) return 'Hoje'; if (d === 1) return 'Amanhã'; if (d === -1) return 'Ontem'; var s = diaSemana(iso); return s.charAt(0).toUpperCase() + s.slice(1); }
function relativo(ts){
  if (!ts) return ''; var d = new Date(ts); if (isNaN(d)) return '';
  var s = (Date.now() - d) / 1000;
  if (s < 60) return 'agora';
  if (s < 3600) return 'há ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'há ' + Math.floor(s / 3600) + 'h';
  if (s < 86400 * 7) { var n = Math.floor(s / 86400); return 'há ' + n + (n === 1 ? ' dia' : ' dias'); }
  return 'em ' + d.toLocaleDateString('pt-BR');
}
function dataHora(ts){ var d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); }
function toast(msg, tipo){
  var t = el('toast'); t.textContent = msg; t.className = 'toast on ' + (tipo || '');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = 'toast'; }, 4200);
}
function loader(on){ el('loader').classList.toggle('on', !!on); }
function iniciais(nome){ var p = String(nome || '?').trim().split(/\s+/); return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase(); }
function corDe(nome){ var h = 0, s = norm(nome); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return AV_CORES[h % AV_CORES.length]; }
function avHTML(nome, ext, cls){ return '<span class="av' + (ext ? ' ext' : '') + (cls ? ' ' + cls : '') + '" style="background:' + corDe(nome) + '" title="' + esc(nome) + (ext ? ' · fora do sistema' : '') + '">' + esc(iniciais(nome)) + '</span>'; }
function lev(a, b){
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  var v0 = [], v1 = [], i, j;
  for (i = 0; i <= b.length; i++) v0[i] = i;
  for (i = 0; i < a.length; i++) {
    v1[0] = i + 1;
    for (j = 0; j < b.length; j++) v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + (a[i] === b[j] ? 0 : 1));
    for (j = 0; j <= b.length; j++) v0[j] = v1[j];
  }
  return v1[b.length];
}

/* ─────────────── domínio ─────────────── */
function ehPonto(o){ return o.tipo === 'ponto'; }
function aberto(o){ return ABERTOS.indexOf(o.status || 'pendente') >= 0; }
function assuntos(){ return S.itens.filter(function(x){ return x.tipo !== 'ponto'; }); }
function pontosDe(id){ return S.itens.filter(function(x){ return x.tipo === 'ponto' && x.assuntoId === id && !x.arquivado; }); }
function nomePor(email){
  if (!email) return '';
  var g = S.gestores.filter(function(x){ return x.email === email; })[0];
  return g ? g.nome : email.split('@')[0];
}
function chavePessoa(p){ return p ? (p.email || ('n:' + norm(p.nome))) : ''; }
function pessoasDoItem(o){
  var L = [];
  if (o.dono || o.donoNome) L.push({ email:o.dono || '', nome:o.donoNome || nomePor(o.dono), papel:'resp' });
  (o.envolvidos || []).forEach(function(p){ if (p) L.push({ email:p.email || '', nome:p.nome || nomePor(p.email), papel:'env' }); });
  if (o.aguardandoDe && (o.aguardandoDe.nome || o.aguardandoDe.email)) L.push({ email:o.aguardandoDe.email || '', nome:o.aguardandoDe.nome || nomePor(o.aguardandoDe.email), papel:'ag' });
  return L;
}
/* soAbertos=true: só pontos abertos (para "Comigo"); senão inclui pontos encerrados (histórico preservado) */
function pessoasDoAssunto(a, soAbertos){
  var L = pessoasDoItem(a);
  pontosDe(a.id).filter(function(p){ return !soAbertos || aberto(p); }).forEach(function(p){ L = L.concat(pessoasDoItem(p)); });
  return L;
}
function envolveMe(a){ var me = S.me.email; return pessoasDoAssunto(a, true).some(function(p){ return p.email === me; }); }
function podeEditar(o){
  if (!S.me || S.demo) return !!S.me;
  if (S.me.admin) return true;
  var e = S.me.email;
  if (o.dono === e || o.criadoPor === e) return true;
  if ((o.responsaveis || []).indexOf(e) >= 0) return true;
  if (ehPonto(o) && S.porId[o.assuntoId]) return podeEditar(S.porId[o.assuntoId]);
  return false;
}
function farol(o){
  if (!aberto(o)) return 'fechado';
  var d = diasAte(o.prazo);
  if (d != null && d < 0) return 'atrasado';
  if (o.status === 'bloqueado') return 'bloq';
  if (d === 0) return 'hoje';
  if (o.status === 'em_risco') return 'risco';
  if (d == null) return 'sem';
  if (d <= 2) return 'breve';
  return 'ok';
}
function farolAssunto(a){
  var f = farol(a); if (!aberto(a)) return f;
  pontosDe(a.id).filter(aberto).forEach(function(p){ var g = farol(p); if (RANK[g] < RANK[f]) f = g; });
  return f;
}
/* desde quando se aguarda o retorno (último evento "aguardando" do histórico) */
function aguardDesde(o){
  var h = o.historico || [];
  for (var i = h.length - 1; i >= 0; i--) if (h[i].tipo === 'aguardando') return h[i].ts;
  return o.atualizadoEm || o.criadoEm || '';
}
/* itens ativos do assunto: ele mesmo (se aberto) + pontos abertos */
function ativos(a){ return aberto(a) ? [a].concat(pontosDe(a.id).filter(aberto)) : []; }
/* todos os sinais de um assunto, separados (um assunto pode ter vários ao mesmo tempo) */
function sinais(a){
  var ps = pontosDe(a.id), abP = ps.filter(aberto);
  var s = { atrasado:0, hoje:0, amanha:0, bloq:0, bloqP:0, riscoP:0, crit:0, aguard:0, aguardNomes:[], aguardDias:0,
            pontosAbertos:abP.length, pontosTotal:ps.length };
  ativos(a).forEach(function(x){
    var d = diasAte(x.prazo);
    if (d != null && d < 0) s.atrasado++;
    if (d === 0) s.hoje++;
    if (d === 1) s.amanha++;
    if (x.status === 'bloqueado' || x.status === 'em_risco') s.bloq++;
    if (x !== a && x.status === 'bloqueado') s.bloqP++;
    if (x !== a && x.status === 'em_risco') s.riscoP++;
    if (x.criticidade === 'critica') s.crit++;
    if (x.aguardandoDe && x.aguardandoDe.nome) {
      s.aguard++;
      if (s.aguardNomes.indexOf(x.aguardandoDe.nome) < 0) s.aguardNomes.push(x.aguardandoDe.nome);
      s.aguardDias = Math.max(s.aguardDias, diasDesde(aguardDesde(x)));
    }
  });
  return s;
}
/* o vencimento mais urgente entre o assunto e seus pontos abertos */
function proxVenc(a){
  var L = ehPonto(a) ? (aberto(a) ? [a] : []) : ativos(a);
  L = L.filter(function(x){ return x.prazo; }).sort(function(x, y){ return x.prazo.localeCompare(y.prazo); });
  return L[0] ? { prazo:L[0].prazo, item:L[0] } : null;
}
function atencao(s){ return !!(s.atrasado || s.hoje || s.bloq || s.crit || s.aguard); }
function passaView(a, v){
  if (v === 'arquivados') return !!a.arquivado;
  if (a.arquivado) return false;
  if (v === 'concluidos') return a.status === 'concluido';
  if (v === 'cancelados') return a.status === 'cancelado';
  if (!aberto(a)) return false;
  var s = sinais(a);
  if (v === 'hoje') return atencao(s);
  if (v === 'agenda') { var pv = proxVenc(a); return !!(pv && diasAte(pv.prazo) <= 0); }
  if (v === 'meus') return envolveMe(a);
  if (v === 'aguardando') return s.aguard > 0;
  if (v === 'bloqueados') return s.bloq > 0;
  if (v === 'alta') return a.prioridade === 'alta' || s.crit > 0;
  if (v === 'reunioes') return !!a.reuniao;
  return true;
}
function passaFiltros(a){
  if (S.fArea && (a.area || 'Sem área') !== S.fArea) return false;
  if (S.fPessoa && !pessoasDoAssunto(a, false).some(function(p){ return chavePessoa(p) === S.fPessoa; })) return false;
  if (S.q) {
    var hay = norm([a.id, a.origem, a.titulo, a.resumo, a.area, a.proximaAcao, a.motivoBloqueio]
      .concat(pessoasDoAssunto(a, false).map(function(p){ return p.nome; }))
      .concat(pontosDe(a.id).map(function(p){ return p.titulo + ' ' + p.id; })).join(' '));
    if (norm(S.q).split(/\s+/).some(function(t){ return t && hay.indexOf(t) < 0; })) return false;
  }
  return true;
}
function ordenar(lista){
  if (S.view === 'concluidos' || S.view === 'cancelados') return lista.sort(function(a, b){ return String(b.encerradoEm || b.atualizadoEm).localeCompare(String(a.encerradoEm || a.atualizadoEm)); });
  if (S.view === 'arquivados') return lista.sort(function(a, b){ return String(b.atualizadoEm).localeCompare(String(a.atualizadoEm)); });
  return lista.sort(function(a, b){
    var fa = RANK[farolAssunto(a)], fb = RANK[farolAssunto(b)]; if (fa !== fb) return fa - fb;
    var x = proxVenc(a), y = proxVenc(b), pa = x ? x.prazo : '9999', pb = y ? y.prazo : '9999'; if (pa !== pb) return pa.localeCompare(pb);
    return String(b.atualizadoEm).localeCompare(String(a.atualizadoEm));
  });
}
function resolverPessoa(txt){
  txt = String(txt || '').trim(); if (!txt) return null;
  var t = norm(txt);
  var g = S.gestores.filter(function(x){ return norm(x.nome) === t || x.email === txt.toLowerCase(); })[0];
  if (g) return { email:g.email, nome:g.nome };
  var ja = S.nomes.filter(function(n){ return norm(n) === t; })[0];   /* mesma grafia já usada */
  return { email:'', nome:ja || txt };
}
function pessoaTxt(p){ return p ? (p.nome || nomePor(p.email)) : ''; }

/* nome parecido com alguém que já existe? (Gleydson × Gledson, "Gledson da obra") */
function nomeParecido(txt){
  var t = norm(txt); if (t.length < 3) return null;
  var achou = null;
  S.nomes.some(function(n){
    var nn = norm(n); if (!nn) return false;
    if (nn === t) { achou = null; return true; }
    var lim = nn.length >= 6 ? 2 : 1;
    if ((t.length >= 4 && nn.indexOf(t + ' ') === 0) || t.indexOf(nn + ' ') === 0 || lev(t, nn) <= lim || lev(t.split(' ')[0], nn) <= (lim - 1)) { if (!achou) achou = n; }
    return false;
  });
  return S.nomes.some(function(n){ return norm(n) === t; }) ? null : achou;
}
function avisoNome(inp){
  var host = inp.closest('.addl') || inp.closest('.com-l') || inp.closest('.np-row') || inp;
  var prox = host.nextElementSibling;
  if (prox && prox.classList.contains('hint-nome')) prox.remove();
  var c = nomeParecido(inp.value); if (!c) return;
  var d = document.createElement('div'); d.className = 'hint-nome';
  d.innerHTML = 'Já existe <b>' + esc(c) + '</b> no caderno — é a mesma pessoa? <button type="button" class="lk">usar “' + esc(c) + '”</button>';
  d.querySelector('button').onclick = function(){ inp.value = c; d.remove(); };
  host.insertAdjacentElement('afterend', d);
}
function confirmaNome(txt){
  var c = nomeParecido(txt); if (!c) return txt;
  return confirm('Já existe "' + c + '" no caderno.\n\nOK = usar "' + c + '"\nCancelar = manter "' + txt + '" como outra pessoa') ? c : txt;
}
document.addEventListener('change', function(e){ var t = e.target; if (t && t.getAttribute && t.getAttribute('list') === 'dl-pessoas') avisoNome(t); });

/* ─────────────── API ─────────────── */
function apiGet(action){
  return fetch(API_URL + '?modulo=tarefas&action=' + action + '&email=' + encodeURIComponent(S.me.email) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ if (!d.ok) { var e = new Error(d.error || 'Erro ao ler a base de dados'); e.codigo = d.codigo; throw e; } return d; });
}
function apiPost(action, payload){
  if (S.demo) return Promise.reject(new Error('Modo demonstração: nada é gravado.'));
  var body = 'action=' + encodeURIComponent(action) + '&email=' + encodeURIComponent(S.me.email) + '&payload=' + encodeURIComponent(JSON.stringify(payload || {}));
  return fetch(API_URL + '?modulo=tarefas', { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' }, body:body })
    .then(function(r){ if (!r.ok) throw new Error('Falha de conexão (' + r.status + ')'); return r.json(); })
    .then(function(d){ if (!d.ok) { var e = new Error(d.error || 'Erro ao gravar'); e.codigo = d.codigo || ''; throw e; } return d; });
}
/* grava, mescla o retorno na tela; em erro mostra o aviso e devolve null */
function post(action, payload, okMsg, silencioso){
  loader(true);
  return apiPost(action, payload).then(function(d){
    loader(false);
    mesclar((d.resultado && d.resultado.itens) || []);
    if (okMsg) toast(okMsg, 'ok');
    return d;
  }).catch(function(e){
    loader(false);
    if (silencioso) throw e;
    toast(e.message, 'error');
    return null;
  });
}
function mesclar(itens){
  itens.forEach(function(n){
    var i = -1;
    for (var k = 0; k < S.itens.length; k++) if (S.itens[k].id === n.id) { i = k; break; }
    if (i >= 0) S.itens[i] = n; else S.itens.push(n);
  });
  indexar(); renderTudo();
}
function indexar(){
  S.porId = {};
  S.itens.forEach(function(o){ S.porId[o.id] = o; });
}

/* ─────────────── carga ─────────────── */
function carregar(){
  loader(true);
  apiGet('boot').then(function(d){
    loader(false);
    S.me = d.me; S.gestores = d.gestores || []; S.externos = d.pessoasExternas || []; S.itens = d.itens || [];
    S.carregado = true;
    indexar(); preencherListas(); renderTudo();
    el('usr').textContent = S.me.nome + (S.me.admin ? ' · admin' : '');
    el('btn-novo').style.display = ''; el('fab').style.display = '';
    abrirLinkPendente();
  }).catch(function(e){
    loader(false);
    el('fich').innerHTML = '';
    el('main').innerHTML = '<div class="bloq-tela"><h2>🔒 Não foi possível abrir</h2><p>' + esc(e.message) + '</p><p style="margin-top:14px"><button class="btn pri" onclick="location.href=\'Index_Menu.html\'">Voltar ao menu</button> <button class="btn" onclick="carregar()">Tentar de novo</button></p></div>';
  });
}
function atualizar(){
  if (S.demo || !S.carregado || document.visibilityState === 'hidden' || modalAberto() || digitando()) return;
  apiGet('itens').then(function(d){
    S.itens = d.itens || []; indexar(); renderTudo();
  }).catch(function(){});
}
function digitando(){
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q' && a.id !== 'q-m') return true;
  var c = el('c-txt'); return !!(c && c.value.trim());
}
function preencherListas(){
  var nomes = {};
  S.gestores.forEach(function(g){ nomes[g.nome] = 1; });
  S.externos.forEach(function(n){ nomes[n] = 1; });
  S.itens.forEach(function(o){ pessoasDoItem(o).forEach(function(p){ if (p.nome) nomes[p.nome] = 1; }); });
  S.nomes = Object.keys(nomes).sort(function(a, b){ return a.localeCompare(b); });
  el('dl-pessoas').innerHTML = S.nomes.map(function(n){ return '<option value="' + esc(n) + '">'; }).join('');
  var ar = {}; AREAS.forEach(function(a){ ar[a] = 1; }); S.itens.forEach(function(o){ if (o.area) ar[o.area] = 1; });
  el('dl-areas').innerHTML = Object.keys(ar).sort().map(function(a){ return '<option value="' + esc(a) + '">'; }).join('');
}
function abrirLinkPendente(){
  var h = location.hash;
  try { if (!h) h = localStorage.getItem('tar_link_pendente') || ''; localStorage.removeItem('tar_link_pendente'); } catch(e){}
  var m = h.match(/#a=([^&]+)/);

function renderTabs(){

function setPessoa(i){ var p = S.pessoasLista[i]; S.fPessoa = (p && S.fPessoa !== p.k) ? p.k : ''; S.fPessoaNome = p ? p.nome : ''; if (S.fPessoa && ['arquivados','concluidos','cancelados','agenda'].indexOf(S.view) < 0) S.view = 'abertos'; menuFich(false); renderTudo(); }
function setArea(i){ var a = S.areasLista[i]; S.fArea = (a && S.fArea !== a.nome) ? a.nome : ''; if (S.fArea && ['arquivados','concluidos','cancelados','agenda'].indexOf(S.view) < 0) S.view = 'abertos'; menuFich(false); renderTudo(); }
function buscar(t){ S.q = String(t || '').trim(); var a = el('q'), b = el('q-m'); if (a && a.value !== t) a.value = t; if (b && b.value !== t) b.value = t; renderLista(); }
function abrirBuscaM(){ var b = el('q-m'); if (b) { b.parentNode.classList.remove('fech'); b.focus(); window.scrollTo({ top:0 }); } }

/* ─────────────── lista de fichas ─────────────── */
function renderLista(){
  if (!S.carregado) return;
  var v = VIEWS.filter(function(x){ return x.id === S.view; })[0];
  var h = '<div class="busca m' + (S.q ? '' : ' fech') + '"><input type="search" id="q-m" placeholder="🔎  Buscar assunto, pessoa, código…" value="' + esc(S.q) + '" oninput="buscar(this.value)"></div>';
  var f = [];
  if (S.fPessoa) f.push('<span class="fchip">👤 ' + esc(S.fPessoaNome || '') + ' <button onclick="S.fPessoa=\'\';renderTudo()">×</button></span>');
  if (S.fArea) f.push('<span class="fchip">🏷 ' + esc(S.fArea) + ' <button onclick="S.fArea=\'\';renderTudo()">×</button></span>');
  if (S.q) f.push('<span class="fchip">🔎 ' + esc(S.q) + ' <button onclick="buscar(\'\')">×</button></span>');
  var filtrosH = f.length ? '<div class="filtros">' + f.join('') + '</div>' : '';

  if (S.view === 'hoje') { h += renderHoje(filtrosH); }
  else if (S.view === 'agenda') { h += renderAgenda(filtrosH); }
  else {
    var lista = ordenar(assuntos().filter(function(a){ return passaView(a, S.view) && passaFiltros(a); }));
    h += '<div class="lst-h"><div><h2>' + v.t + '</h2><p>' + v.d + '</p></div><span class="cnt">' + lista.length + (lista.length === 1 ? ' assunto' : ' assuntos') + '</span></div>' + filtrosH;
    h += lista.length ? lista.map(cardHTML).join('') : '<div class="vazio"><b>📭</b>Nenhum assunto aqui' + (f.length ? ' com esses filtros' : '') + '.</div>';
  }
  el('main').innerHTML = h;
  if (document.activeElement && document.activeElement.id === 'q-m') { var q = el('q-m'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function renderHoje(filtrosH){
  var base = assuntos().filter(function(a){ return !a.arquivado && passaFiltros(a); });
  var abertosL = base.filter(aberto), c = { atrasado:0, bloq:0, hoje:0, aguard:0, aguard3:0 };
  abertosL.forEach(function(a){ var s = sinais(a); if (s.atrasado) c.atrasado++; if (s.bloq) c.bloq++; if (s.hoje) c.hoje++; if (s.aguard) { c.aguard++; if (s.aguardDias > 3) c.aguard3++; } });
  var hj = hojeIso(), h = '<div class="lst-h"><div><h2>Hoje</h2><p>' + diaLongo(hj) + '</p></div><button class="btn sm" onclick="setView(\'agenda\')">📅 Ver agenda</button></div>' + filtrosH;
  function k(cls, ico, n, t, sub, v){ return '<div class="rk ' + cls + '" onclick="setView(\'' + v + '\')"><span class="ri">' + ico + '</span><div><b>' + n + '</b><span>' + t + '</span>' + (sub ? '<em>' + sub + '</em>' : '') + '</div></div>'; }
  h += '<div class="resumo">' + k('r', '❗', c.atrasado, 'Atrasados', '', 'abertos') + k('a', '⛔', c.bloq, 'Bloqueados', 'ou em risco', 'bloqueados') +
       k('o', '📅', c.hoje, 'Vencem hoje', '', 'agenda') + k('l', '⏳', c.aguard, 'Aguardando retorno', c.aguard3 ? c.aguard3 + ' há mais de 3 dias' : '', 'aguardando') + '</div>';
  var usados = {}, algum = false;
  var grupos = [
    ['🔴 Atrasados', function(a, s){ return s.atrasado; }],
    ['⛔ Bloqueados ou em risco', function(a, s){ return s.bloq; }],
    ['📅 Vencem hoje', function(a, s){ return s.hoje; }],
    ['🚨 Críticos', function(a, s){ return s.crit; }],
    ['⏳ Aguardando retorno', function(a, s){ return s.aguard; }],
    ['🌅 Vencem amanhã', function(a, s){ return s.amanha; }],
    ['✏️ Atualizados hoje', function(a){ return ehHoje(a.atualizadoEm); }]
  ];
  grupos.forEach(function(g){
    var gl = ordenarLocal(abertosL.filter(function(a){ return !usados[a.id] && g[1](a, sinais(a)); }));
    if (!gl.length) return; algum = true;
    gl.forEach(function(a){ usados[a.id] = 1; });
    h += '<div class="grupo">' + g[0] + ' <span class="gn">' + gl.length + '</span></div>' + gl.map(cardHTML).join('');
  });
  if (!algum) h += '<div class="vazio"><b>🌤</b>Nada pedindo atenção agora.<br>Quando surgir algo, anote com <strong>＋ Novo assunto</strong>.</div>';
  var rec = base.filter(function(a){ return !aberto(a) && a.encerradoEm && diasDesde(a.encerradoEm) <= 7; })
    .sort(function(a, b){ return String(b.encerradoEm).localeCompare(String(a.encerradoEm)); });
  if (rec.length) h += '<div class="grupo">✅ Encerrados nos últimos 7 dias <span class="gn">' + rec.length + '</span></div>' + rec.slice(0, 6).map(cardHTML).join('') +
    (rec.length > 6 ? '<button class="lk" onclick="setView(\'concluidos\')">ver todos</button>' : '');
  return h;
}
function ordenarLocal(l){ var v = S.view; S.view = 'abertos'; var r = ordenar(l); S.view = v; return r; }

/* agenda: assuntos e pontos abertos com prazo */
function itensAgenda(){
  var L = [];
  assuntos().forEach(function(a){
    if (a.arquivado || !aberto(a) || !passaFiltros(a)) return;
    ativos(a).forEach(function(x){ if (x.prazo) L.push(x); });
  });
  return L.sort(function(x, y){ return x.prazo.localeCompare(y.prazo) || (RANK[farol(x)] - RANK[farol(y)]); });
}
function agRowHTML(o){
  var pai = ehPonto(o) ? S.porId[o.assuntoId] : null, F = FAROL[farol(o)];
  var sub = [];
  if (pai) sub.push('🧩 ponto de <i>' + esc(pai.titulo) + '</i>');
  sub.push('👤 ' + esc(o.donoNome || nomePor(o.dono) || '—'));
  if (o.aguardandoDe && o.aguardandoDe.nome) sub.push('⏳ aguardando ' + esc(o.aguardandoDe.nome));
  if (diasAte(o.prazo) < 0) sub.push('<span style="color:var(--red);font-weight:600">' + prazoTxt(o.prazo) + '</span>');
  return '<div class="ag-row" onclick="abrirFicha(\'' + o.id + '\')"><span class="dot" style="background:' + F.c + '" title="' + F.t + '"></span><div class="ac"><b>' + esc(o.titulo) + '</b><span>' + sub.join(' · ') + '</span></div><span class="st st-' + esc(o.status) + '">' + ROT[o.status] + '</span></div>';
}
function renderAgenda(filtrosH){
  var dia = S.dia || (S.dia = hojeIso()), hj = hojeIso(), L = itensAgenda();
  var h = '<div class="lst-h"><div><h2>Agenda</h2><p>Vencimentos de assuntos e pontos, dia a dia.</p></div></div>' + filtrosH;
  h += '<div class="dia-nav"><button class="seta" onclick="mudaDia(-1)" aria-label="Dia anterior">‹</button><div class="dia"><b>' + diaRotulo(dia) + '</b><span>' + diaLongo(dia) + '</span></div><button class="seta" onclick="mudaDia(1)" aria-label="Próximo dia">›</button>' +
    (dia !== hj ? '<button class="btn sm" onclick="S.dia=hojeIso();renderLista()">Voltar para hoje</button>' : '') + '</div>';
  var doDia = L.filter(function(x){ return x.prazo === dia; });
  if (dia === hj) {
    var venc = L.filter(function(x){ return x.prazo < hj; });
    if (venc.length) h += '<div class="grupo">🔴 Vencidos antes de hoje <span class="gn">' + venc.length + '</span></div>' + venc.map(agRowHTML).join('');
  }
  h += '<div class="grupo">📌 ' + (dia === hj ? 'Vencem hoje' : 'Vencem neste dia') + ' <span class="gn">' + doDia.length + '</span></div>';
  h += doDia.length ? doDia.map(agRowHTML).join('') : '<div style="font-size:.86rem;color:var(--mu);padding:4px 2px 6px">Nada vence neste dia.</div>';
  var fim = somaDias(dia, 7), prox = L.filter(function(x){ return x.prazo > dia && x.prazo <= fim; });
  if (prox.length) {
    h += '<div class="grupo">🗓 Próximos 7 dias <span class="gn">' + prox.length + '</span></div>';
    var ult = '';
    prox.forEach(function(x){

  el('pagina').classList.add('on'); el('veu').classList.add('on'); document.body.classList.add('pg-on'); el('pagina').scrollTop = 0;

}
function fecharFicha(){

  h += '<div class="ag-c full"><small>Próxima ação</small><div class="ag-v' + (o.proximaAcao ? '' : ' mu') + '">' + esc(o.proximaAcao || 'não definida') + '</div>' +

function papeisHTML(o){

  if (o.dono || o.donoNome) linhas.push(['Responsável', lista([{ p:{ email:o.dono, nome:o.donoNome || nomePor(o.dono) } }])]);
  var ags = [];
  if (o.aguardandoDe && o.aguardandoDe.nome) ags.push({ p:o.aguardandoDe });
  if (!ehPonto(o)) pontosDe(o.id).filter(aberto).forEach(function(p){ if (p.aguardandoDe && p.aguardandoDe.nome) ags.push({ p:p.aguardandoDe, nota:'num ponto' }); });
  if (ags.length) linhas.push(['Aguardando retorno de', lista(ags)]);

  if (env.length) linhas.push(['Envolvidos', lista(env)]);
  if (!ehPonto(o)) {
    var pr = pontosDe(o.id).filter(function(p){ return p.dono || p.donoNome; }).map(function(p){ return { p:{ email:p.dono, nome:p.donoNome || nomePor(p.dono) }, nota:aberto(p) ? '' : 'ponto encerrado' }; });

function renderPagina(){

  if (ro) ac.push('<button class="btn sm" onclick="location.href=\'Index_Checkpoint.html#reu=' + encodeURIComponent(o.origem) + '\'">🤝 Abrir no Checkpoint</button>');
  if (ac.length) h += '<div class="acoes">' + ac.join('') + '</div>';

  if (o.resumo) h += '<div class="sec"><div class="sec-t">Descrição</div><div class="texto">' + esc(o.resumo) + '</div></div>';

    '<div class="gm"><small>Código</small><b style="font-family:ui-monospace,monospace;font-size:.8rem">' + esc(o.id) + '</b></div>' +
  '</div></div>';

  /* relacionados */

        '</div></div>';
    }
  }

  /* linha do tempo: registrar em cima, mais recente primeiro */

/* ─────────────── modais ─────────────── */
function modal(html){ el('modal-box').innerHTML = html; el('modal').classList.add('on'); var f = el('modal-box').querySelector('input:not([type=checkbox]),textarea,select'); if (f) setTimeout(function(){ f.focus(); }, 60); }
function fecharModal(){ el('modal').classList.remove('on'); el('modal-box').innerHTML = ''; }
function modalAberto(){ return el('modal').classList.contains('on'); }
function msgModal(t){ var m = el('mod-msg'); if (m) m.innerHTML = esc(t); }
function salvarModal(action, payload, okMsg){
  var bs = el('modal-box').querySelectorAll('.mod-f .btn'); Array.prototype.forEach.call(bs, function(b){ b.disabled = true; });
  loader(true);
  return apiPost(action, payload).then(function(d){
    loader(false); fecharModal(); mesclar(d.resultado.itens || []); if (okMsg) toast(okMsg, 'ok'); return d;
  }).catch(function(e){
    loader(false); Array.prototype.forEach.call(bs, function(b){ b.disabled = false; }); msgModal(e.message); return null;
  });
}
document.addEventListener('keydown', function(e){

});
function normPessoa(p){ return p && (p.nome || p.email) ? { email:p.email || '', nome:p.nome || nomePor(p.email) } : null; }
function normLista(l){ return (l || []).map(normPessoa).filter(Boolean).map(function(p){ return chavePessoa(p); }).sort().join('|'); }
function opcoes(mapa, sel){ return Object.keys(mapa).map(function(k){ return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + mapa[k] + '</option>'; }).join(''); }
function envChipsHTML(){ return CH.env.map(function(p, i){ return pessoaChip(p, '<button type="button" onclick="CH.env.splice(' + i + ',1);pintarEnv()">×</button>'); }).join(''); }
function pintarEnv(){ var b = el('f-env'); if (b) b.innerHTML = envChipsHTML(); }
function addEnv(){ var t = val('f-env-in'); if (!t) return; var p = resolverPessoa(confirmaNome(t)); if (!CH.env.some(function(x){ return chavePessoa(x) === chavePessoa(p); })) CH.env.push(p); el('f-env-in').value = ''; var hn = el('f-env-in').closest('.addl').nextElementSibling; if (hn && hn.classList.contains('hint-nome')) hn.remove(); pintarEnv(); }
function toggleMotivo(){ var s = val('f-status'), b = el('f-mot-box'); if (b) b.style.display = (s === 'bloqueado' || s === 'em_risco') ? '' : 'none'; }
function toggleMotivoPrazo(orig){ var b = el('f-mprazo-box'); if (b) b.style.display = (orig && val('f-prazo') !== orig) ? '' : 'none'; }

    '<label>O que está acontecendo? *</label><textarea id="r-txt" maxlength="4000" oninput="detectarAguardo()" placeholder="Ex.: Cris bloqueou o acesso do Mercado Livre. Aguardar Adilson."></textarea>' +
    '<div class="hint">A primeira frase vira o título do assunto; o texto inteiro fica na descrição.</div>' +
    '<div class="g2"><div><label>Responsável *</label><input id="r-resp" list="dl-pessoas" value="' + esc(S.me.nome) + '"></div>' +

    '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="lk esq" onclick="rapidoParaCompleto()">Formulário completo →</button><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" onclick="salvarRapido()">Criar assunto</button></div></div>');
}
function detectarAguardo(){
  var ag = el('r-ag'); if (!ag || (ag.value && ag.dataset.auto !== '1')) return;
  var m = val('r-txt').match(/[Aa]guard(?:ar|ando|a)\s+(?:o\s+|a\s+)?(?:(?:o\s+)?retorno\s+d[oae]s?\s+|(?:a\s+)?resposta\s+d[oae]s?\s+)?([A-ZÀ-Ý][A-Za-zÀ-ÿ]+)/);
  if (m) { ag.value = m[1]; ag.dataset.auto = '1'; } else if (ag.dataset.auto === '1') { ag.value = ''; }
}
function tituloDe(txt){
  var l1 = txt.split(/\n/)[0].trim();
  var m = l1.match(/^(.{6,}?[.!?])(\s|$)/);
  return (m ? m[1].replace(/\.$/, '') : l1).substring(0, 200);
}
function salvarRapido(){
  var txt = val('r-txt'); if (!txt) return msgModal('Escreva o que está acontecendo.');
  var resp = resolverPessoa(val('r-resp')); if (!resp) return msgModal('Informe o responsável.');
  var titulo = tituloDe(txt), resumo = norm(txt) === norm(titulo) || norm(txt) === norm(titulo + '.') ? '' : txt;
  salvarModal('criarAssunto', { titulo:titulo, resumo:resumo, responsavel:resp, prioridade:val('r-prior'), proximaAcao:val('r-prox'), aguardandoDe:resolverPessoa(val('r-ag')) }, 'Assunto criado.')
    .then(function(d){ if (!d) return; preencherListas(); var it = d.resultado.itens || []; if (it[0]) abrirFicha(it[0].id); });
}
function rapidoParaCompleto(){
  var txt = val('r-txt');
  formAssunto(null, { titulo:txt ? tituloDe(txt) : '', resumo:txt && norm(txt) !== norm(tituloDe(txt)) ? txt : '', resp:val('r-resp'), prior:val('r-prior'), prox:val('r-prox'), ag:val('r-ag') });
}

function addLinhaPonto(){

  box.appendChild(d); d.querySelector('.np-t').focus();

function salvarAssunto(id){
  var titulo = val('f-titulo'); if (!titulo) return msgModal('Informe o assunto.');
  var resp = resolverPessoa(val('f-resp')); if (!resp) return msgModal('Informe o responsável.');
  var status = val('f-status'), mot = val('f-mot');
  if ((status === 'bloqueado' || status === 'em_risco') && !mot) return msgModal('Diga o que está impedindo.');
  var ag = resolverPessoa(val('f-ag'));
  if (!id) {
    var pontos = [], falta = false;
    Array.prototype.forEach.call(document.querySelectorAll('#f-pontos .np-row'), function(r){
      var t = r.querySelector('.np-t').value.trim(), rp = resolverPessoa(r.querySelector('.np-r').value);
      if (!t) return; if (!rp) falta = true;
      pontos.push({ titulo:t, responsavel:rp, prazo:r.querySelector('.np-p').value });
    });
    if (falta) return msgModal('Cada ponto precisa de um responsável.');
    salvarModal('criarAssunto', { titulo:titulo, resumo:val('f-resumo'), area:val('f-area'), responsavel:resp, envolvidos:CH.env,
      prioridade:val('f-prior'), criticidade:val('f-crit'), prazo:val('f-prazo'), status:status, motivoBloqueio:mot,
      visibilidade:val('f-vis'), aguardandoDe:ag, proximaAcao:val('f-prox'), pontos:pontos }, 'Assunto criado.')
    .then(function(d){ if (!d) return; preencherListas(); var it = d.resultado.itens || []; if (it[0]) abrirFicha(it[0].id); });
    return;
  }
  var o = S.porId[id], c = {};
  if (titulo !== o.titulo) c.titulo = titulo;
  if (val('f-resumo') !== (o.resumo || '')) c.resumo = val('f-resumo');
  if (val('f-area') !== (o.area || '')) c.area = val('f-area');
  if (resp.email !== (o.dono || '') || resp.nome !== (o.donoNome || nomePor(o.dono))) c.responsavel = resp;
  if (normLista(CH.env) !== normLista(o.envolvidos)) c.envolvidos = CH.env;
  if (val('f-prior') !== o.prioridade) c.prioridade = val('f-prior');
  if (val('f-crit') !== (o.criticidade || 'normal')) c.criticidade = val('f-crit');
  if (val('f-prazo') !== (o.prazo || '')) { c.prazo = val('f-prazo'); c.motivoPrazo = val('f-mprazo'); }
  if (val('f-vis') !== (o.visibilidade || 'todos')) c.visibilidade = val('f-vis');
  if (mot !== (o.motivoBloqueio || '')) c.motivoBloqueio = mot;
  if (status !== o.status) c.status = status;
  if (JSON.stringify(ag) !== JSON.stringify(normPessoa(o.aguardandoDe))) c.aguardandoDe = ag;
  if (val('f-prox') !== (o.proximaAcao || '')) c.proximaAcao = val('f-prox');
  if (!Object.keys(c).length) { fecharModal(); return; }
  salvarModal('editar', { id:id, campos:c }, 'Assunto atualizado.').then(function(){ preencherListas(); });
}

    '<div class="g2"><div><label>Aguardando retorno de</label><input id="f-ag" list="dl-pessoas" value="' + esc(p ? pessoaTxt(p.aguardandoDe) : '') + '" placeholder="Ninguém"></div>' +
    '<div><label>Próxima ação</label><input id="f-prox" maxlength="300" value="' + esc(p ? p.proximaAcao : '') + '"></div></div>' +
    '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" onclick="salvarPonto(\'' + a.id + '\',' + (p ? '\'' + p.id + '\'' : 'null') + ')">' + (p ? '💾 Salvar' : '🧩 Abrir ponto') + '</button></div>');
}
function salvarPonto(assuntoId, pontoId){
  var titulo = val('f-titulo'); if (!titulo) return msgModal('Descreva o ponto.');
  var resp = resolverPessoa(val('f-resp')); if (!resp) return msgModal('Todo ponto precisa de um responsável.');
  var status = val('f-status'), mot = val('f-mot');
  if ((status === 'bloqueado' || status === 'em_risco') && !mot) return msgModal('Diga o que está impedindo.');
  var ag = resolverPessoa(val('f-ag'));
  if (!pontoId) {
    salvarModal('criarPonto', { assuntoId:assuntoId, titulo:titulo, resumo:val('f-resumo'), responsavel:resp, prazo:val('f-prazo'),
      prioridade:val('f-prior'), criticidade:val('f-crit'), status:status, motivoBloqueio:mot, aguardandoDe:ag, proximaAcao:val('f-prox') }, 'Ponto aberto.')
      .then(function(d){ if (d) preencherListas(); });
    return;
  }
  var o = S.porId[pontoId], c = {};
  if (titulo !== o.titulo) c.titulo = titulo;
  if (val('f-resumo') !== (o.resumo || '')) c.resumo = val('f-resumo');
  if (resp.email !== (o.dono || '') || resp.nome !== (o.donoNome || nomePor(o.dono))) c.responsavel = resp;
  if (val('f-prazo') !== (o.prazo || '')) { c.prazo = val('f-prazo'); c.motivoPrazo = val('f-mprazo'); }
  if (val('f-prior') !== o.prioridade) c.prioridade = val('f-prior');
  if (val('f-crit') !== (o.criticidade || 'normal')) c.criticidade = val('f-crit');
  if (mot !== (o.motivoBloqueio || '')) c.motivoBloqueio = mot;
  if (status !== o.status) c.status = status;
  if (JSON.stringify(ag) !== JSON.stringify(normPessoa(o.aguardandoDe))) c.aguardandoDe = ag;
  if (val('f-prox') !== (o.proximaAcao || '')) c.proximaAcao = val('f-prox');
  if (!Object.keys(c).length) { fecharModal(); return; }
  salvarModal('editar', { id:pontoId, campos:c }, 'Ponto atualizado.').then(function(){ preencherListas(); });
}

/* encerrar */
function formEncerrar(id){
  var o = S.porId[id], ponto = ehPonto(o), nAb = ponto ? 0 : pontosDe(id).filter(aberto).length;
  modal('<h3>✅ Encerrar ' + (ponto ? 'ponto' : 'assunto') + '</h3><p class="mod-sub">' + esc(o.titulo) + '</p>' +
    (nAb ? '<div class="mod-msg" style="margin:0 0 4px">Ainda há ' + nAb + ' ponto(s) em aberto neste assunto.</div>' : '') +
    '<label>Como terminou? (opcional)</label><textarea id="e-nota" placeholder="Ex.: acesso liberado e testado"></textarea>' +
    (ponto ? '<label>Evidência (opcional)</label><input id="e-evid" maxlength="500" placeholder="Link, foto, número do pedido…">' : '') +
    '<label class="ck"><input type="checkbox" id="e-canc"> Cancelar em vez de concluir (não vai mais acontecer)</label>' +
    '<div class="hint">O histórico fica guardado e o ' + (ponto ? 'ponto' : 'assunto') + ' pode ser reaberto depois.</div>' +
    '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal()">Voltar</button><button class="btn pri" id="e-btn" onclick="encerrar(\'' + id + '\',false)">✅ Encerrar</button></div>');
}
function encerrar(id, forcar){
  var b = el('e-btn'); if (b) b.disabled = true;
  loader(true);
  apiPost('encerrar', { id:id, nota:val('e-nota'), evidencia:val('e-evid'), cancelar:!!(el('e-canc') && el('e-canc').checked), forcar:!!forcar })
    .then(function(d){ loader(false); fecharModal(); mesclar(d.resultado.itens || []); toast('Encerrado. O histórico fica guardado e dá para reabrir.', 'ok'); })
    .catch(function(e){
      loader(false); if (b) b.disabled = false;
      if (e.codigo === 'PONTOS_ABERTOS') el('mod-msg').innerHTML = esc(e.message) + '<div><button class="btn warn" onclick="encerrar(\'' + id + '\',true)">Encerrar o assunto e os pontos abertos</button></div>';
      else msgModal(e.message);
    });
}

/* reabrir */
function formReabrir(id){
  var o = S.porId[id], ponto = ehPonto(o);
  modal('<h3>↩️ Reabrir ' + (ponto ? 'ponto' : 'assunto') + '</h3><p class="mod-sub">' + esc(o.titulo) + '</p>' +
    '<label>Por que está reabrindo? *</label><textarea id="r-mot" placeholder="Ex.: a obra foi concluída, mas o telhado precisou de uma observação"></textarea>' +
    (ponto ? '' : '<div class="bloco-ext"><label>Abrir já um ponto para tratar isso? (opcional)</label><input id="r-tit" maxlength="200" placeholder="Ex.: Retorno do Gledson sobre o telhado">' +
      '<div class="g2"><div><label>Responsável</label><input id="r-resp" list="dl-pessoas" placeholder="Gestor ou outra pessoa"></div><div><label>Prazo</label><input type="date" id="r-prazo"></div></div></div>') +
    '<div class="mod-msg" id="mod-msg"></div><div class="mod-f"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn warn" onclick="reabrir(\'' + id + '\')">↩️ Reabrir</button></div>');
}
function reabrir(id){
  var mot = val('r-mot'); if (mot.length < 5) return msgModal('Diga por que está reabrindo.');
  var p = { id:id, motivo:mot }, t = val('r-tit');
  if (t) { var rp = resolverPessoa(val('r-resp')); if (!rp) return msgModal('Informe o responsável do novo ponto.'); p.novoPonto = { titulo:t, responsavel:rp, prazo:val('r-prazo') }; }
  salvarModal('reabrir', p, 'Reaberto. O motivo ficou no histórico.').then(function(d){ if (d) preencherListas(); });
}

(function iniciar(){
  S.dia = hojeIso();
  if (/[?&]demo=1/.test(location.search)) { iniciarDemo(); abrirLinkPendente(); return; }
  var s = null; try { s = JSON.parse(localStorage.getItem('qfood_session') || 'null'); } catch(e){}
  if (!s || !s.email || !s.ts || (Date.now() - s.ts > 8 * 60 * 60 * 1000)) {
    try { if (location.hash) localStorage.setItem('tar_link_pendente', location.hash); } catch(e){}
    alert('Sessão expirada. Entre pelo menu do sistema.');
    location.href = 'Index_Menu.html';
    return;
  }
  S.me = { email:String(s.email).toLowerCase(), nome:s.nome || s.email.split('@')[0], admin:false };
  carregar();
  setInterval(atualizar, REFRESH_MS);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') atualizar(); });
})();
