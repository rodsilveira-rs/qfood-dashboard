<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q Food — Conferência de Validade</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1f2e;--sf:#242938;--s2:#2e3447;
  --br:rgba(255,255,255,0.10);--b2:rgba(255,255,255,0.18);
  --tx:#eef1f8;--mu:#8fa0c0;--mu2:#5e718e;
  --red:#ff4d4f;--ok:#36cfa0;--warn:#ffaa2b;--cyan:#22d3ee;--pur:#a07cf6;
  --qf:#e63329;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);padding-bottom:104px;}

/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:60;background:var(--sf);border-bottom:1px solid var(--br);padding:12px 14px;}
.top-in{max-width:820px;margin:0 auto;}
.top-r{display:flex;align-items:center;gap:10px;}
.back{background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:9px;padding:7px 11px;font-size:0.8rem;cursor:pointer;font-family:var(--fb);}
.ttl{font-family:var(--fh);font-weight:700;font-size:0.98rem;flex:1;line-height:1.25;}
.ttl small{display:block;font-family:var(--fb);font-weight:400;font-size:0.68rem;color:var(--mu2);margin-top:2px;}

.prog{margin-top:11px;}
.prog-t{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;}
.prog-t>i{display:block;height:100%;background:var(--ok);width:0;transition:width .35s;}
.prog-l{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;}
.prog-l b{font-family:var(--fh);font-size:0.82rem;}
.prog-l span{font-size:0.72rem;color:var(--mu);}

.wrap{max-width:820px;margin:0 auto;padding:14px;}

/* ---------- avisos ---------- */
.alert{border-radius:11px;padding:11px 13px;font-size:0.79rem;line-height:1.45;margin-bottom:11px;border:1px solid;}
.alert.warn{background:rgba(255,170,43,.10);border-color:rgba(255,170,43,.4);color:#ffce80;}
.alert.err{background:rgba(255,77,79,.10);border-color:rgba(255,77,79,.4);color:#ff9b9c;}
.alert.ok{background:rgba(54,207,160,.10);border-color:rgba(54,207,160,.4);color:#7fe4c4;}

/* ---------- busca e filtros ---------- */
.busca{width:100%;background:var(--sf);border:1px solid var(--br);border-radius:11px;padding:12px 14px;color:var(--tx);font-size:0.86rem;font-family:var(--fb);outline:none;margin-bottom:9px;}
.busca:focus{border-color:var(--qf);}
.filtros{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.filtros button{background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:99px;padding:8px 15px;font-size:0.76rem;cursor:pointer;font-family:var(--fb);}
.filtros button.on{background:var(--qf);border-color:var(--qf);color:#fff;font-weight:600;}

.sec-h{font-family:var(--fh);font-size:0.72rem;color:var(--mu2);letter-spacing:.7px;text-transform:uppercase;margin:20px 0 9px;}

/* ---------- card do item ---------- */
.card{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:15px;margin-bottom:11px;border-left:3px solid var(--mu2);}
.card.d0{border-left-color:#c92a2a;}
.card.d15{border-left-color:var(--red);}
.card.d30{border-left-color:var(--warn);}
.card.d60{border-left-color:#fcc419;}
.card.d90{border-left-color:var(--cyan);}

.badge{display:inline-block;font-size:0.68rem;font-weight:700;font-family:var(--fh);letter-spacing:.5px;padding:4px 11px;border-radius:99px;margin-bottom:9px;}
.badge.b0{background:rgba(201,42,42,.22);color:#ff8787;}
.badge.b15{background:rgba(255,77,79,.18);color:#ff9b9c;}
.badge.b30{background:rgba(255,170,43,.18);color:#ffce80;}
.badge.b60{background:rgba(252,196,25,.16);color:#ffe066;}
.badge.b90{background:rgba(34,211,238,.16);color:#8fe6f5;}

.nm{font-size:1.02rem;font-weight:500;line-height:1.3;margin-bottom:6px;}
.ctx{font-size:0.74rem;color:var(--mu);line-height:1.5;}
.ctx b{color:var(--tx);font-family:var(--fh);}

.det-bt{background:none;border:none;color:var(--mu2);font-size:0.71rem;cursor:pointer;padding:5px 0;font-family:var(--fb);text-decoration:underline;text-underline-offset:3px;}
.det{font-size:0.71rem;color:var(--mu2);line-height:1.7;padding:8px 11px;background:var(--bg);border-radius:9px;margin-top:8px;font-family:ui-monospace,monospace;}

.pergunta{font-size:0.78rem;color:var(--mu);margin:15px 0 8px;}
.linha{display:flex;gap:9px;}
.qtd{flex:1;min-width:0;background:var(--bg);border:2px solid var(--b2);border-radius:11px;padding:15px;color:var(--tx);font-size:1.5rem;font-family:var(--fh);font-weight:800;text-align:center;outline:none;}
.qtd:focus{border-color:var(--qf);}
.conf{background:var(--ok);border:none;border-radius:11px;padding:0 24px;color:#08251c;font-size:0.88rem;font-weight:700;font-family:var(--fh);cursor:pointer;white-space:nowrap;}
.conf:disabled{opacity:.45;cursor:not-allowed;}

/* ação condicional — só aparece quando faz diferença */
.acao{margin-top:12px;padding-top:12px;border-top:1px dashed var(--br);}
.acao-t{font-size:0.75rem;color:var(--mu);margin-bottom:8px;}
.acao-bts{display:flex;gap:7px;flex-wrap:wrap;}
.acao-bts button{background:var(--s2);border:1px solid var(--b2);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:0.74rem;cursor:pointer;font-family:var(--fb);}
.acao-bts button.on{background:var(--pur);border-color:var(--pur);color:#fff;font-weight:600;}

.obs-bt{background:none;border:none;color:var(--mu2);font-size:0.72rem;cursor:pointer;padding:9px 0 0;font-family:var(--fb);}
.obs{width:100%;margin-top:7px;background:var(--bg);border:1px solid var(--br);border-radius:9px;padding:10px 12px;color:var(--tx);font-size:0.79rem;font-family:var(--fb);outline:none;}
.obs:focus{border-color:var(--qf);}
.msg{font-size:0.72rem;margin-top:8px;min-height:15px;}

/* ---------- item já conferido, recolhido ---------- */
.feito{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--br);border-left:3px solid var(--ok);border-radius:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer;}
.feito:active{background:var(--s2);}
.feito-ic{color:var(--ok);font-size:0.95rem;flex-shrink:0;}
.feito-nm{flex:1;font-size:0.81rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.feito-q{font-family:var(--fh);font-size:0.86rem;font-weight:700;white-space:nowrap;}
.feito-q small{display:block;font-family:var(--fb);font-size:0.63rem;color:var(--mu2);font-weight:400;text-align:right;}

.g{color:var(--ok);}.r{color:var(--red);}.y{color:var(--warn);}.m{color:var(--mu);}

/* ---------- barra fixa ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sf);border-top:1px solid var(--br);padding:11px 14px;}
.dock-in{max-width:820px;margin:0 auto;display:flex;gap:9px;align-items:center;}
.dock .info{flex:1;font-size:0.76rem;color:var(--mu);line-height:1.35;}
.dock button{border:none;border-radius:11px;padding:14px 20px;font-size:0.86rem;font-weight:700;font-family:var(--fh);cursor:pointer;white-space:nowrap;}
.dock .fin{background:var(--ok);color:#08251c;flex:1;}
.dock .parc{background:var(--s2);border:1px solid var(--b2);color:var(--mu);}
.dock button:disabled{opacity:.4;cursor:not-allowed;}

.empty{text-align:center;color:var(--mu2);font-size:0.83rem;padding:46px 16px;line-height:1.7;}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--b2);border-top-color:var(--qf);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none !important;}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="top-r">
      <button class="back hide" id="btn-voltar" onclick="location.href='Index_Menu.html'">←</button>
      <div class="ttl">Conferência de Validade<small id="sub">—</small></div>
    </div>
    <div class="prog hide" id="prog">
      <div class="prog-t"><i id="prog-i"></i></div>
      <div class="prog-l"><b id="prog-b">—</b><span id="prog-s"></span></div>
    </div>
  </div>
</div>

<div class="wrap"><div id="app"><div class="empty"><span class="spin"></span> Carregando…</div></div></div>

<div class="dock hide" id="dock"><div class="dock-in" id="dock-in"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Q FOOD — Index_Validades.html  v2.0

   Backend: projeto do VALIDADES_SYNC_URL
     GET  ?tipo=val_listar&unidade=..&hash=..
     POST tipo=val_conferir | val_concluir

   ACESSO
   Pelo link do e-mail (?u=qfood&h=<hash>) o responsável entra sem
   login — o hash autentica aquela unidade, mesmo padrão do
   confirmacao.html do fornecedor. Pelo Menu, usa a sessão da UUSR.

   DESENHO DA TELA
   Cada item faz UMA pergunta: quanto tem agora. Fornecedor, código e
   rodada ficam em "detalhes" recolhido — servem para auditoria, não
   para a decisão do momento. A quantidade recebida e a da última
   conferência ficam visíveis de propósito: é o par que mostra o ritmo
   de saída e ajuda a pessoa a perceber item parado.

   A ação (promoção, avisar comercial) só aparece DEPOIS da quantidade
   e apenas quando muda alguma coisa — item com saldo e vencimento
   próximo. Perguntar em todo item transformaria um campo útil em
   ruído que a pessoa aprende a ignorar.

   REGRA DE OURO
   Quantidade recebida e quantidade anterior são somente leitura.
   A baixa do período e a data da conferência são calculadas pelo
   servidor — se a data fosse digitada, daria para lançar retroativo.
   ══════════════════════════════════════════════════════════════ */

var API   = "https://script.google.com/macros/s/AKfycbxohOKq4Au2UYztDTNXS6kODOJXnTufkkVAkuRFrMrvXmRyh-sUSAJ3aOfVXjkB0bUG/exec";
var TOKEN = "qfood-rs-2026-xK9pL3mQ7vN2bT8";   // mesmo VALIDADES_SYNC_TOKEN do Index_Compras

var P    = new URLSearchParams(location.search);
var UNI  = (P.get("u") || P.get("unidade") || "qfood").toLowerCase();
var HASH = P.get("h") || P.get("hash") || "";

var USER=null, DADOS=null, FEITOS={}, BUSCA="", FILTRO="pendentes";
var ABERTOS={};          // detalhes expandidos
var OBS_ABERTA={};       // campo de observação expandido
var ACAO_SEL={};         // ação escolhida por item

/* Item com saldo e vencendo dentro deste prazo pede uma decisão. */
var DIAS_PEDE_ACAO = 30;

var ACOES = [
  ["PROMOCAO","🎯 Promoção"],
  ["COMUNICADO_COMERCIAL","📣 Avisar comercial"],
  ["OUTROS","➕ Outro"]
];

/* ---------- init ---------- */
(function(){
  if(!HASH){
    var s=null;
    try{ s=JSON.parse(localStorage.getItem("qfood_session")||"null"); }catch(e){}
    if(!s||!s.email||(Date.now()-(s.ts||0))>8*60*60*1000){
      document.getElementById("app").innerHTML=
        '<div class="alert err"><b>Link inválido ou sessão expirada.</b><br>'+
        'Abra pelo link do e-mail que você recebeu, ou entre pelo Menu.</div>';
      return;
    }
    USER=s;
    document.getElementById("btn-voltar").classList.remove("hide");
  }
  carregar();
})();

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(v){ if(v===""||v==null) return null;
  var n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; }
function n2(v){ return (v==null)?"—":Number(v).toLocaleString("pt-BR",
  {minimumFractionDigits:0,maximumFractionDigits:2}); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function quemSou(){ return HASH ? (DADOS?DADOS.responsavel:"link") : USER.email; }

/* Urgência: define cor, texto do badge e ordem de prioridade. */
function urg(d){
  if(d==null)  return {k:"90", t:"SEM VALIDADE", ord:9};
  if(d<0)      return {k:"0",  t:"🔴 VENCIDO há "+Math.abs(d)+" dias", ord:0};
  if(d===0)    return {k:"0",  t:"🔴 VENCE HOJE", ord:0};
  if(d<=15)    return {k:"15", t:"🔴 "+d+" dias", ord:1};
  if(d<=30)    return {k:"30", t:"🟠 "+d+" dias", ord:2};
  if(d<=60)    return {k:"60", t:"🟡 "+d+" dias", ord:3};
  return          {k:"90", t:"🔵 "+d+" dias", ord:4};
}

/* ---------- rede ---------- */
function carregar(){
  document.getElementById("app").innerHTML='<div class="empty"><span class="spin"></span> Carregando itens…</div>';
  var q=API+"?tipo=val_listar&unidade="+encodeURIComponent(UNI);
  if(HASH) q+="&hash="+encodeURIComponent(HASH);
  else q+="&login="+encodeURIComponent(USER.email);

  fetch(q).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){
      document.getElementById("app").innerHTML='<div class="alert err">'+esc(j.erro||"Erro ao carregar")+'</div>';
      return;
    }
    DADOS=j; render();
  }).catch(function(e){
    document.getElementById("app").innerHTML='<div class="alert err">Falha de conexão.<br>'+esc(e)+'</div>';
  });
}

/* text/plain evita preflight CORS — mesmo padrão do Index_Compras */
function post(tipo, dado, cb){
  dado=dado||{}; dado.unidade=UNI;
  if(HASH) dado.hash=HASH;
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({token:TOKEN,tipo:tipo,dado:dado})})
    .then(function(r){return r.json();}).then(function(j){cb(null,j);})
    .catch(function(e){cb(e);});
}

/* ---------- render ---------- */
function render(){
  var itens=(DADOS.itens||[]).slice();
  document.getElementById("sub").textContent=DADOS.nome_unidade+" · "+DADOS.responsavel;

  itens.sort(function(a,b){
    var ua=urg(a.dias_restantes), ub=urg(b.dias_restantes);
    if(ua.ord!==ub.ord) return ua.ord-ub.ord;
    return (a.dias_restantes==null?9999:a.dias_restantes)-(b.dias_restantes==null?9999:b.dias_restantes);
  });

  var pend=itens.filter(function(i){return !FEITOS[i.id_rodada];});
  var fei =itens.filter(function(i){return  FEITOS[i.id_rodada];});
  progresso(fei.length,itens.length);

  if(!itens.length){
    document.getElementById("app").innerHTML=
      '<div class="empty">✓ Nenhum item pendente de conferência.<br><br>'+
      'Quando um produto chegar a um marco de validade, ele aparece aqui '+
      'e você recebe um e-mail.</div>';
    document.getElementById("dock").classList.add("hide");
    return;
  }

  var h="";
  var vencidos=pend.filter(function(i){return i.dias_restantes!=null&&i.dias_restantes<0;}).length;
  var atrasados=pend.filter(function(i){return i.atrasada;}).length;

  if(vencidos) h+='<div class="alert err"><b>🔴 '+vencidos+' produto(s) já vencido(s).</b> Informe a quantidade mesmo assim — o item é encerrado em seguida.</div>';
  if(atrasados) h+='<div class="alert warn"><b>'+atrasados+' item(ns) com prazo de resposta vencido.</b> A gestão já foi avisada. Responder agora encerra a pendência.</div>';

  if(itens.length>6){
    h+='<input class="busca" id="busca" placeholder="🔍 Buscar produto…" value="'+esc(BUSCA)+'" oninput="buscar(this.value)">';
    h+='<div class="filtros">'+
       fbt("pendentes","A conferir ("+pend.length+")")+
       fbt("urgentes","Urgentes")+
       fbt("conferidos","Conferidos ("+fei.length+")")+
       '</div>';
  }

  var t=norm(BUSCA).split(/\s+/).filter(Boolean);
  function bate(i){
    if(!t.length) return true;
    var alvo=norm(i.descricao)+" "+i.codigo+" "+norm(i.fornecedor);
    return t.every(function(x){ return alvo.indexOf(x)>=0; });
  }

  var mostraPend = (FILTRO!=="conferidos");
  var mostraFei  = (FILTRO==="conferidos");

  if(mostraPend){
    var lista=pend.filter(bate);
    if(FILTRO==="urgentes") lista=lista.filter(function(i){ return urg(i.dias_restantes).ord<=2; });
    if(!lista.length){
      h+='<div class="empty">'+(BUSCA?'Nenhum item para "'+esc(BUSCA)+'".':'Nada nesta seleção.')+'</div>';
    } else {
      lista.forEach(function(i){ h+=card(i); });
    }
    if(fei.length && FILTRO==="pendentes"){
      h+='<div class="sec-h">Conferidos ('+fei.length+')</div>';
      fei.filter(bate).forEach(function(i){ h+=cardFeito(i); });
    }
  }
  if(mostraFei){
    var lf=fei.filter(bate);
    if(!lf.length) h+='<div class="empty">Nenhum item conferido ainda.</div>';
    else lf.forEach(function(i){ h+=cardFeito(i); });
  }

  document.getElementById("app").innerHTML=h;
  atualizarDock(pend.length,fei.length);
}

function fbt(id,txt){
  return '<button class="'+(FILTRO===id?"on":"")+'" onclick="setFiltro(\''+id+'\')">'+esc(txt)+'</button>';
}
function setFiltro(f){ FILTRO=f; render(); }
function buscar(v){
  BUSCA=v;
  var el=document.getElementById("busca"), pos=el?el.selectionStart:0;
  render();
  var n=document.getElementById("busca");
  if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
}

function progresso(feito,total){
  var box=document.getElementById("prog");
  box.classList.remove("hide");
  var pct=total?Math.round(feito/total*100):0;
  document.getElementById("prog-i").style.width=pct+"%";
  document.getElementById("prog-b").textContent=feito+" de "+total+" concluídos";
  var falta=total-feito;
  document.getElementById("prog-s").textContent=
    falta===0 ? "tudo conferido" : falta+" produto"+(falta>1?"s":"")+" restante"+(falta>1?"s":"");
}

/* ---------- card pendente ---------- */
function card(i){
  var u=urg(i.dias_restantes);
  var id=i.id_rodada;
  var pedeAcao = (i.dias_restantes!=null && i.dias_restantes<=DIAS_PEDE_ACAO);

  var h='<div class="card d'+u.k+'" id="c-'+id+'">'+
    '<div class="badge b'+u.k+'">'+u.t+'</div>'+
    '<div class="nm">'+esc(i.descricao)+'</div>'+
    '<div class="ctx">Recebido <b>'+n2(i.qtd_recebida)+' '+esc(i.unidade_medida)+'</b>'+
      ' · última conferência <b>'+n2(i.qtd_anterior)+'</b></div>';

  h+='<button class="det-bt" onclick="verDet(\''+id+'\')">'+
     (ABERTOS[id]?"ocultar detalhes":"ver detalhes")+'</button>';
  if(ABERTOS[id]){
    h+='<div class="det">Código '+esc(i.codigo)+'<br>'+esc(i.fornecedor)+'<br>'+
       'Vence em '+esc(i.validade_br)+' · rodada '+i.rodada+
       (i.prazo_br?' · prazo '+esc(i.prazo_br):'')+'</div>';
  }

  h+='<div class="pergunta">Quanto tem agora?</div>'+
     '<div class="linha">'+
       '<input class="qtd" id="q-'+id+'" type="text" inputmode="decimal" placeholder="0" '+
         'oninput="mudouQtd(\''+id+'\')" onkeydown="tecla(event,\''+id+'\')">'+
       '<button class="conf" onclick="gravar(\''+id+'\')">Confirmar</button>'+
     '</div>';

  // A ação nasce escondida e o mudouQtd decide se mostra
  h+='<div class="acao hide" id="a-'+id+'" data-pede="'+(pedeAcao?"1":"0")+'">'+
       '<div class="acao-t" id="at-'+id+'"></div>'+
       '<div class="acao-bts" id="ab-'+id+'">'+
         ACOES.map(function(a){
           return '<button onclick="pickAcao(\''+id+'\',\''+a[0]+'\')" id="ac-'+id+'-'+a[0]+'">'+a[1]+'</button>';
         }).join("")+
       '</div></div>';

  h+='<button class="obs-bt" onclick="verObs(\''+id+'\')">'+
     (OBS_ABERTA[id]?"− observação":"+ adicionar observação")+'</button>';
  if(OBS_ABERTA[id]) h+='<input class="obs" id="o-'+id+'" placeholder="Anotação sobre este item">';

  return h+'<div class="msg" id="m-'+id+'"></div></div>';
}

function verDet(id){ ABERTOS[id]=!ABERTOS[id]; preservando(id,render); }
function verObs(id){ OBS_ABERTA[id]=!OBS_ABERTA[id]; preservando(id,render); }

/* Redesenha sem perder o que já foi digitado no campo de quantidade */
function preservando(id,fn){
  var el=document.getElementById("q-"+id);
  var v=el?el.value:"";
  fn();
  var n=document.getElementById("q-"+id);
  if(n && v){ n.value=v; mudouQtd(id); }
}

/* ---------- ação condicional ---------- */
function mudouQtd(id){
  var el=document.getElementById("q-"+id);
  var box=document.getElementById("a-"+id);
  if(!el||!box) return;
  var q=num(el.value);
  var txt=document.getElementById("at-"+id);

  if(q===null){ box.classList.add("hide"); return; }

  if(q===0){
    // Zerado encerra o ciclo — não faz sentido pedir plano de ação
    box.classList.remove("hide");
    document.getElementById("ab-"+id).classList.add("hide");
    txt.innerHTML='<span class="g">✓ Estoque zerado.</span> Ao confirmar, este item é encerrado e não volta mais.';
    return;
  }

  document.getElementById("ab-"+id).classList.remove("hide");
  if(box.getAttribute("data-pede")==="1"){
    box.classList.remove("hide");
    txt.innerHTML='Ainda tem saldo e vence em breve. <b>O que vai ser feito?</b>';
  } else {
    box.classList.add("hide");   // com folga de prazo, grava direto
  }
}

function pickAcao(id,val){
  ACAO_SEL[id]=(ACAO_SEL[id]===val)?null:val;
  ACOES.forEach(function(a){
    var b=document.getElementById("ac-"+id+"-"+a[0]);
    if(b) b.className=(ACAO_SEL[id]===a[0])?"on":"";
  });
}

function tecla(e,id){ if(e.key==="Enter"){ e.preventDefault(); gravar(id,true); } }

/* ---------- gravação ---------- */
function gravar(id,irProximo){
  var el=document.getElementById("q-"+id), msg=document.getElementById("m-"+id);
  var q=num(el.value);
  if(q==null){ msg.className="msg r"; msg.textContent="Informe a quantidade atual (use 0 se zerou)."; el.focus(); return; }
  if(q<0){ msg.className="msg r"; msg.textContent="Quantidade não pode ser negativa."; return; }

  var obsEl=document.getElementById("o-"+id);
  msg.className="msg m"; msg.textContent="Gravando…";

  post("val_conferir",{
    id_rodada:id, qtd_atual:q,
    acao_tomada:ACAO_SEL[id]||"",
    obs:obsEl?obsEl.value.trim():"",
    conferido_por:quemSou()
  },function(err,j){
    if(err||!j.ok){ msg.className="msg r"; msg.textContent="Erro: "+((j&&j.erro)||"sem conexão"); return; }
    FEITOS[id]=j;
    render();
    if(irProximo) focarProximo();
  });
}

function focarProximo(){
  var itens=(DADOS.itens||[]);
  for(var k=0;k<itens.length;k++){
    if(FEITOS[itens[k].id_rodada]) continue;
    var n=document.getElementById("q-"+itens[k].id_rodada);
    if(n){ n.focus(); n.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  }
}

/* ---------- item conferido, recolhido ---------- */
function cardFeito(i){
  var r=FEITOS[i.id_rodada]||{};
  var sub=r.encerrado ? "encerrado" :
          (r.baixa_periodo!=null ? "baixa "+n2(r.baixa_periodo) : "gravado");
  return '<div class="feito" onclick="reabrir(\''+i.id_rodada+'\')">'+
    '<div class="feito-ic">✓</div>'+
    '<div class="feito-nm">'+esc(i.descricao)+'</div>'+
    '<div class="feito-q">'+n2(r.qtd_atual)+' '+esc(i.unidade_medida)+
      '<small>'+esc(sub)+'</small></div></div>';
}

function reabrir(id){
  var r=FEITOS[id]||{};
  alert("Já conferido: "+n2(r.qtd_atual)+" un"+
    (r.baixa_periodo!=null?"\nBaixa no período: "+n2(r.baixa_periodo):"")+
    (r.encerrado?"\n\nEstoque zerado — item encerrado.":"\n\nVolta no próximo marco de validade.")+
    "\n\nPara corrigir, fale com quem administra o sistema.");
}

/* ---------- barra fixa ---------- */
function atualizarDock(pend,fei){
  var d=document.getElementById("dock");
  d.classList.remove("hide");
  var box=document.getElementById("dock-in");

  if(fei===0){
    box.innerHTML='<div class="info">Informe a quantidade de cada produto e confirme.</div>';
    return;
  }
  // "Finalizar" e "enviar parcial" são ações diferentes e não devem
  // parecer o mesmo botão trocando de frase.
  if(pend===0){
    box.innerHTML='<button class="fin" onclick="concluir(false)">✓ Finalizar conferência</button>';
  } else {
    box.innerHTML='<div class="info"><b>'+pend+'</b> produto'+(pend>1?"s":"")+' restante'+(pend>1?"s":"")+
      '<br><span class="m">'+fei+' já conferido'+(fei>1?"s":"")+'</span></div>'+
      '<button class="parc" onclick="concluir(true)">Enviar parcial</button>';
  }
}

function concluir(parcial){
  var ids=Object.keys(FEITOS);
  if(!ids.length) return;
  var falta=(DADOS.itens||[]).length-ids.length;

  if(parcial && !confirm("Enviar o relatório com "+ids.length+" item(ns) conferido(s)?\n\n"+
     "Os "+falta+" restantes continuam pendentes e seguem sendo cobrados.")) return;

  var b=document.querySelector("#dock-in button");
  b.disabled=true; b.textContent="Gerando relatório…";

  post("val_concluir",{ids_rodadas:ids, conferido_por:quemSou()},function(err,j){
    if(err||!j.ok){
      b.disabled=false; b.textContent=parcial?"Enviar parcial":"✓ Finalizar conferência";
      alert("Erro ao concluir: "+((j&&j.erro)||"sem conexão"));
      return;
    }
    alert("Relatório enviado.\n\n"+
      j.itens+" itens · baixa total "+n2(j.baixa_total)+"\n"+
      j.encerrados+" encerrados por estoque zerado\n"+
      (j.criticos?j.criticos+" vencendo em até 30 dias\n":"")+
      "\nPDF anexo enviado para "+j.email_para+
      "\ncom cópia para "+(j.email_cc||[]).length+" pessoa(s).");
    FEITOS={}; ACAO_SEL={}; OBS_ABERTA={}; ABERTOS={}; BUSCA=""; FILTRO="pendentes";
    carregar();
  });
}
</script>
</body>
