<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q Food — Conferência de Validade</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1f2e;--sf:#242938;--s2:#2e3447;
  --br:rgba(255,255,255,0.10);--b2:rgba(255,255,255,0.18);
  --tx:#eef1f8;--mu:#8fa0c0;--mu2:#5e718e;
  --red:#ff4d4f;--ok:#36cfa0;--warn:#ffaa2b;--cyan:#22d3ee;
  --qf:#e63329;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);padding-bottom:100px;}

.top{position:sticky;top:0;z-index:60;background:var(--sf);border-bottom:1px solid var(--br);padding:12px 14px;}
.top-in{max-width:900px;margin:0 auto;}
.top-r{display:flex;align-items:center;gap:10px;}
.ttl{font-family:var(--fh);font-weight:700;font-size:1rem;flex:1;line-height:1.25;}
.ttl small{display:block;font-family:var(--fb);font-weight:400;font-size:0.7rem;color:var(--mu2);margin-top:2px;}
.back{background:var(--s2);border:1px solid var(--br);color:var(--mu);border-radius:9px;padding:7px 11px;font-size:0.8rem;cursor:pointer;font-family:var(--fb);}
.bar{margin-top:10px;height:6px;background:var(--s2);border-radius:99px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s;}
.bar-lbl{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--mu);margin-top:5px;}

.wrap{max-width:900px;margin:0 auto;padding:14px;}

.alert{border-radius:11px;padding:12px 14px;font-size:0.8rem;line-height:1.45;margin-bottom:12px;border:1px solid;}
.alert.warn{background:rgba(255,170,43,.10);border-color:rgba(255,170,43,.4);color:#ffce80;}
.alert.err{background:rgba(255,77,79,.10);border-color:rgba(255,77,79,.4);color:#ff9b9c;}
.alert.ok{background:rgba(54,207,160,.10);border-color:rgba(54,207,160,.4);color:#7fe4c4;}
.alert.info{background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.4);color:#8fe6f5;}

.sec-h{font-family:var(--fh);font-size:0.75rem;color:var(--mu2);letter-spacing:.6px;text-transform:uppercase;margin:18px 0 8px;}

.card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:13px;margin-bottom:9px;border-left:3px solid var(--mu2);}
.card.d15{border-left-color:var(--red);}
.card.d30{border-left-color:var(--warn);}
.card.d60{border-left-color:var(--cyan);}
.card.feito{border-left-color:var(--ok);opacity:.72;}
.c-top{display:flex;align-items:flex-start;gap:9px;}
.c-nm{flex:1;font-size:0.87rem;line-height:1.35;font-weight:500;}
.c-sub{font-size:0.68rem;color:var(--mu2);margin-top:3px;}
.pill{font-size:0.6rem;padding:3px 8px;border-radius:99px;font-weight:600;white-space:nowrap;}
.pill.r{background:rgba(255,77,79,.16);color:#ff9b9c;}
.pill.y{background:rgba(255,170,43,.16);color:#ffce80;}
.pill.c{background:rgba(34,211,238,.16);color:#8fe6f5;}
.pill.g{background:rgba(54,207,160,.16);color:#7fe4c4;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:11px;}
.fld{background:var(--bg);border:1px solid var(--br);border-radius:9px;padding:8px 9px;}
.fld small{display:block;font-size:0.6rem;color:var(--mu2);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px;}
.fld b{font-family:var(--fh);font-size:0.95rem;}
.fld.lock{opacity:.75;}

.inp-row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
.qtd{flex:1;min-width:110px;background:var(--bg);border:2px solid var(--b2);border-radius:9px;padding:11px;color:var(--tx);font-size:1.05rem;font-family:var(--fh);font-weight:700;text-align:center;outline:none;}
.qtd:focus{border-color:var(--qf);}
.qtd.done{border-color:var(--ok);color:var(--ok);}
.sel{flex:1.4;min-width:150px;background:var(--bg);border:1px solid var(--b2);border-radius:9px;padding:11px 9px;color:var(--tx);font-size:0.8rem;font-family:var(--fb);outline:none;}
.obs{width:100%;margin-top:7px;background:var(--bg);border:1px solid var(--br);border-radius:9px;padding:9px 11px;color:var(--tx);font-size:0.78rem;font-family:var(--fb);outline:none;}
.bt{background:var(--ok);border:none;border-radius:9px;padding:0 16px;color:#08251c;font-size:0.8rem;font-weight:700;font-family:var(--fh);cursor:pointer;white-space:nowrap;}
.bt:disabled{opacity:.45;cursor:not-allowed;}
.msg{font-size:0.7rem;margin-top:6px;min-height:14px;}
.g{color:var(--ok);}.r{color:var(--red);}.y{color:var(--warn);}.m{color:var(--mu);}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--sf);border-top:1px solid var(--br);padding:11px 14px;}
.dock-in{max-width:900px;margin:0 auto;display:flex;gap:8px;}
.dock button{flex:1;padding:14px;border:none;border-radius:10px;font-size:0.88rem;font-weight:600;font-family:var(--fh);cursor:pointer;background:var(--qf);color:#fff;}
.dock button.sec{background:var(--s2);border:1px solid var(--b2);color:var(--tx);}
.dock button:disabled{opacity:.45;cursor:not-allowed;}

.empty{text-align:center;color:var(--mu2);font-size:0.84rem;padding:46px 16px;line-height:1.65;}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--b2);border-top-color:var(--qf);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none !important;}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="top-r">
      <button class="back hide" id="btn-voltar" onclick="location.href='Index_Menu.html'">←</button>
      <div class="ttl">Conferência de Validade<small id="sub">—</small></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="bar-lbl"><span id="bar-l">—</span><span id="bar-r"></span></div>
  </div>
</div>

<div class="wrap"><div id="app"><div class="empty"><span class="spin"></span> Carregando…</div></div></div>

<div class="dock hide" id="dock"><div class="dock-in" id="dock-in"></div></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Q FOOD — Index_Validades.html  v1.0

   Backend: projeto do VALIDADES_SYNC_URL
     GET  ?tipo=val_listar&unidade=..&hash=..
     POST tipo=val_conferir | val_concluir

   ACESSO
   Pelo link do e-mail (?u=qfood&h=<hash>) o responsável entra sem
   login — o hash autentica aquela unidade, mesmo padrão do
   confirmacao.html do fornecedor. Pelo Menu, usa a sessão da UUSR.

   REGRA DE OURO
   Quantidade recebida e quantidade anterior são somente leitura.
   O usuário informa apenas a QUANTIDADE ATUAL. A baixa do período e
   a data da conferência são calculadas pelo servidor — se a data
   fosse digitada, daria para lançar retroativo.
   ══════════════════════════════════════════════════════════════ */

var API   = "https://script.google.com/macros/s/AKfycbxohOKq4Au2UYztDTNXS6kODOJXnTufkkVAkuRFrMrvXmRyh-sUSAJ3aOfVXjkB0bUG/exec";
var TOKEN = "qfood-rs-2026-xK9pL3mQ7vN2bT8";   // mesmo VALIDADES_SYNC_TOKEN do Index_Compras

var P    = new URLSearchParams(location.search);
var UNI  = (P.get("u") || P.get("unidade") || "qfood").toLowerCase();
var HASH = P.get("h") || P.get("hash") || "";
var USER = null, DADOS = null, FEITOS = {};

var ACOES = [
  ["", "Ação (opcional)"],
  ["COMUNICADO_COMERCIAL", "Comunicado ao comercial"],
  ["SEM_ESTOQUE", "Sem estoque"],
  ["PROMOCAO", "Colocar em promoção"],
  ["OUTROS", "Outros"]
];

/* ---------- init ---------- */
(function(){
  if(!HASH){
    var s=null;
    try{ s=JSON.parse(localStorage.getItem("qfood_session")||"null"); }catch(e){}
    if(!s||!s.email||(Date.now()-(s.ts||0))>8*60*60*1000){
      document.getElementById("app").innerHTML=
        '<div class="alert err"><b>Link inválido ou sessão expirada.</b><br>'+
        'Abra pelo link do e-mail que você recebeu, ou entre pelo Menu.</div>';
      return;
    }
    USER=s;
    document.getElementById("btn-voltar").classList.remove("hide");
  }
  carregar();
})();

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function num(v){ if(v===""||v==null) return null;
  var n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; }
function n2(v){ return (v==null)?"—":Number(v).toLocaleString("pt-BR",
  {minimumFractionDigits:2,maximumFractionDigits:2}); }
function quemSou(){ return HASH ? (DADOS?DADOS.responsavel:"link") : USER.email; }

/* ---------- rede ---------- */
function carregar(){
  document.getElementById("app").innerHTML='<div class="empty"><span class="spin"></span> Carregando itens…</div>';
  var q=API+"?tipo=val_listar&unidade="+encodeURIComponent(UNI);
  if(HASH) q+="&hash="+encodeURIComponent(HASH);
  else q+="&login="+encodeURIComponent(USER.email);

  fetch(q).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){
      document.getElementById("app").innerHTML='<div class="alert err">'+esc(j.erro||"Erro ao carregar")+'</div>';
      return;
    }
    DADOS=j; render();
  }).catch(function(e){
    document.getElementById("app").innerHTML='<div class="alert err">Falha de conexão.<br>'+esc(e)+'</div>';
  });
}

/* text/plain evita preflight CORS — mesmo padrão do Index_Compras */
function post(tipo, dado, cb){
  dado=dado||{}; dado.unidade=UNI;
  if(HASH) dado.hash=HASH;
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({token:TOKEN,tipo:tipo,dado:dado})})
    .then(function(r){return r.json();}).then(function(j){cb(null,j);})
    .catch(function(e){cb(e);});
}

/* ---------- render ---------- */
function render(){
  var itens=DADOS.itens||[];
  document.getElementById("sub").textContent=DADOS.nome_unidade+" · "+DADOS.responsavel;

  var feitos=itens.filter(function(i){return FEITOS[i.id_rodada];}).length;
  progresso(feitos,itens.length);

  if(!itens.length){
    document.getElementById("app").innerHTML=
      '<div class="empty">✓ Nenhum item pendente de conferência.<br><br>'+
      'Quando um produto chegar a um marco de validade, ele aparece aqui '+
      'e você recebe um e-mail.</div>';
    document.getElementById("dock").classList.add("hide");
    return;
  }

  var h="";
  var atrasados=itens.filter(function(i){return i.atrasada;});
  if(atrasados.length){
    h+='<div class="alert err"><b>'+atrasados.length+' item(ns) com prazo vencido.</b> '+
       'A gestão já foi avisada. Responder agora encerra a pendência.</div>';
  }

  h+='<div class="alert info">Informe a <b>quantidade atual</b> de cada item. '+
     'Se estiver zerado, informe <b>0</b> — o item sai do ciclo. Enquanto houver saldo, '+
     'ele volta no próximo marco de validade.</div>';

  h+='<div class="sec-h">'+itens.length+' item(ns) para conferir</div>';
  itens.forEach(function(i){ h+=card(i); });

  document.getElementById("app").innerHTML=h;
  atualizarDock();
}

function progresso(feito,total){
  var pct=total?Math.round(feito/total*100):0;
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("bar-l").textContent=DADOS?DADOS.nome_unidade:"—";
  document.getElementById("bar-r").textContent=feito+" de "+total;
}

function card(i){
  var d=i.dias_restantes;
  var cls = FEITOS[i.id_rodada] ? "feito"
          : (d!=null&&d<=15 ? "d15" : (d!=null&&d<=30 ? "d30" : (d!=null&&d<=60?"d60":"")));
  var pill = FEITOS[i.id_rodada] ? '<span class="pill g">CONFERIDO</span>'
           : (d==null ? '<span class="pill c">SEM VALIDADE</span>'
           : '<span class="pill '+(d<=15?"r":(d<=30?"y":"c"))+'">'+d+' DIAS</span>');

  var h='<div class="card '+cls+'" id="row-'+i.id_rodada+'">';
  h+='<div class="c-top"><div class="c-nm">'+esc(i.descricao)+
     '<div class="c-sub">Cód '+esc(i.codigo)+' · '+esc(i.fornecedor)+
     ' · vence '+esc(i.validade_br)+' · rodada '+i.rodada+'</div></div>'+pill+'</div>';

  h+='<div class="grid">'+
     '<div class="fld lock"><small>Recebida</small><b>'+n2(i.qtd_recebida)+' '+esc(i.unidade_medida)+'</b></div>'+
     '<div class="fld lock"><small>Última contagem</small><b>'+n2(i.qtd_anterior)+'</b></div>'+
     '<div class="fld lock"><small>Prazo</small><b>'+esc(i.prazo_br||"—")+'</b></div>'+
     '</div>';

  if(FEITOS[i.id_rodada]){
    var r=FEITOS[i.id_rodada];
    h+='<div class="grid" style="margin-top:8px">'+
       '<div class="fld"><small>Atual</small><b class="g">'+n2(r.qtd_atual)+'</b></div>'+
       '<div class="fld"><small>Baixa no período</small><b>'+n2(r.baixa_periodo)+'</b></div>'+
       '</div>';
    if(r.encerrado) h+='<div class="msg g">✓ Estoque zerado — item encerrado, não volta mais.</div>';
    else h+='<div class="msg g">✓ Gravado. Volta no próximo marco de validade.</div>';
  } else {
    h+='<div class="inp-row">'+
       '<input class="qtd" id="q-'+i.id_rodada+'" type="text" inputmode="decimal" placeholder="qtd atual" '+
         'onkeydown="tecla(event,\''+i.id_rodada+'\')">'+
       '<select class="sel" id="a-'+i.id_rodada+'">'+
         ACOES.map(function(a){return '<option value="'+a[0]+'">'+a[1]+'</option>';}).join("")+
       '</select>'+
       '<button class="bt" onclick="gravar(\''+i.id_rodada+'\')">Gravar</button>'+
       '</div>'+
       '<input class="obs" id="o-'+i.id_rodada+'" placeholder="Observação (opcional)">'+
       '<div class="msg" id="m-'+i.id_rodada+'"></div>';
  }
  return h+'</div>';
}

function tecla(e,id){ if(e.key==="Enter"){ e.preventDefault(); gravar(id,true); } }

/* ---------- gravação ---------- */
function gravar(id,irProximo){
  var el=document.getElementById("q-"+id), msg=document.getElementById("m-"+id);
  var q=num(el.value);
  if(q==null){ msg.className="msg r"; msg.textContent="Informe a quantidade atual (use 0 se zerou)."; el.focus(); return; }
  if(q<0){ msg.className="msg r"; msg.textContent="Quantidade não pode ser negativa."; return; }

  msg.className="msg m"; msg.textContent="Gravando…";
  post("val_conferir",{
    id_rodada:id, qtd_atual:q,
    acao_tomada:document.getElementById("a-"+id).value,
    obs:document.getElementById("o-"+id).value.trim(),
    conferido_por:quemSou()
  },function(err,j){
    if(err||!j.ok){ msg.className="msg r"; msg.textContent="Erro: "+((j&&j.erro)||"sem conexão"); return; }
    FEITOS[id]=j;
    render();
    if(irProximo) focarProximo();
  });
}

function focarProximo(){
  var itens=(DADOS.itens||[]);
  for(var k=0;k<itens.length;k++){
    if(FEITOS[itens[k].id_rodada]) continue;
    var n=document.getElementById("q-"+itens[k].id_rodada);
    if(n){ n.focus(); n.scrollIntoView({block:"center",behavior:"smooth"}); return; }
  }
}

/* ---------- conclusão ---------- */
function atualizarDock(){
  var itens=DADOS.itens||[];
  var feitos=Object.keys(FEITOS).length;
  var d=document.getElementById("dock");
  if(!itens.length){ d.classList.add("hide"); return; }
  d.classList.remove("hide");

  var falta=itens.length-feitos;
  document.getElementById("dock-in").innerHTML =
    '<button onclick="concluir()" '+(feitos===0?"disabled":"")+'>'+
      (falta>0 ? "Concluir "+feitos+" e enviar (faltam "+falta+")" : "Concluir e enviar relatório")+
    '</button>';
}

function concluir(){
  var ids=Object.keys(FEITOS);
  if(!ids.length) return;
  var falta=(DADOS.itens||[]).length-ids.length;
  if(falta>0 && !confirm("Ainda faltam "+falta+" item(ns).\n\nEnviar o relatório só com os "+
     ids.length+" já conferidos? Os demais continuam pendentes e cobrados.")) return;

  var b=document.querySelector("#dock-in button");
  b.disabled=true; b.textContent="Gerando relatório…";

  post("val_concluir",{ids_rodadas:ids, conferido_por:quemSou()},function(err,j){
    if(err||!j.ok){
      b.disabled=false; b.textContent="Tentar de novo";
      alert("Erro ao concluir: "+((j&&j.erro)||"sem conexão"));
      return;
    }
    var m="Relatório enviado.\n\n"+
          j.itens+" itens · baixa total "+n2(j.baixa_total)+"\n"+
          j.encerrados+" encerrados por estoque zerado\n"+
          (j.criticos?j.criticos+" vencendo em até 30 dias\n":"")+
          "\nPDF anexo enviado para "+j.email_para+
          "\ncom cópia para "+(j.email_cc||[]).length+" pessoa(s).";
    alert(m);
    FEITOS={}; carregar();
  });
}
</script>
</body>
</html>
