// 11b. INDICADORES — velocímetros e gráficos na aba de KPIs
// ────────────────────────────────────────────────────────────
var ReqKpi = {
  dados:    null,
  graficos: {},
  chartjs:  null,

  // Chart.js só é baixado quando alguém abre a aba. Quem nunca
  // usa o painel não paga o custo da biblioteca.
  carregarChartjs: function(){
    if(ReqKpi.chartjs) return ReqKpi.chartjs;
    ReqKpi.chartjs = new Promise(function(ok, falhou){
      if(window.Chart) return ok();
      var t = document.createElement("script");
      t.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js";
      t.onload = function(){ ok(); };
      t.onerror = function(){ falhou(new Error("Não consegui carregar a biblioteca de gráficos.")); };
      document.head.appendChild(t);
    });
    return ReqKpi.chartjs;
  },

  abrir: function(){
    mostrar("kpi");
    if(ReqKpi.dados){ ReqKpi.render(); return; }

    document.getElementById("v-kpi").innerHTML = '<div class="carregando">Carregando indicadores…</div>';
    Promise.all([
      ReqKpi.carregarChartjs(),
      ReqAPI.get("kpi", {})
    ]).then(function(r){
      ReqKpi.dados = r[1];
      ReqKpi.render();
    }).catch(function(e){
      document.getElementById("v-kpi").innerHTML =
        '<div class="vazio"><div class="vazio-t">Não deu para carregar os indicadores</div>' +
        '<div class="vazio-s">' + esc(e.message) + '</div></div>';
    });
  },

  filtros: function(){
    return '<div class="filtros" style="margin:18px 0">' +
      '<select class="sel" id="k-periodo">' +
        '<option value="30">Últimos 30 dias</option>' +
        '<option value="90" selected>Últimos 90 dias</option>' +
        '<option value="180">Últimos 6 meses</option>' +
        '<option value="365">Últimos 12 meses</option>' +
        '<option value="0">Tudo</option>' +
      '</select>' +
      '<select class="sel" id="k-empresa"><option value="">Todas as empresas</option>' +
        ((ReqState.config && ReqState.config.empresas) || []).map(function(e){
          return '<option value="' + esc(e.chave) + '">' + esc(e.valor) + '</option>';
        }).join("") +
      '</select></div>';
  },

  ligarFiltros: function(){
    var p = document.getElementById("k-periodo");
    var e = document.getElementById("k-empresa");
    if(p) p.onchange = ReqKpi.render;
    if(e) e.onchange = ReqKpi.render;
  },

  reais: function(n){
    return "R$ " + (Number(n)||0).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  },

  diasEntre: function(de, ate){
    var a = new Date(de), b = ate ? new Date(ate) : new Date();
    if(isNaN(a.getTime()) || isNaN(b.getTime())) return null;
    return (b.getTime() - a.getTime()) / 86400000;
  },

  horasEntre: function(de, ate){
    var d = ReqKpi.diasEntre(de, ate);
    return d === null ? null : d * 24;
  },

  media: function(lista){
    var v = lista.filter(function(x){ return x !== null && isFinite(x); });
    if(!v.length) return null;
    return v.reduce(function(a,b){ return a+b; }, 0) / v.length;
  },

// ── Velocímetro ─────────────────────────────────────────────
// Arco de 270°, percentual gigante no centro, cor pela faixa.
  gauge: function(pct, base, titulo, descricao, unidade){
  var vazio = (pct === null);
  var v = vazio ? 0 : Math.max(0, Math.min(100, pct));
  var cor = vazio ? "var(--mu2)" : (v >= 90 ? "var(--ok)" : (v >= 70 ? "var(--warn)" : "var(--red)"));

  var raio = 80, cx = 100, cy = 100;
  var inicio = 135, varredura = 270;
  var ponto = function(ang){
    var r = (ang - 90) * Math.PI / 180;
    return [cx + raio * Math.cos(r), cy + raio * Math.sin(r)];
  };
  var arco = function(de, ate){
    var a = ponto(de), b = ponto(ate);
    var grande = (ate - de) > 180 ? 1 : 0;
    return "M " + a[0].toFixed(2) + " " + a[1].toFixed(2) +
           " A " + raio + " " + raio + " 0 " + grande + " 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2);
  };

  var fim = inicio + (varredura * v / 100);
  var agulha = ponto(fim);

  return '<div class="gauge">' +
    '<svg viewBox="0 0 200 175" role="img" aria-label="' + esc(titulo) + ': ' +
      (vazio ? "sem dados" : v.toFixed(0) + "%") + '">' +
      '<path d="' + arco(inicio, inicio + varredura) + '" fill="none" stroke="var(--s3)" ' +
        'stroke-width="16" stroke-linecap="round"></path>' +
      (v > 0 ? '<path d="' + arco(inicio, fim) + '" fill="none" stroke="' + cor + '" ' +
        'stroke-width="16" stroke-linecap="round"></path>' : '') +
      (vazio ? '' : '<circle cx="' + agulha[0].toFixed(2) + '" cy="' + agulha[1].toFixed(2) +
        '" r="7" fill="' + cor + '" stroke="var(--sf)" stroke-width="3"></circle>') +
      '<text x="100" y="105" text-anchor="middle" class="g-pct" fill="' + cor + '">' +
        (vazio ? "—" : v.toFixed(0) + (unidade || "%")) + '</text>' +
      '<text x="100" y="128" text-anchor="middle" class="g-sub">' + esc(base) + '</text>' +
    '</svg>' +
    '<div class="g-tit">' + esc(titulo) + '</div>' +
    '<div class="g-desc">' + esc(descricao) + '</div>' +
  '</div>';
  },

// ── Filtro de período e empresa ─────────────────────────────
  filtrar: function(){
  var selP = document.getElementById("k-periodo");
  var selE = document.getElementById("k-empresa");
  var d = selP ? parseInt(selP.value, 10) : 90;
  var emp = selE ? selE.value : "";
  var corte = d ? new Date(Date.now() - d * 86400000).toISOString() : "";

  return (ReqKpi.dados.registros || []).filter(function(r){
    if(corte && r.abertura < corte) return false;
    if(emp && r.empresa !== emp) return false;
    return true;
  });
  },

// ── Cálculo e desenho ───────────────────────────────────────
  render: function(){
  var rs = ReqKpi.filtrar();
  var el = document.getElementById("v-kpi");

  if(!rs.length){
    el.innerHTML = ReqKpi.filtros() +
      '<div class="vazio" style="padding:60px">Nenhuma requisição no período escolhido.</div>';
    ReqKpi.ligarFiltros();
    return;
  }

  // ---- KPI 1: entrega dentro da previsão ----
  var comPrevisao = rs.filter(function(r){ return r.recebimento && r.prazoEntrega; });
  var noPrazo = comPrevisao.filter(function(r){
    return r.recebimento.substring(0,10) <= r.prazoEntrega;
  });
  var kpiPrazo = comPrevisao.length ? (noPrazo.length / comPrevisao.length * 100) : null;

  // ---- KPI 2: fluxo respeitado (passou por aprovação) ----
  var chegaramCompras = rs.filter(function(r){ return r.aprovadaEm || r.nasceuAprovada; });
  var aprovadas = chegaramCompras.filter(function(r){ return !!r.aprovadaEm; });
  var kpiFluxo = chegaramCompras.length ? (aprovadas.length / chegaramCompras.length * 100) : null;

  // ---- KPI 3: recebimento sem divergência ----
  var recebidas = rs.filter(function(r){ return r.statusRecebimento; });
  var limpas = recebidas.filter(function(r){ return r.statusRecebimento === "OK"; });
  var kpiRecebimento = recebidas.length ? (limpas.length / recebidas.length * 100) : null;

  // ---- Números de apoio ----
  var abertas = rs.filter(function(r){
    return ["CONCLUIDA","CANCELADA","RECUSADA"].indexOf(r.status) < 0;
  });
  var hojeIso = new Date().toISOString().substring(0,10);
  var atrasadas = abertas.filter(function(r){
    return r.prazoRetorno && r.prazoRetorno < hojeIso &&
           (r.status === "EM_COTACAO" || r.status === "AGUARDANDO_INFORMACAO");
  });
  var mediaRetorno = ReqKpi.media(rs.map(function(r){
    if(!r.primeiroRetorno) return null;
    return ReqKpi.horasEntre(r.aprovadaEm || r.abertura, r.primeiroRetorno);
  }));
  var mediaCiclo = ReqKpi.media(rs.map(function(r){
    if(!r.conclusao) return null;
    return ReqKpi.diasEntre(r.abertura, r.conclusao);
  }));
  var valorTotal = rs.reduce(function(a, r){ return a + (r.valorFinal || 0); }, 0);

  var h = ReqKpi.filtros();

  h += '<div class="gauges">' +
    ReqKpi.gauge(kpiPrazo, comPrevisao.length + " entregas avaliadas", "Entregue no prazo",
          "Recebidas até a previsão que a Cris informou ao registrar a compra.") +
    ReqKpi.gauge(kpiFluxo, chegaramCompras.length + " requisições na fila", "Fluxo respeitado",
          "Chegaram em Compras com aprovação registrada, em vez de entrar direto.") +
    ReqKpi.gauge(kpiRecebimento, recebidas.length + " recebimentos", "Recebido sem divergência",
          "Chegou completo e correto, sem faltar item nem problema na entrega.") +
  '</div>';

  h += '<div class="nums">' +
    '<div class="num"><div class="num-n">' + abertas.length + '</div><div class="num-l">Em aberto agora</div></div>' +
    '<div class="num' + (atrasadas.length ? ' alerta' : '') + '"><div class="num-n">' + atrasadas.length +
      '</div><div class="num-l">Retornos atrasados</div></div>' +
    '<div class="num"><div class="num-n">' +
      (mediaRetorno === null ? "—" : (mediaRetorno < 24 ? mediaRetorno.toFixed(0) + "h" : (mediaRetorno/24).toFixed(1) + "d")) +
      '</div><div class="num-l">1º retorno de Compras</div></div>' +
    '<div class="num"><div class="num-n">' +
      (mediaCiclo === null ? "—" : mediaCiclo.toFixed(1) + "d") +
      '</div><div class="num-l">Ciclo completo médio</div></div>' +
  '</div>';

  h += '<div class="graficos">' +
    '<div class="card"><div class="card-t">Onde estão as requisições</div>' +
      '<div class="card-s">Distribuição por status no período</div>' +
      '<div class="chart-box"><canvas id="g-status"></canvas></div></div>' +
    '<div class="card"><div class="card-t">Volume por empresa</div>' +
      '<div class="card-s">Quantidade de requisições abertas</div>' +
      '<div class="chart-box"><canvas id="g-empresa"></canvas></div></div>' +
    '<div class="card"><div class="card-t">Quem mais pede</div>' +
      '<div class="card-s">Top 8 solicitantes</div>' +
      '<div class="chart-box"><canvas id="g-solic"></canvas></div></div>' +
    '<div class="card"><div class="card-t">Valor comprado</div>' +
      '<div class="card-s">Total ' + esc(ReqKpi.reais(valorTotal)) + ' no período</div>' +
      '<div class="chart-box"><canvas id="g-valor"></canvas></div></div>' +
  '</div>';

  // ---- Paradas há mais tempo ----
  var paradas = abertas.slice().sort(function(a, b){
    return (a.ultimaAtualizacao || "").localeCompare(b.ultimaAtualizacao || "");
  }).slice(0, 10);

  h += '<div class="card"><div class="card-t">Paradas há mais tempo</div>' +
       '<div class="card-s">As dez requisições em aberto sem movimento há mais dias</div>';
  h += paradas.length
    ? '<table><thead><tr><th>Nº</th><th>O que é</th><th>Empresa</th><th>Aguardando</th><th>Parada há</th></tr></thead><tbody>' +
      paradas.map(function(r){
        var d = ReqKpi.diasEntre(r.ultimaAtualizacao, null);
        var cls = d > 7 ? "dias ruim" : (d > 3 ? "dias atencao" : "dias");
        return '<tr>' +
          '<td><a href="Index_Requisicoes.html?rq=' + encodeURIComponent(r.id) + '" style="color:var(--blue)">' + esc(r.id) + '</a></td>' +
          '<td>' + esc(r.titulo || r.solicitante) + '</td>' +
          '<td>' + esc(r.empresa) + '</td>' +
          '<td>' + esc((r.responsavelAtual || "").split("@")[0]) + '</td>' +
          '<td class="' + cls + '">' + (d === null ? "—" : d.toFixed(0) + " dias") + '</td>' +
        '</tr>';
      }).join("") + '</tbody></table>'
    : '<div class="vazio">Nenhuma requisição em aberto.</div>';
  h += '</div>';

  el.innerHTML = h;
  ReqKpi.ligarFiltros();

  ReqKpi.desenharGraficos(rs);
  },

// ── Gráficos ────────────────────────────────────────────────
  agrupar: function(lista, chave){
  var m = {};
  lista.forEach(function(r){
    var k = r[chave] || "—";
    m[k] = (m[k] || 0) + 1;
  });
  return m;
  },

  desenharGraficos: function(rs){
  Object.keys(ReqKpi.graficos).forEach(function(k){
    try { ReqKpi.graficos[k].destroy(); } catch(_){}
  });
  ReqKpi.graficos = {};

  var css = getComputedStyle(document.documentElement);
  var cor = function(v){ return css.getPropertyValue(v).trim(); };
  Chart.defaults.color = cor("--mu");
  Chart.defaults.font.family = "DM Sans, sans-serif";
  Chart.defaults.font.size = 11;

  var grade = {grid:{color:"rgba(255,255,255,0.06)"}, ticks:{color:cor("--mu2")}};

  var rotulos = {
    NOVA:"Nova", EM_TRIAGEM:"Aprovação", EM_ANALISE:"Com Compras", EM_COTACAO:"Cotação",
    AGUARDANDO_INFORMACAO:"Aguardando resposta", AGUARDANDO_APROVACAO:"Alçada",
    COMPRADA:"Comprada", AGUARDANDO_ENTREGA:"A caminho", RECEBIDA_OK:"Recebida",
    RECEBIDA_PARCIAL:"Parcial", RECEBIDA_DIVERGENCIA:"Divergência",
    CONCLUIDA:"Concluída", CANCELADA:"Cancelada", RECUSADA:"Recusada"
  };

  // Status
  var porStatus = ReqKpi.agrupar(rs, "status");
  ReqKpi.graficos.status = new Chart(document.getElementById("g-status"), {
    type:"bar",
    data:{
      labels: Object.keys(porStatus).map(function(k){ return rotulos[k] || k; }),
      datasets:[{data: Object.values(porStatus), backgroundColor: cor("--blue"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, indexAxis:"y", plugins:{legend:{display:false}},
             scales:{x:grade, y:grade}}
  });

  // Empresa
  var porEmpresa = ReqKpi.agrupar(rs, "empresa");
  ReqKpi.graficos.empresa = new Chart(document.getElementById("g-empresa"), {
    type:"bar",
    data:{
      labels: Object.keys(porEmpresa),
      datasets:[{data: Object.values(porEmpresa), backgroundColor: cor("--lime"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:grade, y:grade}}
  });

  // Solicitantes
  var porSolic = ReqKpi.agrupar(rs, "solicitante");
  var topo = Object.keys(porSolic).sort(function(a,b){ return porSolic[b]-porSolic[a]; }).slice(0,8);
  ReqKpi.graficos.solic = new Chart(document.getElementById("g-solic"), {
    type:"bar",
    data:{
      labels: topo.map(function(k){ return k.split("@")[0]; }),
      datasets:[{data: topo.map(function(k){ return porSolic[k]; }),
                 backgroundColor: cor("--pur"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, indexAxis:"y", plugins:{legend:{display:false}},
             scales:{x:grade, y:grade}}
  });

  // Valor por empresa
  var valores = {};
  rs.forEach(function(r){
    if(!r.valorFinal) return;
    valores[r.empresa || "—"] = (valores[r.empresa || "—"] || 0) + r.valorFinal;
  });
  ReqKpi.graficos.valor = new Chart(document.getElementById("g-valor"), {
    type:"bar",
    data:{
      labels: Object.keys(valores),
      datasets:[{data: Object.values(valores), backgroundColor: cor("--cyan"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, plugins:{legend:{display:false},
      tooltip:{callbacks:{label:function(c){ return ReqKpi.reais(c.raw); }}}},
      scales:{x:grade, y:Object.assign({}, grade, {ticks:{color:cor("--mu2"),
        callback:function(v){ return "R$ " + (v/1000).toFixed(0) + "k"; }}})}}
  });
  }
};

// ────────────────────────────────────────────────────────────
// 12. INICIALIZAÇÃO
// ────────────────────────────────────────────────────────────
function ReqInit(){
  ReqState.sessao = ReqSessao();
  if(!ReqState.sessao) return;

  document.getElementById("quem").textContent = ReqState.sessao.nome || ReqState.sessao.email;

  ReqAPI.get("config", {}).then(function(c){
    ReqState.config = c;

    if(c.usuario.isCompras){
      document.getElementById("titulo").textContent = "Central de Requisições — Compras";
    } else if(ReqHome.aprovador()){
      document.getElementById("titulo").textContent = "Central de Requisições — Aprovações";
    }

    // Aba de indicadores: só para quem aprova, compra ou administra
    if(c.usuario.isCompras || c.usuario.isAdmin || ReqHome.aprovador()){
      var abas = document.getElementById("abas");
      abas.dataset.liberado = "1";
      abas.style.display = "flex";
    }

    document.getElementById("f-empresa").innerHTML =
      '<option value="">Todas as empresas</option>' +
      (c.empresas || []).map(function(e){
        return '<option value="' + esc(e.chave) + '">' + esc(e.valor) + '</option>';
      }).join("");

    document.getElementById("f-status").innerHTML =
      '<option value="">Todos os status</option>' +
      Object.keys(c.statusLabel).map(function(k){
        return '<option value="' + esc(k) + '">' + esc(c.statusLabel[k]) + '</option>';
      }).join("");

    ReqHome.montar();

    // Deep link vindo do e-mail: Index_Requisicoes.html?rq=RQ-2026-0001
    var m = location.search.match(/[?&]rq=([^&]+)/);
    if(m){
      ReqLista.carregar();
      return ReqDetalhe.abrir(decodeURIComponent(m[1]));
    }

    return ReqNotif.sincronizar();
  }).then(function(){
    ReqNotif.iniciar();
  }).catch(function(e){
    document.getElementById("lista").innerHTML =
      '<div class="vazio"><div class="vazio-t">Não deu para entrar</div>' +
      '<div class="vazio-s">' + esc(e.message) + '</div>' +
      '<a class="btn btn-s" href="Index_Menu.html">Voltar ao menu</a></div>';
  });

  // Eventos de tela
  document.querySelectorAll(".aba").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll(".aba").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      if(b.dataset.aba === "kpi") ReqKpi.abrir();
      else { mostrar("lista"); ReqLista.render(); }
    };
  });

  document.getElementById("btn-nova").onclick = function(){ ReqForm.abrir(); };
  document.getElementById("sino").onclick     = function(){ ReqNotif.verNovidades(); };

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(document.getElementById("lightbox").classList.contains("on")) return ReqFoto.fechar();
    if(document.getElementById("modal").classList.contains("on")){
      document.getElementById("modal").classList.remove("on");
      document.getElementById("modal-cx").innerHTML = "";
    }
  });

  document.getElementById("f-busca").oninput    = function(){ ReqLista.render(); };
  document.getElementById("f-empresa").onchange = function(){ ReqLista.render(); };
  document.getElementById("f-status").onchange  = function(){ ReqLista.render(); };
}

ReqInit();
</script>
