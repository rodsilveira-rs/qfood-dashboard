    if(ReqEntregas.recebedorDeAlgo())  itens.push({nav:"receber", ico:"receber", rotulo:"Para receber"});
    itens.push({nav:"encerradas", ico:"arquivo", rotulo:"Encerradas"});
    if(ReqHome.veIndicadores())        itens.push({sep:true}, {nav:"kpi", ico:"kpi", rotulo:"Indicadores"});
    return itens;
  },

  montar: function(){
    ReqState.escopo = ReqHome.escopoInicial();

    document.getElementById("side-nav").innerHTML = ReqHome.nav().map(function(n){
      if(n.sep) return '<div class="nav-sep"></div>';
      return '<button class="nav-it" data-nav="' + n.nav + '">' + ReqIco.svg(n.ico) +
             '<span>' + esc(n.rotulo) + '</span>' +
             (n.badge ? '<span class="nb" id="nav-badge" style="display:none">0</span>' : '') +
             '</button>';
    }).join("");
    document.querySelectorAll(".nav-it").forEach(function(b){
      b.onclick = function(){
        if(b.dataset.nav === "kpi") ReqKpi.abrir();
        else ReqHome.ativar(b.dataset.nav);
      };
    });

    document.getElementById("cnt-grid").innerHTML = ReqHome.cartoes().map(function(c){
      var v = ReqHome.visual[c.escopo] || {ico:"fila", tom:"lime"};
      return '<button class="tile tone-' + v.tom + '" data-escopo="' + c.escopo + '">' +
               '<span class="tile-ico">' + ReqIco.svg(v.ico) + '</span>' +
               '<span><div class="tile-n" id="cnt-' + c.escopo + '">–</div>' +
               '<div class="tile-l">' + esc(c.rotulo) + '</div></span>' +
             '</button>';
    }).join("");
    document.querySelectorAll(".tile").forEach(function(b){
      b.onclick = function(){ ReqHome.ativar(b.dataset.escopo); };
    });

    ReqHome.chips();
    ReqHome.marcar();
  },

  chips: function(){
    var lista = [{escopo:"abertas", rotulo:"Todos"}]
      .concat(ReqHome.cartoes())
      .concat([{escopo:"encerradas", rotulo:"Encerradas"}]);
    document.getElementById("chips").innerHTML = lista.map(function(c){
      var n = ReqState.lista.filter(function(r){ return ReqLista.noEscopo(r, c.escopo); }).length;
      return '<button class="chip-f" data-escopo="' + c.escopo + '">' +
             esc(c.rotulo) + ' (' + n + ')</button>';
    }).join("");
    document.querySelectorAll(".chip-f").forEach(function(b){
      b.onclick = function(){ ReqHome.ativar(b.dataset.escopo); };
    });
  },

  // Uma fila ativa por vez: cartão, chip e item da lateral andam juntos
  marcar: function(){
    var e = ReqState.escopo;
    document.querySelectorAll(".tile").forEach(function(b){ b.classList.toggle("on", b.dataset.escopo === e); });
    document.querySelectorAll(".chip-f").forEach(function(b){ b.classList.toggle("on", b.dataset.escopo === e); });
    document.querySelectorAll(".nav-it").forEach(function(b){ b.classList.toggle("on", b.dataset.nav === e); });
  },

  ativar: function(escopo){
    ReqState.escopo = escopo;
    ReqState.detalheId = null;
    mostrar("lista");
    ReqHome.marcar();
    ReqLista.render();
  },

  contar: function(){
    ReqHome.cartoes().forEach(function(c){
      var el = document.getElementById("cnt-" + c.escopo);
      if(!el) return;
      el.textContent = ReqState.lista.filter(function(r){
        return ReqLista.noEscopo(r, c.escopo);
      }).length;
    });

    var minhas = ReqState.lista.filter(ReqLista.precisaDeMim).length;
    var nb = document.getElementById("nav-badge");
    if(nb){ nb.textContent = minhas; nb.style.display = minhas ? "inline-block" : "none"; }

    ReqHome.chips();
    ReqHome.marcar();
  }
};

// ────────────────────────────────────────────────────────────
// 9f. ENTREGAS — quem recebe na porta confere e dá baixa
// ────────────────────────────────────────────────────────────
var ReqEntregas = {
  // Empresas em que o usuário é o recebedor (REQ_PARAM: RECEBEDOR)
  empresas: function(){
    var eu = (ReqState.sessao.email || "").toLowerCase();
    return ((ReqState.config && ReqState.config.recebedores) || [])
      .filter(function(r){ return String(r.valor).toLowerCase() === eu; })
      .map(function(r){ return r.chave; });
  },

  souRecebedor: function(empresa){
    return ReqEntregas.empresas().indexOf(String(empresa || "").toUpperCase()) >= 0;
  },

  recebedorDeAlgo: function(){
    return ReqEntregas.empresas().length > 0;
  },

  hojeIso: function(){
    var d = new Date();
    return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
  },

  maisDias: function(n){
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
  },

  // Separa o que está a caminho em: atrasado, hoje, próximos 3 dias e sem previsão.
  // "Mais adiante" fica de fora do aviso para ele não virar ruído.
  grupos: function(){
    var hoje = ReqEntregas.hojeIso();
    var limite = ReqEntregas.maisDias(3);
    var g = {atraso:[], hoje:[], breve:[], sem:[]};

    ReqState.lista.forEach(function(r){
      if(!ReqLista.noEscopo(r, "receber")) return;
      var prev = (r.prazoEntrega || "").substring(0, 10);
      if(!prev)              g.sem.push(r);
      else if(prev < hoje)   g.atraso.push(r);
      else if(prev === hoje) g.hoje.push(r);
      else if(prev <= limite)g.breve.push(r);
    });

    var porData = function(a, b){ return (a.prazoEntrega || "").localeCompare(b.prazoEntrega || ""); };
    g.atraso.sort(porData); g.hoje.sort(porData); g.breve.sort(porData);
    return g;
  },

  // O aviso abre no primeiro acesso do dia. Depois disso a lista fica
  // no cartão "Para receber" — repetir a cada acesso vira clique no automático.
  chave: function(){
    return "req_entregas_visto_" + (ReqState.sessao.email || "");
  },

  talvezMostrar: function(){
    if(!ReqEntregas.recebedorDeAlgo()) return;
    if(ReqState.detalheId) return;
    var visto = "";
    try { visto = localStorage.getItem(ReqEntregas.chave()) || ""; } catch(_){}
    if(visto === ReqEntregas.hojeIso()) return;

    var g = ReqEntregas.grupos();
    var total = g.atraso.length + g.hoje.length + g.breve.length + g.sem.length;
    if(!total) return;
    ReqEntregas.abrir();
  },

  abrir: function(){
    var g = ReqEntregas.grupos();
    var total = g.atraso.length + g.hoje.length + g.breve.length + g.sem.length;

    var bloco = function(classe, titulo, lista){
      if(!lista.length) return "";
      return '<div class="ent-grupo ' + classe + '">' +
        '<div class="ent-grupo-t">' + esc(titulo) + ' <span class="qt">' + lista.length + '</span></div>' +
        lista.map(ReqEntregas.linha).join("") +
      '</div>';
    };

    var cx = document.getElementById("modal-cx");
    cx.classList.add("largo");
    cx.innerHTML =
      '<div class="modal-t">📦 Entregas para conferir</div>' +
      '<div class="modal-s">' + (total
        ? 'Confirme o que chegou. Se ainda não veio, avise — a cobrança volta para a Cris.'
        : 'Nenhuma entrega pendente de conferência.') + '</div>' +
      bloco("atraso", "Previsão já passou", g.atraso) +
      bloco("hoje",   "Chega hoje",         g.hoje) +
      bloco("breve",  "Próximos 3 dias",    g.breve) +
      bloco("sem",    "Sem previsão informada", g.sem) +
      '<div class="btns" style="margin-top:6px">' +
        '<button class="btn btn-p" onclick="ReqEntregas.fechar(true)">Ok, entendi</button>' +
        '<button class="btn btn-s" onclick="ReqEntregas.verTodas()">Ver todas na lista</button>' +
      '</div>';

    document.getElementById("modal").classList.add("on");
  },

  linha: function(r){
    var prev = (r.prazoEntrega || "").substring(0, 10);
    return '<div class="ent" id="ent-' + esc(r.id) + '">' +
      '<div class="ent-tit">' + esc(r.titulo) + '</div>' +
      '<div class="ent-meta">' + esc(r.id) + ' · ' +
        esc([nomeEmpresa(r.empresa), r.unidade].filter(Boolean).join(" · ")) + '<br>' +
        (prev ? 'Previsão ' + esc(dataBr(prev)) : 'Sem previsão') +
        (r.fornecedor ? ' · ' + esc(r.fornecedor) : '') +
        ' · Pedido por ' + esc(nomeDe(r.solicitanteOriginal || r.abertoPor)) +
      '</div>' +
      '<div class="btns">' +
        '<button class="btn btn-ok" onclick="ReqEntregas.chegouCerto(\'' + r.id + '\')">✓ Chegou certo</button>' +
        '<button class="btn btn-d" onclick="ReqEntregas.outro(\'' + r.id + '\',\'DIVERGENCIA\')">Chegou com problema</button>' +
        '<button class="btn btn-s" onclick="ReqEntregas.outro(\'' + r.id + '\',\'NAO_RECEBI\')">Ainda não chegou</button>' +
        '<button class="btn btn-s" onclick="ReqEntregas.fechar(false);ReqDetalhe.abrir(\'' + r.id + '\')">Abrir</button>' +
      '</div>' +
    '</div>';
  },

  fechar: function(marcarVisto){
    if(marcarVisto){
      try { localStorage.setItem(ReqEntregas.chave(), ReqEntregas.hojeIso()); } catch(_){}
    }
    document.getElementById("modal").classList.remove("on");
    document.getElementById("modal-cx").classList.remove("largo");
    document.getElementById("modal-cx").innerHTML = "";
  },

  verTodas: function(){
    ReqEntregas.fechar(true);
    ReqHome.ativar("receber");
  },

  // Botão "Receber" da fila: as mesmas opções do aviso, só daquela entrega
  uma: function(id){
    var r = ReqState.lista.filter(function(x){ return x.id === id; })[0];
    if(!r){ toast("Recarregue a lista.", true); return; }
    var cx = document.getElementById("modal-cx");
    cx.classList.add("largo");
    cx.innerHTML = '<div class="modal-t">📦 Conferir entrega</div>' +
      '<div class="modal-s">Confirme o que chegou. Se algo faltar, a Cris é avisada por e-mail.</div>' +
      ReqEntregas.linha(r) +
      '<div class="btns" style="margin-top:6px"><button class="btn btn-s" onclick="ReqEntregas.fechar(false)">Fechar</button></div>';
    document.getElementById("modal").classList.add("on");
  },

  // Caminho curto: chegou tudo certo, sem foto obrigatória.
  chegouCerto: function(id){
    if(!confirm("Confirmar que " + id + " chegou completo e correto? A requisição será encerrada.")) return;
    ReqAPI.post("confirmarRecebimento", {id:id, situacao:"OK", observacao:"Conferido na entrega"},
                "Registrando recebimento…")
      .then(function(){
        toast(id + " recebida e encerrada.");
        return ReqLista.carregar();
      })
      .then(function(){
        var g = ReqEntregas.grupos();
        if(g.atraso.length + g.hoje.length + g.breve.length + g.sem.length) ReqEntregas.abrir();
        else ReqEntregas.fechar(true);
      })
      .catch(function(e){ toast(e.message, true); });
  },

  // Problema ou "não chegou": reaproveita o modal de recebimento,
  // que exige observação e foto e avisa a Cris por e-mail.
  outro: function(id, situacao){
    ReqEntregas.fechar(false);
    ReqState.detalheId = id;
    ReqReceb.abrir(situacao);
  }
};

// 9e. APROVAÇÃO — quem pode aprovar cada empresa
// ────────────────────────────────────────────────────────────
var ReqAprov = {
  // Lista de e-mails autorizados a aprovar as requisições de uma empresa.
  // A ordem da REQ_PARAM importa: o primeiro é quem aparece como responsável.
  daEmpresa: function(empresa){
    var e = String(empresa || "").toUpperCase();
    return ((ReqState.config && ReqState.config.aprovadores) || [])
      .filter(function(g){ return g.chave === e; })
      .map(function(g){ return g.valor; });
  },

  exigeAprovacao: function(empresa){
    var e = String(empresa || "").toUpperCase();
    var lista = ((ReqState.config && ReqState.config.triagem) || [])
      .filter(function(t){ return t.chave === e; });
    return lista.length ? String(lista[0].valor).toUpperCase() === "SIM" : false;
  },

  souAprovador: function(empresa){
    var eu = (ReqState.config && ReqState.config.usuario.email || "").toLowerCase();
    return ReqAprov.daEmpresa(empresa).some(function(m){ return m.toLowerCase() === eu; });
  },

  // Aprovação direto da lista: o Matheus não precisa abrir uma a uma
  // para liberar sacola e material óbvio. Recusar e pedir ajuste
  // continuam exigindo o detalhe, porque pedem justificativa.
  rapida: function(id){
    var r = ReqState.lista.filter(function(x){ return x.id === id; })[0];
    if(!r){ toast("Recarregue a lista.", true); return; }

    document.getElementById("modal-cx").innerHTML =
      '<div class="modal-t">Aprovar ' + esc(r.id) + '?</div>' +
      '<div class="modal-s">Ao aprovar, a requisição vai direto para a fila da Cris.</div>' +
      '<div class="card" style="margin:0 0 16px"><dl class="kv">' +
        '<dt>O que é</dt><dd>' + esc(r.titulo) + '</dd>' +
        '<dt>Empresa</dt><dd>' + esc([nomeEmpresa(r.empresa), r.unidade, r.setor].filter(Boolean).join(" · ")) + '</dd>' +
        '<dt>Pedido por</dt><dd>' + esc(r.solicitanteOriginal || r.abertoPorNome) + '</dd>' +
        '<dt>Urgência</dt><dd>' + esc(r.urgencia) + '</dd>' +
        (r.dataNecessidade ? '<dt>Precisa até</dt><dd>' + esc(dataBr(r.dataNecessidade)) + '</dd>' : '') +
      '</dl></div>' +
      '<div class="btns">' +
        '<button class="btn btn-ok" id="ap-ok" onclick="ReqAprov.confirmar(\'' + r.id + '\')">✓ Aprovar e enviar para a Cris</button>' +
        '<button class="btn btn-s" onclick="ReqAprov.fechar();ReqDetalhe.abrir(\'' + r.id + '\')">Abrir para analisar</button>' +
        '<button class="btn btn-s" onclick="ReqAprov.fechar()">Cancelar</button>' +
      '</div>';

    document.getElementById("modal").classList.add("on");
  },

  fechar: function(){
    document.getElementById("modal").classList.remove("on");
    document.getElementById("modal-cx").innerHTML = "";
  },

  confirmar: function(id){
    var btn = document.getElementById("ap-ok");
    btn.disabled = true;
    btn.textContent = "Aprovando…";
    ReqAPI.post("alterarStatus", {id:id, status:"EM_ANALISE", texto:"Aprovada"}, "Aprovando…")
      .then(function(){
        ReqAprov.fechar();
        toast(id + " aprovada. Já está com a Cris.");
        return ReqNotif.sincronizar();
      })
      .catch(function(e){
        toast(e.message, true);
        btn.disabled = false;
        btn.textContent = "✓ Aprovar e enviar para a Cris";
      });
  },

  // Bloco do detalhe: quem aprovou e quando, ou quem ainda pode aprovar.
  bloco: function(r, eventos){
    if(!ReqAprov.exigeAprovacao(r.empresa)) return "";

    var ev = (eventos || []).filter(function(e){
      return e.tipo === "STATUS" && e.statusAnterior === "EM_TRIAGEM" && e.statusNovo === "EM_ANALISE";
    }).pop();

    if(ev){
      return '<div class="card"><div class="card-t">Aprovação</div><dl class="kv">' +
             '<dt>Situação</dt><dd style="color:var(--ok)">✓ Aprovada</dd>' +
             '<dt>Por</dt><dd>' + esc(ev.usuarioNome || nomeDe(ev.usuario)) + '</dd>' +
             '<dt>Quando</dt><dd>' + esc(horaBr(ev.dataHora)) + '</dd>' +
             '</dl></div>';
    }

    if(r.status !== "EM_TRIAGEM") return "";

    return '<div class="card"><div class="card-t">Aprovação</div><dl class="kv">' +
           '<dt>Situação</dt><dd style="color:var(--warn)">⏳ Aguardando aprovação</dd>' +
           '<dt>Pode aprovar</dt><dd>' +
             esc(ReqAprov.daEmpresa(r.empresa).map(nomeDe).join(" · ")) + '</dd>' +
           '</dl></div>';
  }
};

// ────────────────────────────────────────────────────────────
// 9d. PRAZO DE RETORNO — Compras não segura requisição sem data
// ────────────────────────────────────────────────────────────
var ReqPrazo = {
  // Quanto tempo Compras tem para voltar, conforme a urgência
  diasPorUrgencia: {Emergencial:0, Alta:1, Normal:3, Baixa:5},
  req: null,

  hojeIso: function(){
    var d = new Date();
    return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
  },

  maisDias: function(n){
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
  },

  // Sugestão = o que a urgência pede, mas nunca depois de quando precisam do item.
  // Se o prazo é curto, sobra a véspera. Se já estourou, é hoje.
  sugerir: function(r){
    var porUrgencia = ReqPrazo.maisDias(ReqPrazo.diasPorUrgencia[r.urgencia] === undefined ? 3 : ReqPrazo.diasPorUrgencia[r.urgencia]);
    var nec = (r.dataNecessidade || "").substring(0, 10);
    if(!nec) return porUrgencia;
    var vespera = new Date(nec + "T12:00:00");
    vespera.setDate(vespera.getDate() - 1);
    var vIso = vespera.getFullYear() + "-" + ("0"+(vespera.getMonth()+1)).slice(-2) + "-" + ("0"+vespera.getDate()).slice(-2);
    var limite = (porUrgencia < vIso) ? porUrgencia : vIso;
    return (limite < ReqPrazo.hojeIso()) ? ReqPrazo.hojeIso() : limite;
  },

  atrasada: function(r){
    if(!r || !r.prazoRetorno) return false;
    if(r.status !== "EM_COTACAO" && r.status !== "AGUARDANDO_INFORMACAO") return false;
    return r.prazoRetorno.substring(0, 10) < ReqPrazo.hojeIso();
  },

  abrir: function(status){
    var r = ReqState.reqAtual;
    if(!r){ toast("Recarregue a requisição.", true); return; }
    ReqPrazo.req = r;

    var nec = (r.dataNecessidade || "").substring(0, 10);
    var sugestao = ReqPrazo.sugerir(r);
    var ehCotacao = (status === "EM_COTACAO");

    var aviso = "";
    if(r.urgencia === "Emergencial"){
      aviso = '<div class="aguardando" style="background:rgba(255,77,79,.12);border-color:rgba(255,77,79,.35);color:#ff8a8b">' +
              'Requisição EMERGENCIAL' + (nec ? ' — precisam disso até ' + esc(dataBr(nec)) : '') +
              '. O retorno deve ser hoje.</div>';
    } else if(nec){
      aviso = '<div class="aguardando">Precisam do item até <b>' + esc(dataBr(nec)) +
              '</b>. Seu retorno tem que caber antes disso.</div>';
    }

    document.getElementById("modal-cx").innerHTML =
      '<div class="modal-t">' + (ehCotacao ? "Estou cotando" : "Preciso de informação") + '</div>' +
      '<div class="modal-s">' + (ehCotacao
        ? "Informe até quando você volta com a cotação. Quem pediu passa a ver essa data."
        : "Diga o que falta e até quando você precisa da resposta.") + '</div>' +
      aviso +
      '<div class="campo"><label class="lbl" for="pz-texto">' +
        (ehCotacao ? "Observação <i>opcional</i>" : "O que você precisa saber <span class=\"obrig\">*</span>") + '</label>' +
        '<textarea class="inp" id="pz-texto" placeholder="' +
        (ehCotacao ? "Ex.: pedi orçamento em três fornecedores." : "Ex.: qual a voltagem da tomada da cozinha?") + '"></textarea></div>' +
      '<div class="campo"><label class="lbl" for="pz-data">Retorno até <span class="obrig">*</span></label>' +
        '<input class="inp" id="pz-data" type="date" value="' + esc(sugestao) + '" min="' + esc(ReqPrazo.hojeIso()) + '"' +
        (nec ? ' max="' + esc(nec) + '"' : '') + '></div>' +
      '<div class="btns" style="margin-top:6px">' +
        '<button class="btn btn-p" id="pz-ok" onclick="ReqPrazo.confirmar(\'' + status + '\')">Confirmar</button>' +
        '<button class="btn btn-s" onclick="ReqPrazo.fechar()">Cancelar</button>' +
      '</div>';

    document.getElementById("modal").classList.add("on");
  },

  fechar: function(){
    document.getElementById("modal").classList.remove("on");
    document.getElementById("modal-cx").innerHTML = "";
  },

  confirmar: function(status){
    var texto = document.getElementById("pz-texto").value.trim();
    var data  = document.getElementById("pz-data").value;
    var r = ReqPrazo.req || {};
    var nec = (r.dataNecessidade || "").substring(0, 10);

    if(status === "AGUARDANDO_INFORMACAO" && !texto){
      toast("Escreva o que você precisa saber.", true); return;
    }
    if(!data){ toast("Informe até quando você retorna.", true); return; }
    if(data < ReqPrazo.hojeIso()){ toast("A data de retorno não pode ser no passado.", true); return; }
    if(nec && data > nec){
      toast("O retorno não pode ser depois de " + dataBr(nec) + ", que é quando precisam do item.", true);
      return;
    }

    var btn = document.getElementById("pz-ok");
    btn.disabled = true;
    btn.textContent = "Salvando…";

    ReqAPI.post("alterarStatus", {
      id:           ReqState.detalheId,
      status:       status,
      texto:        texto,
      prazoRetorno: data
    }).then(function(){
      ReqPrazo.fechar();
      toast("Pronto. Retorno prometido para " + dataBr(data) + ".");
      ReqDetalhe.recarregar();
    }).catch(function(e){
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = "Confirmar";
    });
  }
};

// ────────────────────────────────────────────────────────────
// 10. NOVA REQUISIÇÃO
// ────────────────────────────────────────────────────────────
var ReqForm = {
  abrir: function(){
    mostrar("nova");
    var c = ReqState.config;
    var empresas = (c.empresas || []).map(function(e){
      return '<option value="' + esc(e.chave) + '">' + esc(e.valor) + '</option>';
    }).join("");
    var setores = (c.setores || []).map(function(s){
      return '<option value="' + esc(s.valor) + '">' + esc(s.valor) + '</option>';
    }).join("");
    var categorias = (c.categorias || []).map(function(x){

  addArquivo: function(tipo){
    var inp = document.getElementById("n-arq");
    inp.accept = (tipo === "IMAGEM") ? "image/*" : ".pdf,.doc,.docx,.xls,.xlsx,image/*";
    inp.dataset.tipo = tipo;
    inp.value = "";
    inp.click();

  pegouArquivo: function(input){
    var arq = input.files && input.files[0];
    if(!arq) return;
    if(ReqState.anexosNovos.length >= 10){ toast("Máximo de 10 referências.", true); return; }
    var tipo = input.dataset.tipo || "OUTRO";

    var guardar = function(b64, mime){
      ReqState.anexosNovos.push({
        tipo: mime.indexOf("image") === 0 ? "IMAGEM" : "PDF",
        base64: b64, mime: mime, nome: arq.name
      });
      ReqForm.renderLinks();
    };

    if(arq.type.indexOf("image") === 0){
      ReqAnexo.comprimir(arq, function(b64){ guardar(b64, "image/jpeg"); });
    } else {
      var fr = new FileReader();
      fr.onload = function(){ guardar(String(fr.result).split(",")[1], arq.type || "application/pdf"); };
      fr.onerror = function(){ toast("Não deu para ler o arquivo.", true); };
      fr.readAsDataURL(arq);
    }
  },

  unidades: function(){
    var emp = document.getElementById("n-empresa").value;
    var lista = (ReqState.config.unidades || []).filter(function(u){
      return u.chave === emp || u.chave === "*";

    document.getElementById("n-unidade").innerHTML =
      '<option value="">Escolha</option>' +
      lista.map(function(u){ return '<option value="' + esc(u.valor) + '">' + esc(u.valor) + '</option>'; }).join("");

             '</div>';
    }).join("");
  },

  enviar: function(autoaprovar){
    var titulo = document.getElementById("n-titulo").value.trim();
    var desc   = document.getElementById("n-desc").value.trim();
    var emp    = document.getElementById("n-empresa").value;
    var uni    = document.getElementById("n-unidade").value;
    var iDesc  = document.getElementById("i-desc").value.trim();

    if(!titulo){ toast("Escreva em poucas palavras o que você precisa.", true); return; }
    if(!emp){    toast("Escolha a empresa.", true); return; }
    if(!uni){    toast("Escolha a unidade.", true); return; }
    if(!desc && !iDesc){ toast("Explique o que você precisa ou preencha o item.", true); return; }
    if(!document.getElementById("n-solic").value){ toast("Escolha para quem é a requisição.", true); return; }

    var itens = [];
    if(iDesc){
      itens.push({
        descricao:     iDesc,
        quantidade:    document.getElementById("i-qtd").value.trim(),
        categoria:     document.getElementById("i-cat").value,
        marca:         document.getElementById("i-marca").value.trim(),
        modelo:        document.getElementById("i-modelo").value.trim(),
        cor:           document.getElementById("i-cor").value.trim(),
        voltagem:      document.getElementById("i-volt").value,
        dimensoes:     document.getElementById("i-dim").value.trim(),
        peso:          document.getElementById("i-peso").value.trim(),
        precoEstimado: document.getElementById("i-preco").value.trim(),
        especificacao: document.getElementById("i-espec").value.trim()
      });
    }

    if(!ReqState.anexosNovos.length){
      var seguir = confirm(
        "Você não anexou nenhuma referência.\n\n" +
        "Um link, uma foto do que acabou ou um print do Instagram ajuda muito " +
        "a Cris a comprar exatamente o que você quer — e evita idas e vindas.\n\n" +
        "Quer enviar assim mesmo?");
      if(!seguir) return;
    }

    var links    = ReqState.anexosNovos.filter(function(a){ return a.url; });
    var arquivos = ReqState.anexosNovos.filter(function(a){ return a.base64; });

    var btn = document.getElementById("btn-enviar");
    btn.disabled = true;
    btn.textContent = "Enviando…";

    var idCriado = null;

    ReqAPI.post("criar", {
      requestUuid:         ReqForm.uuid(),
      titulo:              titulo,
      descricao:           desc,
      empresa:             emp,
      unidade:             uni,
      setor:               document.getElementById("n-setor").value,
      solicitanteOriginal: document.getElementById("n-solic").value,
      urgencia:            document.getElementById("n-urg").value,
      dataNecessidade:     document.getElementById("n-quando").value,
      itens:               itens,
      links:               links,
      autoaprovar:         !!autoaprovar
    }, "Criando requisição…").then(function(r){
      idCriado = r.id;
      if(r.duplicada) return null;

      // A subpasta do Drive só existe depois que a requisição tem número,
      // então os arquivos sobem agora, um a um, com a tela bloqueada.
      var fila = Promise.resolve();
      arquivos.forEach(function(a, i){
        fila = fila.then(function(){
          return ReqAPI.post("anexar", {
            id: idCriado, tipo: a.tipo, base64: a.base64,
            mimeType: a.mime, nomeArquivo: a.nome
          }, "Enviando anexo " + (i+1) + " de " + arquivos.length + "…");
        });
      });
      return fila;
    }).then(function(){
      toast("Requisição " + idCriado + " criada.");
      ReqState.anexosNovos = [];
      ReqForm._uuid = null;
      ReqDetalhe.abrir(idCriado);
    }).catch(function(e){
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = "Enviar requisição";
      // Se a requisição nasceu e só o anexo falhou, leva a pessoa para ela
      // em vez de deixar o formulário preenchido dando a impressão de erro total.
      if(idCriado){
        toast("A requisição " + idCriado + " foi criada, mas algum anexo falhou. Anexe pelo detalhe.", true);
        ReqState.anexosNovos = [];
        ReqForm._uuid = null;
        ReqDetalhe.abrir(idCriado);
      }
    });
  },

  // Idempotência: o backend usa isso para não criar duas requisições
  // no duplo clique ou no reenvio por internet instável.
  uuid: function(){
    if(!ReqForm._uuid){
      ReqForm._uuid = "web-" + Date.now().toString(36) + "-" +
                      Math.random().toString(36).slice(2, 10);
    }
    return ReqForm._uuid;
  }
};

  // Chart.js só é baixado quando alguém abre a aba. Quem nunca

  carregarChartjs: function(){
    if(ReqKpi.chartjs) return ReqKpi.chartjs;

      if(window.Chart) return ok();
      var t = document.createElement("script");
      t.src = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js";
      t.onload = function(){ ok(); };
      t.onerror = function(){ falhou(new Error("Não consegui carregar a biblioteca de gráficos.")); };
      document.head.appendChild(t);

    return ReqKpi.chartjs;
  },

    var a = new Date(de), b = ate ? new Date(ate) : new Date();

// ── Velocímetro ─────────────────────────────────────────────
// Arco de 270°, percentual gigante no centro, cor pela faixa.
  gauge: function(pct, base, titulo, descricao, unidade){
  var vazio = (pct === null);
  var v = vazio ? 0 : Math.max(0, Math.min(100, pct));
  var cor = vazio ? "var(--mu2)" : (v >= 90 ? "var(--ok)" : (v >= 70 ? "var(--warn)" : "var(--red)"));

  var raio = 80, cx = 100, cy = 100;
  var inicio = 135, varredura = 270;
  var ponto = function(ang){
    var r = (ang - 90) * Math.PI / 180;
    return [cx + raio * Math.cos(r), cy + raio * Math.sin(r)];
  };
  var arco = function(de, ate){
    var a = ponto(de), b = ponto(ate);
    var grande = (ate - de) > 180 ? 1 : 0;
    return "M " + a[0].toFixed(2) + " " + a[1].toFixed(2) +
           " A " + raio + " " + raio + " 0 " + grande + " 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2);
  };

  // O degradê acompanha o arco: vermelho na largada, âmbar no meio,
  // verde na chegada. Como o arco é cortado no valor atual, o ponteiro
  // só alcança o verde quando o indicador realmente chega lá.
  var gid = "grad-" + String(titulo).toLowerCase().replace(/[^a-z]/g, "");
  var fim = inicio + (varredura * v / 100);
  var agulha = ponto(fim);

  return '<div class="gauge">' +
    '<svg viewBox="0 0 200 175" role="img" aria-label="' + esc(titulo) + ': ' +
      (vazio ? "sem dados" : v.toFixed(0) + "%") + '">' +
      '<defs><linearGradient id="' + gid + '" gradientUnits="userSpaceOnUse" x1="20" y1="100" x2="180" y2="100">' +
        '<stop offset="0" stop-color="#ff4d4f"></stop>' +
        '<stop offset="0.35" stop-color="#ff8c3a"></stop>' +
        '<stop offset="0.65" stop-color="#ffd12b"></stop>' +
        '<stop offset="1" stop-color="#36cfa0"></stop>' +
      '</linearGradient></defs>' +
      '<path d="' + arco(inicio, inicio + varredura) + '" fill="none" stroke="var(--s3)" ' +
        'stroke-width="14" stroke-linecap="round"></path>' +
      (v > 0 ? '<path d="' + arco(inicio, fim) + '" fill="none" stroke="url(#' + gid + ')" ' +
        'stroke-width="14" stroke-linecap="round"></path>' : '') +
      (vazio ? '' : '<circle cx="' + agulha[0].toFixed(2) + '" cy="' + agulha[1].toFixed(2) +
        '" r="6.5" fill="' + cor + '" stroke="var(--sf)" stroke-width="3"></circle>') +
      '<text x="100" y="107" text-anchor="middle" class="g-pct" fill="' + cor + '">' +
        (vazio ? "—" : v.toFixed(0) + (unidade || "%")) + '</text>' +
      '<text x="100" y="130" text-anchor="middle" class="g-sub">' + esc(base) + '</text>' +
    '</svg>' +
    '<div class="g-tit">' + esc(titulo) + '</div>' +
    '<div class="g-desc">' + esc(descricao) + '</div>' +
  '</div>';
  },

// ── Filtro de período e empresa ─────────────────────────────
  filtrar: function(){
  var selP = document.getElementById("k-periodo");
  var selE = document.getElementById("k-empresa");
  var d = selP ? parseInt(selP.value, 10) : 90;
  var emp = selE ? selE.value : "";
  var corte = d ? new Date(Date.now() - d * 86400000).toISOString() : "";

  return (ReqKpi.dados.registros || []).filter(function(r){
    if(corte && r.abertura < corte) return false;
    if(emp && r.empresa !== emp) return false;
    return true;
  });
  },

// ── Cálculo e desenho ───────────────────────────────────────
  render: function(){
  var rs = ReqKpi.filtrar();
  var el = document.getElementById("v-kpi");

  if(!rs.length){
    el.innerHTML = ReqKpi.filtros() +
      '<div class="vazio" style="padding:60px">Nenhuma requisição no período escolhido.</div>';
    ReqKpi.ligarFiltros();
    return;
  }

  // ---- KPI 1: entrega dentro da previsão ----
  var comPrevisao = rs.filter(function(r){ return r.recebimento && r.prazoEntrega; });
  var noPrazo = comPrevisao.filter(function(r){
    return r.recebimento.substring(0,10) <= r.prazoEntrega;
  });
  var kpiPrazo = comPrevisao.length ? (noPrazo.length / comPrevisao.length * 100) : null;

  // ---- KPI 2: fluxo respeitado (passou por aprovação) ----
  var chegaramCompras = rs.filter(function(r){ return r.aprovadaEm || r.nasceuAprovada; });
  var aprovadas = chegaramCompras.filter(function(r){ return !!r.aprovadaEm; });
  var kpiFluxo = chegaramCompras.length ? (aprovadas.length / chegaramCompras.length * 100) : null;

  // ---- KPI 3: recebimento sem divergência ----
  var recebidas = rs.filter(function(r){ return r.statusRecebimento; });
  var limpas = recebidas.filter(function(r){ return r.statusRecebimento === "OK"; });
  var kpiRecebimento = recebidas.length ? (limpas.length / recebidas.length * 100) : null;

  // ---- Números de apoio ----
  var abertas = rs.filter(function(r){
    return ["CONCLUIDA","CANCELADA","RECUSADA"].indexOf(r.status) < 0;
  });
  var hojeIso = new Date().toISOString().substring(0,10);
  var atrasadas = abertas.filter(function(r){
    return r.prazoRetorno && r.prazoRetorno < hojeIso &&
           (r.status === "EM_COTACAO" || r.status === "AGUARDANDO_INFORMACAO");
  });
  var mediaRetorno = ReqKpi.media(rs.map(function(r){
    if(!r.primeiroRetorno) return null;
    return ReqKpi.horasEntre(r.aprovadaEm || r.abertura, r.primeiroRetorno);
  }));
  var mediaCiclo = ReqKpi.media(rs.map(function(r){
    if(!r.conclusao) return null;
    return ReqKpi.diasEntre(r.abertura, r.conclusao);
  }));
  var valorTotal = rs.reduce(function(a, r){ return a + (r.valorFinal || 0); }, 0);

  var h = ReqKpi.filtros();

  h += '<div class="gauges">' +
    ReqKpi.gauge(kpiPrazo, comPrevisao.length + " entregas avaliadas", "Entregue no prazo",
          "Recebidas até a previsão que a Cris informou ao registrar a compra.") +
    ReqKpi.gauge(kpiFluxo, chegaramCompras.length + " requisições na fila", "Fluxo respeitado",
          "Chegaram em Compras com aprovação registrada, em vez de entrar direto.") +
    ReqKpi.gauge(kpiRecebimento, recebidas.length + " recebimentos", "Recebido sem divergência",
          "Chegou completo e correto, sem faltar item nem problema na entrega.") +
  '</div>';

  h += '<div class="nums">' +
    '<div class="num"><div class="num-n">' + abertas.length + '</div><div class="num-l">Em aberto agora</div></div>' +
    '<div class="num' + (atrasadas.length ? ' alerta' : '') + '"><div class="num-n">' + atrasadas.length +
      '</div><div class="num-l">Retornos atrasados</div></div>' +
    '<div class="num"><div class="num-n">' +
      (mediaRetorno === null ? "—" : (mediaRetorno < 24 ? mediaRetorno.toFixed(0) + "h" : (mediaRetorno/24).toFixed(1) + "d")) +
      '</div><div class="num-l">1º retorno de Compras</div></div>' +
    '<div class="num"><div class="num-n">' +
      (mediaCiclo === null ? "—" : mediaCiclo.toFixed(1) + "d") +
      '</div><div class="num-l">Ciclo completo médio</div></div>' +
  '</div>';

  h += '<div class="graficos">' +
    '<div class="card"><div class="card-t">Onde estão as requisições</div>' +
      '<div class="card-s">Distribuição por status no período</div>' +
      '<div class="chart-box"><canvas id="g-status"></canvas></div></div>' +
    '<div class="card"><div class="card-t">Volume por empresa</div>' +
      '<div class="card-s">Quantidade de requisições abertas</div>' +
      '<div class="chart-box"><canvas id="g-empresa"></canvas></div></div>' +
    '<div class="card"><div class="card-t">Quem mais pede</div>' +
      '<div class="card-s">Top 8 solicitantes</div>' +
      '<div class="chart-box"><canvas id="g-solic"></canvas></div></div>' +
    '<div class="card"><div class="card-t">Valor comprado</div>' +
      '<div class="card-s">Total ' + esc(ReqKpi.reais(valorTotal)) + ' no período</div>' +
      '<div class="chart-box"><canvas id="g-valor"></canvas></div></div>' +
  '</div>';

  // ---- Paradas há mais tempo ----
  var paradas = abertas.slice().sort(function(a, b){
    return (a.ultimaAtualizacao || "").localeCompare(b.ultimaAtualizacao || "");
  }).slice(0, 10);

  h += '<div class="card"><div class="card-t">Paradas há mais tempo</div>' +
       '<div class="card-s">As dez requisições em aberto sem movimento há mais dias</div>';
  h += paradas.length
    ? '<table><thead><tr><th>Nº</th><th>O que é</th><th>Empresa</th><th>Aguardando</th><th>Parada há</th></tr></thead><tbody>' +
      paradas.map(function(r){
        var d = ReqKpi.diasEntre(r.ultimaAtualizacao, null);
        var cls = d > 7 ? "dias ruim" : (d > 3 ? "dias atencao" : "dias");
        return '<tr>' +
          '<td><a href="Index_Requisicoes.html?rq=' + encodeURIComponent(r.id) + '" style="color:var(--blue)">' + esc(r.id) + '</a></td>' +
          '<td>' + esc(r.titulo || r.solicitante) + '</td>' +
          '<td>' + esc(r.empresa) + '</td>' +
          '<td>' + esc((r.responsavelAtual || "").split("@")[0]) + '</td>' +
          '<td class="' + cls + '">' + (d === null ? "—" : d.toFixed(0) + " dias") + '</td>' +
        '</tr>';
      }).join("") + '</tbody></table>'
    : '<div class="vazio">Nenhuma requisição em aberto.</div>';
  h += '</div>';

  el.innerHTML = h;
  ReqKpi.ligarFiltros();

  ReqKpi.desenharGraficos(rs);
  },

// ── Gráficos ────────────────────────────────────────────────
  agrupar: function(lista, chave){
  var m = {};
  lista.forEach(function(r){
    var k = r[chave] || "—";
    m[k] = (m[k] || 0) + 1;
  });
  return m;
  },

  desenharGraficos: function(rs){
  Object.keys(ReqKpi.graficos).forEach(function(k){
    try { ReqKpi.graficos[k].destroy(); } catch(_){}
  });
  ReqKpi.graficos = {};

  var css = getComputedStyle(document.documentElement);
  var cor = function(v){ return css.getPropertyValue(v).trim(); };
  Chart.defaults.color = cor("--mu");
  Chart.defaults.font.family = "DM Sans, sans-serif";
  Chart.defaults.font.size = 11;

  var grade = {grid:{color:"rgba(255,255,255,0.06)"}, ticks:{color:cor("--mu2")}};

  var rotulos = {
    NOVA:"Nova", EM_TRIAGEM:"Aprovação", EM_ANALISE:"Com Compras", EM_COTACAO:"Cotação",
    AGUARDANDO_INFORMACAO:"Aguardando resposta", AGUARDANDO_APROVACAO:"Alçada",
    COMPRADA:"Comprada", AGUARDANDO_ENTREGA:"A caminho", RECEBIDA_OK:"Recebida",
    RECEBIDA_PARCIAL:"Parcial", RECEBIDA_DIVERGENCIA:"Divergência",
    CONCLUIDA:"Concluída", CANCELADA:"Cancelada", RECUSADA:"Recusada"
  };

  // Status
  var porStatus = ReqKpi.agrupar(rs, "status");
  ReqKpi.graficos.status = new Chart(document.getElementById("g-status"), {
    type:"bar",
    data:{
      labels: Object.keys(porStatus).map(function(k){ return rotulos[k] || k; }),
      datasets:[{data: Object.values(porStatus), backgroundColor: cor("--blue"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, indexAxis:"y", plugins:{legend:{display:false}},
             scales:{x:grade, y:grade}}
  });

  // Empresa
  var porEmpresa = ReqKpi.agrupar(rs, "empresa");
  ReqKpi.graficos.empresa = new Chart(document.getElementById("g-empresa"), {
    type:"bar",
    data:{
      labels: Object.keys(porEmpresa),
      datasets:[{data: Object.values(porEmpresa), backgroundColor: cor("--lime"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:grade, y:grade}}
  });

  // Solicitantes
  var porSolic = ReqKpi.agrupar(rs, "solicitante");
  var topo = Object.keys(porSolic).sort(function(a,b){ return porSolic[b]-porSolic[a]; }).slice(0,8);
  ReqKpi.graficos.solic = new Chart(document.getElementById("g-solic"), {
    type:"bar",
    data:{
      labels: topo.map(function(k){ return k.split("@")[0]; }),
      datasets:[{data: topo.map(function(k){ return porSolic[k]; }),
                 backgroundColor: cor("--pur"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, indexAxis:"y", plugins:{legend:{display:false}},
             scales:{x:grade, y:grade}}
  });

  // Valor por empresa
  var valores = {};
  rs.forEach(function(r){
    if(!r.valorFinal) return;
    valores[r.empresa || "—"] = (valores[r.empresa || "—"] || 0) + r.valorFinal;
  });
  ReqKpi.graficos.valor = new Chart(document.getElementById("g-valor"), {
    type:"bar",
    data:{
      labels: Object.keys(valores),
      datasets:[{data: Object.values(valores), backgroundColor: cor("--cyan"), borderRadius:6}]
    },
    options:{maintainAspectRatio:false, plugins:{legend:{display:false},
      tooltip:{callbacks:{label:function(c){ return ReqKpi.reais(c.raw); }}}},
      scales:{x:grade, y:Object.assign({}, grade, {ticks:{color:cor("--mu2"),
        callback:function(v){ return "R$ " + (v/1000).toFixed(0) + "k"; }}})}}
  });
  }
};

// ────────────────────────────────────────────────────────────
// 12. INICIALIZAÇÃO
// ────────────────────────────────────────────────────────────
function ReqInit(){
  ReqState.sessao = ReqSessao();
  if(!ReqState.sessao) return;

  ReqIco.hidratar();
  document.querySelector(".side-rod").innerHTML =
    '<span>Q Food Company</span><span title="Versão da tela">v' + REQ_VERSAO + '</span>';

  var nomeSessao = ReqState.sessao.nome || ReqState.sessao.email;
  ["u-nome","tb-nome"].forEach(function(id){ document.getElementById(id).textContent = nomeSessao; });
  ["u-av","tb-av"].forEach(function(id){ document.getElementById(id).textContent = ReqIniciais(nomeSessao); });

  ReqAPI.get("config", {}).then(function(c){
    ReqState.config = c;

    var nome = c.usuario.nome || nomeSessao;
    ["u-nome","tb-nome"].forEach(function(id){ document.getElementById(id).textContent = nome; });
    ["u-av","tb-av"].forEach(function(id){ document.getElementById(id).textContent = ReqIniciais(nome); });
    ["u-papel","tb-papel"].forEach(function(id){ document.getElementById(id).textContent = ReqPapel(); });

    document.getElementById("saud").innerHTML =
      '<div class="saud-t">Olá, ' + esc(String(nome).split(/\s+/)[0]) + '!</div>' +
      '<div class="saud-s">Vamos manter a operação em movimento.</div>';

    if(c.usuario.isCompras)         document.getElementById("titulo").textContent = "Central de Requisições — Compras";
    else if(ReqHome.aprovador())    document.getElementById("titulo").textContent = "Central de Requisições — Aprovações";

    document.getElementById("f-empresa").innerHTML =
      '<option value="">Todas as empresas</option>' +
      (c.empresas || []).map(function(e){
        return '<option value="' + esc(e.chave) + '">' + esc(e.valor) + '</option>';
      }).join("");

    document.getElementById("f-status").innerHTML =
      '<option value="">Todos os status</option>' +
      Object.keys(c.statusLabel).map(function(k){
        return '<option value="' + esc(k) + '">' + esc(rotuloStatus(k, c.statusLabel[k])) + '</option>';
      }).join("");

    ReqHome.montar();

    // Deep link vindo do e-mail: Index_Requisicoes.html?rq=RQ-2026-0001
    var m = location.search.match(/[?&]rq=([^&]+)/);
    if(m){
      ReqLista.carregar();
      return ReqDetalhe.abrir(decodeURIComponent(m[1]));
    }

    return ReqNotif.sincronizar();
  }).then(function(){
    ReqNotif.iniciar();
    ReqEntregas.talvezMostrar();
  }).catch(function(e){
    document.getElementById("lista").innerHTML =
      '<div class="vazio"><div class="vazio-t">Não deu para entrar</div>' +
      '<div class="vazio-s">' + esc(e.message) + '</div>' +
      '<a class="btn btn-s" href="Index_Menu.html">Voltar ao menu</a></div>';
  });

  // Eventos de tela
  document.getElementById("btn-nova").onclick   = function(){ ReqForm.abrir(); };
  document.getElementById("bn-nova").onclick    = function(){ ReqForm.abrir(); };
  document.getElementById("sino").onclick       = function(){ ReqNotif.verNovidades(); };
  document.getElementById("bn-alertas").onclick = function(){ ReqNotif.verNovidades(); };
  document.getElementById("bn-fila").onclick    = function(){ ReqHome.ativar("abertas"); };

  // Avatar: no celular abre o menu da conta (Menu principal, Sair…)
  document.getElementById("av-btn").onclick = function(){ ReqMenu.abrir(); };

  document.getElementById("btn-filtros").onclick = function(){
    var box = document.getElementById("filtros-mais");
    var aberto = box.style.display !== "none";
    box.style.display = aberto ? "none" : "flex";
    this.classList.toggle("on", !aberto);
  };

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(document.getElementById("lightbox").classList.contains("on")) return ReqFoto.fechar();
    if(document.getElementById("folha").classList.contains("on")) return ReqMenu.fechar();
    if(document.getElementById("modal").classList.contains("on")){
      document.getElementById("modal").classList.remove("on");
      document.getElementById("modal-cx").classList.remove("largo");
      document.getElementById("modal-cx").innerHTML = "";
    }
  });

  document.getElementById("f-busca").oninput    = function(){ ReqLista.render(); };
  document.getElementById("f-empresa").onchange = function(){ ReqLista.render(); };
  document.getElementById("f-status").onchange  = function(){ ReqLista.render(); };
  document.getElementById("f-ordem").onchange   = function(){ ReqLista.render(); };
}

ReqInit();
</script>
