<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Q Food — Central de Requisições</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c100e;--sf:#141a17;--s2:#1a211d;--s3:#232c27;
  --br:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.13);--b3:rgba(255,255,255,0.22);
  --tx:#eef3ef;--mu:#93a39a;--mu2:#63736a;
  --red:#ff5a5f;--ok:#3ddc97;--warn:#ffb02e;--blue:#4d9ef7;--pur:#a78bfa;--cyan:#38bdf8;
  --lime:#a6e635;--lime2:#8fcc1f;
  --fh:'DM Sans',sans-serif;--fb:'DM Sans',sans-serif;
  --side:248px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);min-height:100vh;padding:0 0 60px;}
button,input,select,textarea{font-family:var(--fb);}
a{color:var(--blue);}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

/* ---- TOPO ---- */
.top{border-bottom:1px solid var(--br);background:var(--sf);position:sticky;top:0;z-index:50;}
.top-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;}
.top-back{color:var(--mu);text-decoration:none;font-size:0.82rem;white-space:nowrap;}
.top-back:hover{color:var(--tx);}
.top-title{font-family:var(--fh);font-weight:700;font-size:1.05rem;flex:1;}
.top-user{font-size:0.74rem;color:var(--mu2);white-space:nowrap;}
.sino{position:relative;background:none;border:1px solid var(--br);border-radius:10px;color:var(--tx);
  padding:7px 11px;cursor:pointer;font-size:0.95rem;}
.sino:hover{border-color:var(--b2);}
.sino-n{position:absolute;top:-6px;right:-6px;background:var(--lime);color:#12200a;font-size:0.62rem;
  font-weight:700;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 5px;display:none;}
.btn-nova{background:var(--lime);color:#12200a;border:none;border-radius:10px;padding:9px 16px;
  font-family:var(--fh);font-weight:700;font-size:0.82rem;cursor:pointer;white-space:nowrap;}
.btn-nova:hover{filter:brightness(1.08);}

/* ---- CONTADORES ---- */
.cnt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0 18px;}
.cnt{background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:14px 18px;cursor:pointer;
  text-align:left;color:var(--tx);transition:all .15s;box-shadow:0 1px 0 rgba(255,255,255,.05) inset;}
.cnt:hover{background:var(--s3);border-color:var(--b3);transform:translateY(-1px);}
.cnt:active{transform:translateY(0);}
.cnt.on{background:var(--s3);border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset;}
.cnt-n{font-family:var(--fh);font-size:1.7rem;font-weight:800;line-height:1;color:var(--tx);}
.cnt-l{font-size:0.74rem;color:var(--mu);margin-top:6px;font-weight:500;}
.cnt.on .cnt-l{color:var(--tx);}
.cnt.destaque .cnt-n{color:var(--warn);}
.cnt.alerta .cnt-n{color:var(--red);}
.rq-acoes{display:flex;gap:6px;margin-top:4px;}
.rq-acoes .btn{padding:6px 12px;font-size:0.72rem;}

/* ---- FILTROS ---- */
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.inp,.sel{background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:9px 12px;
  color:var(--tx);font-size:0.82rem;outline:none;}
.inp:focus,.sel:focus{border-color:var(--b2);}
.inp::placeholder{color:var(--mu2);}
.filtros .inp{flex:1;min-width:180px;}

/* ---- LISTA ---- */
.lista{display:flex;flex-direction:column;gap:10px;}
.rq{background:var(--sf);border:1px solid var(--br);border-left:3px solid var(--s3);border-radius:12px;
  padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;transition:border-color .15s;}
.rq:hover{border-color:var(--b2);}
.rq.novo{border-left-color:var(--lime);background:linear-gradient(90deg,rgba(132,204,22,0.06),transparent 40%);}
.rq-id{font-family:var(--fh);font-size:0.72rem;color:var(--mu2);letter-spacing:0.4px;}
.rq-tit{font-family:var(--fh);font-weight:700;font-size:0.98rem;margin:2px 0 6px;}
.rq-meta{font-size:0.74rem;color:var(--mu);line-height:1.6;}
.rq-dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.rq-quando{font-size:0.68rem;color:var(--mu2);}
.chip{display:inline-block;font-size:0.68rem;font-weight:500;padding:4px 10px;border-radius:999px;
  border:1px solid var(--br);background:var(--s2);color:var(--mu);white-space:nowrap;}
.chip.nova,.chip.em_triagem{background:rgba(255,170,43,.14);color:var(--warn);border-color:rgba(255,170,43,.3);}
.chip.em_analise,.chip.em_cotacao{background:rgba(77,142,245,.14);color:var(--blue);border-color:rgba(77,142,245,.3);}
.chip.aguardando_informacao,.chip.aguardando_aprovacao{background:rgba(160,124,246,.14);color:var(--pur);border-color:rgba(160,124,246,.3);}
.chip.comprada,.chip.aguardando_entrega{background:rgba(34,211,238,.14);color:var(--cyan);border-color:rgba(34,211,238,.3);}
.chip.recebida_ok,.chip.concluida{background:rgba(54,207,160,.14);color:var(--ok);border-color:rgba(54,207,160,.3);}
.chip.recebida_parcial,.chip.recebida_divergencia{background:rgba(255,77,79,.14);color:var(--red);border-color:rgba(255,77,79,.3);}
.chip.cancelada,.chip.recusada{background:var(--s2);color:var(--mu2);}
.chip.urg{background:rgba(255,77,79,.14);color:var(--red);border-color:rgba(255,77,79,.3);}

.vazio{background:var(--sf);border:1px dashed var(--b2);border-radius:14px;padding:44px 24px;text-align:center;}
.vazio-t{font-family:var(--fh);font-weight:700;margin-bottom:6px;}
.vazio-s{font-size:0.82rem;color:var(--mu);margin-bottom:18px;}

/* ---- DETALHE ---- */
.det-hdr{display:flex;align-items:flex-start;gap:14px;margin:22px 0 16px;flex-wrap:wrap;}
.det-tit{font-family:var(--fh);font-size:1.35rem;font-weight:800;flex:1;min-width:240px;}
.card{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.card-t{font-family:var(--fh);font-weight:700;font-size:0.9rem;margin-bottom:14px;}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:0.84rem;}
.kv dt{color:var(--mu);}
.kv dd{color:var(--tx);}
.aguardando{background:rgba(255,170,43,.1);border:1px solid rgba(255,170,43,.25);border-radius:10px;
  padding:11px 14px;font-size:0.84rem;color:var(--warn);margin-bottom:14px;}

.item{border:1px solid var(--br);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--bg);}
.item-d{font-weight:500;font-size:0.9rem;}
.item-e{font-size:0.76rem;color:var(--mu);margin-top:5px;line-height:1.6;}

.anexos{display:flex;flex-wrap:wrap;gap:10px;}
.anexo{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--br);
  border-radius:10px;padding:9px 13px;font-size:0.78rem;color:var(--tx);text-decoration:none;max-width:280px;}
.anexo:hover{border-color:var(--b2);}
.anexo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.anexo small{color:var(--mu2);font-size:0.68rem;}

/* ---- TIMELINE ---- */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--s3);}
.ev{position:relative;padding-bottom:18px;}
.ev:last-child{padding-bottom:0;}
.ev:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--s3);border:2px solid var(--sf);}
.ev.status:before{background:var(--blue);}
.ev.compra:before{background:var(--cyan);}
.ev.recebimento:before{background:var(--ok);}
.ev.criacao:before{background:var(--lime);}
.ev-h{font-size:0.72rem;color:var(--mu2);margin-bottom:3px;}
.ev-h b{color:var(--mu);font-weight:500;}
.ev-c{font-size:0.86rem;line-height:1.6;}

/* ---- FORM ---- */
.campo{margin-bottom:14px;}
.lbl{display:block;font-size:0.76rem;color:var(--mu);margin-bottom:6px;}
.lbl i{color:var(--mu2);font-style:normal;}
.campo .inp,.campo .sel,.campo textarea{width:100%;}
textarea.inp{resize:vertical;min-height:84px;line-height:1.6;}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.mais{background:none;border:1px dashed var(--b2);border-radius:10px;color:var(--mu);padding:9px 14px;
  font-size:0.78rem;cursor:pointer;width:100%;}
.mais:hover{color:var(--tx);border-color:var(--b3);}
.extra{display:none;margin-top:12px;}
.extra.on{display:block;}

.btn{border:none;border-radius:10px;padding:10px 18px;font-family:var(--fh);font-weight:700;
  font-size:0.82rem;cursor:pointer;}
.btn-p{background:var(--lime);color:#12200a;}
.btn-s{background:var(--s2);color:var(--tx);border:1px solid var(--br);}
.btn-s:hover{border-color:var(--b2);}
.btn-ok{background:rgba(54,207,160,.16);color:var(--ok);border:1px solid rgba(54,207,160,.35);}
.btn-w{background:rgba(255,170,43,.16);color:var(--warn);border:1px solid rgba(255,170,43,.35);}
.btn-d{background:rgba(255,77,79,.14);color:var(--red);border:1px solid rgba(255,77,79,.3);}
.btn:disabled{opacity:.55;cursor:wait;}
.btns{display:flex;gap:10px;flex-wrap:wrap;}

.anexar-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.anexar-bar .btn-s{font-size:0.76rem;padding:8px 13px;}

/* ---- GALERIA DE FOTOS ---- */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:12px;}
.foto{border:1px solid var(--br);border-radius:12px;overflow:hidden;background:var(--bg);}
.foto-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;
  background:var(--s2);font-size:0.7rem;color:var(--mu);text-transform:uppercase;letter-spacing:0.4px;}
.foto-cab a{color:var(--blue);text-decoration:none;font-size:0.68rem;white-space:nowrap;}
.foto-img{width:100%;height:190px;object-fit:cover;display:block;background:var(--s2);cursor:zoom-in;border:none;}
.foto-erro{padding:26px 12px;text-align:center;font-size:0.74rem;color:var(--mu2);}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:none;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
.lightbox.on{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;}

/* ---- MODAL ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:250;display:none;
  align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.modal.on{display:flex;}
.modal-cx{background:var(--sf);border:1px solid var(--b2);border-radius:16px;padding:22px 24px;
  max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-t{font-family:var(--fh);font-weight:700;font-size:1.05rem;margin-bottom:6px;}
.modal-s{font-size:0.8rem;color:var(--mu);margin-bottom:16px;line-height:1.6;}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.slot{border:1px dashed var(--b2);border-radius:12px;height:120px;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  background:var(--bg);color:var(--mu2);font-size:0.72rem;padding:8px;text-align:center;}
.slot:hover{border-color:var(--lime);color:var(--mu);}
.slot img{width:100%;height:100%;object-fit:cover;}
.slot-x{font-size:1.4rem;}
.slot.cheio{border-style:solid;border-color:var(--lime);padding:0;}
.obrig{color:var(--red);}

/* ---- OVERLAY DE GRAVAÇÃO ---- */
.gravando{position:fixed;inset:0;background:rgba(10,13,20,.72);z-index:400;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;cursor:progress;}
.gravando.on{display:flex;}
.spin{width:42px;height:42px;border:3px solid var(--s3);border-top-color:var(--lime);
  border-radius:50%;animation:girar .7s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}
.gravando-t{font-family:var(--fh);font-weight:700;font-size:0.92rem;}

.slot-arq{border:1px dashed var(--b2);border-radius:12px;padding:14px;cursor:pointer;background:var(--bg);
  color:var(--mu2);font-size:0.78rem;display:flex;align-items:center;gap:10px;}
.slot-arq:hover{border-color:var(--lime);color:var(--mu);}
.slot-arq.cheio{border-style:solid;border-color:var(--lime);color:var(--tx);}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s3);
  border:1px solid var(--b2);border-radius:12px;padding:13px 20px;font-size:0.84rem;z-index:200;
  display:none;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.toast.err{border-color:rgba(255,77,79,.5);color:#ffd7d7;}
.carregando{text-align:center;color:var(--mu2);font-size:0.84rem;padding:34px;}

/* ---- AVISO DE ENTREGAS ---- */
.ent-grupo{margin-bottom:16px;}
.ent-grupo-t{font-family:var(--fh);font-weight:700;font-size:0.78rem;text-transform:uppercase;
  letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.ent-grupo-t .qt{background:var(--s3);border-radius:999px;padding:1px 8px;font-size:0.7rem;}
.ent-grupo.atraso .ent-grupo-t{color:var(--red);}
.ent-grupo.hoje .ent-grupo-t{color:var(--warn);}
.ent-grupo.breve .ent-grupo-t{color:var(--cyan);}
.ent-grupo.sem .ent-grupo-t{color:var(--mu);}
.ent{background:var(--bg);border:1px solid var(--br);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.ent-grupo.atraso .ent{border-left:3px solid var(--red);}
.ent-grupo.hoje .ent{border-left:3px solid var(--warn);}
.ent-tit{font-weight:500;font-size:0.9rem;}
.ent-meta{font-size:0.74rem;color:var(--mu);margin:4px 0 10px;line-height:1.55;}
.ent .btns .btn{padding:7px 12px;font-size:0.74rem;}
.modal-cx.largo{max-width:720px;}

/* ---- ABAS ---- */
.abas{display:flex;gap:8px;margin:20px 0 4px;border-bottom:1px solid var(--br);}
.aba{background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);
  padding:10px 16px;font-family:var(--fh);font-weight:700;font-size:0.86rem;cursor:pointer;}
.aba:hover{color:var(--tx);}
.aba.on{color:var(--tx);border-bottom-color:var(--lime);}

/* ---- VELOCÍMETROS ---- */
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0;}
.gauge{background:var(--sf);border:1px solid var(--br);border-radius:16px;padding:16px 18px 14px;text-align:center;}
.gauge svg{width:100%;max-width:186px;height:auto;display:block;margin:0 auto;}
.g-pct{font-family:var(--fh);font-weight:800;font-size:3.4rem;line-height:1;}
.g-sub{font-size:0.7rem;fill:var(--mu2);}
.g-tit{font-family:var(--fh);font-weight:700;font-size:0.92rem;margin-top:10px;}
.g-desc{font-size:0.74rem;color:var(--mu);margin-top:6px;line-height:1.55;}
.g-base{font-size:0.7rem;color:var(--mu2);margin-top:10px;padding-top:10px;border-top:1px solid var(--br);}

/* ---- CARDS DE NÚMERO ---- */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.num{background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:16px 18px;}
.num-n{font-family:var(--fh);font-size:1.6rem;font-weight:800;line-height:1;}
.num-l{font-size:0.73rem;color:var(--mu);margin-top:6px;}
.num.alerta .num-n{color:var(--red);}

.card{background:var(--sf);border:1px solid var(--br);border-radius:16px;padding:20px;margin-bottom:16px;}
.card-t{font-family:var(--fh);font-weight:700;font-size:0.92rem;margin-bottom:4px;}
.card-s{font-size:0.74rem;color:var(--mu2);margin-bottom:16px;}
.graficos{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chart-box{position:relative;height:260px;}

table{width:100%;border-collapse:collapse;font-size:0.82rem;}
th{text-align:left;font-size:0.7rem;color:var(--mu2);text-transform:uppercase;letter-spacing:0.4px;
  padding:8px 10px;border-bottom:1px solid var(--br);font-weight:500;}
td{padding:10px;border-bottom:1px solid var(--br);}
tr:last-child td{border-bottom:none;}
.dias{font-family:var(--fh);font-weight:700;}
.dias.ruim{color:var(--red);}
.dias.atencao{color:var(--warn);}

.carregando{text-align:center;color:var(--mu2);font-size:0.86rem;padding:60px;}
.vazio{color:var(--mu2);font-size:0.82rem;padding:20px;text-align:center;}

@media(max-width:900px){
  .gauges{grid-template-columns:1fr;}
  .nums{grid-template-columns:repeat(2,1fr);}
  .graficos{grid-template-columns:1fr;}
}

/* ---- IMPRESSÃO / PDF ---- */
.print-cab{display:none;}
@media print{
  @page{margin:14mm;}
  body{background:#fff;color:#111;padding:0;}
  .top,#v-lista,#v-nova,#v-kpi,.abas,.toast,.btns,.anexar-bar,.modal,.lightbox,.det-hdr .btn,.det-hdr .chip{display:none !important;}
  .wrap{max-width:100%;padding:0;}
  .print-cab{display:block;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:16px;}
  .print-cab h1{font-family:var(--fh);font-size:1.3rem;margin-bottom:4px;}
  .print-cab div{font-size:0.8rem;color:#555;}
  .card{background:#fff;border:1px solid #bbb;break-inside:avoid;margin-bottom:10px;}
  .card-t,.det-tit,.item-d{color:#111;}
  .kv dt,.rq-meta,.item-e,.ev-h,.ev-h b,.foto-cab{color:#555;}
  .kv dd,.ev-c{color:#111;}
  .item,.anexo,.foto{background:#fff;border-color:#ccc;color:#111;}
  .foto-cab{background:#f2f2f2;}
  .foto-img{height:auto;max-height:70mm;object-fit:contain;}
  .galeria{grid-template-columns:repeat(2,1fr);}
  .aguardando{background:#fff;border:1px solid #999;color:#111;}
  .tl:before{background:#bbb;}
  .ev:before{border-color:#fff;background:#999;}
  a{color:#111;text-decoration:underline;}
}

@media(max-width:760px){
  .cnt-grid{grid-template-columns:repeat(2,1fr);}
  .slots{grid-template-columns:1fr;}
  .slot{height:150px;}
  .linha,.linha3{grid-template-columns:1fr;}
  .kv{grid-template-columns:1fr;gap:2px 0;}
  .kv dd{margin-bottom:8px;}
  .rq{grid-template-columns:1fr;}
  .rq-dir{align-items:flex-start;text-align:left;flex-direction:row;}
  .top-user{display:none;}
}

/* ════════════════════════════════════════════════════════════
   LAYOUT "FILA OPERACIONAL" — lateral + topo + cartões
   ════════════════════════════════════════════════════════════ */
body{padding:0;background:var(--bg);}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;}

/* ---- LATERAL ---- */
.side{background:#0f1411;border-right:1px solid var(--br);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;padding:20px 14px 14px;}
.side-logo{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;}
.logo-q{width:38px;height:38px;border-radius:11px;background:var(--lime);color:#122004;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.25rem;flex:none;}
.logo-q.sm{width:32px;height:32px;font-size:1.05rem;border-radius:9px;}
.logo-t{font-weight:700;font-size:1.02rem;line-height:1.1;}
.logo-s{font-size:0.7rem;color:var(--mu);}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-it{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mu);
  background:none;border:none;font-size:0.86rem;cursor:pointer;text-align:left;width:100%;
  border-left:3px solid transparent;}
.nav-it:hover{background:var(--s2);color:var(--tx);}
.nav-it.on{background:rgba(166,230,53,.1);color:var(--lime);border-left-color:var(--lime);font-weight:600;}
.nav-it .nb{margin-left:auto;background:var(--lime);color:#122004;font-size:0.68rem;font-weight:700;
  border-radius:6px;padding:1px 7px;}
.nav-sep{height:1px;background:var(--br);margin:10px 8px;}
.side-foot{border-top:1px solid var(--br);padding-top:12px;display:flex;flex-direction:column;gap:2px;}
.user-card{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--br);
  border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.av{width:34px;height:34px;border-radius:50%;background:var(--s3);border:1px solid var(--b2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;flex:none;}
.u-nome{font-weight:700;font-size:0.88rem;}
.u-papel{font-size:0.72rem;color:var(--mu);}
.side-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--mu);
  text-decoration:none;font-size:0.86rem;background:none;border:none;cursor:pointer;width:100%;text-align:left;}
.side-link:hover{background:var(--s2);color:var(--tx);}
.side-link.sair:hover{color:var(--red);}
.side-rod{display:flex;justify-content:space-between;font-size:0.66rem;color:var(--mu2);padding:10px 12px 0;}

/* ---- PRINCIPAL ---- */
.main{min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--br);
  position:sticky;top:0;background:rgba(12,16,14,.92);backdrop-filter:blur(8px);z-index:40;}
.tb-title{font-weight:700;font-size:1.15rem;flex:1;}
.tb-brand{display:none;align-items:center;gap:9px;flex:1;}
.tb-dir{display:flex;align-items:center;gap:10px;}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--s2);
  border:1px solid var(--br);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn:hover{border-color:var(--b2);}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:0.62rem;
  font-weight:700;border-radius:999px;min-width:18px;height:18px;line-height:18px;padding:0 5px;
  text-align:center;display:none;}
.av-btn{display:flex;align-items:center;gap:9px;background:none;border:none;color:var(--tx);cursor:pointer;
  padding:3px 6px 3px 3px;border-radius:12px;}
.av-btn:hover{background:var(--s2);}
.av-btn .tb-u{text-align:left;line-height:1.2;}
.conteudo{padding:22px 28px 60px;max-width:1180px;width:100%;}

.busca-linha{display:flex;gap:12px;margin-bottom:18px;}
.busca{flex:1;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--br);
  border-radius:12px;padding:0 14px;color:var(--mu2);}
.busca:focus-within{border-color:var(--b2);}
.busca input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:0.86rem;padding:12px 0;}
.busca input::placeholder{color:var(--mu2);}
.btn-nova{display:flex;align-items:center;gap:8px;background:var(--lime);color:#122004;border:none;
  border-radius:12px;padding:0 20px;font-weight:700;font-size:0.86rem;cursor:pointer;white-space:nowrap;}
.btn-nova:hover{background:#b6f04a;}

/* ---- CARTÕES DE RESUMO ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
.tile{display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--br);
  border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;color:var(--tx);transition:all .15s;}
.tile:hover{border-color:var(--b2);transform:translateY(-1px);}
.tile.on{border-color:currentColor;}
.tile-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
.tile-ico .ico{width:22px;height:22px;}
.tile-n{font-size:1.5rem;font-weight:800;line-height:1;}
.tile-l{font-size:0.8rem;margin-top:3px;}
.tone-lime{color:var(--lime);} .tone-lime .tile-ico{background:rgba(166,230,53,.14);}
.tone-blue{color:var(--blue);} .tone-blue .tile-ico{background:rgba(77,158,247,.14);}
.tone-red{color:var(--red);}   .tone-red .tile-ico{background:rgba(255,90,95,.14);}
.tone-warn{color:var(--warn);} .tone-warn .tile-ico{background:rgba(255,176,46,.14);}
.tone-pur{color:var(--pur);}   .tone-pur .tile-ico{background:rgba(167,139,250,.14);}
.tile .tile-n{color:var(--tx);}
.tile .tile-l{color:inherit;}
.tile.tone-lime{background:linear-gradient(135deg,rgba(166,230,53,.07),var(--sf) 60%);}
.tile.tone-blue{background:linear-gradient(135deg,rgba(77,158,247,.07),var(--sf) 60%);}
.tile.tone-red{background:linear-gradient(135deg,rgba(255,90,95,.08),var(--sf) 60%);}
.tile.tone-warn{background:linear-gradient(135deg,rgba(255,176,46,.07),var(--sf) 60%);}
.tile.tone-pur{background:linear-gradient(135deg,rgba(167,139,250,.07),var(--sf) 60%);}

/* ---- CHIPS ---- */
.chips-linha{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.chips{display:flex;gap:8px;flex:1;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip-f{background:var(--sf);border:1px solid var(--br);color:var(--mu);border-radius:999px;
  padding:7px 14px;font-size:0.8rem;cursor:pointer;white-space:nowrap;}
.chip-f:hover{color:var(--tx);border-color:var(--b2);}
.chip-f.on{background:rgba(166,230,53,.12);border-color:var(--lime);color:var(--lime);font-weight:600;}
.ordena{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--mu);}
.ordena select{background:var(--sf);border:1px solid var(--br);color:var(--tx);border-radius:10px;
  padding:7px 10px;font-size:0.8rem;outline:none;}
.btn-filtro{background:var(--sf);border:1px solid var(--br);color:var(--mu);border-radius:10px;
  padding:7px 12px;font-size:0.78rem;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-filtro.on{color:var(--lime);border-color:var(--lime);}
.filtros-mais{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filtros-mais select{background:var(--sf);border:1px solid var(--br);color:var(--tx);border-radius:10px;
  padding:9px 12px;font-size:0.82rem;outline:none;}

/* ---- LINHA DA FILA ---- */
.lista{display:flex;flex-direction:column;gap:10px;}
.fila-it{display:grid;grid-template-columns:auto 1fr auto auto;gap:18px;align-items:center;
  background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:14px 18px;cursor:pointer;
  transition:border-color .15s;}
.fila-it:hover{border-color:var(--b2);}
.fila-it.minha{border-left:3px solid var(--red);
  background:linear-gradient(90deg,rgba(255,90,95,.10),var(--sf) 45%);}
.fila-it.novo .fi-id:after{content:"• novidade";color:var(--lime);margin-left:8px;font-weight:600;}
.fi-ico{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--s2);overflow:hidden;flex:none;}
.fi-ico .ico{width:24px;height:24px;}
.fi-ico img{width:100%;height:100%;object-fit:cover;}
.fi-head{font-weight:700;font-size:0.98rem;margin-bottom:3px;}
.fi-linha{font-size:0.84rem;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;}
.fi-id{color:var(--mu);font-size:0.78rem;}
.fi-tit{font-weight:600;}
.fi-sub{font-size:0.76rem;color:var(--mu2);margin-top:3px;}
.fi-meio{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:150px;}
.fi-dado{display:flex;align-items:center;gap:6px;font-size:0.76rem;color:var(--mu);}
.fi-dado .ico{width:14px;height:14px;}
.fi-acao{display:flex;align-items:center;gap:8px;}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:0.7rem;font-weight:600;padding:3px 9px;
  border-radius:7px;}
.bdg:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.bdg.urg-e{background:rgba(255,90,95,.15);color:var(--red);}
.bdg.urg-a{background:rgba(255,176,46,.15);color:var(--warn);}
.bdg.urg-n{background:rgba(77,158,247,.15);color:var(--blue);}
.bdg.urg-b{background:var(--s3);color:var(--mu);}
.bdg.atraso{background:rgba(255,90,95,.15);color:var(--red);}
.btn-acao{background:var(--lime);color:#122004;border:none;border-radius:10px;padding:10px 20px;
  font-weight:800;font-size:0.78rem;letter-spacing:0.4px;cursor:pointer;text-transform:uppercase;}
.btn-acao:hover{background:#b6f04a;}
.btn-ver{background:none;border:1px solid var(--b2);color:var(--tx);border-radius:10px;padding:9px 16px;
  font-size:0.78rem;cursor:pointer;white-space:nowrap;}
.btn-ver:hover{border-color:var(--b3);background:var(--s2);}
.c-red{color:var(--red);} .c-warn{color:var(--warn);} .c-blue{color:var(--blue);}
.c-ok{color:var(--ok);}   .c-pur{color:var(--pur);}   .c-mu{color:var(--mu);}
.bg-red{background:rgba(255,90,95,.14)!important;color:var(--red);}
.bg-warn{background:rgba(255,176,46,.14)!important;color:var(--warn);}
.bg-blue{background:rgba(77,158,247,.14)!important;color:var(--blue);}
.bg-ok{background:rgba(61,220,151,.14)!important;color:var(--ok);}
.bg-pur{background:rgba(167,139,250,.14)!important;color:var(--pur);}
.bg-mu{background:var(--s2)!important;color:var(--mu);}

/* ---- DETALHE ---- */
.dt-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.dt-top .dt-id{flex:1;text-align:center;font-weight:700;font-size:0.95rem;}
.dt-hero{display:flex;gap:16px;align-items:center;margin-bottom:16px;}
.dt-thumb{width:84px;height:84px;border-radius:14px;background:var(--s2);display:flex;align-items:center;
  justify-content:center;overflow:hidden;flex:none;cursor:pointer;}
.dt-thumb .ico{width:34px;height:34px;}
.dt-thumb img{width:100%;height:100%;object-fit:cover;}
.dt-titulo{font-weight:800;font-size:1.25rem;line-height:1.25;}
.dt-sub{font-size:0.8rem;color:var(--mu);margin:4px 0 8px;}
.dt-bdgs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--br);margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);padding:10px 14px;
  font-size:0.84rem;cursor:pointer;white-space:nowrap;}
.tab:hover{color:var(--tx);}
.tab.on{color:var(--lime);border-bottom-color:var(--lime);font-weight:600;}
.tab small{color:var(--mu2);margin-left:4px;}
.tab-p{display:none;}
.tab-p.on{display:block;}
.sua-acao{background:var(--sf);border:1px solid var(--br);border-radius:16px;padding:18px;margin-bottom:14px;}
.sua-acao-cab{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
.sua-acao-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
.sua-acao-rot{font-size:0.66rem;font-weight:700;letter-spacing:0.6px;color:var(--lime);text-transform:uppercase;}
.sua-acao-t{font-weight:700;font-size:1.02rem;margin:2px 0;}
.sua-acao-s{font-size:0.78rem;color:var(--mu);line-height:1.5;}
.sua-acao .card{background:none;border:none;padding:0;margin:0;}
.sua-acao .card + .card{border-top:1px solid var(--br);padding-top:14px;margin-top:14px;}
.sua-acao .card-t{display:none;}
.btn-grande{width:100%;background:var(--lime);color:#122004;border:none;border-radius:12px;padding:15px;
  font-weight:800;font-size:0.92rem;letter-spacing:0.5px;cursor:pointer;text-transform:uppercase;margin-bottom:10px;}
.btn-grande:hover{background:#b6f04a;}
.btn-par{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-sec{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);border:1px solid var(--br);
  color:var(--tx);border-radius:11px;padding:11px;font-size:0.8rem;cursor:pointer;}
.btn-sec:hover{border-color:var(--b2);}
.btn-sec.perigo{color:var(--red);}
.resumo{background:var(--sf);border:1px solid var(--br);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.res-it{display:grid;grid-template-columns:auto 110px 1fr auto;gap:12px;align-items:center;padding:14px 16px;
  border-bottom:1px solid var(--br);cursor:default;}
.res-it:last-child{border-bottom:none;}
.res-it.link{cursor:pointer;}
.res-it.link:hover{background:var(--s2);}
.res-it .ico{color:var(--mu);}
.res-rot{font-size:0.8rem;font-weight:600;}
.res-val{font-size:0.8rem;color:var(--mu);line-height:1.45;}
.res-val b{color:var(--tx);font-weight:500;}
.res-seta{color:var(--mu2);}

/* ---- COMPONENTES ANTIGOS NA PALETA NOVA ---- */
.card{border-radius:16px;}
.inp,.sel{background:var(--bg);}
.btn-p{background:var(--lime);color:#122004;}
.det-hdr{margin:0 0 16px;}
.det-tit{font-weight:800;}
.modal-cx{background:var(--sf);}

#v-detalhe,#v-nova{max-width:920px;}

/* ---- NAVEGAÇÃO INFERIOR + FOLHA (celular) ---- */
.bottom{display:none;}
.folha{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:260;display:none;align-items:flex-end;}
.folha.on{display:flex;}
.folha-cx{background:var(--sf);border-top:1px solid var(--b2);border-radius:20px 20px 0 0;width:100%;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom));}
.folha-alca{width:40px;height:4px;border-radius:4px;background:var(--b3);margin:0 auto 14px;}
.saud{display:none;}

@media(max-width:900px){
  .app{grid-template-columns:1fr;}
  .side{display:none;}
  .topbar{padding:14px 16px;}
  .tb-title{display:none;}
  .tb-brand{display:flex;}
  .av-btn .tb-u{display:none;}
  .conteudo{padding:12px 14px 100px;}
  .saud{display:block;margin:4px 2px 14px;}
  .saud-t{font-weight:800;font-size:1.4rem;}
  .saud-s{font-size:0.8rem;color:var(--mu);}
  .busca-linha .btn-nova{display:none;}
  .tiles{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none;margin:0 -14px 14px;padding:0 14px;}
  .tiles::-webkit-scrollbar{display:none;}
  .tile{flex:0 0 auto;min-width:92px;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;}
  .tile-ico{width:30px;height:30px;border-radius:8px;}
  .tile-ico .ico{width:17px;height:17px;}
  .tile-n{font-size:1.15rem;}
  .tile-l{font-size:0.72rem;margin-top:0;}
  .chips-linha{margin-bottom:10px;gap:10px;}
  .chips{flex:1 1 100%;margin:0 -14px;padding:0 14px;}
  .ordena{flex:1 1 100%;}
  .ordena select{flex:1;}
  .ordena label{display:none;}
  .fila-it{grid-template-columns:auto 1fr auto;gap:12px;padding:12px;}
  .fi-ico{width:44px;height:44px;}
  .fi-meio{display:none;}
  .fi-mob{display:flex!important;}
  .fi-acao .btn-ver{display:none;}
  .btn-acao{padding:8px 12px;font-size:0.7rem;}
  .res-it{grid-template-columns:auto 84px 1fr auto;gap:10px;padding:13px 14px;}
  .bottom{display:grid;grid-template-columns:1fr 1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:90;
    background:rgba(15,20,17,.97);border-top:1px solid var(--b2);
    padding:6px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);}
  .bn{background:none;border:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;
    gap:3px;font-size:0.7rem;cursor:pointer;position:relative;padding:4px;}
  .bn.on{color:var(--lime);}
  .bn .badge{top:0;right:calc(50% - 20px);}
  .bn-nova .bn-circ{width:52px;height:52px;border-radius:50%;background:var(--lime);color:#122004;
    display:flex;align-items:center;justify-content:center;margin-top:-26px;
    box-shadow:0 6px 20px rgba(166,230,53,.35);border:4px solid var(--bg);}
  .bn-nova .bn-circ .ico{width:24px;height:24px;stroke-width:2.6;}
}
.fi-mob{display:none;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}

@media print{
  .side,.topbar,.bottom,.tabs,.dt-top,.sua-acao .btns,.btn-grande,.btn-par,.folha{display:none !important;}
  .app{display:block;}
  .tab-p{display:block !important;}
  .conteudo{padding:0;max-width:100%;}
  .sua-acao,.resumo{background:#fff;border-color:#bbb;}
  .res-rot,.sua-acao-t,.dt-titulo{color:#111;}
}

</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side">
    <div class="side-logo">
      <div class="logo-q">Q</div>
      <div><div class="logo-t">Q Food</div><div class="logo-s">Central de Requisições</div></div>

      </div>

      <!-- NOVA -->

    </div>
  </main>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   CENTRAL DE REQUISIÇÕES — Index_Requisicoes.html
   Frontend do módulo REQ_ (backend em Code_Requisicoes.gs).

   ⚠️ A API_URL tem que ser a da implantação "Code_Requisicoes" —
   cada módulo tem a sua. Pegue pelo botão Copiar em
   Implantar > Gerenciar implantações > Code_Requisicoes.
   Publicar Nova versão em outra implantação NÃO atualiza esta.
   ════════════════════════════════════════════════════════════════ */

var API_URL = "https://script.google.com/macros/s/AKfycbyso-KAp8Dz6h_zoBzImoGQ2FhHPDvYDpZG0dV0M5jVGHzGT1_6f8fKsXmmJ0.../exec";

// Aparece no rodapé da lateral. Mude a cada publicação — assim dá para
// saber, por um print, se a pessoa está na versão nova ou no cache.
var REQ_VERSAO = "2026-09-23a";

// ────────────────────────────────────────────────────────────
// 1. CONFIG
// ────────────────────────────────────────────────────────────
var ReqConfig = {
  pollingMs:      5 * 60 * 1000,   // 5 min, só com a aba visível
  maxLadoFoto:    1600,            // px — comprime antes de subir
  qualidadeFoto:  0.8,
  sessaoMs:       8 * 60 * 60 * 1000
};

// ────────────────────────────────────────────────────────────
// 2. ESTADO
// ────────────────────────────────────────────────────────────
var ReqState = {
  sessao:      null,
  config:      null,
  lista:       [],
  novidades:   {ids:[], total:0},
  escopo:      "abertas",
  detalheId:   null,
  reqAtual:    null,
  timer:       null,
  anexosNovos: []      // anexos da tela de criação (só links; arquivos sobem depois)
};

// ────────────────────────────────────────────────────────────
// 3. API
// ────────────────────────────────────────────────────────────
var ReqAPI = {
  get: function(action, params){
    var q = "?modulo=requisicoes&action=" + encodeURIComponent(action) +
            "&email=" + encodeURIComponent(ReqState.sessao.email);
    Object.keys(params || {}).forEach(function(k){
      if(params[k] !== undefined && params[k] !== null && params[k] !== ""){
        q += "&" + k + "=" + encodeURIComponent(params[k]);
      }
    });
    // Carimbo de tempo: impede o navegador de servir resposta guardada
    return fetch(API_URL + q + "&_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j.ok) throw new Error(j.error || "Falha na leitura");
        return j.resultado;
      });
  },

  // Uma gravação por vez. Enquanto ela corre, a tela fica bloqueada —
  // sem isso a pessoa clica de novo e o LockService recusa a segunda.
  ocupado: false,

  post: function(action, payload, rotulo){
    if(ReqAPI.ocupado){
      return Promise.reject(new Error("Já estou salvando. Aguarde um instante."));
    }
    ReqAPI.ocupado = true;
    ReqAPI.bloquear(rotulo || "Salvando…");

    payload = payload || {};
    payload.email = ReqState.sessao.email;
    var body = new URLSearchParams();
    body.append("action", action);
    body.append("payload", JSON.stringify(payload));

    return fetch(API_URL + "?modulo=requisicoes", {method:"POST", body:body})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j.ok) throw new Error(j.error || "Falha ao gravar");
        return j.resultado;
      })
      .finally(function(){
        ReqAPI.ocupado = false;
        ReqAPI.liberar();
      });
  },

  bloquear: function(rotulo){
    document.getElementById("gravando-t").textContent = rotulo;
    document.getElementById("gravando").classList.add("on");
  },

  liberar: function(){
    document.getElementById("gravando").classList.remove("on");
  }
};

// ────────────────────────────────────────────────────────────
// 4. SESSÃO
// ────────────────────────────────────────────────────────────
function ReqSessao(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem("qfood_session") || "null"); } catch(_){}
  if(!s || !s.email || (Date.now() - s.ts > ReqConfig.sessaoMs)){
    location.href = "Index_Menu.html";
    return null;
  }
  return s;
}

// ────────────────────────────────────────────────────────────
// 5. UTILITÁRIOS
// ────────────────────────────────────────────────────────────
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function dataBr(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso).substring(0,10);
  return ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2) + "/" + d.getFullYear();
}

function horaBr(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return dataBr(iso) + " " + ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
}

function desde(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  var min = Math.floor((Date.now() - d.getTime()) / 60000);
  if(min < 1)    return "agora";
  if(min < 60)   return "há " + min + " min";
  var h = Math.floor(min / 60);
  if(h < 24)     return "há " + h + "h";
  var dias = Math.floor(h / 24);
  if(dias === 1) return "ontem";
  if(dias < 30)  return "há " + dias + " dias";
  return dataBr(iso);
}

function nomeDe(email){
  if(!email) return "—";
  var alvo = String(email).toLowerCase();
  var u = (ReqState.config && ReqState.config.usuario) || {};
  if(alvo === (u.email||"").toLowerCase()) return "você";
  var lista = (ReqState.config && ReqState.config.pessoas) || [];
  for(var i = 0; i < lista.length; i++){
    if(lista[i].email.toLowerCase() === alvo) return lista[i].nome;
  }
  return String(email).split("@")[0];
}

// Máscara de dinheiro: digita 12345 e vira R$ 123,45
function moeda(el){
  if(!el) return;
  el.addEventListener("input", function(){
    var v = el.value.replace(/\D/g, "");
    if(!v){ el.value = ""; return; }
    var n = (parseInt(v, 10) / 100).toFixed(2).split(".");
    el.value = "R$ " + n[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + n[1];
  });
  el.setAttribute("inputmode", "numeric");
}

// "ML" vira "Mercearia Liberdade" — o código é da planilha, não da pessoa
function nomeEmpresa(chave){
  var lista = (ReqState.config && ReqState.config.empresas) || [];
  for(var i = 0; i < lista.length; i++){
    if(lista[i].chave === String(chave || "").toUpperCase()) return lista[i].valor;
  }
  return chave || "";
}

// "Triagem" saiu do vocabulário da tela; o backend continua com o código antigo
var ReqRotulos = {EM_TRIAGEM:"Em aprovação", EM_ANALISE:"Aprovada, com Compras"};
function rotuloStatus(codigo, doServidor){
  return ReqRotulos[codigo] || doServidor || codigo;
}

function toast(msg, erro){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (erro ? " err" : "");
  t.style.display = "block";
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.style.display = "none"; }, erro ? 6000 : 3200);
}

function mostrar(qual){
  ["lista","detalhe","nova","kpi"].forEach(function(v){
    document.getElementById("v-" + v).style.display = (v === qual ? "block" : "none");
  });
  document.querySelectorAll(".nav-it").forEach(function(n){
    if(qual === "kpi") n.classList.toggle("on", n.dataset.nav === "kpi");
    else if(qual !== "lista") n.classList.remove("on");
  });
  document.getElementById("bn-fila").classList.toggle("on", qual === "lista");
  window.scrollTo(0, 0);
}

// ────────────────────────────────────────────────────────────
// 5b. ÍCONES, SAIR E MENU DO CELULAR
// ────────────────────────────────────────────────────────────
var ReqIco = {

    comprar:  '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',

    atraso:   '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    cotacao:  '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    resposta: '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5z"/>',

    pdf:      '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    anexo:    '<path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
    historico:'<path d="M3 3v5h5"/><path d="M3.1 13A9 9 0 1 0 6 5.3L3 8M12 7v5l4 2"/>',

  },

  svg: function(nome, extra){
    return '<svg class="ico' + (extra ? ' ' + extra : '') + '" viewBox="0 0 24 24" aria-hidden="true">' +
           (ReqIco.p[nome] || ReqIco.p.fila) + '</svg>';
  },

  // Troca os <span data-ico="..."> do HTML fixo pelo desenho
  hidratar: function(raiz){
    (raiz || document).querySelectorAll("[data-ico]").forEach(function(el){
      if(el.dataset.icoFeito) return;
      el.dataset.icoFeito = "1";
      el.insertAdjacentHTML("afterbegin", ReqIco.svg(el.dataset.ico));
    });

};

function ReqPapel(){
  var u = (ReqState.config && ReqState.config.usuario) || {};
  if(u.nivel === "ADMIN")   return "Administrador";
  if(u.isCompras)           return "Compras";
  if(ReqHome.aprovador())   return "Aprovador";
  return "Solicitante";
}

function ReqIniciais(nome){
  var partes = String(nome || "?").trim().split(/\s+/);
  return ((partes[0] || "?")[0] + (partes.length > 1 ? partes[partes.length-1][0] : "")).toUpperCase();
}

function ReqSair(){
  if(!confirm("Sair do sistema?")) return;
  try {
    localStorage.removeItem("qfood_session");
    sessionStorage.clear();
  } catch(_){}
  location.href = "Index_Menu.html";
}

// Menu da conta no celular: é por aqui que se chega ao menu principal,
// aos indicadores e ao Sair, já que a lateral some na tela pequena.
var ReqMenu = {
  abrir: function(){
    var u = (ReqState.config && ReqState.config.usuario) || {};
    var nome = u.nome || ReqState.sessao.nome || ReqState.sessao.email;
    var h = '<div class="folha-alca"></div>' +
      '<div class="user-card"><div class="av">' + esc(ReqIniciais(nome)) + '</div>' +
        '<div><div class="u-nome">' + esc(nome) + '</div><div class="u-papel">' + esc(ReqPapel()) + '</div></div></div>';
    if(ReqHome.veIndicadores()){
      h += '<button class="side-link" onclick="ReqMenu.fechar();ReqKpi.abrir()">' + ReqIco.svg("kpi") + 'Indicadores</button>';
    }
    h += '<button class="side-link" onclick="ReqMenu.fechar();ReqHome.ativar(\'minhas\')">' + ReqIco.svg("minhas") + 'Minhas requisições</button>' +
         '<button class="side-link" onclick="ReqMenu.fechar();ReqHome.ativar(\'encerradas\')">' + ReqIco.svg("arquivo") + 'Encerradas</button>' +
         '<div class="nav-sep"></div>' +
         '<a class="side-link" href="Index_Menu.html">' + ReqIco.svg("grade") + 'Menu principal</a>' +
         '<button class="side-link sair" onclick="ReqSair()">' + ReqIco.svg("sair") + 'Sair</button>';
    document.getElementById("folha-cx").innerHTML = h;
    document.getElementById("folha").classList.add("on");
  },
  fechar: function(){
    document.getElementById("folha").classList.remove("on");
  }
};

// ────────────────────────────────────────────────────────────
// 6. LISTA
// ────────────────────────────────────────────────────────────
var ReqLista = {
  // Carrega tudo que o usuário pode ver, uma vez. Os escopos e filtros
  // são recortes no cliente — assim os contadores nunca divergem da lista
  // e trocar de fila é instantâneo.
  carregar: function(){
    document.getElementById("lista").innerHTML = '<div class="carregando">Carregando…</div>';
    return ReqAPI.get("listar", {}).then(function(r){
      ReqState.lista = r.requisicoes || [];
      ReqHome.contar();
      ReqLista.render();
    }).catch(function(e){
      document.getElementById("lista").innerHTML =
        '<div class="vazio"><div class="vazio-t">Não deu para carregar</div>' +
        '<div class="vazio-s">' + esc(e.message) + '</div></div>';
    });
  },

  // Cada escopo é uma pergunta de trabalho, não um status técnico.
  noEscopo: function(r, escopo){
    var eu = ReqState.sessao.email.toLowerCase();
    var meu = (r.abertoPor || "").toLowerCase() === eu ||
              (r.solicitanteOriginal || "").toLowerCase() === eu;
    var comigo = (r.responsavelAtual || "").toLowerCase() === eu;
    var emTransito = (r.status === "COMPRADA" || r.status === "AGUARDANDO_ENTREGA");

    switch(escopo){
      case "aprovar":         return r.status === "EM_TRIAGEM" && ReqAprov.souAprovador(r.empresa);
      case "receber":         return emTransito && ReqEntregas.souRecebedor(r.empresa);
      case "comprar":         return r.status === "EM_ANALISE";
      case "cotacao":         return r.status === "EM_COTACAO";
      case "aguardando_resp": return r.status === "AGUARDANDO_INFORMACAO";
      case "emcompras":       return !r.encerrada && !emTransito && meu;
      case "entrega":         return emTransito;
      case "minhas":          return meu && !r.encerrada;
      case "comigo":          return comigo && !r.encerrada;
      case "atrasadas":       return ReqPrazo.atrasada(r);
      case "abertas":         return !r.encerrada;
      case "encerradas":      return !!r.encerrada;
      default:                return true;   // todas
    }
  },

  // "Depende de mim agora": sou o responsável, ou posso aprovar,
  // ou é entrega que eu confiro. É o que ganha o destaque vermelho.
  precisaDeMim: function(r){
    if(r.encerrada) return false;
    var eu = ReqState.sessao.email.toLowerCase();
    if((r.responsavelAtual || "").toLowerCase() === eu) return true;
    if(r.status === "EM_TRIAGEM" && ReqAprov.souAprovador(r.empresa)) return true;
    var emTransito = (r.status === "COMPRADA" || r.status === "AGUARDANDO_ENTREGA");
    return emTransito && ReqEntregas.souRecebedor(r.empresa);
  },

  // Título, cor e ícone de cada linha: o que falta acontecer, em português.
  estado: function(r){
    var mim = ReqLista.precisaDeMim(r);
    var s = r.status;
    if(s === "EM_TRIAGEM")
      return mim ? {t:"Precisa da sua aprovação", c:"red", i:"aprovar"}
                 : {t:"Aguardando aprovação",     c:"warn", i:"aprovar"};
    if(s === "EM_ANALISE")
      return mim ? {t:"Precisa da sua compra",    c:"red", i:"comprar"}
                 : {t:"Aguardando compra",        c:"warn", i:"comprar"};
    if(s === "EM_COTACAO")            return {t:"Em cotação",               c:"pur", i:"cotacao"};
    if(s === "AGUARDANDO_INFORMACAO")
      return mim ? {t:"Precisa da sua resposta",  c:"red", i:"resposta"}
                 : {t:"Aguardando informação",    c:"pur", i:"resposta"};
    if(s === "AGUARDANDO_APROVACAO")  return {t:"Aguardando alçada",        c:"warn", i:"aprovar"};
    if(s === "COMPRADA" || s === "AGUARDANDO_ENTREGA")
      return mim ? {t:"Confira a entrega",        c:"blue", i:"receber"}
                 : {t:"A caminho",                c:"blue", i:"caminho"};
    if(s === "RECEBIDA_PARCIAL" || s === "RECEBIDA_DIVERGENCIA")
                                      return {t:"Entrega com pendência",    c:"red", i:"receber"};
    if(s === "CONCLUIDA" || s === "RECEBIDA_OK")
                                      return {t:"Concluída",                c:"ok",  i:"check"};
    if(s === "CANCELADA")             return {t:"Cancelada",                c:"mu",  i:"recusar"};
    if(s === "RECUSADA")              return {t:"Recusada",                 c:"mu",  i:"recusar"};
    return {t:r.statusLabel || s, c:"mu", i:"fila"};
  },

  urgencia: function(u){
    var m = {Emergencial:["urg-e","Urgente"], Alta:["urg-a","Alta"], Normal:["urg-n","Normal"], Baixa:["urg-b","Baixa"]};
    var x = m[u] || m.Normal;
    return '<span class="bdg ' + x[0] + '">' + x[1] + '</span>';
  },

  // "Hoje, 14 de set" / "Amanhã" / "16 de set"
  dataCurta: function(iso){
    if(!iso) return "";
    var d = String(iso).substring(0, 10);
    var hoje = ReqEntregas.hojeIso(), amanha = ReqEntregas.maisDias(1), ontem = ReqEntregas.maisDias(-1);
    var meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    var p = d.split("-");
    var curto = parseInt(p[2], 10) + " de " + meses[parseInt(p[1], 10) - 1];
    if(d === hoje)   return "Hoje, " + curto;
    if(d === amanha) return "Amanhã, " + curto;
    if(d === ontem)  return "Ontem, " + curto;
    return curto;
  },

  // Traduz status técnico em "quem precisa fazer o quê"
  proximaAcao: function(r){
    if(r.encerrada) return "Encerrada";
    var quem = r.responsavelAtual ? nomeDe(r.responsavelAtual) : "";
    if(r.status === "EM_TRIAGEM")            return quem + " precisa aprovar";
    if(r.status === "EM_ANALISE")            return "Aguardando " + quem + " comprar";
    if(r.status === "EM_COTACAO")            return quem + " retorna até " + dataBr(r.prazoRetorno);
    if(r.status === "AGUARDANDO_INFORMACAO") return quem + " precisa responder";
    if(r.status === "COMPRADA" ||
       r.status === "AGUARDANDO_ENTREGA")    return "A caminho" + (r.prazoEntrega ? " · previsão " + dataBr(r.prazoEntrega) : "");
    return quem ? "Aguardando " + quem : "";
  },

  // Ordem de trabalho: primeiro o que depende de você, depois o que
  // está estourando, depois a data mais próxima.
  prioridade: function(a, b){
    var ordem = (document.getElementById("f-ordem") || {}).value || "urgencia";

    if(ordem === "recentes"){
      return (b.ultimaAtualizacao || "").localeCompare(a.ultimaAtualizacao || "");
    }
    if(ordem === "necessidade"){
      var na = (a.dataNecessidade || "9999").substring(0, 10);
      var nb = (b.dataNecessidade || "9999").substring(0, 10);
      if(na !== nb) return na < nb ? -1 : 1;
      return (b.ultimaAtualizacao || "").localeCompare(a.ultimaAtualizacao || "");
    }

    var peso = function(r){
      if(r.encerrada) return 9;
      if(ReqLista.precisaDeMim(r)) return 0;
      if(ReqPrazo.atrasada(r)) return 1;
      if(r.urgencia === "Emergencial") return 2;
      if(r.urgencia === "Alta") return 3;
      return r.dataNecessidade ? 4 : 5;
    };
    var pa = peso(a), pb = peso(b);
    if(pa !== pb) return pa - pb;

    var da = (a.dataNecessidade || "9999").substring(0, 10);
    var db = (b.dataNecessidade || "9999").substring(0, 10);
    if(da !== db) return da < db ? -1 : 1;
    return (b.ultimaAtualizacao || "").localeCompare(a.ultimaAtualizacao || "");
  },

  render: function(){
    var busca   = (document.getElementById("f-busca").value || "").toLowerCase().trim();
    var empresa = document.getElementById("f-empresa").value;
    var status  = document.getElementById("f-status").value;

    var itens = ReqState.lista.filter(function(r){
      if(!ReqLista.noEscopo(r, ReqState.escopo)) return false;
      if(empresa && r.empresa !== empresa) return false;
      if(status && r.status !== status) return false;
      if(!busca) return true;
      return (r.id + " " + r.titulo + " " + r.abertoPorNome + " " + nomeDe(r.solicitanteOriginal) + " " +
              r.empresa + " " + r.unidade).toLowerCase().indexOf(busca) >= 0;
    });

    itens.sort(ReqLista.prioridade);

    var el = document.getElementById("lista");
    if(!itens.length){
      el.innerHTML =
        '<div class="vazio"><div class="vazio-t">Nada por aqui</div>' +
        '<div class="vazio-s">' + esc(ReqHome.vazio()) + '</div>' +
        '<button class="btn btn-p" onclick="ReqForm.abrir()">+ Nova requisição</button></div>';
      return;
    }

    el.innerHTML = itens.map(ReqLista.linha).join("");
  },

  linha: function(r){
    var e = ReqLista.estado(r);
    var mim = ReqLista.precisaDeMim(r);
    var novo = ReqState.novidades.ids.indexOf(r.id) >= 0;
    var emTransito = (r.status === "COMPRADA" || r.status === "AGUARDANDO_ENTREGA");
    var podeAprovar = (r.status === "EM_TRIAGEM" && ReqAprov.souAprovador(r.empresa));
    var podeReceber = emTransito && ReqEntregas.souRecebedor(r.empresa);

    var data = emTransito && r.prazoEntrega
      ? "Previsão " + ReqLista.dataCurta(r.prazoEntrega)
      : (r.dataNecessidade ? "Precisa " + ReqLista.dataCurta(r.dataNecessidade) : "Sem data definida");

    var botao;
    if(podeAprovar){
      botao = '<button class="btn-acao" onclick="event.stopPropagation();ReqAprov.rapida(\'' + r.id + '\')">Aprovar</button>';
    } else if(podeReceber){
      botao = '<button class="btn-acao" onclick="event.stopPropagation();ReqEntregas.uma(\'' + r.id + '\')">Receber</button>';
    } else {
      botao = '<button class="btn-ver">' + (emTransito ? "Acompanhar" : "Ver detalhes") + '</button>';
    }

    var urg = ReqLista.urgencia(r.urgencia) +
              (ReqPrazo.atrasada(r) ? ' <span class="bdg atraso">Atrasada</span>' : '');

    return '<div class="fila-it' + (mim ? ' minha' : '') + (novo ? ' novo' : '') +
           '" onclick="ReqDetalhe.abrir(\'' + r.id + '\')">' +
      '<div class="fi-ico bg-' + e.c + '">' + ReqIco.svg(e.i) + '</div>' +
      '<div style="min-width:0">' +
        '<div class="fi-head c-' + e.c + '">' + esc(e.t) + '</div>' +
        '<div class="fi-linha"><span class="fi-id">#' + esc(r.id) + '</span>' +
          '<span class="fi-tit">' + esc(r.titulo) + '</span></div>' +
        '<div class="fi-sub">' + esc([r.unidade, nomeEmpresa(r.empresa)].filter(Boolean).join(" · ")) +
          ' · ' + esc(nomeDe(r.solicitanteOriginal || r.abertoPor)) + '</div>' +
        '<div class="fi-mob">' + urg +
          '<span class="fi-dado">' + ReqIco.svg("cal") + esc(data) + '</span></div>' +
      '</div>' +
      '<div class="fi-meio">' + urg +
        '<span class="fi-dado">' + ReqIco.svg("cal") + esc(data) + '</span>' +
        '<span class="fi-dado">' + ReqIco.svg("atraso") + 'Atualizada ' + esc(desde(r.ultimaAtualizacao)) + '</span>' +
      '</div>' +
      '<div class="fi-acao">' + botao + '</div>' +
    '</div>';
  }
};

var ReqDetalhe = {
  aba: "geral",

  abrir: function(id){

    ReqState.detalheId = id;
    mostrar("detalhe");
    document.getElementById("v-detalhe").innerHTML = '<div class="carregando">Carregando ' + esc(id) + '…</div>';
    ReqAPI.get("detalhe", {id:id}).then(function(d){
      ReqDetalhe.render(d);
      // Marcar como lida é cosmético. Se falhar, a requisição continua
      // na tela — só o badge de novidade fica errado.
      ReqAPI.post("marcarComoLida", {id:id})
        .then(function(){ ReqNotif.atualizar(); })
        .catch(function(){});
    }).catch(function(e){
      document.getElementById("v-detalhe").innerHTML =
        '<div class="card"><div class="card-t">Não deu para abrir</div>' +
        '<div class="rq-meta">' + esc(e.message) + '</div>' +

      var sub = {
        EM_TRIAGEM:            "Revise as informações e aprove esta requisição para seguir com a compra.",

        EM_COTACAO:            "Quando fechar, registre a compra com fornecedor, valor e previsão.",
        AGUARDANDO_INFORMACAO: "Responda na aba Histórico — a requisição volta sozinha para a Cris.",
        COMPRADA:              "Confira o que chegou e dê baixa. Se algo faltar, a Cris é avisada.",
        AGUARDANDO_ENTREGA:    "Confira o que chegou e dê baixa. Se algo faltar, a Cris é avisada."
      }[r.status] || "";
      return '<div class="sua-acao">' +
        '<div class="sua-acao-cab">' +
          '<div class="sua-acao-ico bg-' + e.c + '">' + ReqIco.svg(e.i) + '</div>' +

         '</div>';

    // Cabeçalho com a primeira foto de referência, quando houver
    var thumb = refs.length
      ? '<div class="dt-thumb" onclick="ReqFoto.ampliar(\'' + refs[0].driveFileId + '\')">' +

      : '<div class="dt-thumb bg-' + e.c + '">' + ReqIco.svg(e.i) + '</div>';

    h += '<div class="dt-hero">' + thumb + '<div style="min-width:0">' +
           '<div class="dt-titulo">' + esc(r.titulo) + '</div>' +
           '<div class="dt-sub">' + esc([r.unidade, nomeEmpresa(r.empresa), r.setor].filter(Boolean).join(" · ")) + '</div>' +
           '<div class="dt-bdgs">' + ReqLista.urgencia(r.urgencia) +

    // ---------- VISÃO GERAL ----------

      ? '<b>' + esc(r.statusRecebimento) + '</b>' +

      : (refs.length ? '' : '<div class="rq-meta">Nenhum link, foto ou arquivo ainda.</div>');
    if(evid.length) h += '<div class="card-t" style="margin-top:16px">Evidências do recebimento</div>' + ReqFoto.galeria(evid, "Evidência");
    if(p.anexar){
      h += '<div class="anexar-bar">' +
             '<button class="btn btn-s" onclick="ReqAnexo.link()">🔗 Link</button>' +
             '<button class="btn btn-s" onclick="ReqAnexo.escolher(\'IMAGEM\')">📷 Foto</button>' +

    // ---------- HISTÓRICO ----------
    h += '<div class="tab-p' + (aba === "historico" ? ' on' : '') + '" data-aba="historico">' +

      }).join("") +
      '</div></div></div>';

  kv: function(rotulo, valor){
    if(!valor) return "";
    return "<dt>" + esc(rotulo) + "</dt><dd>" + esc(valor).replace(/\n/g,"<br>") + "</dd>";
  }
};

      valorFinal:   document.getElementById("c-valor").value.trim(),
      prazoEntrega: document.getElementById("c-prazo").value,

// ────────────────────────────────────────────────────────────
var ReqAnexo = {
  link: function(){
    var url = prompt("Cole o link (Mercado Livre, Instagram, Facebook, site do fornecedor…)");
    if(!url || !url.trim()) return;
    ReqAPI.post("anexar", {id:ReqState.detalheId, tipo:"LINK", url:url.trim()})
      .then(function(r){ toast("Link anexado (" + r.origem + ")."); ReqDetalhe.recarregar(); })
      .catch(function(e){ toast(e.message, true); });
  },

  escolher: function(tipo){
    var inp = document.getElementById("arq");
    inp.accept = (tipo === "IMAGEM") ? "image/*" : ".pdf,.doc,.docx,.xls,.xlsx";
    inp.dataset.tipo = tipo;
    inp.value = "";
    inp.click();
  },

  enviar: function(input){
    var arq = input.files && input.files[0];
    if(!arq) return;
    var tipo = input.dataset.tipo || "OUTRO";
    toast("Enviando " + arq.name + "…");

    var pronto = function(base64, mime){
      ReqAPI.post("anexar", {
        id:          ReqState.detalheId,
        tipo:        tipo,
        base64:      base64,
        mimeType:    mime,
        nomeArquivo: arq.name
      }).then(function(){
        toast("Anexado.");
        ReqDetalhe.recarregar();
      }).catch(function(e){ toast(e.message, true); });
    };

    if(arq.type.indexOf("image") === 0){
      ReqAnexo.comprimir(arq, function(b64){ pronto(b64, "image/jpeg"); });
    } else {
      var fr = new FileReader();
      fr.onload = function(){ pronto(String(fr.result).split(",")[1], arq.type || "application/octet-stream"); };
      fr.onerror = function(){ toast("Não deu para ler o arquivo.", true); };
      fr.readAsDataURL(arq);
    }
  },

  // Foto de celular vem com 4–8 MB. Reduz antes de subir.
  comprimir: function(arq, callback){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = ReqConfig.maxLadoFoto;
        var l = img.width, a = img.height;
        if(l > max || a > max){
          if(l > a){ a = Math.round(a * max / l); l = max; }
          else     { l = Math.round(l * max / a); a = max; }
        }
        var cv = document.createElement("canvas");
        cv.width = l; cv.height = a;
        cv.getContext("2d").drawImage(img, 0, 0, l, a);
        callback(cv.toDataURL("image/jpeg", ReqConfig.qualidadeFoto).split(",")[1]);
      };
      img.onerror = function(){ toast("Não deu para ler a imagem.", true); };
      img.src = fr.result;
    };
    fr.readAsDataURL(arq);
  }
};

// 9b. FOTOS — galeria que abre sozinha + lightbox
// ────────────────────────────────────────────────────────────
var ReqFoto = {
  // Formato lh3: é o que faz a imagem renderizar direto, em vez de
  // abrir a página do Drive. Exige o arquivo com link de visualização.
  src: function(driveFileId, largura){
    return "https://lh3.googleusercontent.com/d/" + driveFileId + "=w" + (largura || 800);
  },

  galeria: function(fotos, rotulo){
    return '<div class="galeria">' + fotos.map(function(a){
      var titulo = a.nomeArquivo || rotulo;
      return '<div class="foto">' +
        '<div class="foto-cab"><span>' + esc(titulo) + '</span>' +
          '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">🔗 ABRIR</a></div>' +
        '<img class="foto-img" alt="' + esc(titulo) + '" loading="lazy"' +
          ' src="' + ReqFoto.src(a.driveFileId, 800) + '"' +
          ' onclick="ReqFoto.ampliar(\'' + a.driveFileId + '\')"' +
          ' onerror="ReqFoto.falhou(this,\'' + a.driveFileId + '\')">' +
      '</div>';
    }).join("") + '</div>';
  },

  // Se o lh3 não vier, tenta o thumbnail do Drive. Se também falhar,
  // é permissão do arquivo — avisa em vez de deixar quadrado quebrado.
  falhou: function(img, id){
    if(!img.dataset.tentou){
      img.dataset.tentou = "1";
      img.src = "https://drive.google.com/thumbnail?id=" + id + "&sz=w800";
      return;
    }
    var box = img.parentNode;
    img.remove();
    var aviso = document.createElement("div");
    aviso.className = "foto-erro";
    aviso.textContent = "Sem permissão para exibir. Use ABRIR.";
    box.appendChild(aviso);
  },

  ampliar: function(id){
    document.getElementById("lightbox-img").src = ReqFoto.src(id, 1600);
    document.getElementById("lightbox").classList.add("on");
  },

  fechar: function(){
    document.getElementById("lightbox").classList.remove("on");
    document.getElementById("lightbox-img").src = "";
  }
};

var ReqReceb = {
  situacao: null,
  fotos:    [null, null, null],
  doc:      null,

  titulos: {
    OK:          {t:"Recebi, está certo",  s:"Se quiser, fotografe o item e anexe a NF ou o recibo. Tudo opcional aqui."},
    PARCIAL:     {t:"Recebi parcial",      s:"Diga o que faltou e fotografe o que chegou. A Cris é avisada por e-mail."},
    DIVERGENCIA: {t:"Recebi com problema", s:"Descreva o problema e anexe as fotos. A Cris é avisada por e-mail."},
    NAO_RECEBI:  {t:"Ainda não chegou",    s:"Registre desde quando está esperando. A cobrança do fornecedor volta para a Cris."}
  },

  abrir: function(situacao){
    ReqReceb.situacao = situacao;
    ReqReceb.fotos = [null, null, null];
    ReqReceb.doc = null;
    var cfg = ReqReceb.titulos[situacao] || {t:"Recebimento", s:""};
    var problema = (situacao === "PARCIAL" || situacao === "DIVERGENCIA");
    var marca = problema ? ' <span class="obrig">*</span>' : ' <i>opcional</i>';

    document.getElementById("modal-cx").innerHTML =
      '<div class="modal-t">' + esc(cfg.t) + '</div>' +
      '<div class="modal-s">' + esc(cfg.s) + '</div>' +
      '<div class="campo"><label class="lbl" for="rc-obs">Observação' +
        (situacao === "OK" ? ' <i>opcional</i>' : ' <span class="obrig">*</span>') + '</label>' +
        '<textarea class="inp" id="rc-obs" placeholder="Ex.: vieram 3 caixas das 5, e uma delas estava molhada."></textarea></div>' +
      '<label class="lbl">Fotos do item' + marca + ' <i>— até 3, toque para escolher</i></label>' +
      '<div class="slots">' +
        [0,1,2].map(function(i){
          return '<div class="slot" id="slot-' + i + '" onclick="ReqReceb.escolherFoto(' + i + ')">' +
                 '<div class="slot-x">📷</div><div>Foto ' + (i+1) + '</div></div>';
        }).join("") +
      '</div>' +
      '<label class="lbl" style="margin-top:14px">NF ou recibo <i>opcional — PDF ou imagem</i></label>' +
      '<div class="slot-arq" id="slot-doc" onclick="ReqReceb.escolherDoc()">📄 <span id="slot-doc-txt">Anexar NF ou recibo</span></div>' +
      '<input type="file" id="rc-foto" accept="image/*" capture="environment" style="display:none" onchange="ReqReceb.pegouFoto(this)">' +
      '<input type="file" id="rc-doc" accept=".pdf,image/*" style="display:none" onchange="ReqReceb.pegouDoc(this)">' +
      '<div class="btns" style="margin-top:18px">' +
        '<button class="btn btn-p" id="rc-ok" onclick="ReqReceb.confirmar()">Registrar</button>' +
        '<button class="btn btn-s" onclick="ReqReceb.fechar()">Cancelar</button>' +
      '</div>';

    document.getElementById("modal").classList.add("on");
    document.getElementById("rc-obs").focus();
  },

  fechar: function(){
    document.getElementById("modal").classList.remove("on");
    document.getElementById("modal-cx").innerHTML = "";
    document.getElementById("modal-cx").classList.remove("largo");
    ReqReceb.fotos = [null, null, null];
    ReqReceb.doc = null;
    // Se o modal foi aberto a partir do aviso de entregas, a tela
    // continua na lista — o detalhe não está aberto.
    if(document.getElementById("v-detalhe").style.display === "none") ReqState.detalheId = null;
  },

  escolherFoto: function(i){
    var inp = document.getElementById("rc-foto");
    inp.dataset.slot = i;
    inp.value = "";
    inp.click();
  },

  pegouFoto: function(input){
    var arq = input.files && input.files[0];
    if(!arq) return;
    var i = parseInt(input.dataset.slot, 10);
    ReqAnexo.comprimir(arq, function(b64){
      ReqReceb.fotos[i] = {base64:b64, nome:arq.name || ("evidencia_" + (i+1) + ".jpg"), mime:"image/jpeg"};
      var slot = document.getElementById("slot-" + i);
      slot.className = "slot cheio";
      slot.innerHTML = '<img alt="Foto ' + (i+1) + '" src="data:image/jpeg;base64,' + b64 + '">';
    });
  },

  escolherDoc: function(){
    var inp = document.getElementById("rc-doc");
    inp.value = "";
    inp.click();
  },

  pegouDoc: function(input){
    var arq = input.files && input.files[0];
    if(!arq) return;
    var guardar = function(b64, mime){
      ReqReceb.doc = {base64:b64, nome:arq.name, mime:mime};
      document.getElementById("slot-doc").className = "slot-arq cheio";
      document.getElementById("slot-doc-txt").textContent = arq.name;
    };
    if(arq.type.indexOf("image") === 0){
      ReqAnexo.comprimir(arq, function(b64){ guardar(b64, "image/jpeg"); });
    } else {
      var fr = new FileReader();
      fr.onload = function(){ guardar(String(fr.result).split(",")[1], arq.type || "application/pdf"); };
      fr.onerror = function(){ toast("Não deu para ler o arquivo.", true); };
      fr.readAsDataURL(arq);
    }
  },

  confirmar: function(){
    var obs = document.getElementById("rc-obs").value.trim();
    var problema = (ReqReceb.situacao === "PARCIAL" || ReqReceb.situacao === "DIVERGENCIA");

    if(ReqReceb.situacao !== "OK" && !obs){
      toast("Descreva o que aconteceu.", true); return;
    }
    var fotos = ReqReceb.fotos.filter(function(f){ return f; });
    if(problema && !fotos.length){
      toast("Anexe pelo menos uma foto do que chegou.", true); return;
    }

    var btn = document.getElementById("rc-ok");
    btn.disabled = true;
    btn.textContent = "Enviando…";

    // Sobe anexo por anexo e só então registra. Se algum falhar,
    // o recebimento não é gravado pela metade.
    var envios = fotos.map(function(f){
      return {tipo:"IMAGEM", base64:f.base64, mimeType:f.mime, nomeArquivo:f.nome, origem:"Evidência"};
    });
    if(ReqReceb.doc){
      envios.push({
        tipo: ReqReceb.doc.mime.indexOf("image") === 0 ? "IMAGEM" : "PDF",
        base64: ReqReceb.doc.base64, mimeType: ReqReceb.doc.mime,
        nomeArquivo: ReqReceb.doc.nome, origem: "NF/Recibo"
      });
    }

    var fila = Promise.resolve();
    envios.forEach(function(a, i){
      fila = fila.then(function(){
        a.id = ReqState.detalheId;
        return ReqAPI.post("anexar", a, "Enviando anexo " + (i+1) + " de " + envios.length + "…");
      });
    });

    fila.then(function(){
      return ReqAPI.post("confirmarRecebimento", {
        id:         ReqState.detalheId,
        situacao:   ReqReceb.situacao,
        observacao: obs
      }, "Registrando recebimento…");
    }).then(function(){
      ReqReceb.fechar();
      toast(ReqReceb.situacao === "OK" ? "Recebimento registrado. Requisição encerrada."
                                       : "Registrado. A Cris foi avisada.");
      ReqDetalhe.recarregar();
    }).catch(function(e){
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = "Registrar";
    });
  }
};

  cartoes: function(){

        {escopo:"entrega",   rotulo:"A caminho"},
        {escopo:"atrasadas", rotulo:"Atrasadas"}
      ];
    }

      {escopo:"comigo",    rotulo:"Precisa de mim"},
      {escopo:"minhas",    rotulo:"Minhas abertas"},
      {escopo:"emcompras", rotulo:"Em compras"},
      {escopo:"entrega",   rotulo:"A caminho"}
    ];
  },

  aprovador: function(){
    var lista = (ReqState.config && ReqState.config.aprovadores) || [];
    var eu = (ReqState.sessao.email || "").toLowerCase();
    return lista.some(function(g){ return String(g.valor).toLowerCase() === eu; });
  },

  veIndicadores: function(){
    var u = (ReqState.config && ReqState.config.usuario) || {};
    return !!(u.isCompras || u.isAdmin || ReqHome.aprovador());
  },

  // A fila abre em "Todos", mas ordenada com o que depende de você no
  // topo — é o que o modelo mostra e o que resolve a caixa de entrada.
  escopoInicial: function(){ return "abertas"; },

  vazio: function(){
    var m = {
      abertas:         "Nenhuma requisição em aberto.",
      encerradas:      "Nenhuma requisição encerrada ainda.",
      aprovar:         "Nenhuma requisição esperando sua aprovação.",
      receber:         "Nenhuma entrega esperando sua conferência.",
      comprar:         "Nenhuma requisição aprovada esperando compra.",
      cotacao:         "Nada em cotação no momento.",
      aguardando_resp: "Ninguém está devendo resposta.",
      atrasadas:       "Nenhum retorno atrasado. Tudo em dia.",
      comigo:          "Nada esperando por você.",
      minhas:          "Você não tem requisição aberta.",
      entrega:         "Nada a caminho.",
      emcompras:       "Nenhuma requisição sua em compras."
    };
    return m[ReqState.escopo] || "Quando alguém precisar de algo, a requisição aparece aqui.";
  },

  // Itens da lateral, conforme o papel de cada um
  nav: function(){
    var u = (ReqState.config && ReqState.config.usuario) || {};
    var itens = [
      {nav:"abertas", ico:"fila",   rotulo:"Fila operacional", badge:true},
      {nav:"minhas",  ico:"minhas", rotulo:"Minhas requisições"}
    ];
    if(ReqHome.aprovador())            itens.push({nav:"aprovar", ico:"aprovar", rotulo:"Para aprovar"});
