<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Extras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mesma identidade do Gestão Técnica e do Controle de Produção */
:root{
  --red:#C8161F; --red-q:#D8161F; --red-ink:#B3121C; --red-soft:#FCECEE; --red-line:#F4D2D6;
  --amber:#D0880A; --amber-ink:#7A3E08; --amber-soft:#FDF4E3; --amber-line:#F2E0BD;
  --slate:#4B5258; --slate-ink:#2F3437; --slate-soft:#F1F1F3; --slate-line:#E2E3E6;
  --green:#24963F; --green-ink:#1F6B2A; --green-soft:#EAF8ED; --green-line:#CDEBD4;
  --blue:#2563EB; --blue-ink:#1D4ED8; --blue-soft:#E8F0FE; --blue-line:#CFDDFB;
  --purple:#6D4BC4; --purple-soft:#F0EBFB; --purple-line:#DDD2F5;
  --side:#141919; --side-ativo:#421313; --side-txt:#E8EAEA;
  --paper:#F6F6F7; --card:#FFFFFF; --line:#E6E7EA; --text:#161819; --mute:#6B7075;
  --r:10px; --r-lg:14px; --side-w:236px; --nav-h:68px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-ink)}
.hidden,[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #93B4F5;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.wm{display:flex;align-items:flex-end;gap:3px;line-height:1;font-weight:800;letter-spacing:-.03em}
.wm .q{color:var(--red-q);font-size:1.4em;line-height:.78;font-weight:900}
.wm-sub{font-size:12.5px;font-weight:500;margin-top:4px}

/* ---------- Estrutura ---------- */
.side{display:none}
.main{min-width:0}
.top{background:var(--card);position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.top .wm{font-size:22px}
.top .grow{flex:1}
.top-t{font-size:13px;color:var(--mute);margin-left:6px;padding-left:10px;border-left:1px solid var(--line);font-weight:600}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--text)}
.icon-btn:hover{background:var(--slate-soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:#3B3F42;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:0;font-size:14px;flex:none}
.content{padding:16px 16px calc(var(--nav-h) + 48px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom)}
.bnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--nav-h);color:#555A5E;font-size:11.5px;font-weight:500}
.bnav button .ic{width:22px;height:22px}
.bnav button.on{color:var(--red)}
.bnav .bdg{position:absolute;top:9px;left:calc(50% + 5px);min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:999px;background:var(--red-q);color:#fff;font-size:10px;font-weight:700}
.bnav .fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(200,22,31,.35);margin:0 auto 14px}
.bnav .fab .ic{width:28px;height:28px;stroke-width:2.4}
.sync-line{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:34;height:28px;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.warn i{background:var(--amber)}.sync.bad i{background:var(--red-q)}.sync.mute i{background:#A3A8AC}
.sync.bad{color:var(--red-ink);font-weight:600}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:var(--side-w) 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-txt);padding:26px 0 20px;overflow-y:auto}
  .top,.bnav,.sync-line{display:none}
  .content{padding:28px 30px 48px}
}
.side-brand{padding:0 24px 30px;color:#fff}
.side-brand .wm{font-size:26px}
.side-brand .wm-sub{color:var(--side-txt);padding-left:30px;margin-top:6px}
.side-nav{display:flex;flex-direction:column;gap:4px;padding:0 10px}
.side-nav button{white-space:nowrap;display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--side-txt);padding:11px 14px;border-radius:6px;font-weight:500;font-size:14px;text-align:left}
.side-nav button .ic{width:19px;height:19px}
.side-nav button:hover{background:rgba(255,255,255,.06)}
.side-nav button.on{background:var(--side-ativo);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--red-q)}
.side-nav .n{margin-left:auto;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:999px;background:var(--red-q);color:#fff;font-size:11px;font-weight:700;text-align:center}
.side-nova{margin:18px 14px 6px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:700;padding:11px}
.side-foot{margin-top:auto;padding:18px 12px 0;display:flex;flex-direction:column;gap:2px}
.side-user{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04);min-width:0}
.side-user .avatar{width:40px;height:40px;background:#27303A;border:1px solid rgba(255,255,255,.14)}
.side-user div{min-width:0}
.side-user b{display:block;color:#fff;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user small{display:block;color:var(--side-txt);opacity:.65;font-size:12.5px}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--side-txt);padding:10px 12px;border-radius:6px;font-size:14px;font-weight:500;text-decoration:none;text-align:left}
.side-foot a:hover,.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.side-sync{padding:10px 12px 0}
.side-sync .sync{color:var(--side-txt);opacity:.8}
.side-rod{padding:10px 12px 0;font-size:11px;color:var(--side-txt);opacity:.45}

/* ---------- Cabeçalho da página ---------- */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:2px 0 18px}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.ph .sub{font-size:13.5px;color:var(--mute);margin-top:4px}
.ph .grow{flex:1}
@media (min-width:900px){.ph h1{font-size:30px}}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card+.card{margin-top:12px}
.card h3{font-size:15px;margin:0 0 10px;font-weight:700}
.sec{margin-top:22px}
.sec-t{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:15px;font-weight:700}
.sec-t .grow{flex:1}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:699px){.kpi{flex-direction:column;gap:8px;padding:12px}.kpi .kic{width:32px;height:32px}.kpi b{font-size:24px}}
.kpi{border:1px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%}
.kpi .kic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi b{display:block;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:13px;font-weight:600}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.k-amber{background:var(--amber-soft);border-color:var(--amber-line)}.k-amber .kic{background:#fff;color:var(--amber)}
.k-blue{background:var(--blue-soft);border-color:var(--blue-line)}.k-blue .kic{background:#fff;color:var(--blue)}
.k-purple{background:var(--purple-soft);border-color:var(--purple-line)}.k-purple .kic{background:#fff;color:var(--purple)}
.k-red{background:var(--red-soft);border-color:var(--red-line)}.k-red .kic{background:#fff;color:var(--red)}
.k-green{background:var(--green-soft);border-color:var(--green-line)}.k-green .kic{background:#fff;color:var(--green)}
.k-slate{background:var(--slate-soft);border-color:var(--slate-line)}.k-slate .kic{background:#fff;color:var(--slate)}
.dup{display:grid;gap:12px}
@media (min-width:900px){.dup{grid-template-columns:1.5fr 1fr}}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-amber{background:var(--amber-soft);color:var(--amber-ink);border-color:var(--amber-line)}
.p-blue{background:var(--blue-soft);color:var(--blue-ink);border-color:var(--blue-line)}
.p-green{background:var(--green-soft);color:var(--green-ink);border-color:var(--green-line)}
.p-red{background:var(--red-soft);color:var(--red-ink);border-color:var(--red-line)}
.p-slate{background:var(--slate-soft);color:var(--slate-ink);border-color:var(--slate-line)}
.p-purple{background:var(--purple-soft);color:var(--purple);border-color:var(--purple-line)}
.sem{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.sem.verde{background:var(--green)}.sem.amarelo{background:#E5A50A}.sem.vermelho{background:var(--red-q)}

.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
button.item:hover,.item.click:hover{border-color:#C9CCD1}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .m{font-size:13px;color:var(--mute);margin-top:2px}
.item .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item.pend{border-style:dashed}
.vagas{font-weight:800;font-size:15px}
.empty{text-align:center;color:var(--mute);padding:26px 12px;font-size:14px;background:var(--card);border:1px dashed var(--line);border-radius:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--red);background:var(--red);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--red-ink)}
.btn.ghost{background:var(--card);color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--slate-soft)}
.btn.ok{background:var(--green);border-color:var(--green)}.btn.ok:hover{background:var(--green-ink)}
.btn.out-red{background:var(--card);color:var(--red-ink);border-color:var(--red-line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.wa{background:#1FA855;border-color:#1FA855}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip.fora{text-decoration:line-through;opacity:.45;border-style:dashed}
.txt-red{color:var(--red-ink);font-weight:600}
.serie-tag{font-size:11px;color:var(--slate-ink,#475569);background:var(--slate-soft);border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros select,.filtros input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:14px}
.filtros input{min-width:160px;flex:1}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px 11px;font-size:15px;min-height:42px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field input[type=checkbox],.field input[type=radio]{width:18px;height:18px;min-height:0;padding:0;flex:none;accent-color:var(--red)}
.chip input{margin:0}
.field .hint{font-size:12px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--text);color:#fff}
.seg button.on.ok{background:var(--green)}.seg button.on.no{background:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 12px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--red)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);height:42px}
.stepper button{width:42px;height:100%;border:0;background:var(--slate-soft);font-size:20px;font-weight:700}
.stepper input{border:0!important;text-align:center;flex:1;min-width:0;font-weight:700}
.resumo{background:var(--slate-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:4px 0 14px}
.alerta{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px;border:1px solid}
.alerta.amarelo{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.alerta.vermelho{background:var(--red-soft);border-color:var(--red-line);color:var(--red-ink)}
.alerta.azul{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}
.alerta ul{margin:6px 0 0;padding-left:18px}

.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;font-size:14px}
.info div small{display:block;color:var(--mute);font-size:12px}
.info div b{font-weight:600}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 12px 16px;font-size:13.5px}
.tl li:before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--slate)}
.tl li.c:before{border-color:var(--amber)}
.tl li small{display:block;color:var(--mute);font-size:12px}

/* Indicadores */
:root{--viz-1:#2a78d6}
.kpi.stat{cursor:default}
.ind-f select{flex:1 1 170px;max-width:240px}
@media (max-width:600px){.ind-f select{flex:1 1 calc(50% - 8px);max-width:none;min-width:0;height:40px;font-size:13.5px}.kpi.stat b{font-size:21px;white-space:nowrap}}
.ind-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.ind-grid>.card{margin:0}
@media (min-width:900px){.ind-grid{grid-template-columns:1fr 1fr}}
.ind-b{min-width:0}
.ind-bt{font-weight:700;font-size:15px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px}
.ind-bt small{font-weight:500;font-size:12px;color:var(--mute)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,32%) 1fr minmax(90px,auto);gap:10px;align-items:center;font-size:13.5px}
.hb[data-act]{cursor:pointer}
.hb-l{line-height:1.25;overflow-wrap:anywhere}
.hb-t{height:14px}
.hb-t span{display:block;height:100%;background:var(--viz-1);border-radius:0 4px 4px 0}
.hb-v{text-align:right;display:flex;flex-direction:column;line-height:1.25}
.hb-v b{font-variant-numeric:tabular-nums}
.hb-v small{color:var(--mute);font-size:11.5px;white-space:nowrap}
@media (max-width:600px){.hb{grid-template-columns:1fr auto;row-gap:4px}.hb-l{grid-column:1/-1}}
.cols{display:flex;gap:6px;height:190px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.col-t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.col-v{font-size:12px;font-weight:700;margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.col-b{display:block;width:100%;max-width:28px;background:var(--viz-1);border-radius:4px 4px 0 0}
.col-l{font-size:12px;color:var(--mute);border-top:1px solid var(--line);text-align:center;padding-top:5px}
.ind-alerta{margin-top:14px;border:1px solid var(--amber-line);background:var(--amber-soft);color:var(--amber-ink);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ind-alerta.neutro{border-color:var(--line);background:var(--card);color:var(--text)}
.ind-mini{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12.5px;color:var(--mute);text-align:center}
.ind-mini span{display:flex;flex-direction:column;gap:2px}
.ind-mini b{color:var(--text);font-size:17px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
.tbl th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl tr:last-child td{border-bottom:0}

/* Velocímetro */
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge svg{width:100%;max-width:260px;height:auto}
.gauge .pct{font-size:40px;font-weight:900;letter-spacing:-.03em;fill:var(--text)}
.gauge .lbl{font-size:13px;fill:var(--mute);font-weight:600}

/* ---------- Janela (folha no celular, diálogo no computador) ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none}
.modal.on{display:block}
.modal .bg{position:absolute;inset:0;background:rgba(15,17,19,.45)}
.modal .box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:0}
.modal .mh{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:14px 16px}
.modal .mh h2{font-size:17px;margin:0;flex:1;font-weight:800}
.modal .mb{padding:16px 16px calc(18px + env(safe-area-inset-bottom))}

<script>
/* ════════════════════════════════════════════════════════════════

const ic = (n, c) => '<svg class="ic' + (c ? ' ' + c : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICO[n] || '') + '</svg>';

/* ════════════════════════════════════════════════════════════════
   TEMPO E RECORRÊNCIA — cópia exata das funções do Code_Extras.gs.
   Mudou lá, mude aqui (e vice-versa).
   ════════════════════════════════════════════════════════════════ */
function extDia_(data) {
  const p = String(data || '').split('-');
  return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
}
function extMin_(data, hora) {
  const h = String(hora || '00:00').split(':');
  return extDia_(data) * 1440 + (+h[0]) * 60 + (+h[1] || 0);
}
function extTurno_(data, ini, fim) {
  const a = extMin_(data, ini);
  let b = extMin_(data, fim);
  if (b <= a) b += 1440;
  return { ini: a, fim: b };
}
function extRiscoCalc(hist, cand, cfg) {
  var contam = ['CONVIDADO', 'CONFIRMADO', 'VALIDADO'];
  var outros = (hist || []).filter(function (h) {
    return contam.indexOf(h.status) >= 0 && (!cand.esc_id || h.esc_id !== cand.esc_id);
  });
  var dCand = extDia_(cand.data);
  var fatores = [], avisos = [], nivel = 0;
  var sobe = function (n) { if (n > nivel) nivel = n; };
  var num = function (k, d) { var v = parseFloat(cfg && cfg[k]); return isFinite(v) ? v : d; };

  var c30 = 1, c60 = 1, c90 = 1;
  outros.forEach(function (h) {
    var d = dCand - extDia_(h.data);
    if (d >= 0 && d < 30) c30++;
    if (d >= 0 && d < 60) c60++;
    if (d >= 0 && d < 90) c90++;
  });
  if (c30 >= num('vermelho_30d', 8)) { sobe(2); fatores.push(c30 + ' extras em 30 dias (contando este)'); }
  else if (c30 >= num('amarelo_30d', 4)) { sobe(1); fatores.push(c30 + ' extras em 30 dias (contando este)'); }

  /* Semanas seguidas na mesma função (semana = bloco de 7 dias a partir de segunda) */
  var semana = function (dia) { return Math.floor((dia + 3) / 7); };
  var semanas = {};
  outros.forEach(function (h) {
    if (h.funcao_id === cand.funcao_id && extDia_(h.data) <= dCand) semanas[semana(extDia_(h.data))] = 1;
  });
  var sCand = semana(dCand), seguidas = 1;
  while (semanas[sCand - seguidas]) seguidas++;
  if (seguidas >= num('semanas_seguidas_amarelo', 3)) {
    sobe(1); fatores.push('Mesma função em ' + seguidas + ' semanas seguidas');
  }

  /* Padrão fixo: mesmo dia da semana, mesmo horário de entrada, mesmo setor */
  var padrao = 1;
  outros.forEach(function (h) {
    var d = dCand - extDia_(h.data);
    if (d > 0 && d < 60 && d % 7 === 0 && h.hora_ini === cand.hora_ini &&
        h.setor === cand.setor && h.empresa === cand.empresa && h.unidade === cand.unidade) padrao++;
  });
  if (padrao >= num('padrao_vermelho', 4)) {
    sobe(2); fatores.push(padrao + 'ª vez no mesmo dia da semana, horário e setor em 60 dias');
  }

  /* Descanso entre turnos */
  var minimo = num('interjornada_horas', 11) * 60;
  var t = extTurno_(cand.data, cand.hora_ini, cand.hora_fim);
  outros.forEach(function (h) {
    var o = extTurno_(h.data, h.hora_ini, h.hora_fim);
    var gap = o.fim <= t.ini ? t.ini - o.fim : (t.fim <= o.ini ? o.ini - t.fim : -1);
    if (gap >= 0 && gap < minimo) {
      sobe(1);
      fatores.push('Só ' + (Math.round(gap / 6) / 10).toString().replace('.', ',') +
        'h de descanso para o extra de ' + extDataCurta(h.data));
    }
  });

  return {
    nivel: ['verde', 'amarelo', 'vermelho'][nivel], fatores: fatores, avisos: avisos,
    c30: c30 - 1, c60: c60 - 1, c90: c90 - 1
  };
}
function extDataCurta(iso) {
  var s = String(iso || '');
  return s.length >= 10 ? s.slice(8, 10) + '/' + s.slice(5, 7) : s;
}

/* ════════════════════════════════════════════════════════════════
   UTILITÁRIOS
   ════════════════════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const low = v => String(v == null ? '' : v).trim().toLowerCase();
const up = v => String(v == null ? '' : v).trim().toUpperCase();
const norm = v => low(v).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
const num = v => { if (v === '' || v == null) return 0; let s = String(v).replace(/R\$/gi, '').replace(/\s/g, ''); if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/\./g, '').replace(',', '.'); else if (s.indexOf(',') >= 0) s = s.replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const dinheiro = v => { const n = num(v).toFixed(2).split('.'); return 'R$ ' + n[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + n[1]; };
const pad = n => ('0' + n).slice(-2);
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function agoraStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
const hojeStr = () => agoraStr().slice(0, 10);
const agoraMin = () => { const s = agoraStr(); return extMin_(s.slice(0, 10), s.slice(11, 16)); };
const addDias = (iso, n) => { const d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) + n * 864e5); return d.toISOString().slice(0, 10); };
const dataBr = iso => { const s = String(iso || ''); return s.length >= 10 ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : s; };
const diaCurto = iso => { if (!iso) return ''; const d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10))); return DIAS[d.getUTCDay()].slice(0, 3) + ' ' + extDataCurta(iso); };
function quando(iso) {
  if (!iso) return '';
  const h = hojeStr();
  if (iso === h) return 'hoje';
  if (iso === addDias(h, 1)) return 'amanhã';
  if (iso === addDias(h, -1)) return 'ontem';
  return diaCurto(iso);
}
const horaDe = s => String(s || '').slice(11, 16);
const plural = (n, s, p) => n + ' ' + (n === 1 ? s : (p || s + 's'));
const iniciais = n => { const p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
const pill = (par, extra) => par ? '<span class="pill ' + par[1] + '">' + esc(par[0]) + (extra ? ' ' + esc(extra) : '') + '</span>' : '';
function toast(msg, tipo) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (tipo ? ' ' + tipo : '');
  t.style.display = 'block';
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.style.display = 'none'; }, tipo === 'err' ? 7000 : (tipo === 'warn' ? 6000 : 3200));
}

/* ════════════════════════════════════════════════════════════════
   APARELHO (IndexedDB) — banco próprio ext_local, sem disputar o
   localStorage com a Produção e a Gestão Técnica.
   ════════════════════════════════════════════════════════════════ */
const Local = {
  db: null, mem: { kv: {}, fila: {} },
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, erro) => {
      if (!window.indexedDB) return erro(new Error('sem IndexedDB'));
      const r = indexedDB.open('ext_local', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
        if (!db.objectStoreNames.contains('fila')) db.createObjectStore('fila', { keyPath: 'id' });
      };
      r.onsuccess = () => { this.db = r.result; ok(r.result); };
      r.onerror = () => erro(r.error);
    });
  },
  op(loja, modo, fn) {
    return this.abrir().then(db => new Promise((ok, erro) => {
      const tx = db.transaction(loja, modo);
      const req = fn(tx.objectStore(loja));
      tx.oncomplete = () => ok(req && req.result !== undefined ? req.result : null);
      tx.onerror = () => erro(tx.error);
    }));
  },
  get(k) { return this.op('kv', 'readonly', s => s.get(k)).then(r => r ? r.v : null).catch(() => (this.mem.kv[k] || null)); },
  set(k, v) { return this.op('kv', 'readwrite', s => s.put({ k, v, ts: Date.now() })).catch(() => { this.mem.kv[k] = v; }); },
  filaTodos() { return this.op('fila', 'readonly', s => s.getAll()).then(r => r || []).catch(() => Object.values(this.mem.fila)); },
  filaPut(it) { return this.op('fila', 'readwrite', s => s.put(it)).catch(() => { this.mem.fila[it.id] = it; }); },
  filaDel(id) { return this.op('fila', 'readwrite', s => s.delete(id)).catch(() => { delete this.mem.fila[id]; }); }
};

/* ════════════════════════════════════════════════════════════════
   SERVIDOR
   ════════════════════════════════════════════════════════════════ */
async function lerJson(r) {
  const t = String(await r.text() || '').trim();
  if (!t || t.charAt(0) === '<') { const e = new Error('O servidor respondeu uma página em vez de dados.'); e.rede = true; throw e; }
  let j;
  try { j = JSON.parse(t); } catch (_) { const e = new Error('Resposta do servidor ilegível.'); e.rede = true; throw e; }
  if (!j.ok) { const e = new Error(j.error || 'Falha no servidor'); e.regra = !!j.regra; throw e; }
  return j;
}
async function apiGet(action, params) {
  let q = '?modulo=extras&action=' + encodeURIComponent(action) + '&email=' + encodeURIComponent(S.sessao.email);
  Object.keys(params || {}).forEach(k => { q += '&' + k + '=' + encodeURIComponent(params[k]); });
  q += '&_=' + Date.now();
  let erro;
  for (let n = 0; n < 3; n++) {
    try { return (await lerJson(await fetch(CFG.GAS_URL + q, { cache: 'no-store' }))).resultado; }
    catch (e) { erro = e; if (e.regra) throw e; await new Promise(ok => setTimeout(ok, 800 * (n + 1))); }
  }
  erro.rede = true;
  throw erro;
}
async function apiPost(action, payload) {
  const body = JSON.stringify({ action, payload: Object.assign({}, payload, { email: S.sessao.email }) });
  let r;
  try { r = await fetch(CFG.GAS_URL + '?modulo=extras', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); }
  catch (e) { e.rede = true; throw e; }
  return (await lerJson(r)).resultado;
}

/* ════════════════════════════════════════════════════════════════
   SESSÃO — a mesma do Index_Menu
   ════════════════════════════════════════════════════════════════ */
function sessao() {
  try {
    const s = JSON.parse(localStorage.getItem('qfood_session') || 'null');
    const ttl = (s && s.ttl) || CFG.SESSAO_H * 3600e3;
    if (!s || !s.email || Date.now() - (s.ts || 0) > ttl) return null;
    s.email = low(s.email);
    return s;
  } catch (e) { return null; }
}
function guardarPedidoAbrir() {
  const m = location.hash.match(/abrir=([^&]+)/);
  if (m) { try { localStorage.setItem(CFG.ABRIR_KEY, decodeURIComponent(m[1])); } catch (e) { } }
}
function irParaMenu() { guardarPedidoAbrir(); location.href = CFG.MENU_URL; }
function sair() {
  if (!confirm('Sair do sistema?')) return;
  try { localStorage.removeItem('qfood_session'); } catch (e) { }
  location.href = CFG.MENU_URL;
}

/* ════════════════════════════════════════════════════════════════
   ESTADO
   base: o que o servidor mandou.  d: base + ações ainda na fila.
   ════════════════════════════════════════════════════════════════ */
const S = {
  sessao: null, base: null, d: null, fila: [], enviando: false,
  view: 'inicio', sync: { estado: 'mute', hora: '' },
  f: { solEscopo: 'abertas', solEmp: '', solBusca: '', banco: '', bancoFun: '', bancoSem: '', pagTab: 'apagar', valTab: 'pendentes', indAba: 'resumo', indPer: '30', indEmp: '', indUni: '', indSet: '', indCc: '', indFun: '', indVin: '' },
  sel: {}, modalCtx: null
};
const U = () => S.d.usuario;
const cfg = () => S.d.config || {};
const solDe = id => S.d.solicitacoes.find(s => s.sol_id === id);
const escDa = sol => S.d.escalas.filter(e => e.sol_id === sol.sol_id);
const pessoaDe = id => S.d.pessoas.find(p => p.pessoa_id === id);
const funcaoNome = id => { const f = S.d.funcoes.find(x => x.funcao_id === id); return f ? f.nome : id; };
const empNome = cod => { const r = S.d.estrutura.find(x => up(x.empresa) === up(cod)); return r ? (r.empresa_nome || r.empresa) : cod; };
const nomeDe = email => email ? ((email === U().email) ? 'você' : (S.d.nomes[low(email)] || String(email).split('@')[0])) : '—';
const ocupadas = sol => escDa(sol).filter(e => ATIVAS.indexOf(e.status) >= 0).length;
const confirmados = sol => escDa(sol).filter(e => e.status === 'CONFIRMADO' || e.status === 'VALIDADO').length;
const turno = x => extTurno_(x.data, x.hora_ini, x.hora_fim);
/* Série = mesma vaga aberta em várias datas (dias fixos) */
const serieDe = sol => sol && sol.serie_id ? S.d.solicitacoes.filter(x => x.serie_id === sol.serie_id).sort((a, b) => a.data.localeCompare(b.data)) : (sol ? [sol] : []);
const serieCancelaveis = sol => serieDe(sol).filter(x => x.data >= sol.data && ['CANCELADA', 'RECUSADA', 'ENCERRADA'].indexOf(x.status) < 0 &&
  (podeAprovar(x) || low(x.solicitante) === U().email) && !escDa(x).some(e => e.status === 'VALIDADO'));
const local = sol => empNome(sol.empresa) + (sol.unidade && norm(sol.unidade) !== norm(empNome(sol.empresa)) ? ' ' + sol.unidade : '');

function bate(a, b, n) { if (!a || a === '*') return true; return n ? norm(a) === norm(b) : up(a) === up(b); }
const noEscopo = (e, s) => bate(e.empresa, s.empresa) && bate(e.unidade, s.unidade, true) && bate(e.setor, s.setor, true);
const podeAprovar = s => U().admin || U().escopos.some(e => e.papel === 'APROVADOR' && noEscopo(e, s));
const autoaprova = s => U().admin || U().escopos.some(e => e.papel === 'APROVADOR' && e.autoaprova && noEscopo(e, s));
const podeValidar = s => U().admin || U().escopos.some(e => noEscopo(e, s));
const podeEscalar = s => podeValidar(s) || low(s.solicitante) === U().email;
function papel() {
  const u = U();
  if (u.admin) return 'Administrador';
  if (u.financeiro && !u.gestor) return 'Financeiro';
  if (u.aprovador) return 'Aprovador' + (u.financeiro ? ' e financeiro' : '');
  if (u.gestor) return 'Validador';
  return 'Solicitante';
}

/* Valor da tabela: mesma regra do servidor */
function valorDe(funcaoId, horas, data) {
  const vivos = S.d.valores.filter(v => (!v.vigencia_ini || v.vigencia_ini <= data) && (!v.vigencia_fim || v.vigencia_fim >= data));
  let l = vivos.filter(v => v.funcao_id === funcaoId);
  if (!l.length) l = vivos.filter(v => !v.funcao_id || v.funcao_id === '*');
  if (!l.length) return 0;
  l.sort((a, b) => num(a.horas) - num(b.horas));
  const c = l.find(v => num(v.horas) >= horas - 0.25) || l[l.length - 1];
  return num(c.valor);
}
const horasTurno = (data, ini, fim, intervalo) => { const t = extTurno_(data, ini, fim); return Math.max(0, (t.fim - t.ini - num(intervalo)) / 60); };
const hFmt = h => (Math.round(h * 10) / 10).toString().replace('.', ',') + 'h';

/* Status da solicitação: mesma regra do servidor */
function recalc(sol) {
  if (['SOLICITADA', 'RECUSADA', 'CANCELADA'].indexOf(sol.status) >= 0) return;
  const e = escDa(sol);
  const ativas = e.filter(x => ATIVAS.indexOf(x.status) >= 0).length;
  const conf = e.filter(x => x.status === 'CONFIRMADO' || x.status === 'VALIDADO').length;
  const pend = e.filter(x => x.status === 'CONVIDADO' || x.status === 'CONFIRMADO').length;
  if (agoraMin() > turno(sol).fim && pend === 0 && e.some(x => x.status === 'VALIDADO' || x.status === 'FALTOU')) sol.status = 'ENCERRADA';
  else if (conf >= num(sol.vagas)) sol.status = 'COMPLETA';
  else if (ativas) sol.status = 'EM_ESCALA';
  else sol.status = 'APROVADA';
}
/* Rótulo que leva o tempo em conta: vaga que passou sem ninguém não é "em escala" */
function rotuloSol(s) {
  if (['APROVADA', 'EM_ESCALA'].indexOf(s.status) >= 0 && agoraMin() > turno(s).ini) {
    return ocupadas(s) ? ['Em andamento', 'p-blue'] : ['Não preenchida', 'p-red'];
  }
  return ST_SOL[s.status];
}
function rotuloEsc(e) {
  if ((e.status === 'CONFIRMADO' || e.status === 'CONVIDADO') && agoraMin() >= turno(e).fim) return ['Aguardando validação', 'p-purple'];
  if (e.status === 'VALIDADO' && e.status_fin) {
    const f = ST_FIN[e.status_fin];
    return e.status_fin === 'AGENDADO' ? [f[0] + ' ' + extDataCurta(e.pag_data_prevista), f[1]] : f;
  }
  return ST_ESC[e.status];
}
function riscoDe(p, cand) {
  return extRiscoCalc(p.hist || [], cand, cfg());
}
function riscoHoje(p) {
  const c = cfg();
  if (p.c30 >= num(c.vermelho_30d || 8)) return 'vermelho';
  if (p.c30 >= num(c.amarelo_30d || 4)) return 'amarelo';
  return 'verde';
}

/* ════════════════════════════════════════════════════════════════
   AÇÕES LOCAIS — o que a tela mostra enquanto a ação está na fila
   ════════════════════════════════════════════════════════════════ */
function aplicarLocal(it) {
  const p = it.payload, d = S.d, u = d.usuario;
  const s = p.sol_id ? solDe(p.sol_id) : null;
  const e = p.esc_id ? d.escalas.find(x => x.esc_id === p.esc_id) : null;
  switch (it.action) {
    case 'criarSolicitacao':
      if (s) return;
      d.solicitacoes.push(Object.assign({}, p, {
        numero: 'Enviando…', status: p.autoaprovar ? 'APROVADA' : 'SOLICITADA', solicitante: u.email, solicitante_nome: u.nome,
        funcao_nome: funcaoNome(p.funcao_id), vagas: String(p.vagas), intervalo_min: String(p.intervalo_min || 0),
        valor_previsto: String(valorDe(p.funcao_id, horasTurno(p.data, p.hora_ini, p.hora_fim, p.intervalo_min), p.data)),
        criado_em: p.feito_em, _pend: true
      }));
      break;
    case 'criarSerie':
      (p.itens || []).forEach(x => {
        if (solDe(x.sol_id)) return;
        aplicarLocal({ action: 'criarSolicitacao', payload: Object.assign({}, p, { itens: undefined, sol_id: x.sol_id, data: x.data }) });
      });
      break;
    case 'decidirSerie':
      if (s) serieDe(s).filter(x => x.status === 'SOLICITADA' && podeAprovar(x)).forEach(x => aplicarLocal({ action: 'decidirSolicitacao', payload: Object.assign({}, p, { sol_id: x.sol_id }) }));
      break;
    case 'cancelarSerie':
      if (s) serieCancelaveis(s).forEach(x => aplicarLocal({ action: 'cancelarSolicitacao', payload: Object.assign({}, p, { sol_id: x.sol_id }) }));
      break;
    case 'decidirSolicitacao':
      if (s && s.status === 'SOLICITADA') { s.status = p.decisao === 'APROVAR' ? 'APROVADA' : 'RECUSADA'; s.aprovador_nome = u.nome; s.motivo_recusa = p.motivo || ''; s._pend = true; }
      break;
    case 'cancelarSolicitacao':
      if (s) { s.status = 'CANCELADA'; s._pend = true; escDa(s).forEach(x => { if (x.status === 'CONVIDADO' || x.status === 'CONFIRMADO') x.status = 'CANCELADO'; }); }
      break;
    case 'escalar': {
      if (!s || e) return;
      const pes = pessoaDe(p.pessoa_id);
      const nova = {
        esc_id: p.esc_id, sol_id: s.sol_id, numero: s.numero, pessoa_id: p.pessoa_id, pessoa_nome: pes ? pes.nome : '',
        empresa: up(s.empresa), unidade: s.unidade, setor: s.setor, funcao_id: s.funcao_id, data: s.data, hora_ini: s.hora_ini, hora_fim: s.hora_fim,
        status: p.confirmado ? 'CONFIRMADO' : 'CONVIDADO', risco_nivel: p._nivel || 'verde', justificativa: p.justificativa || '',
        escalado_por: u.email, escalado_por_nome: u.nome, _pend: true
      };
      d.escalas.push(nova);
      if (pes) (pes.hist = pes.hist || []).push({ esc_id: nova.esc_id, data: nova.data, hora_ini: nova.hora_ini, hora_fim: nova.hora_fim, funcao_id: nova.funcao_id, empresa: nova.empresa, unidade: nova.unidade, setor: nova.setor, status: nova.status });
      recalc(s);
      break;
    }
    case 'escalaAcao':
      if (e) {
        e.status = { CONFIRMAR: 'CONFIRMADO', RECUSOU: 'RECUSOU', CANCELAR: 'CANCELADO' }[p.acao] || e.status; e._pend = true;
        const pes = pessoaDe(e.pessoa_id); if (pes && pes.hist) pes.hist.forEach(h => { if (h.esc_id === e.esc_id) h.status = e.status; });
        const so = solDe(e.sol_id); if (so) recalc(so);
      }
      break;
    case 'validar':
      if (e) {
        if (p.realizou) {
          e.status = 'VALIDADO'; e.hora_ini_real = p.hora_ini_real; e.hora_fim_real = p.hora_fim_real;
          e.valor_final = String(p._valor || 0); e.status_fin = p.pag_modo === 'AGENDADO' ? 'AGENDADO' : 'LIBERADO'; e.pag_data_prevista = p.pag_data || '';
        } else { e.status = 'FALTOU'; e.valor_final = '0'; }
        e.validador_nome = u.nome; e._pend = true;
        const so = solDe(e.sol_id); if (so) recalc(so);
      }
      break;
    case 'disponibilidade':
      if (p.acao === 'REMOVER') d.disponibilidade = d.disponibilidade.filter(x => x.id !== p.id);
      else if (!d.disponibilidade.some(x => x.id === p.id)) d.disponibilidade.push(Object.assign({ _pend: true }, p));
      break;
  }
}
function montarEstado() {
  S.d = JSON.parse(JSON.stringify(S.base));
  S.fila.forEach(it => { try { aplicarLocal(it); } catch (e) { console.warn(e); } });
}

/* ════════════════════════════════════════════════════════════════
   FILA — grava primeiro no aparelho, envia depois
   ════════════════════════════════════════════════════════════════ */
const Fila = {
  async carregar() {
    const todos = await Local.filaTodos();
    S.fila = todos.filter(i => i.email === S.sessao.email).sort((a, b) => a.criado - b.criado);
  },
  async add(action, payload) {
    const id = uid('cmd');
    const it = { id, email: S.sessao.email, action, criado: Date.now(), tentativas: 0,
      payload: Object.assign({}, payload, { cmd_id: id, feito_em: agoraStr(), _fila: !navigator.onLine }) };
    S.fila.push(it);
    aplicarLocal(it);
    render();
    await Local.filaPut(it);
    if (!navigator.onLine) toast('Sem internet: guardado no aparelho. Sobe sozinho quando o sinal voltar.', 'warn');
    Fila.enviar();
    return it;
  },
  async tirar(it) {
    S.fila = S.fila.filter(x => x.id !== it.id);
    await Local.filaDel(it.id);
  },
  async enviar() {
    if (S.enviando || !navigator.onLine || !S.fila.length) { pintarSync(); return; }
    S.enviando = true; pintarSync();
    let mexeu = false;
    try {
      while (S.fila.length && navigator.onLine) {
        const it = S.fila[0];
        try {
          const r = await apiPost(it.action, it.payload);
          if (r && r.conflito) toast(r.mensagem, 'warn');
          await Fila.tirar(it); mexeu = true;
        } catch (e) {
          if (e.regra) {
            await Fila.tirar(it); mexeu = true;
            toast('Não entrou: ' + e.message, 'err');
          } else {
            it.tentativas++; it.payload._fila = true;
            await Local.filaPut(it);
            if (it.tentativas >= 8) { await Fila.tirar(it); mexeu = true; toast('Uma ação não pôde ser enviada depois de várias tentativas: ' + e.message, 'err'); }
            break;
          }
        }
      }
    } finally { S.enviando = false; }
    if (mexeu) await carregar(); else pintarSync();
  }
};

/* Ações que só vão com internet (dinheiro, CPF/PIX, configuração) */
async function online(action, payload, rotulo) {
  if (!navigator.onLine) { toast('Esta ação precisa de internet.', 'err'); throw new Error('offline'); }
  gravando(true, rotulo);
  try {
    const r = await apiPost(action, Object.assign({ cmd_id: uid('cmd') }, payload));
    return r;
  } catch (e) {
    toast(e.rede ? 'Não consegui confirmar com o servidor. Recarregue e veja se entrou antes de repetir.' : e.message, 'err');
    throw e;
  } finally { gravando(false); }
}

/* ════════════════════════════════════════════════════════════════
   CARGA
   ════════════════════════════════════════════════════════════════ */
const chaveCarga = () => 'carga:' + S.sessao.email;
async function carregar() {
  if (!navigator.onLine) { pintarSync(); return; }
  try {
    const r = await apiGet('load');
    S.base = r;
    Local.set(chaveCarga(), r);
    S.sync = { estado: 'ok', hora: agoraStr() };
    montarEstado();
    render();
    abrirPedido();
  } catch (e) {
    if (e.regra) { telaBloqueio(e.message); return; }
    S.sync = { estado: S.base ? 'cache' : 'bad', hora: S.sync.hora };
    if (!S.base) telaBloqueio('Não consegui falar com o servidor. Confira a internet e tente de novo.', true);
    else pintarSync();
  }
}
function telaBloqueio(msg, tentar) {
  $('#app').innerHTML = '<div class="bloqueio"><div class="wm" style="justify-content:center;font-size:28px"><span class="q">Q</span>Food</div>' +
    '<h1>Extras</h1><p class="mute">' + esc(msg) + '</p><p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
    (tentar ? '<button class="btn" onclick="location.reload()">Tentar de novo</button>' : '') +
    '<a class="btn ghost" href="' + CFG.MENU_URL + '">Voltar ao Menu</a></p></div>';
  $('.bnav').style.display = 'none'; $('.sync-line').style.display = 'none';
}
function abrirPedido() {
  let alvo = null;
  const m = location.hash.match(/abrir=([^&]+)/);
  if (m) alvo = decodeURIComponent(m[1]);
  try { alvo = alvo || localStorage.getItem(CFG.ABRIR_KEY); localStorage.removeItem(CFG.ABRIR_KEY); } catch (e) { }
  if (!alvo) return;
  history.replaceState(null, '', location.pathname);
  const s = S.d.solicitacoes.find(x => x.numero === alvo || x.sol_id === alvo);
  if (s) abrirSol(s.sol_id); else toast('Não achei ' + alvo + ' entre as solicitações que você vê.', 'warn');
}

/* ════════════════════════════════════════════════════════════════
   CONTADORES (menu e início)
   ════════════════════════════════════════════════════════════════ */
function contar() {
  const d = S.d, am = agoraMin(), h = hojeStr();
  const aprovar = d.solicitacoes.filter(s => s.status === 'SOLICITADA' && podeAprovar(s) && !(low(s.solicitante) === U().email && !autoaprova(s)));
  const vagas = d.solicitacoes.filter(s => ['APROVADA', 'EM_ESCALA'].indexOf(s.status) >= 0 && turno(s).ini > am && podeEscalar(s))
    .map(s => ({ s, falta: num(s.vagas) - ocupadas(s) })).filter(x => x.falta > 0)
    .sort((a, b) => turno(a.s).ini - turno(b.s).ini);
  const validar = d.escalas.filter(e => (e.status === 'CONVIDADO' || e.status === 'CONFIRMADO') && turno(e).ini <= am && solDe(e.sol_id) && podeValidar(solDe(e.sol_id)))
    .sort((a, b) => turno(a).fim - turno(b).fim);
  const pagar = U().financeiro ? d.escalas.filter(e => e.status === 'VALIDADO' && (e.status_fin === 'LIBERADO' || (e.status_fin === 'AGENDADO' && e.pag_data_prevista <= h))) : [];
  const risco = d.pessoas.filter(p => p.status !== 'INATIVO' && riscoHoje(p) !== 'verde');
  const meus = d.log.filter(l => (l.tipo === 'CONFLITO' || l.tipo === 'REJEITADO') && l.usuario === U().email && l.data_hora.slice(0, 10) >= addDias(h, -3));
  return { aprovar, vagas, validar, pagar, risco, meus };
}

function pintarSync() {
  const n = S.fila.length;
  let cls = 'ok', txt;
  if (!navigator.onLine) { cls = 'bad'; txt = 'Sem internet' + (n ? ' · ' + plural(n, 'ação guardada', 'ações guardadas') : ' · mostrando o que estava salvo'); }
  else if (S.enviando || n) { cls = 'warn'; txt = 'Enviando ' + plural(n, 'ação', 'ações') + '…'; }
  else if (S.sync.estado === 'cache') { cls = 'warn'; txt = 'Sem resposta do servidor · mostrando o que estava salvo'; }
  else if (S.sync.estado === 'ok') txt = 'Sincronizado às ' + horaDe(S.sync.hora);
  else { cls = 'mute'; txt = 'Carregando'; }
  ['#sync-m', '#sync-d'].forEach(id => { const el = $(id); if (!el) return; el.className = 'sync ' + cls; el.lastChild.textContent = txt; });
}

/* ════════════════════════════════════════════════════════════════
   TELAS
   ════════════════════════════════════════════════════════════════ */
function render() {
  if (!S.d) return;

function indPeriodo(k) {

const pctTxt = (a, b) => b ? (Math.round(a / b * 1000) / 10).toString().replace('.', ',') + '%' : '—';
const minDe = dh => extMin_(String(dh).slice(0, 10), String(dh).slice(11, 16) || '00:00');
function durTxt(m) {
  if (m == null || !isFinite(m)) return '—';
  m = Math.max(0, Math.round(m));
  if (m < 60) return m + ' min';
  if (m < 1440) return Math.floor(m / 60) + 'h' + pad(m % 60);

}
const media = l => l.length ? l.reduce((t, x) => t + x, 0) / l.length : null;
const vinculoDe = e => { const p = pessoaDe(e.pessoa_id); return p ? p.tipo_vinculo : ''; };
const horasDe = e => num(e.horas) || horasTurno(e.data, e.hora_ini_real || e.hora_ini, e.hora_fim_real || e.hora_fim, e.intervalo_real_min);

  const m = {};

/* Junta tudo o que as abas usam, já filtrado */
function indDados() {
  const f = S.f, per = indPeriodo(f.indPer), am = agoraMin();
  const okSol = s => (!f.indEmp || up(s.empresa) === f.indEmp) && (!f.indUni || s.unidade === f.indUni) && (!f.indSet || s.setor === f.indSet) &&
    (!f.indCc || s.centro_custo === f.indCc) && (!f.indFun || s.funcao_id === f.indFun);
  const okEsc = e => !f.indVin || vinculoDe(e) === f.indVin;
  const todasSols = S.d.solicitacoes.filter(s => !s._pend && okSol(s));
  const sols = todasSols.filter(s => s.data >= per.ini && s.data <= per.fim);
  const ids = {}; sols.forEach(s => { ids[s.sol_id] = s; });
  const esc = S.d.escalas.filter(e => ids[e.sol_id] && !e._pend && okEsc(e));
  const val = esc.filter(e => e.status === 'VALIDADO');
  const falt = esc.filter(e => e.status === 'FALTOU');
  const custo = val.reduce((t, e) => t + num(e.valor_final), 0);
  const horas = val.reduce((t, e) => t + horasDe(e), 0);

  /* Vagas: só solicitações aprovadas com turno já começado */
  const aprov = sols.filter(s => ['APROVADA', 'EM_ESCALA', 'COMPLETA', 'ENCERRADA'].indexOf(s.status) >= 0);
  const comecadas = aprov.filter(s => turno(s).ini <= am);
  let vagas = 0, preenchidas = 0, cheias = 0, parciais = 0, vazias = 0;
  comecadas.forEach(s => {
    const v = num(s.vagas), ocup = escDa(s).filter(e => ['VALIDADO', 'CONFIRMADO', 'CONVIDADO'].indexOf(e.status) >= 0).length;
    vagas += v; preenchidas += Math.min(v, ocup);
    if (ocup >= v) cheias++; else if (ocup > 0) parciais++; else vazias++;
  });

  /* Antecedência: do pedido ao início do turno */
  const antec = sols.filter(s => s.criado_em && ['CANCELADA'].indexOf(s.status) < 0).map(s => turno(s).ini - minDe(s.criado_em));
  const faixasAnt = [['72h ou mais', a => a >= 4320], ['24 a 72h', a => a >= 1440 && a < 4320], ['6 a 24h', a => a >= 360 && a < 1440], ['Menos de 6h', a => a >= 0 && a < 360], ['Lançado depois de começar', a => a < 0]]
    .map(x => ({ rot: x[0], n: antec.filter(x[1]).length }));

  /* Aprovação: só as que esperaram outra pessoa aprovar */
  const decididas = sols.filter(s => s.decidido_em && s.criado_em && s.aprovador);
  const auto = decididas.filter(s => low(s.aprovador) === low(s.solicitante));
  const esperaram = decididas.filter(s => low(s.aprovador) !== low(s.solicitante));
  const tAprov = esperaram.map(s => minDe(s.decidido_em) - minDe(s.criado_em)).filter(x => x >= 0);
  const aprovPorUni = agruparTempo(esperaram, s => local(s), s => minDe(s.decidido_em) - minDe(s.criado_em));

  /* Preencher: da aprovação até a última vaga ocupada, antes do turno */
  const tPreench = [];
  aprov.forEach(s => {
    const v = num(s.vagas);
    const l = escDa(s).filter(e => e.escalado_em && ['CANCELADO', 'RECUSOU'].indexOf(e.status) < 0).sort((a, b) => a.escalado_em.localeCompare(b.escalado_em));
    if (l.length < v) return;
    const fim = minDe(l[v - 1].escalado_em), ini = minDe(s.decidido_em || s.criado_em);
    if (fim <= turno(s).ini && fim >= ini) tPreench.push(fim - ini);
  });

  /* Convites e faltas */
  const resp = esc.filter(e => ['CONFIRMADO', 'VALIDADO', 'FALTOU', 'RECUSOU'].indexOf(e.status) >= 0);
  const aceitos = resp.filter(e => e.status !== 'RECUSOU');

  /* Previsto x realizado: turnos encerrados e sem validação pendente */
  let previsto = 0, prevPreench = 0, realizado = 0, nPrev = 0, acima = 0, abaixo = 0;
  aprov.filter(s => turno(s).fim <= am && !escDa(s).some(e => e.status === 'CONVIDADO' || e.status === 'CONFIRMADO')).forEach(s => {
    const vp = num(s.valor_previsto), vs = escDa(s).filter(e => e.status === 'VALIDADO' && okEsc(e));
    previsto += vp * num(s.vagas); prevPreench += vp * vs.length; realizado += vs.reduce((t, e) => t + num(e.valor_final), 0); nPrev++;
    vs.forEach(e => { const d = num(e.valor_final) - vp; if (d > 0) acima += d; else abaixo -= d; });
  });

  return { per, sols, todasSols, esc, val, falt, custo, horas, vagas, preenchidas, cheias, parciais, vazias, comecadas, antec, faixasAnt,
    decididas, auto, esperaram, tAprov, aprovPorUni, tPreench, resp, aceitos, previsto, prevPreench, realizado, nPrev, acima, abaixo, okEsc };
}
function agruparTempo(lista, chave, valor) {
  const m = {};
  lista.forEach(x => { const k = chave(x), v = valor(x); if (!k || !(v >= 0)) return; (m[k] = m[k] || []).push(v); });
  return Object.keys(m).map(k => ({ rot: k, med: media(m[k]), n: m[k].length })).sort((a, b) => b.med - a.med);
}

/* ---------- Peças visuais ---------- */
function stat(rotulo, valor, sub, cor) {

}
/* Barras horizontais: uma cor, valor na ponta, detalhe embaixo */
function barras(l, vazio) {
  if (!l.length) return '<div class="empty">' + esc(vazio || 'Sem dados no período.') + '</div>';
  const max = Math.max.apply(null, l.map(x => x.valor)) || 1;
  return '<div class="hbars">' + l.map(x => '<div class="hb"' + (x.act ? ' role="button" tabindex="0" data-act="' + x.act + '" data-id="' + esc(x.id) + '"' : '') + ' title="' + esc(x.rot + ': ' + x.txt + (x.sub ? ' · ' + x.sub : '')) + '">' +
    '<div class="hb-l">' + esc(x.rot) + '</div><div class="hb-t"><span style="width:' + (x.valor > 0 ? Math.max(1.5, x.valor / max * 100) : 0).toFixed(1) + '%"></span></div>' +
    '<div class="hb-v"><b>' + x.txt + '</b>' + (x.sub ? '<small>' + x.sub + '</small>' : '') + '</div></div>').join('') + '</div>';
}
/* Colunas (tempo ou dia da semana) */
function colunas(l) {
  const max = Math.max.apply(null, l.map(x => x.valor)) || 1;

}
function bloco(titulo, corpo, sub) {
  return '<div class="card ind-b"><div class="ind-bt">' + esc(titulo) + (sub ? '<small>' + sub + '</small>' : '') + '</div>' + corpo + '</div>';
}
function tabela(cab, linhas, direita) {
  if (!linhas.length) return '<div class="empty">Sem dados no período.</div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + cab.map((c, i) => '<th' + (direita.indexOf(i) >= 0 ? ' style="text-align:right"' : '') + '>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +

const linhaCusto = g => ({ rot: g.rot, valor: g.custo, txt: dinheiro(g.custo), sub: hFmt(g.horas) + ' · ' + plural(g.n, 'extra') });

/* Evolução: últimos 4 meses, com os filtros (menos o período) */

    (!f.indCc || s.centro_custo === f.indCc) && (!f.indFun || s.funcao_id === f.indFun);
  const meses = []; let ini = h.slice(0, 8) + '01';
  for (let i = 0; i < 4; i++) { meses.unshift(ini.slice(0, 7)); ini = addDias(ini, -1).slice(0, 8) + '01'; }
  const val = S.d.escalas.filter(e => e.status === 'VALIDADO' && solDe(e.sol_id) && okSol(solDe(e.sol_id)) && (!f.indVin || vinculoDe(e) === f.indVin));
  const pm = meses.map(m => { const l = val.filter(e => e.data.slice(0, 7) === m); return { m, rot: MESES[+m.slice(5, 7) - 1], custo: l.reduce((t, e) => t + num(e.valor_final), 0), n: l.length, horas: l.reduce((t, e) => t + horasDe(e), 0) }; });

}

function indPessoas(x, c) {
  const vin = agrupar(x.val, e => vinculoDe(e) || 'SEM', e => VINCULO[vinculoDe(e)] || 'Sem cadastro');
  const top = agrupar(x.val, e => e.pessoa_id, e => e.pessoa_nome).sort((a, b) => b.n - a.n || b.custo - a.custo).slice(0, 10);
  /* Aceite por pessoa: só quem recebeu 3 convites ou mais */
  const porP = {};
  x.resp.forEach(e => { const p = porP[e.pessoa_id] || (porP[e.pessoa_id] = { id: e.pessoa_id, nome: e.pessoa_nome, conv: 0, sim: 0, faltas: 0 }); p.conv++; if (e.status !== 'RECUSOU') p.sim++; if (e.status === 'FALTOU') p.faltas++; });
  const aceiteTodos = Object.keys(porP).map(k => porP[k]).filter(p => p.conv >= 3).sort((a, b) => b.sim / b.conv - a.sim / a.conv || b.conv - a.conv);
  const aceite = aceiteTodos.slice(0, 12);
  const faltosos = Object.keys(porP).map(k => porP[k]).filter(p => p.faltas > 0).sort((a, b) => b.faltas - a.faltas);
  const verm = c.risco.filter(p => riscoHoje(p) === 'vermelho').length, amar = c.risco.length - verm;

/* ---------- Detalhe da solicitação ---------- */
function abrirSol(id) {
  const s = solDe(id);
  if (!s) return;
  S.modalCtx = { tipo: 'sol', id };
  const esca = escDa(s), am = agoraMin();
  const podeA = podeAprovar(s), podeE = podeEscalar(s), podeV = podeValidar(s);
  const vivo = ['APROVADA', 'EM_ESCALA', 'COMPLETA'].indexOf(s.status) >= 0;
  const hs = horasTurno(s.data, s.hora_ini, s.hora_fim, s.intervalo_min);
  let h = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">' + pill(rotuloSol(s)) + (s._pend ? '<span class="pend-tag">na fila, ainda não chegou ao servidor</span>' : '') + '</div>' +
    '<div class="card"><div class="info">' +
    '<div><small>Data</small><b>' + esc(DIAS[new Date(Date.UTC(+s.data.slice(0, 4), +s.data.slice(5, 7) - 1, +s.data.slice(8, 10))).getUTCDay()]) + ', ' + dataBr(s.data) + '</b></div><div><small>Horário</small><b>' + esc(s.hora_ini) + ' às ' + esc(s.hora_fim) + ' · ' + hFmt(hs) + '</b></div>' +
    '<div><small>Empresa / unidade</small><b>' + esc(local(s)) + '</b></div><div><small>Setor</small><b>' + esc(s.setor) + '</b></div>' +
    '<div><small>Função</small><b>' + esc(s.funcao_nome) + '</b></div><div><small>Vagas</small><b>' + num(s.vagas) + ' (' + plural(ocupadas(s), 'escalado') + ')</b></div>' +
    '<div><small>Valor previsto por pessoa</small><b>' + dinheiro(s.valor_previsto) + '</b></div><div><small>Centro de custo</small><b>' + esc(s.centro_custo || '—') + '</b></div>' +
    '<div><small>Pedido por</small><b>' + esc(s.solicitante_nome || nomeDe(s.solicitante)) + '</b></div><div><small>' + (s.status === 'RECUSADA' ? 'Recusado por' : 'Aprovado por') + '</small><b>' + esc(s.aprovador_nome || '—') + '</b></div>' +
    '</div><div style="margin-top:12px;font-size:14px"><small class="mute" style="display:block;font-size:12px">Motivo</small><b>' + esc(s.motivo) + '</b>' + (s.motivo_detalhe ? ' · ' + esc(s.motivo_detalhe) : '') + (s.obs ? '<div class="small mute" style="margin-top:4px">' + esc(s.obs) + '</div>' : '') +
    (s.motivo_recusa ? '<div class="alerta vermelho" style="margin-top:8px">Recusa: ' + esc(s.motivo_recusa) + '</div>' : '') + '</div></div>';

  h += '<div class="sec"><div class="sec-t">Escalados (' + ocupadas(s) + '/' + num(s.vagas) + ')<span class="grow"></span>' +
    (vivo && podeE && ocupadas(s) < num(s.vagas) ? '<button class="btn sm" data-act="escalar" data-id="' + esc(s.sol_id) + '">' + ic('mais', 'sm') +
      (am >= turno(s).ini ? 'Registrar quem trabalhou' : 'Adicionar pessoa') + '</button>' : '') + '</div>';
  h += esca.length ? '<div class="list">' + esca.map(e => {
    const pes = pessoaDe(e.pessoa_id);
    const acoes = [];
    if (podeE && e.status === 'CONVIDADO') acoes.push('<button class="btn ok sm" data-act="esc-acao" data-a="CONFIRMAR" data-id="' + esc(e.esc_id) + '">Confirmou</button>', '<button class="btn ghost sm" data-act="esc-acao" data-a="RECUSOU" data-id="' + esc(e.esc_id) + '">Não aceitou</button>');

function formDados(f) { const o = {}; new FormData(f).forEach((v, k) => { o[k] = String(v).trim(); }); return o; }
/* Datas da série: período De/Até, só os dias da semana marcados, menos as tiradas. */
function datasNova(x) {
  const c = S.modalCtx, out = { todas: [], datas: [], erro: '' };
  if (!c.dias.length) { out.erro = 'Escolha os dias da semana.'; return out; }
  if (!x.de || !x.ate) { out.erro = 'Informe o período (de / até).'; return out; }
  if (x.ate < x.de) { out.erro = 'A data final é antes da inicial.'; return out; }
  if (extDia_(x.ate) - extDia_(x.de) > 92) { out.erro = 'Período de no máximo 3 meses.'; return out; }
  for (let d = x.de; d <= x.ate; d = addDias(d, 1)) if (c.dias.indexOf(diaSemana(d)) >= 0) out.todas.push(d);
  out.datas = out.todas.filter(d => !c.fora[d]);

  else if (out.datas.length > SERIE_MAX) out.erro = 'São ' + out.datas.length + ' datas. O máximo é ' + SERIE_MAX + ' por vez: encurte o período.';
  return out;
}

function calcValidar() {

  $('#v-obs-l').innerHTML = c.realizou ? 'Observação' : 'O que aconteceu? <span class="req">*</span>';
  if (!c.realizou) return;
  const hs = horasTurno(e.data, $('#v-ini').value, $('#v-fim').value, $('#v-int').value);
  const base = valorDe(e.funcao_id, hs, e.data);
  /* Sugestão: o que essa pessoa recebeu da última vez na mesma função e no
     mesmo tipo de dia (semana ou fim de semana). Sem histórico, a tabela. */
  const ult = ultimoValor(e);
  const sug = ult ? num(ult.valor_final) : base;
  const inp = $('#v-valor');
  if (!c.editado) inp.value = sug.toFixed(2).replace('.', ',');
  const fin = Math.max(0, Math.round(num(inp.value) * 100) / 100);
  c.valor = fin; c.horas = hs; c.base = base; c.ult = ult;
  const dif = Math.abs(fin - base) >= 0.01;
  $('#v-valor-hint').innerHTML = 'Tabela: ' + dinheiro(base) + (ult ? ' · última vez (' + esc(diaCurto(ult.data)) + '): ' + dinheiro(ult.valor_final) : '');
  $('#v-mot-box').hidden = !dif;
  $('#v-obs-l').innerHTML = dif ? 'Observação <span class="req">*</span>' : 'Observação';
  $('#val-resumo').innerHTML = '<b>' + hFmt(hs) + '</b> trabalhadas · <b>a pagar ' + dinheiro(fin) + '</b>' +
    (dif ? ' · ' + (fin > base ? dinheiro(fin - base) + ' acima' : dinheiro(base - fin) + ' abaixo') + ' da tabela' : '') +
    (base > 0 && fin > base * 2 ? ' · <span style="color:var(--red-ink)">mais que o dobro da tabela, confira</span>' : '') +
    (hs > 12 ? ' · <span style="color:var(--red-ink)">mais de 12h, confira</span>' : '');
}
const fimDeSemana = iso => { const w = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10))).getUTCDay(); return w === 0 || w === 6; };

    num(x.valor_final) > 0 && fimDeSemana(x.data) === fds && x.data <= e.data && extDia_(e.data) - extDia_(x.data) <= 120)

function enviarValidar() {
  const c = S.modalCtx, e = S.d.escalas.find(x => x.esc_id === c.id);
  const obs = $('#v-obs').value.trim();
  if (!c.realizou) {
    if (obs.length < 3) return toast('Conte o que aconteceu.', 'err');
    fechar();
    Fila.add('validar', { esc_id: e.esc_id, realizou: false, obs, visto: e.status });
    return render();
  }
  calcValidar();
  if (c.horas <= 0 || c.horas > 16) return toast('Confira os horários.', 'err');
  let motivo = obs;
  if (Math.abs(c.valor - c.base) >= 0.01 && motivo.length < 3) {
    /* Repetiu o valor da última vez: o próprio sistema registra o motivo */
    if (c.ult && Math.abs(c.valor - num(c.ult.valor_final)) < 0.01) motivo = 'Mesmo valor do turno de ' + dataBr(c.ult.data);

  if (c.modo === 'AGENDADO' && (!dataPag || dataPag < hojeStr())) return toast('Escolha a data do pagamento.', 'err');

  modal('Registrar pagamento', h, '<button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" data-act="pagar-enviar">Confirmar pagamento</button>');

function lerArquivo(inp) {
  return new Promise((ok, erro) => {
    const f = inp.files && inp.files[0];
    if (!f) return erro(new Error('Anexe o comprovante.'));
    if (f.size > CFG.MAX_ARQ_MB * 1048576 && f.type.indexOf('image') < 0) return erro(new Error('Arquivo acima de ' + CFG.MAX_ARQ_MB + ' MB.'));
    const rd = new FileReader();
    rd.onerror = () => erro(new Error('Não consegui ler o arquivo.'));
    rd.onload = () => {
      if (f.type.indexOf('image') !== 0) return ok({ base64: rd.result, mime: f.type || 'application/pdf', nome: f.name });
      const img = new Image();
      img.onload = () => {
        const m = 1600, k = Math.min(1, m / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ok({ base64: cv.toDataURL('image/jpeg', 0.82), mime: 'image/jpeg', nome: f.name });
      };
      img.onerror = () => ok({ base64: rd.result, mime: f.type, nome: f.name });
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
}

function baixarCsv(nome, cab, linhas) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const txt = '﻿' + [cab].concat(linhas).map(l => l.map(q).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}

const Versao = {
  assinatura: null, nova: false, checando: false, toque: 0,   // 0: ainda não mexeu, pode recarregar já na abertura
  hash(t) { let h = 0; for (let i = 0; i < t.length; i++) h = ((h << 5) - h + t.charCodeAt(i)) | 0; return String(h); },
  ocupado() {
    if (aberto() || S.enviando || S.fila.length) return true;
    const a = document.activeElement;
    return !!(a && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(a.tagName) >= 0);
  },
  recarregar() { location.replace(location.pathname + '?v=' + Date.now() + location.hash); },
  avisar() {
    if ($('#aviso-versao')) return;
    const el = document.createElement('div');
    el.id = 'aviso-versao'; el.className = 'aviso-versao';
    el.innerHTML = '<span>Nova versão disponível</span><button type="button">Atualizar agora</button>';
    el.querySelector('button').onclick = () => Versao.recarregar();
    document.body.appendChild(el);
  },
  /* Compara a versão escrita no arquivo do GitHub com a versão que está
     rodando. Antes comparava só com o que viu na 1ª checagem: se a página
     abria de uma cópia velha (o GitHub Pages deixa o navegador guardar por
     10 min), a 1ª checagem já pegava a nova como "normal" e a tela ficava
     velha até a próxima atualização. */
  versaoDe(t) { const m = /VERSAO:\s*'([^']+)'/.exec(t); return m ? m[1] : ''; },
  async checar() {
    if (this.checando || !navigator.onLine || location.protocol === 'file:') return;
    this.checando = true;
    try {
      const url = location.pathname + '?checagem=' + Date.now();
      let etag = null;
      try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); if (r.ok) etag = r.headers.get('etag') || r.headers.get('last-modified'); } catch (e) { }
      if (etag && etag === this.assinatura) return;            // nada mudou desde a última olhada
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.text();
      const sig = etag || (t.length + ':' + this.hash(t));
      const antes = this.assinatura;
      this.assinatura = sig;
      const v = this.versaoDe(t);
      // versão diferente da que roda, ou arquivo mudou sem trocar o número da versão
      const mudou = (v && v !== CFG.VERSAO) || (antes && antes !== sig);
      if (!mudou) return;
      this.nova = v || 'nova';
      this.avisar();
      this.tentar();
    } catch (e) { } finally { this.checando = false; }
  },
  /* Recarrega sozinho quando a pessoa não está mexendo. Se já tentou ir para
     essa versão há pouco e voltou a velha (GitHub ainda espalhando o arquivo),
     não fica em looping: mostra só o aviso e tenta de novo em 5 min. */
  tentar() {
    if (!this.nova || document.visibilityState !== 'visible' || this.ocupado() || Date.now() - this.toque <= CFG.OCIOSO_MS) return;
    let ult = null;
    try { ult = JSON.parse(sessionStorage.getItem('ext_recarga') || 'null'); } catch (e) { }
    if (ult && ult.v === this.nova && Date.now() - ult.t < 300000) return;
    try { sessionStorage.setItem('ext_recarga', JSON.stringify({ v: this.nova, t: Date.now() })); } catch (e) { }
    this.recarregar();
  },
  iniciar() {
    this.checar();
    setInterval(() => { if (document.visibilityState === 'visible') this.checar(); }, CFG.VERSAO_MS);
    setInterval(() => this.tentar(), 20000);
    ['pointerdown', 'keydown', 'touchstart'].forEach(e => document.addEventListener(e, () => { this.toque = Date.now(); }, { passive: true }));
  }
};

/* ════════════════════════════════════════════════════════════════
   INÍCIO
   ════════════════════════════════════════════════════════════════ */
(async function iniciar() {
  S.sessao = sessao();
  if (!S.sessao) { irParaMenu(); return; }
  guardarPedidoAbrir();
  await Fila.carregar();
  const salvo = await Local.get(chaveCarga());
  if (salvo) { S.base = salvo; S.sync = { estado: 'cache', hora: '' }; montarEstado(); render(); }
  await carregar();
  Fila.enviar();
  Versao.iniciar();
  window.addEventListener('online', () => { pintarSync(); Fila.enviar(); carregar(); });
  window.addEventListener('offline', () => pintarSync());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { Fila.enviar(); if (!aberto()) carregar(); Versao.checar(); }
  });
  setInterval(() => { if (document.visibilityState === 'visible' && navigator.onLine && !aberto() && !S.enviando) carregar(); }, CFG.REFRESH_MS);
  /* Abre mesmo sem internet a partir da segunda visita (sw.js do plus-liberdade) */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
